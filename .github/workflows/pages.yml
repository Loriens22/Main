# Build check: type-check and production build of the game on every push of the development branch.
# (Publishing is not automatic: the repository's GitHub Pages site is managed separately.)
name: Build check

on:
  push:
    branches: [claude/3d-game-blender-realism-i1xzwh]
  workflow_dispatch:

permissions:
  contents: read

# same group as the first version of this workflow, so that this run supersedes it
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
