<h2>2. KEY C# SCRIPTS</h2>

<div class="note"><strong>Frame convention for the code below.</strong> The simulation works in a
right-handed, <strong>Z-up</strong> inertial frame, because that is what every astrodynamics
textbook uses and translating Vallado into a Y-up frame is a reliable way to introduce sign
errors you will not find for a month. Conversion to Unity's left-handed Y-up frame happens in
exactly one place, in <code>FloatingOrigin.ToScene()</code> / <code>ToWorld()</code>. The model
convention from §0.3 (−Z nose, +Y dorsal) applies on the <em>rendering</em> side of that
boundary.</div>

<h3>2.1 DoubleVector3.cs</h3>

<pre><code>using System;
using System.Runtime.CompilerServices;
using UnityEngine;

namespace StellarExpanse.Numerics
{
    /// &lt;summary&gt;
    /// Double-precision 3-vector. ALL simulation state is stored in this type.
    /// UnityEngine.Vector3 is produced only at the last possible moment, and always
    /// relative to the floating origin — never as an absolute world position.
    /// &lt;/summary&gt;
    [Serializable]
    public struct DoubleVector3 : IEquatable&lt;DoubleVector3&gt;
    {
        public double x, y, z;

        public static readonly DoubleVector3 zero = new DoubleVector3(0, 0, 0);
        public static readonly DoubleVector3 one  = new DoubleVector3(1, 1, 1);
        // Simulation frame is Z-up (see note above).
        public static readonly DoubleVector3 poleZ = new DoubleVector3(0, 0, 1);

        [MethodImpl(MethodImplOptions.AggressiveInlining)]
        public DoubleVector3(double x, double y, double z) { this.x = x; this.y = y; this.z = z; }

        [MethodImpl(MethodImplOptions.AggressiveInlining)]
        public DoubleVector3(Vector3 v) { x = v.x; y = v.y; z = v.z; }

        public double sqrMagnitude { [MethodImpl(MethodImplOptions.AggressiveInlining)]
                                     get { return x * x + y * y + z * z; } }

        public double magnitude { [MethodImpl(MethodImplOptions.AggressiveInlining)]
                                  get { return Math.Sqrt(x * x + y * y + z * z); } }

        public DoubleVector3 normalized
        {
            get
            {
                double m = Math.Sqrt(x * x + y * y + z * z);
                // Threshold is 1e-300, not Unity's 1e-9: magnitudes of 1e11 are routine
                // here and a 1e-9 epsilon would silently zero legitimate tiny vectors.
                return m &gt; 1e-300 ? new DoubleVector3(x / m, y / m, z / m) : zero;
            }
        }

        public static DoubleVector3 operator +(DoubleVector3 a, DoubleVector3 b)
            =&gt; new DoubleVector3(a.x + b.x, a.y + b.y, a.z + b.z);
        public static DoubleVector3 operator -(DoubleVector3 a, DoubleVector3 b)
            =&gt; new DoubleVector3(a.x - b.x, a.y - b.y, a.z - b.z);
        public static DoubleVector3 operator -(DoubleVector3 a)
            =&gt; new DoubleVector3(-a.x, -a.y, -a.z);
        public static DoubleVector3 operator *(DoubleVector3 a, double s)
            =&gt; new DoubleVector3(a.x * s, a.y * s, a.z * s);
        public static DoubleVector3 operator *(double s, DoubleVector3 a)
            =&gt; new DoubleVector3(a.x * s, a.y * s, a.z * s);
        public static DoubleVector3 operator /(DoubleVector3 a, double s)
            =&gt; new DoubleVector3(a.x / s, a.y / s, a.z / s);

        public static bool operator ==(DoubleVector3 a, DoubleVector3 b)
            =&gt; a.x == b.x &amp;&amp; a.y == b.y &amp;&amp; a.z == b.z;
        public static bool operator !=(DoubleVector3 a, DoubleVector3 b) =&gt; !(a == b);

        [MethodImpl(MethodImplOptions.AggressiveInlining)]
        public static double Dot(DoubleVector3 a, DoubleVector3 b)
            =&gt; a.x * b.x + a.y * b.y + a.z * b.z;

        [MethodImpl(MethodImplOptions.AggressiveInlining)]
        public static DoubleVector3 Cross(DoubleVector3 a, DoubleVector3 b)
            =&gt; new DoubleVector3(a.y * b.z - a.z * b.y,
                                 a.z * b.x - a.x * b.z,
                                 a.x * b.y - a.y * b.x);

        public static double Distance(DoubleVector3 a, DoubleVector3 b) =&gt; (a - b).magnitude;

        public static DoubleVector3 Lerp(DoubleVector3 a, DoubleVector3 b, double t)
            =&gt; new DoubleVector3(a.x + (b.x - a.x) * t,
                                 a.y + (b.y - a.y) * t,
                                 a.z + (b.z - a.z) * t);

        /// Component of \`a\` perpendicular to unit vector \`n\`.
        public static DoubleVector3 ProjectOnPlane(DoubleVector3 a, DoubleVector3 n)
            =&gt; a - n * Dot(a, n);

        /// Numerically stable angle between two vectors (rad). acos(dot) loses all
        /// precision near 0 and pi; the atan2 form does not. This matters: the true
        /// anomaly near periapsis of a near-circular orbit is exactly that case.
        public static double Angle(DoubleVector3 a, DoubleVector3 b)
        {
            DoubleVector3 an = a.normalized, bn = b.normalized;
            return 2.0 * Math.Atan2((an - bn).magnitude, (an + bn).magnitude);
        }

        /// Rotate by a unit quaternion (x,y,z,w), double precision throughout.
        public static DoubleVector3 Rotate(DoubleQuaternion q, DoubleVector3 v)
        {
            double tx = 2.0 * (q.y * v.z - q.z * v.y);
            double ty = 2.0 * (q.z * v.x - q.x * v.z);
            double tz = 2.0 * (q.x * v.y - q.y * v.x);
            return new DoubleVector3(v.x + q.w * tx + q.y * tz - q.z * ty,
                                     v.y + q.w * ty + q.z * tx - q.x * tz,
                                     v.z + q.w * tz + q.x * ty - q.y * tx);
        }

        /// Convert to a render-space Vector3. ONLY call this on a vector that has
        /// already had the scene origin subtracted, or you throw away 30 bits.
        [MethodImpl(MethodImplOptions.AggressiveInlining)]
        public Vector3 ToVector3() =&gt; new Vector3((float)x, (float)y, (float)z);

        public bool Equals(DoubleVector3 o) =&gt; this == o;
        public override bool Equals(object o) =&gt; o is DoubleVector3 d &amp;&amp; Equals(d);
        public override int GetHashCode()
            =&gt; x.GetHashCode() ^ (y.GetHashCode() &lt;&lt; 2) ^ (z.GetHashCode() &gt;&gt; 2);
        public override string ToString() =&gt; string.Concat("(", x.ToString("G17"), ", ",
                                                            y.ToString("G17"), ", ",
                                                            z.ToString("G17"), ")");
    }
}</code></pre>

<p><code>DoubleQuaternion</code> is the obvious analogue and is omitted for space: four doubles,
Hamilton product, conjugate, normalise, slerp, <code>FromAxisAngle</code>, <code>LookRotation</code>
matching the prototype's <code>qlook()</code> (−Z looks along the forward vector). Renormalise it
every time you integrate it; a quaternion integrated for an hour of game time at 50 Hz without
renormalisation drifts off the unit sphere and starts scaling your ship.</p>

<h3>2.2 FloatingOrigin.cs</h3>

<p>Float32 has a 24-bit significand. At 10 km from the origin the ULP is about 1.2 mm; at 100 km
it is about 12 mm, which is visible vertex swim and audible physics buzz on a landed ship.
The threshold below is 4 km, giving sub-millimetre precision everywhere in the scene.</p>

<pre><code>using System;
using System.Collections.Generic;
using UnityEngine;
using UnityEngine.SceneManagement;
using StellarExpanse.Numerics;

namespace StellarExpanse.Origin
{
    public interface IOriginShiftable { void OnOriginShift(Vector3 delta); }

    /// &lt;summary&gt;
    /// Keeps the Unity scene within \`threshold\` metres of (0,0,0) by translating
    /// everything. SceneOrigin is the double-precision simulation position that
    /// Unity's (0,0,0) currently represents.
    /// &lt;/summary&gt;
    [DefaultExecutionOrder(900)]   // after gameplay Update, before rendering
    public sealed class FloatingOrigin : MonoBehaviour
    {
        public static FloatingOrigin Instance { get; private set; }

        [SerializeField] double threshold  = 4000.0;   // metres
        [SerializeField] Transform focus;              // usually the active vessel
        [SerializeField] Camera[] cameras;             // for TAA history correction

        public DoubleVector3 SceneOrigin { get; private set; }
        public event Action&lt;Vector3&gt; Shifted;

        static readonly List&lt;IOriginShiftable&gt; s_listeners = new List&lt;IOriginShiftable&gt;(256);
        readonly List&lt;GameObject&gt; _roots      = new List&lt;GameObject&gt;(512);
        readonly List&lt;ParticleSystem&gt; _worldPs = new List&lt;ParticleSystem&gt;(64);
        readonly List&lt;Rigidbody&gt; _bodies       = new List&lt;Rigidbody&gt;(256);
        ParticleSystem.Particle[] _pScratch = new ParticleSystem.Particle[8192];
        bool _rootsDirty = true;
        bool _restoreInterpolation;

        void Awake()
        {
            Instance = this;
            // We take responsibility for syncing transforms: one sync after the whole
            // shift instead of one per Transform write. This is the single biggest
            // contributor to rebase cost in a naive implementation.
            Physics.autoSyncTransforms = false;
            SceneManager.sceneLoaded   += (a, b) =&gt; _rootsDirty = true;
            SceneManager.sceneUnloaded += a =&gt; _rootsDirty = true;
        }

        public static void Register(IOriginShiftable l)
        { if (!s_listeners.Contains(l)) s_listeners.Add(l); }
        public static void Unregister(IOriginShiftable l) { s_listeners.Remove(l); }

        /// Mark the cached root list stale after spawning/destroying top-level objects.
        public void InvalidateRoots() { _rootsDirty = true; }

        public Vector3 ToScene(DoubleVector3 world)
        {
            DoubleVector3 d = world - SceneOrigin;
            // Simulation is Z-up right-handed; Unity is Y-up left-handed.
            return new Vector3((float)d.x, (float)d.z, (float)d.y);
        }

        public DoubleVector3 ToWorld(Vector3 scene)
            =&gt; SceneOrigin + new DoubleVector3(scene.x, scene.z, scene.y);

        void LateUpdate()
        {
            if (_restoreInterpolation) RestoreInterpolation();
            if (focus == null) return;
            Vector3 p = focus.position;
            if (p.sqrMagnitude &lt; threshold * threshold) return;
            Shift(-p);
        }

        void Shift(Vector3 delta)
        {
            SceneOrigin = SceneOrigin - new DoubleVector3(delta.x, delta.z, delta.y);

            if (_rootsDirty) RebuildCaches();

            // 1) Kill Rigidbody interpolation for exactly one frame. Otherwise the
            //    renderer interpolates from the PRE-shift pose to the POST-shift pose
            //    and the entire world smears across the screen for one frame. This is
            //    the classic "rebase hitch" and it is a visual artefact, not a CPU cost.
            for (int i = 0; i &lt; _bodies.Count; i++)
            {
                Rigidbody rb = _bodies[i];
                if (rb == null) continue;
                rb.interpolation = RigidbodyInterpolation.None;
            }
            _restoreInterpolation = true;

            // 2) Translate scene roots. Children come along for free.
            for (int i = 0; i &lt; _roots.Count; i++)
            {
                GameObject go = _roots[i];
                if (go == null) continue;
                Transform t = go.transform;
                t.position = t.position + delta;
            }

            // 3) One physics sync for the whole shift.
            Physics.SyncTransforms();

            // 4) World-simulated particle systems. Prefer to avoid this entirely — see
            //    the note below — but some systems (a re-entry wake) genuinely need
            //    world simulation and must be moved manually.
            for (int i = 0; i &lt; _worldPs.Count; i++)
            {
                ParticleSystem ps = _worldPs[i];
                if (ps == null) continue;
                int count = ps.particleCount;
                if (count == 0) continue;
                if (_pScratch.Length &lt; count)
                    _pScratch = new ParticleSystem.Particle[Mathf.NextPowerOfTwo(count)];
                bool wasPlaying = ps.isPlaying;
                if (wasPlaying) ps.Pause(false);
                int n = ps.GetParticles(_pScratch, count);
                for (int k = 0; k &lt; n; k++) _pScratch[k].position += delta;
                ps.SetParticles(_pScratch, n);
                if (wasPlaying) ps.Play(false);
            }

            // 5) Trails and line renderers keep world-space history. Shifting a
            //    TrailRenderer is not exposed, so clear it; a one-frame trail gap during
            //    a 4 km rebase is invisible, a 4 km trail spike is not.
            //    (LineRenderer with useWorldSpace CAN be shifted via GetPositions.)

            // 6) Anything with its own cached world state.
            for (int i = 0; i &lt; s_listeners.Count; i++) s_listeners[i].OnOriginShift(delta);

            // 7) Correct temporal history so TAA / motion blur do not ghost. Translating
            //    the previous-frame view matrix by the same delta keeps motion vectors
            //    correct through the rebase. Almost nobody does this, and it is why most
            //    floating-origin implementations flash on every shift.
            for (int i = 0; i &lt; cameras.Length; i++)
                if (cameras[i] != null) cameras[i].ResetProjectionMatrix();
            OnHistoryShift(delta);

            Shifted?.Invoke(delta);
        }

        void RestoreInterpolation()
        {
            for (int i = 0; i &lt; _bodies.Count; i++)
                if (_bodies[i] != null)
                    _bodies[i].interpolation = RigidbodyInterpolation.Interpolate;
            _restoreInterpolation = false;
        }

        void RebuildCaches()
        {
            _roots.Clear(); _worldPs.Clear(); _bodies.Clear();
            for (int s = 0; s &lt; SceneManager.sceneCount; s++)
            {
                Scene sc = SceneManager.GetSceneAt(s);
                if (!sc.isLoaded) continue;
                sc.GetRootGameObjects(_roots);
            }
            for (int i = 0; i &lt; _roots.Count; i++)
            {
                _roots[i].GetComponentsInChildren(true, _bodiesTmp);
                _bodies.AddRange(_bodiesTmp);
                _roots[i].GetComponentsInChildren(true, _psTmp);
                for (int k = 0; k &lt; _psTmp.Count; k++)
                    if (_psTmp[k].main.simulationSpace == ParticleSystemSimulationSpace.World)
                        _worldPs.Add(_psTmp[k]);
            }
            _rootsDirty = false;
        }
        static readonly List&lt;Rigidbody&gt; _bodiesTmp = new List&lt;Rigidbody&gt;(64);
        static readonly List&lt;ParticleSystem&gt; _psTmp = new List&lt;ParticleSystem&gt;(64);

        partial void OnHistoryShift(Vector3 delta);   // implemented by the render layer
    }
}</code></pre>

<h3>2.2.1 How to avoid the rebase hitch</h3>
<ol>
<li><strong>Shift often and small.</strong> A 4 km threshold means a rebase roughly every few
seconds in atmospheric flight and every fraction of a second in orbit. That sounds bad; it is
not. A frequent, cheap shift is far better than a rare, expensive one, because the cost is
dominated by the fixed overhead of walking the scene and that overhead does not grow with the
distance shifted.</li>
<li><strong>Cache the root list.</strong> <code>Scene.GetRootGameObjects</code> allocates and
walks; calling it plus <code>GetComponentsInChildren</code> every shift is what makes naive
implementations cost 3–8 ms. Cache, and invalidate only on spawn/destroy of top-level
objects.</li>
<li><strong><code>Physics.autoSyncTransforms = false</code></strong> and one explicit
<code>Physics.SyncTransforms()</code>. With auto-sync on, every Transform write dirties the
physics scene.</li>
<li><strong>Disable Rigidbody interpolation for the shift frame.</strong> This is the actual
visible "hitch" in most implementations — not a frame-time spike, a one-frame smear.</li>
<li><strong>Make particle systems free.</strong> Set <code>simulationSpace = Custom</code> with
<code>customSimulationSpace</code> pointing at a transform that never moves relative to the
scene, or use Local space with a parent that moves with the emitter. Then step 4 above becomes
a no-op. Reserve World space for the handful of systems that genuinely need it.</li>
<li><strong>Shift in <code>LateUpdate</code>, never inside <code>FixedUpdate</code>.</strong>
A shift between substeps of the same frame will be seen by half your physics callbacks and not
the other half.</li>
<li><strong>Translate the temporal-reprojection history.</strong> See step 7 — otherwise TAA and
motion blur produce a one-frame ghost on every rebase, which at a 4 km threshold means a
permanent shimmer.</li>
<li><strong>Never store an absolute world position in a Vector3 field.</strong> Enforce it with a
Roslyn analyser or a naming convention; this rule is violated by accident constantly, and the
symptom (things drift apart after twenty minutes) is very hard to trace back.</li>
</ol>

<h3>2.3 OrbitalBody.cs</h3>

<pre><code>using System;
using UnityEngine;
using StellarExpanse.Numerics;

namespace StellarExpanse.Orbital
{
    /// A gravitating body: star, planet or moon. Positions are propagated on rails
    /// (Keplerian) because a solar system's own motion does not need to be simulated.
    public sealed class OrbitalBody : MonoBehaviour
    {
        [Header("Physical")]
        public string bodyName;
        public double mu;              // GM, m^3/s^2  — store mu, never mass*G
        public double radius;          // mean equatorial radius, m
        public double rotationPeriod;  // sidereal, s (negative = retrograde)
        public double axialTilt;       // rad, about the +X axis of the parent frame
        public double siderealAtEpoch; // rotation phase at t = 0, rad

        [Header("Hierarchy")]
        public OrbitalBody parent;
        public KeplerSolver.Elements elements;   // relative to \`parent\`

        [Header("Environment")]
        public AtmosphereModel atmosphere;       // null for airless bodies
        public PlanetDNA dna;                    // the procedural genome (see 0.1)

        // Current state, absolute (root-frame) coordinates.
        public DoubleVector3 position;
        public DoubleVector3 velocity;

        /// Sphere of influence radius (Laplace): r_soi = a * (m / M)^(2/5).
        /// Expressed in mu, since mu ratio == mass ratio.
        public double SphereOfInfluence
        {
            get
            {
                if (parent == null) return double.PositiveInfinity;
                return elements.a * Math.Pow(mu / parent.mu, 0.4);
            }
        }

        /// Surface gravity at the reference radius, m/s^2. Useful for UI and for
        /// sanity-checking a procedurally generated body.
        public double SurfaceGravity =&gt; mu / (radius * radius);

        /// Body-fixed rotation at time t (seconds since epoch).
        public DoubleQuaternion RotationAt(double t)
        {
            double spin = siderealAtEpoch + (rotationPeriod != 0.0
                        ? 2.0 * Math.PI * t / rotationPeriod : 0.0);
            DoubleQuaternion tilt = DoubleQuaternion.FromAxisAngle(
                new DoubleVector3(1, 0, 0), axialTilt);
            DoubleQuaternion spinQ = DoubleQuaternion.FromAxisAngle(
                new DoubleVector3(0, 0, 1), spin);
            return DoubleQuaternion.Multiply(tilt, spinQ);
        }

        /// Surface velocity of the atmosphere/ground at an absolute point (co-rotation).
        public DoubleVector3 SurfaceVelocityAt(DoubleVector3 absolutePoint)
        {
            if (rotationPeriod == 0.0) return velocity;
            DoubleVector3 rel = absolutePoint - position;
            DoubleVector3 axis = DoubleVector3.Rotate(
                DoubleQuaternion.FromAxisAngle(new DoubleVector3(1, 0, 0), axialTilt),
                new DoubleVector3(0, 0, 1));
            double omega = 2.0 * Math.PI / rotationPeriod;
            return velocity + DoubleVector3.Cross(axis * omega, rel);
        }

        /// Advance this body's on-rails state to absolute time t.
        public void PropagateTo(double t)
        {
            if (parent == null) { position = DoubleVector3.zero; velocity = DoubleVector3.zero; return; }
            KeplerSolver.ElementsToState(elements, parent.mu, t,
                                         out DoubleVector3 r, out DoubleVector3 v);
            position = parent.position + r;
            velocity = parent.velocity + v;
        }

        /// Gravitational acceleration this body exerts at an absolute point.
        /// Includes the J2 oblateness term, which is what makes a real low orbit
        /// precess and is cheap enough to always have on.
        public DoubleVector3 AccelerationAt(DoubleVector3 p, double j2 = 0.0)
        {
            DoubleVector3 d = position - p;
            double r2 = d.sqrMagnitude;
            if (r2 &lt; 1.0) return DoubleVector3.zero;
            double r = Math.Sqrt(r2);
            DoubleVector3 a = d * (mu / (r2 * r));
            if (j2 != 0.0)
            {
                // Standard J2 perturbation in the body's equatorial frame (z = pole).
                DoubleVector3 rel = p - position;
                double z2r2 = (rel.z * rel.z) / r2;
                double k = 1.5 * j2 * mu * radius * radius / (r2 * r2 * r);
                a += new DoubleVector3(rel.x * k * (5.0 * z2r2 - 1.0),
                                       rel.y * k * (5.0 * z2r2 - 1.0),
                                       rel.z * k * (5.0 * z2r2 - 3.0));
            }
            return a;
        }
    }
}</code></pre>

<h3>2.4 KeplerSolver.cs</h3>

<p>Three things must work: state vector to elements, elements to state at an arbitrary time, and
direct propagation of a state vector by a time interval. The first two go through anomaly
solving; the third uses universal variables, which handles elliptic, parabolic and hyperbolic
orbits with one code path and is what you want for the patched-conic solver's SOI search.</p>

<pre><code>using System;
using StellarExpanse.Numerics;

namespace StellarExpanse.Orbital
{
    public static class KeplerSolver
    {
        public const double TwoPi = 6.283185307179586;

        [Serializable]
        public struct Elements
        {
            public double a;      // semi-major axis, m. NEGATIVE for hyperbolic orbits.
            public double e;      // eccentricity
            public double i;      // inclination, rad
            public double raan;   // right ascension of ascending node, rad
            public double argp;   // argument of periapsis, rad
            public double m0;     // mean anomaly at epoch, rad (elliptic)
                                  // or hyperbolic mean anomaly (hyperbolic)
            public double epoch;  // seconds
            public double p;      // semi-latus rectum, m. Authoritative when e -&gt; 1.
        }

        // ---------------------------------------------------------------- RV -&gt; COE
        /// Vallado's RV2COE. Frame is Z-up; the reference plane is XY.
        public static Elements StateToElements(DoubleVector3 r, DoubleVector3 v,
                                               double mu, double t)
        {
            Elements el = default;
            el.epoch = t;

            double rm = r.magnitude;
            double v2 = v.sqrMagnitude;
            double rdotv = DoubleVector3.Dot(r, v);

            DoubleVector3 h = DoubleVector3.Cross(r, v);
            double hm = h.magnitude;
            el.p = hm * hm / mu;

            // Eccentricity vector: e = ((v^2 - mu/r) r - (r.v) v) / mu
            DoubleVector3 ev = (r * (v2 - mu / rm) - v * rdotv) / mu;
            el.e = ev.magnitude;

            // Specific orbital energy. a is undefined for a true parabola; p is not.
            double energy = v2 * 0.5 - mu / rm;
            el.a = (Math.Abs(el.e - 1.0) &gt; 1e-10) ? -mu / (2.0 * energy)
                                                  : double.PositiveInfinity;

            el.i = Math.Acos(Math.Max(-1.0, Math.Min(1.0, h.z / hm)));

            // Node vector n = zhat x h
            DoubleVector3 n = new DoubleVector3(-h.y, h.x, 0.0);
            double nm = n.magnitude;

            const double EQUATORIAL = 1e-11;
            const double CIRCULAR   = 1e-11;

            if (nm &gt; EQUATORIAL)
            {
                el.raan = Math.Atan2(n.y, n.x);
                if (el.raan &lt; 0.0) el.raan += TwoPi;
            }
            else el.raan = 0.0;   // equatorial: RAAN is degenerate, fold it into argp

            double nu;
            if (el.e &gt; CIRCULAR)
            {
                if (nm &gt; EQUATORIAL)
                {
                    el.argp = Math.Acos(Math.Max(-1.0, Math.Min(1.0,
                                  DoubleVector3.Dot(n, ev) / (nm * el.e))));
                    if (ev.z &lt; 0.0) el.argp = TwoPi - el.argp;
                }
                else
                {
                    el.argp = Math.Atan2(ev.y, ev.x);    // true longitude of periapsis
                    if (el.argp &lt; 0.0) el.argp += TwoPi;
                }
                nu = Math.Acos(Math.Max(-1.0, Math.Min(1.0,
                          DoubleVector3.Dot(ev, r) / (el.e * rm))));
                if (rdotv &lt; 0.0) nu = TwoPi - nu;
            }
            else
            {
                // Circular: periapsis is undefined. Use argument of latitude.
                el.argp = 0.0;
                if (nm &gt; EQUATORIAL)
                {
                    nu = Math.Acos(Math.Max(-1.0, Math.Min(1.0,
                              DoubleVector3.Dot(n, r) / (nm * rm))));
                    if (r.z &lt; 0.0) nu = TwoPi - nu;
                }
                else
                {
                    nu = Math.Atan2(r.y, r.x);
                    if (nu &lt; 0.0) nu += TwoPi;
                }
            }

            el.m0 = TrueToMean(nu, el.e);
            return el;
        }

        // ---------------------------------------------------------------- COE -&gt; RV
        public static void ElementsToState(Elements el, double mu, double t,
                                           out DoubleVector3 r, out DoubleVector3 v)
        {
            double dt = t - el.epoch;
            double nu;

            if (el.e &lt; 1.0)
            {
                double n = Math.Sqrt(mu / (el.a * el.a * el.a));
                double M = WrapPi(el.m0 + n * dt);
                double E = SolveEccentric(M, el.e);
                // Half-angle form: stable at all e, unlike acos of the cos(nu) identity.
                nu = 2.0 * Math.Atan2(Math.Sqrt(1.0 + el.e) * Math.Sin(E * 0.5),
                                      Math.Sqrt(1.0 - el.e) * Math.Cos(E * 0.5));
            }
            else
            {
                double aAbs = Math.Abs(el.a);
                double n = Math.Sqrt(mu / (aAbs * aAbs * aAbs));
                double M = el.m0 + n * dt;                 // hyperbolic M does NOT wrap
                double H = SolveHyperbolic(M, el.e);
                nu = 2.0 * Math.Atan2(Math.Sqrt(el.e + 1.0) * Math.Sinh(H * 0.5),
                                      Math.Sqrt(el.e - 1.0) * Math.Cosh(H * 0.5));
            }

            double p = el.p &gt; 0.0 ? el.p : el.a * (1.0 - el.e * el.e);
            double rm = p / (1.0 + el.e * Math.Cos(nu));
            double sqrtMuP = Math.Sqrt(mu / p);

            // Perifocal frame (x toward periapsis, z along h)
            DoubleVector3 rPf = new DoubleVector3(rm * Math.Cos(nu), rm * Math.Sin(nu), 0.0);
            DoubleVector3 vPf = new DoubleVector3(-sqrtMuP * Math.Sin(nu),
                                                   sqrtMuP * (el.e + Math.Cos(nu)), 0.0);

            // R3(-raan) R1(-i) R3(-argp)
            double cO = Math.Cos(el.raan), sO = Math.Sin(el.raan);
            double ci = Math.Cos(el.i),    si = Math.Sin(el.i);
            double cw = Math.Cos(el.argp), sw = Math.Sin(el.argp);

            double m11 = cO * cw - sO * sw * ci, m12 = -cO * sw - sO * cw * ci, m13 =  sO * si;
            double m21 = sO * cw + cO * sw * ci, m22 = -sO * sw + cO * cw * ci, m23 = -cO * si;
            double m31 = sw * si,                m32 =  cw * si,               m33 =  ci;

            r = new DoubleVector3(m11 * rPf.x + m12 * rPf.y + m13 * rPf.z,
                                  m21 * rPf.x + m22 * rPf.y + m23 * rPf.z,
                                  m31 * rPf.x + m32 * rPf.y + m33 * rPf.z);
            v = new DoubleVector3(m11 * vPf.x + m12 * vPf.y + m13 * vPf.z,
                                  m21 * vPf.x + m22 * vPf.y + m23 * vPf.z,
                                  m31 * vPf.x + m32 * vPf.y + m33 * vPf.z);
        }

        // ------------------------------------------------------- anomaly conversions
        public static double TrueToMean(double nu, double e)
        {
            if (e &lt; 1.0)
            {
                double E = 2.0 * Math.Atan2(Math.Sqrt(1.0 - e) * Math.Sin(nu * 0.5),
                                            Math.Sqrt(1.0 + e) * Math.Cos(nu * 0.5));
                return E - e * Math.Sin(E);
            }
            double H = 2.0 * Atanh(Math.Sqrt((e - 1.0) / (e + 1.0)) * Math.Tan(nu * 0.5));
            return e * Math.Sinh(H) - H;
        }

        static double Atanh(double x) =&gt; 0.5 * Math.Log((1.0 + x) / (1.0 - x));

        public static double WrapPi(double x)
        {
            x %= TwoPi;
            if (x &gt;  Math.PI) x -= TwoPi;
            if (x &lt; -Math.PI) x += TwoPi;
            return x;
        }

        // ------------------------------------------------- elliptic Kepler equation
        /// Solve M = E - e sin(E) for E. Newton-Raphson with a damped step and a
        /// guaranteed-convergent bisection fallback.
        public static double SolveEccentric(double M, double e,
                                            double tol = 1e-13, int maxIter = 40)
        {
            M = WrapPi(M);
            if (e &lt; 1e-12) return M;                 // circular

            // Danby's starter. Good to ~1e-2 even at e = 0.99, which halves the
            // iteration count versus the naive E0 = M.
            double E = M + 0.85 * e * Math.Sign(Math.Sin(M) == 0.0 ? 1.0 : Math.Sin(M));

            for (int k = 0; k &lt; maxIter; k++)
            {
                double f  = E - e * Math.Sin(E) - M;
                double fp = 1.0 - e * Math.Cos(E);
                if (fp &lt; 1e-14) break;               // near-parabolic stall -&gt; bisect
                double dE = -f / fp;
                // Damp the step. Undamped NR overshoots wildly for e &gt; 0.97 when the
                // guess lands on the near-flat part of the curve at periapsis.
                if (dE &gt;  0.5) dE =  0.5;
                if (dE &lt; -0.5) dE = -0.5;
                E += dE;
                if (Math.Abs(dE) &lt; tol) return E;
            }
            return BisectEccentric(M, e, tol);
        }

        /// f(E) = E - e sin E - M is strictly increasing for e &lt; 1, and
        /// E - M = e sin E is bounded by e, so [M - e, M + e] always brackets the root.
        static double BisectEccentric(double M, double e, double tol)
        {
            double lo = M - e, hi = M + e;
            for (int k = 0; k &lt; 200; k++)
            {
                double mid = 0.5 * (lo + hi);
                if (mid - e * Math.Sin(mid) - M &gt; 0.0) hi = mid; else lo = mid;
                if (hi - lo &lt; tol) break;
            }
            return 0.5 * (lo + hi);
        }

        // ----------------------------------------------- hyperbolic Kepler equation
        /// Solve M = e sinh(H) - H for H. Note M is unbounded here — do not wrap it.
        public static double SolveHyperbolic(double M, double e,
                                             double tol = 1e-13, int maxIter = 60)
        {
            // Starter: linear near M = 0, logarithmic once sinh dominates.
            double H = (Math.Abs(M) &lt; 6.0)
                     ? M / (e - 1.0)
                     : Math.Sign(M) * Math.Log(2.0 * Math.Abs(M) / e + 1.8);

            for (int k = 0; k &lt; maxIter; k++)
            {
                double f  = e * Math.Sinh(H) - H - M;
                double fp = e * Math.Cosh(H) - 1.0;    // &gt;= e - 1 &gt; 0, never singular
                double dH = -f / fp;
                if (dH &gt;  1.0) dH =  1.0;              // sinh is brutally stiff
                if (dH &lt; -1.0) dH = -1.0;
                H += dH;
                if (Math.Abs(dH) &lt; tol) return H;
            }
            return BisectHyperbolic(M, e, tol);
        }

        static double BisectHyperbolic(double M, double e, double tol)
        {
            // f is strictly increasing; expand a bracket by doubling.
            double lo = -1.0, hi = 1.0;
            while (e * Math.Sinh(lo) - lo - M &gt; 0.0) lo *= 2.0;
            while (e * Math.Sinh(hi) - hi - M &lt; 0.0) hi *= 2.0;
            for (int k = 0; k &lt; 300; k++)
            {
                double mid = 0.5 * (lo + hi);
                if (e * Math.Sinh(mid) - mid - M &gt; 0.0) hi = mid; else lo = mid;
                if (hi - lo &lt; tol * Math.Max(1.0, Math.Abs(hi))) break;
            }
            return 0.5 * (lo + hi);
        }

        // --------------------------------------------- universal-variable propagation
        /// Stumpff functions C(z) and S(z).
        /// The series branch is not an optimisation — it is required. The closed forms
        /// suffer catastrophic cancellation as z -&gt; 0 (1 - cos(s) with s ~ 1e-3 loses
        /// about seven significant digits).
        public static void Stumpff(double z, out double c2, out double c3)
        {
            if (z &gt; 1e-4)
            {
                double s = Math.Sqrt(z);
                c2 = (1.0 - Math.Cos(s)) / z;
                c3 = (s - Math.Sin(s)) / (s * s * s);
            }
            else if (z &lt; -1e-4)
            {
                double s = Math.Sqrt(-z);
                c2 = (1.0 - Math.Cosh(s)) / z;
                c3 = (Math.Sinh(s) - s) / (s * s * s);
            }
            else
            {
                c2 = 0.5      - z / 24.0  + z * z / 720.0  - z * z * z / 40320.0;
                c3 = 1.0/6.0  - z / 120.0 + z * z / 5040.0 - z * z * z / 362880.0;
            }
        }

        /// Propagate (r0, v0) forward by dt under a point mass mu, using the universal
        /// anomaly chi. One code path for ellipse, parabola and hyperbola — which is
        /// exactly what the patched-conic SOI search needs, because a trajectory can
        /// change type mid-search.
        public static bool UniversalPropagate(DoubleVector3 r0, DoubleVector3 v0,
                                              double dt, double mu,
                                              out DoubleVector3 r, out DoubleVector3 v,
                                              double tol = 1e-9, int maxIter = 60)
        {
            r = r0; v = v0;
            if (dt == 0.0) return true;

            double r0m    = r0.magnitude;
            double rdotv  = DoubleVector3.Dot(r0, v0);
            double sqrtMu = Math.Sqrt(mu);
            double alpha  = 2.0 / r0m - v0.sqrMagnitude / mu;   // = 1/a

            double chi;
            if (alpha &gt; 1e-12)                       // elliptic
            {
                chi = sqrtMu * dt * alpha;
            }
            else if (alpha &lt; -1e-12)                 // hyperbolic
            {
                double a = 1.0 / alpha;              // negative
                double sgn = Math.Sign(dt);
                chi = sgn * Math.Sqrt(-a) * Math.Log(
                        (-2.0 * mu * alpha * dt) /
                        (rdotv + sgn * Math.Sqrt(-mu * a) * (1.0 - r0m * alpha)));
            }
            else                                     // near-parabolic (Barker)
            {
                DoubleVector3 h = DoubleVector3.Cross(r0, v0);
                double p = h.sqrMagnitude / mu;
                double s = 0.5 * (Math.PI * 0.5 - Math.Atan(3.0 * Math.Sqrt(mu / (p*p*p)) * dt));
                double w = Math.Atan(Math.Pow(Math.Tan(s), 1.0 / 3.0));
                chi = Math.Sqrt(p) * 2.0 / Math.Tan(2.0 * w);
            }

            double z = 0.0, c2 = 0.5, c3 = 1.0 / 6.0, rm = r0m;
            bool converged = false;
            for (int k = 0; k &lt; maxIter; k++)
            {
                z = chi * chi * alpha;
                Stumpff(z, out c2, out c3);
                // rm is exactly dF/dchi, so this is Newton's method with an
                // analytic derivative and no extra work.
                rm = chi * chi * c2
                   + (rdotv / sqrtMu) * chi * (1.0 - z * c3)
                   + r0m * (1.0 - z * c2);
                double F = (rdotv / sqrtMu) * chi * chi * c2
                         + (1.0 - r0m * alpha) * chi * chi * chi * c3
                         + r0m * chi - sqrtMu * dt;
                if (Math.Abs(rm) &lt; 1e-12) break;
                double dchi = F / rm;
                chi -= dchi;
                if (Math.Abs(dchi) &lt; tol) { converged = true; break; }
            }

            // Lagrange f and g coefficients.
            double f    = 1.0 - (chi * chi / r0m) * c2;
            double g    = dt - (chi * chi * chi / sqrtMu) * c3;
            double gdot = 1.0 - (chi * chi / rm) * c2;
            double fdot = (sqrtMu / (rm * r0m)) * chi * (z * c3 - 1.0);

            r = r0 * f + v0 * g;
            v = r0 * fdot + v0 * gdot;

            // Sanity identity: f*gdot - fdot*g must equal 1. Assert it in dev builds;
            // it catches every sign error in this function immediately.
            return converged;
        }
    }
}</code></pre>

<h2>2b. KEY C# SCRIPTS — ORBITAL CORE</h2>

<h3>KeplerSolver.cs</h3>
<p>State vectors to Keplerian elements and back. The bisection fallback is not optional:
Newton-Raphson on Kepler's equation diverges for high eccentricity with a naive initial
guess, and that is the single most common bug in hobby orbital code.</p>
<pre><code>using System;
using UnityEngine;

public static class KeplerSolver
{
    public const double Tolerance = 1e-12;
    public const int    MaxIter   = 64;

    public struct Elements
    {
        public double a, e, i, raan, argp, nu, m0, epoch, mu;
        public double Period =&gt; (e &lt; 1.0 &amp;&amp; a &gt; 0.0) ? 2.0 * Math.PI * Math.Sqrt(a*a*a/mu)
                                                       : double.PositiveInfinity;
        public double Periapsis =&gt; a * (1.0 - e);
        public double Apoapsis  =&gt; (e &lt; 1.0) ? a * (1.0 + e) : double.PositiveInfinity;
    }

    /// Solve M = E - e sin E for the eccentric anomaly.
    public static double SolveElliptic(double M, double e)
    {
        M = M % (2.0 * Math.PI); if (M &lt; 0.0) M += 2.0 * Math.PI;
        // Initial guess after Danby; good enough that Newton converges in ~4 steps.
        double E = M + 0.85 * e * Math.Sign(Math.Sin(M));
        for (int k = 0; k &lt; MaxIter; k++)
        {
            double f  = E - e * Math.Sin(E) - M;
            double fp = 1.0 - e * Math.Cos(E);
            if (Math.Abs(fp) &lt; 1e-14) break;
            double d = f / fp;
            E -= d;
            if (Math.Abs(d) &lt; Tolerance) return E;
        }
        // Newton failed (near-parabolic). Bisect, which cannot fail.
        double lo = 0.0, hi = 2.0 * Math.PI;
        for (int k = 0; k &lt; 200; k++)
        {
            double mid = 0.5 * (lo + hi);
            if (mid - e * Math.Sin(mid) - M &gt; 0.0) hi = mid; else lo = mid;
        }
        return 0.5 * (lo + hi);
    }

    /// Solve M = e sinh H - H for the hyperbolic anomaly.
    public static double SolveHyperbolic(double M, double e)
    {
        double H = Math.Sign(M) * Math.Log(2.0 * Math.Abs(M) / e + 1.8);
        for (int k = 0; k &lt; MaxIter; k++)
        {
            double f  = e * Math.Sinh(H) - H - M;
            double fp = e * Math.Cosh(H) - 1.0;
            if (Math.Abs(fp) &lt; 1e-14) break;
            double d = f / fp;
            H -= d;
            if (Math.Abs(d) &lt; Tolerance) break;
        }
        return H;
    }

    public static Elements FromState(DoubleVector3 r, DoubleVector3 v, double mu, double epoch)
    {
        double R = r.Magnitude, V = v.Magnitude;
        DoubleVector3 h = DoubleVector3.Cross(r, v);
        DoubleVector3 n = DoubleVector3.Cross(new DoubleVector3(0,0,1), h);
        DoubleVector3 ev = (DoubleVector3.Cross(v, h) / mu) - (r / R);

        Elements el = default;
        el.mu    = mu;
        el.epoch = epoch;
        el.e     = ev.Magnitude;
        double energy = V*V*0.5 - mu/R;
        el.a  = (Math.Abs(el.e - 1.0) &gt; 1e-9) ? -mu / (2.0 * energy) : double.PositiveInfinity;
        el.i  = Math.Acos(Clamp(h.z / h.Magnitude, -1.0, 1.0));

        // Circular and equatorial orbits leave argp / raan undefined; pick a stable
        // convention instead of returning NaN.
        if (n.Magnitude &gt; 1e-9)
        {
            el.raan = Math.Acos(Clamp(n.x / n.Magnitude, -1.0, 1.0));
            if (n.y &lt; 0.0) el.raan = 2.0 * Math.PI - el.raan;
        }
        else el.raan = 0.0;

        if (el.e &gt; 1e-9 &amp;&amp; n.Magnitude &gt; 1e-9)
        {
            el.argp = Math.Acos(Clamp(DoubleVector3.Dot(n, ev) / (n.Magnitude * el.e), -1.0, 1.0));
            if (ev.z &lt; 0.0) el.argp = 2.0 * Math.PI - el.argp;
        }
        else el.argp = 0.0;

        if (el.e &gt; 1e-9)
        {
            el.nu = Math.Acos(Clamp(DoubleVector3.Dot(ev, r) / (el.e * R), -1.0, 1.0));
            if (DoubleVector3.Dot(r, v) &lt; 0.0) el.nu = 2.0 * Math.PI - el.nu;
        }
        else el.nu = 0.0;

        return el;
    }

    static double Clamp(double x, double a, double b) =&gt; x &lt; a ? a : (x &gt; b ? b : x);
}</code></pre>

<h3>PatchedConicSolver.cs</h3>
<p>The sphere of influence radius is <code>r_SOI = a * (m/M)^(2/5)</code>. Crossing it means
changing reference frame: subtract or add the parent body's state vector. Do it in one
atomic step or the trajectory visibly kinks.</p>
<pre><code>public class PatchedConicSolver : MonoBehaviour
{
    public CelestialBody currentSOI;

    public static double SoiRadius(CelestialBody b)
        =&gt; b.parent == null ? double.PositiveInfinity
                            : b.semiMajorAxis * System.Math.Pow(b.mu / b.parent.mu, 0.4);

    /// Deepest body in the hierarchy whose SOI contains the point.
    public CelestialBody Dominant(DoubleVector3 pos)
    {
        CelestialBody best = CelestialBody.Root;
        foreach (var b in CelestialBody.All)
        {
            if (b.parent == null) continue;
            if ((pos - b.Position).Magnitude &lt; SoiRadius(b) &amp;&amp; b.Depth &gt; best.Depth)
                best = b;
        }
        return best;
    }

    /// Rebase the vessel's state when it crosses a SOI boundary.
    public void CheckTransition(Vessel v)
    {
        CelestialBody now = Dominant(v.Position);
        if (now == currentSOI) return;
        Debug.Log(\$"SOI change {currentSOI.name} -> {now.name}");
        // Position and velocity are absolute, so nothing to convert here; what changes is
        // which mu the conic is fitted against. Refit immediately so the predicted
        // trajectory does not flicker for a frame.
        v.elements  = KeplerSolver.FromState(v.Position - now.Position,
                                             v.Velocity - now.Velocity, now.mu, Time.timeAsDouble);
        currentSOI  = now;
        FloatingOrigin.Instance.RequestRebase();
    }
}</code></pre>

<h3>PlanetQuadtree.cs — chunked LOD on a cube-sphere</h3>
<p>Subdivide on screen-space error. Skirts are the cheapest crack fix and the one to use
first; edge-stitching produces cleaner normals but complicates the index buffer, and
geomorphing is only worth it once popping is your dominant artifact.</p>
<pre><code>public class QuadtreeNode
{
    public int face, depth;
    public Vector2 uvMin; public float size;
    public QuadtreeNode[] children;
    public Mesh mesh;

    /// Tangent warp spreads vertices evenly; a plain normalized cube bunches them
    /// badly at the face centres.
    public static Vector3 CubeToSphere(int face, float u, float v)
    {
        float tu = Mathf.Tan(u * Mathf.PI * 0.25f);
        float tv = Mathf.Tan(v * Mathf.PI * 0.25f);
        Vector3 p = FaceBasis[face].right   * tu
                  + FaceBasis[face].up      * tv
                  + FaceBasis[face].forward;
        return p.normalized;
    }

    public void Update(Vector3 camLocal, float planetRadius, int maxDepth)
    {
        Vector3 centre = CubeToSphere(face, uvMin.x + size*0.5f, uvMin.y + size*0.5f)
                       * planetRadius;
        float dist     = Vector3.Distance(camLocal, centre);
        float nodeSize = planetRadius * size;

        // Split while the node subtends more than ~2 chunk-widths of screen.
        bool wantSplit = dist &lt; nodeSize * 2.2f &amp;&amp; depth &lt; maxDepth;

        if (wantSplit &amp;&amp; children == null) Split();
        if (!wantSplit &amp;&amp; children != null &amp;&amp; dist &gt; nodeSize * 3.2f) Merge(); // hysteresis

        if (children != null) foreach (var c in children) c.Update(camLocal, planetRadius, maxDepth);
    }
}</code></pre>
<div class="note"><strong>Hysteresis matters.</strong> Split at 2.2x and merge at 3.2x, never at
the same threshold — otherwise a node sitting exactly on the boundary splits and merges
every frame, and you get a stutter that is very hard to trace.</div>

<h3>WormholeController.cs</h3>
<pre><code>public class WormholeController : MonoBehaviour
{
    public enum Phase { Idle, Charging, Opening, Transit, Exit }
    public Phase phase = Phase.Idle;

    [SerializeField] float chargeTime = 2.2f, openTime = 1.4f, transitTime = 4.2f;
    float t;
    CelestialBody target;

    public void Begin(CelestialBody destination)
    {
        if (ship.power &lt; 0.12f) { Hud.Warn("Insufficient reactor charge"); return; }
        target = destination; phase = Phase.Charging; t = 0f;
    }

    void Update()
    {
        if (phase == Phase.Idle) return;
        t += Time.deltaTime;
        switch (phase)
        {
            case Phase.Charging:
                ship.power -= 0.06f * Time.deltaTime;
                mouthMaterial.SetFloat("_Open", Mathf.Clamp01(t / chargeTime));
                if (t &gt; chargeTime) { phase = Phase.Opening; t = 0f; }
                break;
            case Phase.Transit:
                if (t &gt; transitTime) { Arrive(); phase = Phase.Exit; t = 0f; }
                break;
        }
    }

    /// Drop the ship on a stable circular orbit rather than at a random point, so the
    /// player is never dumped into an immediate escape or impact trajectory.
    void Arrive()
    {
        double r  = target.radius * 2.5;
        DoubleVector3 pos = target.Position + new DoubleVector3(r, 0, 0);
        double v  = System.Math.Sqrt(target.mu / r);          // vis-viva, circular case
        ship.SetState(pos, target.Velocity + new DoubleVector3(0, 0, -v));
        ship.transform.rotation = Quaternion.LookRotation(
            (Vector3)(target.Position - pos), Vector3.up);
        FloatingOrigin.Instance.RequestRebase();
    }
}</code></pre>

<h3>ScaleManager.cs — the space-to-surface handover</h3>
<p>One camera cannot cover 0.1 m to 1e13 m with a 24-bit depth buffer. Two options, and
the second is what this prototype uses.</p>
<ul>
<li><strong>Split cameras.</strong> A near camera (0.1 m to 10 km) and a far camera
(5 km to 1e13 m) rendering in sequence with depth cleared between. Robust, costs an extra
pass, and objects straddling the boundary need care.</li>
<li><strong>Logarithmic depth.</strong> Write
<code>z = log2(max(1e-6, 1 + w)) * (2 / log2(far + 1)) - 1</code> in the vertex shader.
One pass, no boundary, but interpolation across very large triangles is only approximate —
so tessellate long thin geometry, and write <code>gl_FragDepth</code> in the fragment shader
if you see z-fighting on huge polygons.</li>
</ul>

<h2>3. UNREAL ENGINE 5 ALTERNATIVE</h2>

<h3>What changes, and what does not</h3>
<p>UE5's <strong>Large World Coordinates</strong> makes <code>FVector</code> double-precision,
which removes the most painful part of the Unity approach: you can keep true 1:1
heliocentric positions in engine types without a custom double vector. It does <em>not</em>
remove the need for origin rebasing — GPU transforms are still float, so
<code>WorldToMeters</code> drift and shadow/depth precision still degrade far from origin.
Keep rebasing, just rebase less often.</p>

<h3>Module layout</h3>
<pre><code>Source/StellarExpanse/
  Public/
    Celestial/    APlanetActor.h  UOrbitalMovementComponent.h  FPlanetQuadtree.h
    Flight/       AVesselPawn.h   UAeroComponent.h  URcsComponent.h
    Warp/         AWormholeActor.h
    Render/       UPlanetTerrainComponent.h  FTerrainMeshBuilder.h
  Private/        (matching .cpp)
Content/
  Planets/   Materials/  Niagara/  Blueprints/  Maps/</code></pre>

<h3>Nanite: read this before you plan around it</h3>
<div class="note"><strong>Nanite does not solve procedural planets the way people assume.</strong>
Nanite clusters are built offline from static meshes. Runtime-generated geometry has to go
through the Nanite build path, which is far too slow to do per chunk per frame. As of UE 5.4+
there is runtime Nanite mesh creation, but it is expensive and not designed for continuous
streaming terrain. For a procedural planet you almost certainly want conventional chunked
LOD with your own mesh builder (Realtime Mesh Component or a custom
<code>UProceduralMeshComponent</code> replacement), and reserve Nanite for authored props
scattered on the surface — rocks, wreckage, buildings — where it genuinely shines.</div>

<h3>Lumen, World Partition, Chaos, Niagara</h3>
<ul>
<li><strong>Lumen</strong> works well for surface-level lighting but its screen-space and
distance-field paths assume human-scale worlds. At orbital distances, fall back to a simple
directional light plus your analytic atmosphere; switch Lumen on below roughly 50 km.</li>
<li><strong>World Partition</strong> is built around a finite grid and does not naturally
express a sphere. Use it for authored surface content on a "current landing region" tile,
and drive planet terrain from your own quadtree instead.</li>
<li><strong>Chaos</strong> handles the landing gear well: a physics constraint per leg with a
linear drive gives you spring and damping directly, and its solver is stable at the
stiffnesses landing gear needs.</li>
<li><strong>Niagara</strong> is the right tool for the plume, re-entry plasma and dust.
Use GPU sim with a fixed bounds override — the default dynamic bounds computation is a
readback stall, and at these particle counts it will dominate your frame.</li>
</ul>

<h2>4. SHADER AND VFX RECOMMENDATIONS</h2>

<h3>Atmospheric scattering</h3>
<p>Two credible choices. <strong>Bruneton and Neyret (2008)</strong> precompute transmittance
and multiple-scattering into LUTs; highest quality, but a per-planet bake and several
megabytes of texture. <strong>Hillaire (2020), "A Scalable and Production Ready Sky and
Atmosphere Rendering Technique"</strong> is what most modern engines ship: small LUTs, a
sky-view LUT in a latitude/longitude parameterisation, and an aerial-perspective volume.
It re-bakes cheaply, which matters when the player can wormhole to a new planet.</p>
<p>The cheap version — and what this prototype uses — is analytic single scattering with a
short optical-depth march. It costs about 20 texture-free ALU-heavy steps and looks correct
from space through to the ground. <strong>Include the ozone layer.</strong> Without it your
twilight has no purple-magenta band and every sunset looks subtly wrong. The failure mode of
all of these is banding on long rays; dither the sample offset per pixel.</p>

<h3>Volumetric clouds</h3>
<p><strong>Schneider and Vos, "The Real-time Volumetric Cloudscapes of Horizon: Zero Dawn"</strong>
is still the reference: Perlin-Worley base shape, Worley erosion, a weather texture driving
coverage and type, height-gradient profiles per cloud type, dual-lobe Henyey-Greenstein
phase, and the Beer's-powder term for dark edges.</p>
<div class="note"><strong>Normalise your phase function.</strong> Henyey-Greenstein is
<code>(1 - g^2) / (4*pi*(1 + g^2 - 2*g*cos(theta))^1.5)</code>. Drop the <code>4*pi</code> and
at g = 0.8 the forward peak reaches about 45 instead of 3.6 — your clouds blow out to solid
white and no amount of density tuning will fix it. This exact bug occurred during
development of this prototype.</div>
<p>Cost control: march at quarter resolution into a separate buffer, offset samples with a
Bayer or blue-noise pattern, reproject the previous frame, and upsample with a depth-aware
bilateral filter. Early-out when transmittance drops below 0.01.</p>

<h3>Ocean</h3>
<p><strong>Tessendorf's FFT</strong> spectrum is the gold standard for a realistic open sea and
is what film uses, but it needs a compute pass and tiles, which is awkward on a sphere.
<strong>Sum-of-Gerstner-waves</strong> — 8 to 16 waves from a directional spectrum — gets you
the sharp trochoidal crests that read as real water, gives analytic normals and tangents for
free, and lets the CPU evaluate the identical displacement for buoyancy. The
<strong>Jacobian</strong> of the Gerstner displacement going negative tells you where a wave
is about to break: that is your foam mask, and it is far more convincing than a noise
texture.</p>
<p>The single detail that sells water at distance is <strong>slope-derived roughness</strong>
feeding a GGX lobe. It turns the sun's reflection from a dot into a long shimmering streak.</p>

<h3>Re-entry plasma and the bow shock</h3>
<p>Drive everything from real quantities: stagnation heat flux by <strong>Sutton-Graves</strong>,
<code>q = k * sqrt(rho / Rn) * v^3</code> with k about 1.7415e-4 in SI, and shock standoff
distance shrinking with Mach number. Colour the emission by blackbody temperature rather than
by an artist gradient, and modulate it by <code>dot(normal, -velocityDirection)</code> so
windward surfaces glow and leeward surfaces stay dark. The long turbulent wake behind the
vehicle is what conveys speed; without it, re-entry reads as a static glow.</p>

<h3>Engine plumes</h3>
<p>Make plume shape a function of ambient pressure. At sea level you get a narrow collimated
jet with visible <strong>Mach diamonds</strong> from the shock train; in vacuum the flow is
grossly underexpanded and blooms into a wide translucent bell. Animating that transition
during ascent is one of the highest-value details in the whole project, and it is nearly free
— it is one uniform.</p>

<h3>Wormhole</h3>
<p>Base it on the Ellis / Morris-Thorne metric as rendered for <em>Interstellar</em>:
<strong>James, von Tunzelmann, Franklin and Thorne, "Gravitational Lensing by Spinning Black
Holes in Astrophysics, and in the Movie Interstellar", Classical and Quantum Gravity 32,
065001 (2015)</strong>. The three things that make it read as real rather than as a portal
effect:</p>
<ol>
<li>The mouth is a <strong>sphere</strong> showing the destination sky, not a hole in a plane.</li>
<li>An <strong>Einstein ring</strong> where the deflection diverges at the throat edge.</li>
<li>If you add an accretion disk, <strong>Doppler beaming</strong> makes the approaching side
dramatically brighter and bluer, and lensing lifts the far side of the disk up over the top
and under the bottom of the mouth. That asymmetry is the recognisable signature.</li>
</ol>

<h3>Terrain surface</h3>
<p>Triplanar mapping avoids UV seams on a sphere and handles cliffs correctly; blend the three
projections by the squared normal components with a sharpening exponent around 4. Add parallax
occlusion mapping only below about 50 m from the camera — above that it costs the same and
does nothing visible. Tessellation is largely obsolete for this purpose; prefer denser chunk
meshes near the camera, which cost less and behave better with your collision mesh.</p>
<div class="note"><strong>Scale-aware thresholds.</strong> Any biome boundary — snowline,
waterline, slope-driven rock — must widen its transition as vertex spacing grows. A fixed
<code>smoothstep(a,b,x)</code> evaluated per vertex at coarse LOD flips between neighbouring
vertices hundreds of kilometres apart and Gouraud-interpolates into salt-and-pepper speckle.
This was a real bug in this prototype and it looks exactly like broken noise.</div>

<h2>5. SHIP MODEL IMPORT AND SETUP</h2>

<h3>Budgets and LOD chain</h3>
<table>
<tr><th>LOD</th><th>Triangles</th><th>Switch distance</th><th>Notes</th></tr>
<tr><td>LOD0</td><td>150k-400k</td><td>0-60 m</td><td>Cockpit interior visible, full greebles</td></tr>
<tr><td>LOD1</td><td>60k</td><td>60-250 m</td><td>Interior culled, small greebles baked to normal map</td></tr>
<tr><td>LOD2</td><td>15k</td><td>250 m-2 km</td><td>Silhouette only, panel lines in texture</td></tr>
<tr><td>LOD3</td><td>2k</td><td>2 km+</td><td>Plus an impostor billboard beyond about 20 km</td></tr>
</table>

<h3>Conventions</h3>
<ul>
<li><strong>Scale:</strong> author in metres, 1 unit = 1 m, and apply scale before export.
Non-uniform scale on a parent transform breaks normal mapping and physics inertia.</li>
<li><strong>Pivot:</strong> at the centre of mass, not at the geometric centre and not at the
nose. Your inertia tensor and every torque calculation assume this.</li>
<li><strong>Axis:</strong> pick one and enforce it. This project uses -Z forward, +Y up.
Unity is +Z forward and Blender is +Y forward, so an FBX round-trip will rotate your ship
unless you fix it at export.</li>
<li><strong>Naming:</strong> <code>SM_Vagrant_Hull_LOD0</code>,
<code>SKT_Engine_01</code> for sockets, <code>SM_Vagrant_Gear_L_Upper</code> for
articulated parts. Sockets for every engine bell, RCS port, gear leg and nav light —
the flight model finds them by name.</li>
</ul>

<h3>Rigging the moving parts</h3>
<ul>
<li><strong>Engine bells</strong> gimbal about two axes. Rig as a two-bone chain with the
pivot at the gimbal block, not at the throat, and rate-limit the actuation in code
(real gimbals slew at roughly 5-15 degrees per second).</li>
<li><strong>Landing gear</strong> needs a prismatic joint per leg for the shock stroke plus a
hinge for deployment. Drive the visual compression from the physics constraint, never the
other way round.</li>
<li><strong>Radiators</strong> deploy on a hinge; make sure the collider follows, or the ship
will collide with a stowed radiator's deployed collider.</li>
</ul>

<h3>Import settings people get wrong</h3>
<ul>
<li>Unity: turn <strong>off</strong> "Optimize Mesh" if you rely on vertex order, turn
<strong>on</strong> "Read/Write" only if you genuinely need CPU access (it doubles memory),
and set "Normals: Import" — recalculating destroys hard edges on machined surfaces.</li>
<li>Unreal: disable "Combine Meshes" for anything articulated, enable "Import Normals" for
the same reason, and set the collision complexity explicitly rather than accepting the
auto-generated convex hull, which will be wrong for a ship this shape.</li>
<li>Both: import the metallic/roughness maps as <strong>linear</strong>, not sRGB. This is the
most common material bug and it makes everything look like wet plastic.</li>
</ul>

<h2>7. PERFORMANCE BUDGET</h2>
<p>Frame budgets: 16.6 ms at 60 fps on desktop, 33.3 ms at 30 fps on mobile. Leave 20 percent
headroom or you will miss vsync on the frames that matter.</p>
<table>
<tr><th>System</th><th>Desktop (ms)</th><th>Mobile (ms)</th><th>Main lever</th></tr>
<tr><td>Terrain raster</td><td>2.5</td><td>5.0</td><td>Chunk count, LOD depth cap</td></tr>
<tr><td>Terrain mesh generation (CPU)</td><td>1.5</td><td>3.0</td><td>Chunks built per frame; move to a worker/job</td></tr>
<tr><td>Atmosphere</td><td>1.5</td><td>3.5</td><td>March step count</td></tr>
<tr><td>Volumetric clouds</td><td>3.0</td><td>6.0</td><td>Quarter-res + reprojection, or billboard fallback</td></tr>
<tr><td>Ocean</td><td>1.0</td><td>2.0</td><td>Wave count, detail fade distance</td></tr>
<tr><td>Ship and props</td><td>1.5</td><td>3.0</td><td>LOD chain, instancing</td></tr>
<tr><td>Particles / VFX</td><td>1.0</td><td>2.5</td><td>Pool cap, overdraw</td></tr>
<tr><td>Post chain</td><td>2.0</td><td>4.0</td><td>Bloom resolution, drop motion blur first</td></tr>
<tr><td>Physics + orbits</td><td>0.5</td><td>1.0</td><td>On-rails propagation when coasting</td></tr>
<tr><td>Headroom</td><td>2.1</td><td>3.3</td><td></td></tr>
</table>

<h3>Optimisations in priority order</h3>
<ol>
<li><strong>Move terrain generation off the main thread.</strong> Unity Jobs plus Burst, or a
Web Worker. This is the single biggest win and it removes the hitching that players notice
most.</li>
<li><strong>Horizon-cull terrain chunks.</strong> On the ground you can see perhaps 5 percent
of a planet's chunks; culling by the horizon angle is a couple of lines and removes most of
the draw calls.</li>
<li><strong>LOD hysteresis</strong> — split and merge at different distances. Costs nothing
and eliminates a whole class of stutter.</li>
<li><strong>GPU instancing for surface scatter.</strong> Rocks and plants placed by a
deterministic hash need exactly one draw call per type per chunk.</li>
<li><strong>Quarter-resolution volumetrics</strong> with depth-aware upsampling before you
consider reducing step counts — resolution is cheaper to lose than sample count.</li>
<li><strong>Occlusion culling</strong> matters far less than people expect on a planet
surface, because the horizon already does the work. Spend the time on chunk streaming
instead.</li>
</ol>

<h3>Profiling method</h3>
<p>Measure with GPU timer queries per pass, not with frame rate. Frame rate is a ratio and it
hides which pass regressed. Capture a fixed camera path — orbit, re-entry, low flight,
landed — and run it after every change; the four scenarios stress completely different parts
of the pipeline, and an optimisation that helps orbit often hurts the ground.</p>

</div>`;

   vset(_e0,(Math.random()-.5)*9,(Math.random()-.5)*9,-16+Math.random()*8);
   qrot(_e1,SHIP.quat,_e0);
   vadd(_e1,_e1,SHIP.pos);vsub(_e1,_e1,CTX.camPos);
   vnorm(_e2,SHIP.vel);
   const h=CTX.reentryHeat;
   partEmit(_e1[0],_e1[1],_e1[2],-_e2[0]*260,-_e2[1]*260,-_e2[2]*260,
    0.7+Math.random()*0.8,3.0+Math.random()*5.0,
    2.6*h,1.1*h*h,0.5*h*h*h,0.35);
  }
 }
 // landing dust: ballistic on airless worlds, billowing in atmosphere
 if(CTX.body&&CTX.altitude<180&&SHIP.throttle>0.05){
  const air=CTX.atmoDensity>0.01;
  const n=air?4:3;
  for(let i=0;i<n;i++){
   worldToBodyDir(CTX.body,SHIP.pos,_e0);
   biomeColor(_e0[0],_e0[1],_e0[2],0,0,CTX.body.dna,_bc,0);
   vsub(_e1,SHIP.pos,CTX.camPos);
   const a=Math.random()*TAU, sp=air?(12+Math.random()*24):(30+Math.random()*70);
   vsub(_e2,SHIP.pos,CTX.body.pos);vnorm(_e2,_e2);
   partEmit(_e1[0],_e1[1]-6,_e1[2],
    Math.cos(a)*sp,_e2[1]*sp*0.3,Math.sin(a)*sp,
    air?1.8:2.6,air?5:3,_bc[0]*1.4,_bc[1]*1.3,_bc[2]*1.2,air?0.9:0.02);
  }
 }
 // RCS puffs
 if(SHIP.rcsOn&&vlen(SHIP.rcs)>0.06&&Math.random()<0.7){
  const p=L.rcs[(Math.random()*L.rcs.length)|0];
  vset(_e0,p[0],p[1],p[2]);
  qrot(_e1,SHIP.quat,_e0);vadd(_e1,_e1,SHIP.pos);vsub(_e1,_e1,CTX.camPos);
  qrot(_e2,SHIP.quat,v3((Math.random()-.5)*22,(Math.random()-.5)*22,(Math.random()-.5)*22));
  partEmit(_e1[0],_e1[1],_e1[2],_e2[0],_e2[1],_e2[2],0.30,1.0,0.9,1.0,1.3,2.2);
 }
}
/* ===== BOOT + LOOP ===== */
let lastT=0, fpsAcc=0, fpsN=0, fpsShow=0;
const _g0=v3();
function frame(now){
 requestAnimationFrame(frame);
 const raw=(now-lastT)/1000; lastT=now;
 if(!isFinite(raw)||raw<=0)return;
 let dt=Math.min(raw,1/15);
 fpsAcc+=raw;fpsN++;
 if(fpsAcc>0.5){fpsShow=fpsN/fpsAcc;fpsAcc=0;fpsN=0;
  $('fps').textContent=fpsShow.toFixed(0)+' FPS · '+PART.n+' PT · '+LEAVES.length+' CH · T'+QUALITY.tier;}
 if(CTX.paused)return;
 const warp=(WARPST.state==='idle')?CTX.timeWarp:1;
 const sim=dt*warp;
 CTX.t+=sim;CTX.dt=dt;
 worldStep(CTX.t,sim);
 // sub-step so high warp stays stable
 const steps=clamp(Math.ceil(warp/8),1,8);
 for(let i=0;i<steps;i++)fltUpdate(sim/steps);
 warpUpdate(dt);
 updateCamera(dt);
 vset(_g0,0,0,0);
 if(CTX.body){
  vsub(_g0,CTX.body.pos,SHIP.pos);
  const d=vlen(_g0);vscl(_g0,_g0,CTX.body.mu/(d*d*d));
 }
 spawnFX(dt);
 partUpdate(dt,_g0);
 render();
 updateHUD(dt);
}
function boot(){
 const bar=$('bar').firstElementChild, bm=$('bmsg');
 const steps=[
  ['GENERATING SOLAR SYSTEM',()=>{loadSystem(0);worldStep(0,0);}],
  ['COMPILING SHADERS',()=>{initGL();}],
  ['ASSEMBLING VESSEL',()=>{fltInit();}],
  ['BINDING CONTROLS',()=>{buildHUD();fltBindInput(canvas);bindSticks();}],
  ['ENTERING ORBIT',()=>{}]
 ];
 let i=0;
 const next=()=>{
  if(i>=steps.length){
   $('boot').style.opacity=0;
   setTimeout(()=>{$('boot').style.display='none';},900);
   message('STELLAR EXPANSE',
    'You are in a 420 km orbit over Earth.<br>'+
    (IS_MOBILE?'Right stick to steer · left stick up for throttle · CREATE WORMHOLE to jump'
              :'W/A/S/D pitch &amp; yaw · Q/E roll · Shift/Ctrl throttle · G gear · T SAS · C view · drag to look'));
   lastT=performance.now();requestAnimationFrame(frame);
   return;
  }
  bm.textContent=steps[i][0];
  bar.style.width=((i+1)/steps.length*100)+'%';
  try{steps[i][1]();}catch(err){
   bm.innerHTML='<span style="color:#f66">FAILED: '+steps[i][0]+'</span><br>'+
     '<span style="font-size:9px">'+String(err.message||err).slice(0,400)+'</span>';
   throw err;
  }
  i++;setTimeout(next,40);
 };
 next();
}
window.SEGDBG={DBG:DBG,QUALITY:QUALITY,CTX:CTX,SHIP:SHIP,PART:PART,
 LEAVES:LEAVES,get BODIES(){return BODIES;},startWarp:startWarp,WARPST:WARPST,warpUpdate:warpUpdate};
boot();

})();
