 // orogenic ridges — only where continental gradient is high (believable mountain belts)
 const belt=sat(Math.abs(cont)*1.7+.15);

  const r=ridged(px*2.7+11,py*2.7,pz*2.7,Math.min(oct-3,6),2.11,.55);

  const step=d.amp*.28;

function fieldNormal(x,y,z,d,out,eps){

 const e=eps;

 const hy=fieldHeight(x+bx*e,y+by*e,z+bz*e,d);

 // n = normalize(up - t*sx - b*sy)
 let nx=x-tx*sx-bx*sy, ny=y-ty*sx-by*sy, nz=z-tz*sx-bz*sy;

}

function terrNode(face,u0,v0,size,depth){

function terrGetTree(b){

  for(let f=0;f<6;f++){const n=terrNode(f,-1,-1,2,0);terrInitNode(n,b);T.roots.push(n);}

  col[k*3]=col[bi*3]*0.8;col[k*3+1]=col[bi*3+1]*0.8;col[k*3+2]=col[bi*3+2]*0.8;

const _tp=v3(),_tq=v3();
function terrUpdate(b,camPos,maxDepth,out){

 vsub(_tp,camPos,b.pos);

 vset(_tq,lx,_tp[1],lz);

 for(const r of T.roots)terrVisit(r,b,_tq,maxDepth,out);

}
function terrVisit(n,b,camLocal,maxDepth,out){

 const dist=Math.hypot(dx,dy,dz);
 const nodeSize=b.radius*n.size;
 // horizon cull: skip nodes on the far side once we are close to the surface
 const camR=Math.hypot(camLocal[0],camLocal[1],camLocal[2]);
 if(n.depth>2&&camR<b.radius*1.35){
  const cosA=(camLocal[0]*n.ctr[0]+camLocal[1]*n.ctr[1]+camLocal[2]*n.ctr[2])/camR;
  const horiz=Math.sqrt(Math.max(0,1-(b.radius/camR)*(b.radius/camR)));
  if(cosA<horiz-0.35-n.size)return;

 const want=dist<nodeSize*2.2 && n.depth<maxDepth;
 if(want){
  if(!n.kids){
   n.kids=[];const h=n.size*0.5;
   for(let j=0;j<2;j++)for(let i=0;i<2;i++){
    const k=terrNode(n.face,n.u0+i*h,n.v0+j*h,h,n.depth+1);terrInitNode(k,b);n.kids.push(k);}
  }
  let ready=true;
  for(const k of n.kids)if(!k.mesh&&!(k.kids&&k.kids.length)){ready=false;break;}
  // draw children only once they all have geometry, else keep drawing this node
  if(ready||n.depth===0){for(const k of n.kids)terrVisit(k,b,camLocal,maxDepth,out);return;}

  const rec=k=>{if(k.mesh){k.mesh.dispose();k.mesh=null;}if(k.kids){k.kids.forEach(rec);k.kids=null;}};

 }

}

function MB(){
 return {P:[],N:[],C:[],M:[],I:[],base:0,
  v(x,y,z,nx,ny,nz,c,m){this.P.push(x,y,z);this.N.push(nx,ny,nz);
   this.C.push(c[0],c[1],c[2]);this.M.push(m);return this.P.length/3-1;},
  tri(a,b,c){this.I.push(a,b,c);},
  quad(a,b,c,d){this.I.push(a,b,c,a,c,d);}};
}
// tapered tube along Z from z0 (radius r0) to z1 (radius r1)
function mbTube(B,z0,r0,z1,r1,seg,col,mat,ox,oy,flat){
 ox=ox||0;oy=oy||0;
 const ring=[];
 for(let k=0;k<2;k++){
  const z=k?z1:z0, r=k?r1:r0, row=[];
  for(let i=0;i<seg;i++){
   const a=i/seg*TAU;
   const cs=Math.cos(a),sn=Math.sin(a);
   const rr=flat?r*(1-0.22*Math.abs(sn)):r;
   row.push(B.v(ox+cs*rr,oy+sn*rr,z,cs,sn,0,col,mat));
  }
  ring.push(row);

 for(let i=0;i<seg;i++){const j=(i+1)%seg;B.quad(ring[0][i],ring[0][j],ring[1][j],ring[1][i]);}

}
function mbDisc(B,z,r,seg,nz,col,mat,ox,oy){

function mbBox(B,x,y,z,sx,sy,sz,col,mat){

  const u=Math.abs(n[0])>0.5?[0,1,0]:[1,0,0];
  const w=[n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]];
  const c=[x+n[0]*sx,y+n[1]*sy,z+n[2]*sz];

  const i1=B.v(c[0]+a[0]-b[0],c[1]+a[1]-b[1],c[2]+a[2]-b[2],n[0],n[1],n[2],col,mat);
  const i2=B.v(c[0]+a[0]+b[0],c[1]+a[1]+b[1],c[2]+a[2]+b[2],n[0],n[1],n[2],col,mat);
  const i3=B.v(c[0]-a[0]+b[0],c[1]-a[1]+b[1],c[2]-a[2]+b[2],n[0],n[1],n[2],col,mat);

function fltInit(){

function fltDominant(pos){

function fltGravity(pos,out){

const ballCv=$('ball'); ballCv.width=132;ballCv.height=132;
const ballCtx=ballCv.getContext('2d',{alpha:true});
const ballImg=ballCtx.createImageData(132,132);
const _nb=v3(),_nbU=v3(),_nbN=v3(),_nbE=v3(),_nbW=v3();
function drawNavball(){
 const S=132,R=S*0.5-3,cx=S*0.5,cy=S*0.5;
 const D=ballImg.data;
 // local horizon frame
 const b=CTX.body;
 if(b){vsub(_nbU,SHIP.pos,b.pos);vnorm(_nbU,_nbU);}else vset(_nbU,0,1,0);
 vset(_nbN,0,1,0);
 if(Math.abs(vdot(_nbN,_nbU))>0.98)vset(_nbN,1,0,0);
 vcross(_nbE,_nbN,_nbU);vnorm(_nbE,_nbE);
 vcross(_nbN,_nbU,_nbE);vnorm(_nbN,_nbN);
 const q=SHIP.quat;
 for(let y=0;y<S;y++)for(let x=0;x<S;x++){
  const i=(y*S+x)*4;
  const dx=(x-cx)/R, dy=(cy-y)/R;
  const r2=dx*dx+dy*dy;
  if(r2>1){D[i+3]=0;continue;}
  const dz=Math.sqrt(1-r2);
  // screen->ship frame->world
  vset(_nb,dx,dy,dz);
  qrot(_nbW,q,_nb);
  const vy=vdot(_nbW,_nbU), vn=vdot(_nbW,_nbN), ve=vdot(_nbW,_nbE);
  const lat=Math.asin(clamp(vy,-1,1)), lon=Math.atan2(ve,vn);
  let r,g2,bl;
  if(vy>=0){r=42;g2=104;bl=168;}else{r=112;g2=76;bl=48;}
  // horizon band
  if(Math.abs(vy)<0.022){r=232;g2=238;bl=246;}
  // graticule every 10 degrees
  const latD=lat/DEG, lonD=lon/DEG;
  const gl1=Math.abs(latD%10)<0.9, gl2=Math.abs(((lonD%10)+10)%10)<0.9*Math.max(0.25,Math.cos(lat));
  if(gl1||gl2){r=Math.min(255,r+70);g2=Math.min(255,g2+70);bl=Math.min(255,bl+70);}
  if(Math.abs(latD%30)<1.3){r=Math.min(255,r+40);g2=Math.min(255,g2+40);bl=Math.min(255,bl+40);}
  // cardinal marks near the horizon
  const sh=0.55+0.45*dz;
  D[i]=r*sh;D[i+1]=g2*sh;D[i+2]=bl*sh;D[i+3]=255;
 }
 ballCtx.putImageData(ballImg,0,0);
 // markers
 const mk=(w,col,txt,filled)=>{
  qinvrot(_nb,q,w);
  const sx=cx+_nb[0]*R, sy=cy-_nb[1]*R;
  const front=_nb[2]>0;
  ballCtx.globalAlpha=front?1:0.32;
  ballCtx.strokeStyle=col;ballCtx.fillStyle=col;ballCtx.lineWidth=1.6;
  ballCtx.beginPath();ballCtx.arc(sx,sy,4.6,0,TAU);
  if(filled&&front)ballCtx.fill();else ballCtx.stroke();
  ballCtx.beginPath();ballCtx.moveTo(sx-8,sy);ballCtx.lineTo(sx-5,sy);
  ballCtx.moveTo(sx+5,sy);ballCtx.lineTo(sx+8,sy);ballCtx.moveTo(sx,sy-8);ballCtx.lineTo(sx,sy-5);
  ballCtx.stroke();ballCtx.globalAlpha=1;
 };
 // prograde / retrograde relative to the surface frame
 const vrel=_v5;
 if(b){vsub(vrel,SHIP.vel,b.vel);}else vcopy(vrel,SHIP.vel);
 if(vlen(vrel)>0.4){
  vnorm(_v6,vrel);mk(_v6,'#ffd34d',null,true);
  vscl(_v7,_v6,-1);mk(_v7,'#ffd34d',null,false);
 }
 if(b){
  vcopy(_v6,_nbU);mk(_v6,'#7fe6ff',null,false);            // radial out
  vcross(_v7,vrel,_nbU);if(vlen(_v7)>1e-6){vnorm(_v7,_v7);mk(_v7,'#c79bff',null,false);}
 }
 // fixed reticle
 ballCtx.strokeStyle='#eaf8ff';ballCtx.lineWidth=1.8;
 ballCtx.beginPath();ballCtx.moveTo(cx-16,cy);ballCtx.lineTo(cx-5,cy);
 ballCtx.moveTo(cx+5,cy);ballCtx.lineTo(cx+16,cy);ballCtx.moveTo(cx,cy-5);ballCtx.lineTo(cx,cy-13);
 ballCtx.stroke();
 ballCtx.beginPath();ballCtx.arc(cx,cy,3,0,TAU);ballCtx.stroke();
 ballCtx.strokeStyle='rgba(90,190,255,.55)';ballCtx.lineWidth=2;
 ballCtx.beginPath();ballCtx.arc(cx,cy,R+1.5,0,TAU);ballCtx.stroke();
}

const TOUCH={lx:0,ly:0,rx:0,ry:0};
function bindSticks(){
 const bind=(el,ox,oy)=>{
  const knob=el.firstElementChild;let id=null,cx=0,cy=0;
  const set=(x,y)=>{const r=el.getBoundingClientRect();
   let dx=(x-r.left-r.width/2)/(r.width/2), dy=(y-r.top-r.height/2)/(r.height/2);
   const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
   TOUCH[ox]=dx;TOUCH[oy]=-dy;
   knob.style.transform='translate('+(dx*34)+'px,'+(dy*34)+'px)';};
  el.addEventListener('touchstart',e=>{id=e.changedTouches[0].identifier;
   set(e.changedTouches[0].clientX,e.changedTouches[0].clientY);e.preventDefault();},{passive:false});
  el.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===id)
   set(t.clientX,t.clientY);e.preventDefault();},{passive:false});
  const end=e=>{for(const t of e.changedTouches)if(t.identifier===id){id=null;TOUCH[ox]=0;TOUCH[oy]=0;
   knob.style.transform='';}};
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
 };
 bind($('skL'),'lx','ly');bind($('skR'),'rx','ry');
}

/* ---------- p9a-shaders.js ---------- */
/* ===== BASELINE SHADERS (lead-owned; agent libraries layer on top where compatible) ===== */

const VS_TERRAIN=`
layout(location=0) in vec3 position;
layout(location=1) in vec3 normal;
layout(location=2) in vec2 uv;
layout(location=3) in vec3 color;
uniform mat4 uVP; uniform vec3 uChunkOff; uniform mat3 uRot; uniform vec3 uPlanetC;
out vec3 vN; out vec3 vC; out vec3 vP; out float vH;
void main(){
 vec3 lp=uRot*position;
 vec3 wp=lp+uChunkOff;
 vN=normalize(uRot*normal); vC=color; vP=wp;
 vH=length(wp-uPlanetC);
 vec4 cp=uVP*vec4(wp,1.0); segLog(cp); gl_Position=cp;
}`;
const FS_TERRAIN=`
in vec3 vN; in vec3 vC; in vec3 vP; in float vH;
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uPlanetC; uniform float uPlanetR;
uniform vec3 uSkyTint; uniform float uTime; uniform float uAtmoAmt; uniform float uOceanLvl;
out vec4 fragColor;
void main(){
 vec3 up=normalize(vP-uPlanetC);
 vec3 N=normalize(vN);
 float d=length(vP);
 // sub-metre detail normal, faded by distance so it never aliases
 float det=sat(1.0-d/2600.0);
 if(det>0.001){
  vec3 q=(vP-uPlanetC)*0.35;
  float e=0.55;
  float n0=vfbm3(q,3);
  vec3 gd=vec3(vfbm3(q+vec3(e,0,0),3)-n0,vfbm3(q+vec3(0,e,0),3)-n0,vfbm3(q+vec3(0,0,e),3)-n0);
  N=normalize(N+ (gd-dot(gd,N)*N)*det*2.2);
 }
 float ndl=dot(N,uSunDir);
 // soft terminator: a hard lambert reads as CG, a wrapped one reads as a real planet
 float diff=sat((ndl+0.06)/1.06);
 float sh=sat(dot(up,uSunDir)*6.0+0.35);   // self-shadow the far side
 diff*=sh;
 vec3 alb=vC;
 // ambient: sky dome above + bounce from the ground
 float skyv=sat(dot(N,up)*0.5+0.5);
 vec3 amb=uSkyTint*uAtmoAmt*0.22*skyv + alb*0.045;
 // very cheap specular for wet/icy ground
 vec3 V=normalize(-vP);
 vec3 H=normalize(V+uSunDir);
 float spec=pow(sat(dot(N,H)),28.0)*0.05*sat(luma(alb)-0.5);
 vec3 c=alb*(diff*uSunCol+amb)+spec*uSunCol*diff;
 fragColor=vec4(c,1.0);
}`;

const VS_SPHERE=`
layout(location=0) in vec3 position;
uniform mat4 uVP; uniform vec3 uOff; uniform float uScale; uniform mat3 uRot;
out vec3 vD; out vec3 vP;
void main(){
 vD=normalize(position);
 vec3 wp=uRot*position*uScale+uOff;
 vP=wp;
 vec4 cp=uVP*vec4(wp,1.0); segLog(cp); gl_Position=cp;
}`;
const FS_SPHERE=`
in vec3 vD; in vec3 vP;
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uOff; uniform float uScale;
uniform vec3 uCol; uniform vec3 uEmis; uniform float uIsStar; uniform float uSeed;
uniform float uType; uniform vec3 uPal0,uPal1,uPal2; uniform float uTime; uniform float uAtmoAmt;
uniform vec3 uAtmoTint;
out vec4 fragColor;
void main(){
 vec3 N=normalize(vD);
 if(uIsStar>0.5){
  // photosphere: granulation + limb darkening + faint spots
  vec3 q=N*7.0+vec3(uTime*0.006);
  float gran=vfbm3(q*3.0,4)*0.5+vfbm3(q*11.0,3)*0.25;
  float spot=sat(vfbm3(N*4.0+11.0,4)*1.7-0.72);
  vec3 V=normalize(-vP);
  float mu=sat(dot(N,V));
  float limb=0.42+0.58*pow(mu,0.55);            // Eddington-ish limb darkening
  vec3 c=uEmis*(1.0+gran*0.35)*limb;
  c=mix(c,c*0.45,spot);
  fragColor=vec4(c*7.5,1.0);return;
 }
 vec3 q=N*3.2+uSeed;
 float n=vfbm3(q,5);
 vec3 alb;
 if(uType>4.5&&uType<5.5){                       // gas giant banding
  float band=sin(N.y*20.0+vfbm3(q*2.0,4)*4.0)*0.5+0.5;
  float storm=sat(vfbm3(N*6.0+uSeed*3.0,4)*2.2-1.0);
  alb=mix(uPal0,uPal1,band);
  alb=mix(alb,uPal2,storm*0.8);
 } else {
  float cont=vfbm3(q,5)*0.5+0.5;
  alb=mix(uPal0,uPal1,sat(cont*1.6-0.25));
  alb=mix(alb,uPal2,sat(vfbm3(q*2.7+3.0,4)*1.4));
  float ice=sat((abs(N.y)-0.68)*4.0);
  alb=mix(alb,vec3(0.92,0.95,1.0),ice*0.85);
 }
 alb*=uCol*1.5;
 float ndl=dot(N,uSunDir);
 float diff=sat((ndl+0.05)/1.05);
 // atmospheric rim: bright forward-scattering limb even at a distance
 vec3 V=normalize(-vP);
 float rim=pow(1.0-sat(dot(N,V)),3.0);
 vec3 c=alb*diff*uSunCol + uAtmoTint*rim*uAtmoAmt*sat(ndl+0.3)*1.6;
 c+=alb*0.02;
 fragColor=vec4(c,1.0);
}`;

const FS_STARS=`
in vec2 vUV; out vec4 fragColor;
uniform vec3 uCamR,uCamU,uCamF; uniform float uTanF, uAspect; uniform float uSeed;
// Cell-based starfield. The falloff MUST be expressed in units of the cell's angular
// size, otherwise each "star" becomes a blob a whole cell wide and the sky turns to soup.
vec3 starLayer(vec3 rd,float cells,float thresh,float bright){
 vec3 p=rd*cells;
 vec3 i=floor(p);
 vec3 c=vec3(0.0);
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
  vec3 g=i+vec3(x,y,z);
  vec3 h=hash33(g+uSeed);
  if(h.z<thresh)continue;
  vec3 sp=normalize(g+h);
  float s=length(sp-rd)*cells;          // angular distance measured in cell widths
  if(s>0.45)continue;
  float m=exp(-s*s*190.0);              // a point a few percent of a cell across
  float mag=h.y*h.y*h.y;                // magnitude distribution: many faint, few bright
  // stellar colour from a crude temperature draw
  vec3 col=mix(vec3(1.0,0.64,0.42),vec3(0.68,0.79,1.0),h.x);
  col=mix(vec3(1.0,0.96,0.90),col,0.75);
  c+=col*m*bright*(0.18+mag*4.5);
 }
 return c;
}
void main(){
 vec2 nd=vUV*2.0-1.0;
 vec3 rd=normalize(uCamF+uCamR*nd.x*uTanF*uAspect+uCamU*nd.y*uTanF);
 vec3 c=starLayer(rd,120.0,0.930,1.0)+starLayer(rd,300.0,0.962,0.55)
       +starLayer(rd,700.0,0.984,0.30);
 // galactic plane: a soft glow with darker dust lanes cutting across it
 float gal=exp(-abs(dot(rd,normalize(vec3(0.36,0.30,-0.88))))*9.0);
 float dust=vfbm3(rd*7.0,5);
 float lane=sat(1.0-smoothstep(0.42,0.62,dust)*1.1);
 c+=vec3(0.055,0.065,0.105)*gal*lane*(0.5+dust*0.7);
 c+=vec3(0.085,0.070,0.055)*gal*lane*sat(dust-0.55)*0.9;
 c+=vec3(0.0030,0.0042,0.0080);
 fragColor=vec4(c,1.0);
}`;

/* --- planet composite: ocean + volumetric cloud shell + atmospheric scattering --- */
const FS_ATMO=`
in vec2 vUV; out vec4 fragColor;
uniform sampler2D uScene, uDepth;
uniform vec3 uCamR,uCamU,uCamF; uniform float uTanF,uAspect,uTime;
uniform vec3 uPlanetC; uniform float uPlanetR,uAtmoTop;
uniform vec3 uSunDir,uSunCol;
uniform vec3 uRay; uniform float uMie, uRhoScale, uScaleH;
uniform vec3 uTint;
uniform float uHasOcean, uOceanLvl; uniform vec3 uOceanCol, uOceanDeep;
uniform float uOceanKind;
uniform float uHasCloud, uCloudLo, uCloudHi, uCloudCov;
uniform int uAtmoSteps, uCloudSteps, uCloudLightSteps;
uniform float uExposure;

float densR(float h){return exp(-max(h,0.0)/uScaleH);}
float densM(float h){return exp(-max(h,0.0)/(uScaleH*0.16));}
float densO(float h){return max(0.0,1.0-abs(h-25000.0)/18000.0);}   // ozone layer

// optical depth from point p toward the sun (short march; cheap but banding-free enough)
vec3 sunOptical(vec3 p){
 vec2 t=raySphere(p,uSunDir,uPlanetC,uAtmoTop);
 if(t.y<0.0)return vec3(0.0);
 vec2 g=raySphere(p,uSunDir,uPlanetC,uPlanetR);
 if(g.x>0.0&&g.x<t.y)return vec3(1e9);       // occluded by the planet body
 int N=4;
 float seg=t.y/float(N);
 float odR=0.0,odM=0.0,odO=0.0;
 for(int i=0;i<8;i++){ if(i>=N)break;
  vec3 s=p+uSunDir*(seg*(float(i)+0.5));
  float h=length(s-uPlanetC)-uPlanetR;
  odR+=densR(h);odM+=densM(h);odO+=densO(h);
 }
 odR*=seg;odM*=seg;odO*=seg;
 return uRay*odR*uRhoScale + vec3(uMie)*odM*1.1*uRhoScale + uRay*0.28*odO*uRhoScale*0.0006;
}
vec3 transmit(vec3 od){return exp(-od);}

// --- Gerstner ocean ---
vec3 oceanNormal(vec3 P,vec3 up,float dist,out float foam){
 vec3 t1=normalize(cross(up,abs(up.y)<0.9?vec3(0,1,0):vec3(1,0,0)));
 vec3 t2=cross(up,t1);
 float x=dot(P,t1),y=dot(P,t2);
 float dx=0.0,dy=0.0,jac=0.0;
 float amp=1.6,len=42.0,ph=0.0;
 float fade=sat(1.0-dist/9000.0);
 int N=6;
 for(int i=0;i<8;i++){ if(i>=N)break;
  float a=float(i)*2.4+uTime*0.02;
  vec2 dir=vec2(cos(a),sin(a));
  float k=TAU/len;
  float sp=sqrt(9.8/k);
  float th=k*(dir.x*x+dir.y*y)-sp*uTime*k*0.55;
  float c=cos(th),s=sin(th);
  float aa=amp*fade;
  dx+=dir.x*c*aa*k; dy+=dir.y*c*aa*k;
  jac+=aa*k*s;
  amp*=0.68; len*=0.53;
 }
 foam=sat(-jac*0.9-0.05);
 vec3 n=normalize(up - t1*dx - t2*dy);
 return n;
}
vec3 skyColour(vec3 ro,vec3 rd);

void main(){
 vec2 nd=vUV*2.0-1.0;
 vec3 rd=normalize(uCamF+uCamR*nd.x*uTanF*uAspect+uCamU*nd.y*uTanF);
 vec3 ro=vec3(0.0);
 vec3 scene=texture(uScene,vUV).rgb;
 float dz=texture(uDepth,vUV).r;
 float sceneDist=(dz>=0.9999)?1e12:segViewDist(dz);

 float camH=length(ro-uPlanetC)-uPlanetR;

 // ---------- ocean ----------
 if(uHasOcean>0.5){
  vec2 to=raySphere(ro,rd,uPlanetC,uPlanetR+uOceanLvl);
  float th=(to.x>0.0)?to.x:((to.y>0.0&&camH<uOceanLvl)?0.0:-1.0);
  if(to.x<=to.y&&th>=0.0&&th<sceneDist){
   vec3 P=ro+rd*max(th,0.0);
   vec3 up=normalize(P-uPlanetC);
   float dist=length(P-ro);
   float foam;
   vec3 N=oceanNormal(P,up,dist,foam);
   vec3 V=-rd;
   float fres=0.02+0.98*pow(1.0-sat(dot(N,V)),5.0);
   vec3 R=reflect(rd,N);
   vec3 sky=skyColour(P+up*2.0,R);
   float ndl=sat(dot(N,uSunDir));
   vec3 Hv=normalize(V+uSunDir);
   float rough=mix(0.035,0.16,sat(dist/4000.0));
   float a=rough*rough;
   float nh=sat(dot(N,Hv));
   float dGGX=a*a/(PI*pow(nh*nh*(a*a-1.0)+1.0,2.0));
   vec3 spec=uSunCol*dGGX*fres*8.0*sat(dot(up,uSunDir)*4.0);
   vec3 deep=uOceanDeep, shallow=uOceanCol;
   float sss=pow(sat(dot(V,-uSunDir)*0.5+0.5),3.0)*sat(foam*2.0+0.25);
   vec3 water=mix(deep,shallow,sat(ndl*0.9+0.1));
   if(uOceanKind>1.5){                       // lava: emissive, crust cracked along the Jacobian
    water=uOceanCol*(1.0+foam*6.0);
    water+=blackbody(1400.0+foam*1600.0)*(0.5+foam*3.0);
    spec*=0.15;fres*=0.3;
   } else {
    water+=vec3(0.02,0.16,0.13)*sss*1.4;
   }
   vec3 col=mix(water*(ndl*uSunCol*0.55+uTint*0.25),sky,fres)+spec;
   col=mix(col,vec3(0.86,0.92,0.96)*(ndl*0.8+0.2),sat(foam)*0.85);
   scene=col;
   sceneDist=dist;
  }
 }

 // ---------- volumetric cloud shell ----------
 if(uHasCloud>0.5&&uCloudCov>0.01){
  vec2 tc=raySphere(ro,rd,uPlanetC,uPlanetR+uCloudHi);
  vec2 tl=raySphere(ro,rd,uPlanetC,uPlanetR+uCloudLo);
  float t0,t1;
  bool hit=false;
  if(camH<uCloudLo){ if(tl.y>0.0){t0=tl.y;t1=tc.y;hit=tc.x<=tc.y;} }
  else if(camH<uCloudHi){ t0=0.0; t1=(tl.x>0.0)?tl.x:tc.y; hit=true; }
  else { if(tc.x<=tc.y&&tc.y>0.0){ t0=max(tc.x,0.0); t1=(tl.x>0.0)?tl.x:tc.y; hit=true; } }
  if(hit&&t1>t0){
   t1=min(t1,min(sceneDist,t0+260000.0));
   int NS=uCloudSteps;
   float seg=(t1-t0)/float(NS);
   float dith=hash21(vUV.x*3011.0+vUV.y*7919.0+float(int(uTime*60.0))).x;
   float T=1.0; vec3 acc=vec3(0.0);
   float cosT=dot(rd,uSunDir);
   // dual-lobe Henyey-Greenstein, correctly normalised by 1/4pi
   float hg1=(1.0-0.64)/(4.0*PI*pow(max(1.0+0.64-1.6*cosT,1e-3),1.5));
   float hg2=(1.0-0.04)/(4.0*PI*pow(max(1.0+0.04+0.4*cosT,1e-3),1.5));
   float phase=mix(hg2,hg1,0.62);
   for(int i=0;i<64;i++){ if(i>=NS)break;
    float t=t0+seg*(float(i)+dith);
    vec3 P=ro+rd*t;
    vec3 up=normalize(P-uPlanetC);
    float h=length(P-uPlanetC)-uPlanetR;
    float hf=sat((h-uCloudLo)/max(uCloudHi-uCloudLo,1.0));
    // vertical profile: dense base, eroded anvil top
    float prof=sat(hf*4.0)*sat((1.0-hf)*2.6);
    vec3 q=up*24.0+vec3(uTime*0.004,0.0,uTime*0.003);
    float base=vfbm3(q,4);
    // weather map gates where cloud can exist at all, so the sky stays mostly open
    float weather=smoothstep(0.42,0.86,vfbm3(up*2.2+7.0,3));
    float cov=uCloudCov*weather;
    float thr=1.0-cov*0.62;
    float dens=smoothstep(thr,thr+0.20,base)*prof;
    if(dens<=0.004)continue;
    dens*=1.0-smoothstep(0.40,0.88,vfbm3(q*5.0,3))*0.6;    // erosion carves the cauliflower edges
    if(dens<=0.004)continue;
    // light march toward the sun
    float lt=0.0;
    int LS=uCloudLightSteps;
    float lseg=(uCloudHi-uCloudLo)/float(LS)*1.6;
    for(int j=0;j<8;j++){ if(j>=LS)break;
     vec3 LP=P+uSunDir*(lseg*(float(j)+0.5));
     float lh=length(LP-uPlanetC)-uPlanetR;
     float lhf=sat((lh-uCloudLo)/max(uCloudHi-uCloudLo,1.0));
     float lp=sat(lhf*4.0)*sat((1.0-lhf)*2.6);
     vec3 lq=normalize(LP-uPlanetC)*24.0+vec3(uTime*0.004,0.0,uTime*0.003);
     lt+=sat((vfbm3(lq,3)-(1.0-cov))*2.6)*lp;
    }
    lt*=lseg*0.0016;
    float sun=exp(-lt*1.6);
    float powder=1.0-exp(-dens*seg*0.012);       // Beer's-powder dark edge
    vec3 lum=uSunCol*sun*min(phase,5.5)*2.6*powder + uTint*0.30*(0.25+0.75*hf);
    float sig=dens*seg*0.0016;
    float Ti=exp(-sig);
    acc+=T*(1.0-Ti)*lum;
    T*=Ti;
    if(T<0.012)break;
   }
   scene=scene*T+acc;
   if(T<0.7)sceneDist=min(sceneDist,mix(t1,t0,T));
  }
 }

 // ---------- atmospheric scattering ----------
 vec2 ta=raySphere(ro,rd,uPlanetC,uAtmoTop);
 if(ta.x<=ta.y&&ta.y>0.0){
  float t0=max(ta.x,0.0), t1=min(ta.y,sceneDist);
  if(t1>t0){
   int NS=uAtmoSteps;
   float seg=(t1-t0)/float(NS);
   float dith=hash21(vUV.x*1237.0+vUV.y*4519.0).x;
   float mu=dot(rd,uSunDir);
   float phR=3.0/(16.0*PI)*(1.0+mu*mu);
   float g=0.76;
   float phM=3.0/(8.0*PI)*((1.0-g*g)*(1.0+mu*mu))/((2.0+g*g)*pow(1.0+g*g-2.0*g*mu,1.5));
   vec3 sumR=vec3(0.0),sumM=vec3(0.0);
   float odR=0.0,odM=0.0,odO=0.0;
   for(int i=0;i<32;i++){ if(i>=NS)break;
    float t=t0+seg*(float(i)+dith);
    vec3 P=ro+rd*t;
    float h=length(P-uPlanetC)-uPlanetR;
    float dR=densR(h)*seg, dM=densM(h)*seg, dO=densO(h)*seg;
    odR+=dR;odM+=dM;odO+=dO;
    vec3 odView=uRay*odR*uRhoScale+vec3(uMie)*odM*1.1*uRhoScale+uRay*0.28*odO*uRhoScale*0.0006;
    vec3 tr=transmit(odView+sunOptical(P));
    sumR+=tr*dR;sumM+=tr*dM;
   }
   vec3 inscat=(uRay*uRhoScale*sumR*phR+vec3(uMie)*uRhoScale*sumM*phM)*uSunCol*22.0;
   vec3 odTotal=uRay*odR*uRhoScale+vec3(uMie)*odM*1.1*uRhoScale;
   vec3 tr=transmit(odTotal);
   // night side never goes pure black: airglow + starlight scattering
   vec3 airglow=uTint*0.0016*sat(1.0-abs(dot(normalize(ro-uPlanetC),uSunDir))*1.4);
   scene=scene*tr+inscat+airglow*(1.0-tr);
  }
 }
 fragColor=vec4(scene,1.0);
}
vec3 skyColour(vec3 ro,vec3 rd){
 vec2 ta=raySphere(ro,rd,uPlanetC,uAtmoTop);
 if(ta.y<0.0)return vec3(0.002,0.003,0.006);
 float t0=max(ta.x,0.0),t1=ta.y;
 float mu=dot(rd,uSunDir);
 float phR=3.0/(16.0*PI)*(1.0+mu*mu);
 int N=4; float seg=(t1-t0)/float(N);
 vec3 sum=vec3(0.0); float odR=0.0;
 for(int i=0;i<4;i++){
  vec3 P=ro+rd*(t0+seg*(float(i)+0.5));
  float h=length(P-uPlanetC)-uPlanetR;
  float dR=densR(h)*seg; odR+=dR;
  sum+=transmit(uRay*odR*uRhoScale+sunOptical(P))*dR;
 }
 return uRay*uRhoScale*sum*phR*uSunCol*22.0+vec3(0.002,0.003,0.007);
}`;

const FS_BRIGHT=`
in vec2 vUV; out vec4 fragColor; uniform sampler2D uTex; uniform float uThresh;
void main(){vec3 c=texture(uTex,vUV).rgb;float l=luma(c);
 float k=sat((l-uThresh)/max(uThresh,0.001));fragColor=vec4(c*k,1.0);}`;
const FS_BLUR=`
in vec2 vUV; out vec4 fragColor; uniform sampler2D uTex; uniform vec2 uDir;
void main(){
 vec3 c=texture(uTex,vUV).rgb*0.227027;
 c+=texture(uTex,vUV+uDir*1.3846).rgb*0.316216;
 c+=texture(uTex,vUV-uDir*1.3846).rgb*0.316216;
 c+=texture(uTex,vUV+uDir*3.2308).rgb*0.070270;
 c+=texture(uTex,vUV-uDir*3.2308).rgb*0.070270;
 fragColor=vec4(c,1.0);}`;
const FS_POST=`
in vec2 vUV; out vec4 fragColor;
uniform sampler2D uScene,uBloom,uDepth;
uniform float uExposure,uTime,uBloomAmt,uVignette,uCA,uGrain,uWarp,uHeat,uGodray;
uniform vec2 uSunUV; uniform vec3 uSunCol; uniform float uSunVis;
void main(){
 vec2 uv=vUV;
 // warp/re-entry screen distortion
 if(uWarp>0.001){
  vec2 d=uv-0.5;float r=length(d);
  uv=0.5+d*(1.0-uWarp*0.35*r*r)+d/max(r,1e-4)*sin(r*38.0-uTime*7.0)*uWarp*0.006;
 }
 if(uHeat>0.001){
  float n=vfbm3(vec3(uv*34.0,uTime*1.7),3)-0.5;
  uv+=vec2(n,vfbm3(vec3(uv.yx*31.0,uTime*1.9),3)-0.5)*uHeat*0.010;
 }
 vec2 d=uv-0.5; float r2=dot(d,d);
 float ca=uCA*(0.0016+r2*0.010);
 vec3 c;
 c.r=texture(uScene,uv+d*ca).r;
 c.g=texture(uScene,uv).g;
 c.b=texture(uScene,uv-d*ca).b;
 vec3 bl=texture(uBloom,uv).rgb;
 c+=bl*uBloomAmt;
 // volumetric god rays: radial occlusion march from the star's screen position
 if(uGodray>0.001&&uSunVis>0.001){
  vec2 dv=(uSunUV-uv)*0.32;
  float il=1.0; vec3 g=vec3(0.0);
  vec2 p=uv;
  for(int i=0;i<12;i++){
   p+=dv/12.0;
   vec3 s=texture(uBloom,p).rgb;
   g+=s*il; il*=0.90;
  }
  c+=g*(1.0/12.0)*uGodray*uSunVis*uSunCol*2.2;
  // anamorphic streak + ghosts
  float dd=length((uv-uSunUV)*vec2(1.0,2.6));
  c+=uSunCol*exp(-dd*11.0)*uSunVis*0.5;
  float dh=length((uv-uSunUV)*vec2(0.16,4.0));
  c+=uSunCol*exp(-dh*8.0)*uSunVis*0.34;
  for(int i=1;i<4;i++){
   vec2 gp=uv+(uSunUV-uv)*(1.0+float(i)*0.62);
   float gd=length(gp-uSunUV);
   c+=uSunCol*exp(-gd*22.0)*uSunVis*0.06/float(i);
  }
 }
 c*=uExposure;
 c=acesTonemap(c);
 // filmic grade: lift / gamma / gain, slight teal shadows and warm highlights
 c=pow(max(c,0.0),vec3(0.95,0.98,1.02));
 c=mix(c,c*vec3(0.94,1.0,1.06),0.35);
 c+=vec3(-0.004,0.0,0.010)*(1.0-luma(c));
 float vig=1.0-uVignette*r2*1.5;
 c*=sat(vig);
 float gr=(hash22(uv*vec2(1920.0,1080.0)+uTime*37.0).x-0.5)*uGrain;
 c+=gr;
 fragColor=vec4(max(c,0.0),1.0);
}`;

const VS_PART=`
layout(location=0) in vec3 position;   // world (camera-relative) centre
layout(location=1) in vec3 normal;     // xyz = velocity
layout(location=2) in vec2 uv;         // x = size, y = life01
layout(location=3) in vec3 color;
uniform mat4 uVP; uniform vec3 uCamR,uCamU;
out vec3 vC; out vec2 vQ; out float vL;
void main(){
 int corner=gl_VertexID%6;
 vec2 q=vec2(0.0);
 if(corner==0)q=vec2(-1,-1); else if(corner==1)q=vec2(1,-1); else if(corner==2)q=vec2(-1,1);
 else if(corner==3)q=vec2(1,-1); else if(corner==4)q=vec2(1,1); else q=vec2(-1,1);
 vQ=q; vC=color; vL=uv.y;
 float s=uv.x;
 vec3 R=uCamR,U=uCamU;
 float sp=length(normal);
 if(sp>1.0){ // stretch along velocity
  vec3 vd=normal/sp;
  vec3 side=normalize(cross(vd,normalize(position-vec3(0.0))+vec3(1e-6)));
  R=side; U=vd*min(1.0+sp*0.02,6.0);
 }
 vec3 wp=position+R*q.x*s+U*q.y*s;
 vec4 cp=uVP*vec4(wp,1.0); segLog(cp); gl_Position=cp;
}`;
const FS_PART=`
in vec3 vC; in vec2 vQ; in float vL; out vec4 fragColor;
void main(){

 if(d>1.0)discard;

 fragColor=vec4(vC*a,a);
}`;

const DOCS_HTML = `<div class="w">

<h1>STELLAR EXPANSE — ENGINE PORTING &amp; PRODUCTION GUIDE</h1>

<p>This document is the bridge between the single-file WebGL2 prototype you are
currently flying and a full production build in Unity HDRP or Unreal Engine 5. It is
written against the algorithms this build actually uses — the Float64 heliocentric
state vectors, the camera-relative render path, the derivative-damped fBm heightfield
in <code>fieldHeight()</code>, the cube-sphere quadtree, the patched-conic solver —
so that a port reproduces the same behaviour rather than a superficially similar one.</p>

<p>Everything below assumes the prototype's unit and precision contract, because it
is the only one that works at this scale:</p>

<ul>
<li><strong>1 unit = 1 metre, everywhere.</strong> The solar system is at true 1:1
scale (Sun–Earth = 1.496e11 m). No "Kerbal-scale" 1:10 fudge.</li>
<li><strong>Simulation state is double precision, in absolute coordinates</strong>
(heliocentric, or barycentric if you go n-body).</li>
<li><strong>Rendering is always camera-relative.</strong> The camera's double-precision
position is subtracted before anything is handed to the GPU. No absolute world position
ever enters a <code>float</code>.</li>
<li>Depth is handled by <em>layered cameras</em> (and, in this WebGL build,
a logarithmic depth term), not by a single 0.1 m → 1e13 m projection. That projection
does not exist; see §1.6.</li>
</ul>

<div class="note"><strong>On confidence.</strong> Engine behaviour drifts between minor
versions, especially in HDRP and in Unreal's Nanite/Lumen. Where a number or a feature
is version-dependent I say so explicitly instead of quoting a false precision. Verify
the flagged items against the version you actually ship on.</div>

<h2>0. WHAT THE PROTOTYPE DOES, IN ONE PAGE</h2>

<p>A port is only faithful if it reproduces these five things. Read this before §1.</p>

<h3>0.1 The heightfield is the single source of truth</h3>
<p><code>fieldHeight(x, y, z, dna)</code> takes a <em>unit direction</em> on the planet
sphere and returns <strong>metres of elevation relative to <code>dna.radius</code></strong>.
It drives the render mesh <em>and</em> the collision mesh <em>and</em> the altimeter.
Its structure is:</p>
<ol>
<li>A three-channel <strong>domain warp</strong> (three independent noise lookups scaled by
<code>dna.warp</code>) applied to the sample position, which is what stops the continents
looking like blobby Perlin.</li>
<li><strong>Derivative-damped fBm</strong> (<code>uberfbm</code>): each octave's contribution
is attenuated by <code>1 / (1 + damp * |accumulated gradient|²)</code>. This is the
No Man's Sky-style trick that keeps plains flat and mountain ranges coherent instead of
producing uniform crumple everywhere. <strong>It requires analytic noise derivatives</strong>,
which is why <code>noise3()</code> returns its gradient.</li>
<li><strong>Orogenic ridges</strong> (<code>ridged</code> fBm) gated by a continental-gradient
mask, squared — so ridges appear in belts near continental edges, not uniformly.</li>
<li><strong>Terracing and river carving</strong>, masked by a noise field, using a
quantise-and-lerp for mesas and a converging inverted-ridge field for valleys.</li>
<li><strong>Dunes, Worley-cell impact craters</strong> (three octaves, bowl-plus-rim profile,
depth ≈ 0.2 × diameter), volcanic shields, and polar ice accumulation.</li>
</ol>
<p>An octave cap (<code>dna._oct</code>) lets distant/cheap samples skip the expensive
late stages. Any port must keep that cap and must keep the <em>ordering</em> of these stages
identical between CPU and GPU (§2.10).</p>

<h3>0.2 Physics is Float64, absolute, and patched-conic by default</h3>
<p>Bodies carry <code>mu</code> (standard gravitational parameter, m³/s²), <code>soi</code>
(sphere-of-influence radius), and classical elements <code>a, e, inc, raan, argp, m0</code>.
The ship integrates under one dominant attractor at a time; SOI crossings swap the frame.
The optional n-body path exists but is not the default, for reasons in §2.6.</p>

<h3>0.3 Model space convention</h3>
<p><strong>−Z = forward (nose), +Y = up (dorsal), +X = right (starboard)</strong>. Quaternions
are <code>[x, y, z, w]</code>. This matters enormously for asset import (§5.3): Unity is
+Z-forward, Unreal is +X-forward, Blender is −Y-forward/+Z-up. Pick one convention, write it
on the wall, and put a conversion in exactly one place.</p>

<h3>0.4 Quality tiers are data, not branches</h3>
<p>Every raymarch loop bound in the prototype comes from a uniform the engine sets per tier
(<code>QUALITY.steps.atmo</code>, <code>.cloud</code>, <code>.wh</code>). Keep this discipline
in the port: shader variants explode combinatorially, and a uniform loop bound with a small
constant maximum compiles fine and is far cheaper to maintain than eight permutations.</p>

<h3>0.5 The frame contract</h3>
<p><code>CTX</code> is rebuilt once per frame with <code>phase</code> ∈
{space, orbit, reentry, atmo, landed, warp}, <code>altitude</code>, <code>atmoDensity</code>,
<code>reentryHeat</code>. Almost every visual and audio decision keys off that one struct.
Reproduce it as a single frame-state object in the port; resist the temptation to let each
system query the world independently, because that is how you get systems disagreeing about
which planet you are near during an SOI transition.</p>

<h2>1. UNITY HDRP PROJECT STRUCTURE</h2>

<div class="note"><strong>HDRP does not run on phones.</strong> The High Definition Render
Pipeline targets desktop and current-gen consoles only. If the mobile 30 fps target in §7
is a hard requirement, you are shipping <em>two</em> render pipelines: HDRP for desktop/console
and URP for mobile, with a shared simulation layer. Plan the folder structure for that from
day one — it is the single most expensive thing to retrofit. The tree below marks
pipeline-specific folders explicitly.</div>

<h3>1.2 Why this shape</h3>
<ul>
<li><strong><code>Code/Runtime</code> subfoldered by system, with an asmdef per top-level
folder.</strong> Assembly definitions are the only thing that keeps iteration times sane once
you pass roughly 1500 scripts, and they enforce the dependency direction you want:
<code>Numerics</code> ← <code>Orbital</code> ← <code>Ship</code> ← <code>UI</code>, never
backwards. <code>Numerics</code> and <code>Orbital</code> should have <em>no</em> UnityEngine
dependency beyond <code>Unity.Mathematics</code>, so you can unit-test them headlessly and run
the Kepler regression suite in CI.</li>
<li><strong>Data as ScriptableObjects, not as fields on prefabs.</strong> A planet is
<code>SO_Body</code> (μ, radius, rotation period, axial tilt, parent, elements) plus
<code>SO_PlanetArchetype</code> (the DNA generator's ranges: amplitude, ridge amplitude, warp,
frequency, crater/river/dune/ice/lava/vegetation weights, palette). The DNA object in this
prototype is exactly a serialisable archetype roll — port it verbatim as a
<code>[Serializable] struct PlanetDNA</code> and have the archetype produce it from a seed.
Designers then tune ranges, not instances.</li>
<li><strong>Engines and RCS ports as ScriptableObjects too</strong>
(<code>SO_Engine</code>: vacuum thrust, nozzle exit area, vacuum Isp, throttle range, gimbal
limit, spool rate). Two of the three quantities {F_vac, F_sl, A_e} determine the third — store
F_vac and A_e and derive the rest, so a designer cannot author a physically impossible engine
(§2.7).</li>
<li><strong>Scenes are thin.</strong> <code>Boot</code> loads <code>Space</code> additively.
Planet surfaces are <em>not</em> scenes; they are runtime-generated chunk GameObjects parented
under <code>Surface_Streaming</code>. Do not try to make Unity's scene streaming own planet
terrain — it is built around author-time content, and a quadtree over a sphere is not that.</li>
<li><strong>Keep <code>Dev_SinglePlanet</code> alive forever.</strong> When a physics or LOD bug
appears at hour 40 of a playthrough, the only affordable way to reproduce it is a scene that
boots into the exact configuration in three seconds.</li>
</ul>

<h3>1.3 Camera-relative rendering</h3>
<p>HDRP has a compile-time option <code>ShaderOptions.CameraRelativeRendering</code>, defined in
<code>ShaderConfig.cs</code> inside the HDRP package and mirrored into
<code>ShaderConfig.cs.hlsl</code>. It defaults to <strong>on</strong> and you should leave it on.
What it does: object-to-world matrices are pre-translated by the camera position on the CPU, so
the shader works in a space centred on the camera and world-space positions in the shader never
exceed the scene's local extent. That removes precision loss in <em>shading</em> — normal
reconstruction, specular, shadow lookups, screen-space effects.</p>

<div class="note"><strong>What camera-relative rendering does NOT do:</strong> it does not make
<code>Transform.position</code> double precision. Unity Transforms are float32 regardless.
A ship parked 1.5e11 m from the origin has a position ULP of roughly 16 km. Camera-relative
rendering fixes the shader; only a floating origin (§2.2) fixes the scene graph. Both are
required and they are independent. If you ever need to change this option, copy the HDRP package
into <code>Packages/</code>, edit the C# enum, and run
<code>Edit &gt; Rendering &gt; Generate Shader Includes</code>, or the .hlsl will silently
disagree with the C#.</div>

<h3>1.4 Sky: physically based vs custom override</h3>
<p>HDRP's <strong>Physically Based Sky</strong> is a Bruneton-family precomputed atmosphere with
planetary parameters exposed (planetary radius, ground tint, air and aerosol density and scale
heights, per-channel Rayleigh extinction, Mie anisotropy, ozone layer). It renders correctly from
orbit as well as from the ground, which most sky implementations do not, and it is the right
default.</p>
<p>Its limitations, which will bite you:</p>
<ul>
<li><strong>One atmosphere at a time.</strong> There is a single active sky. During an SOI
transition or a low pass over a moon you must cross-fade parameters, not swap instantly. Drive
every parameter from your <code>FrameContext</code> and interpolate over about two seconds.</li>
<li><strong>Rebuild cost when parameters change.</strong> Changing atmosphere parameters
invalidates the precomputed tables. Amortise: start the blend when the ship enters the
destination SOI, tens of minutes of game time before it matters — or move to Hillaire's
formulation (§4.1), whose LUTs are cheap enough to rebuild every frame, which is the real
answer for procedurally generated planets.</li>
<li><strong>No second scattering body.</strong> A ringed gas giant lighting its moon is not
modelled. Approximate it with a directional bounce light driven by the geometry.</li>
</ul>
<p>Write a custom sky when you need something PBS cannot do — a wormhole-lensed background, a
nebula, or Hillaire's four-LUT model. Subclass <code>SkySettings</code> with a
<code>[SkyUniqueID]</code> attribute and pair it with a <code>SkyRenderer</code>; register with
<code>[VolumeComponentMenu]</code>. Budget roughly a week for a correct one, including the
ambient-probe convolution path — easy to forget, and it is what lights your ship in shadow.</p>

<h3>1.5 Depth precision: why the default fails and what to do</h3>
<p>Unity uses reversed-Z on all modern graphics APIs and HDRP uses a 32-bit float depth buffer.
That combination is close to optimal: reversed-Z pairs the float's dense small-value precision
with the far plane, giving near-uniform relative precision. It still cannot span 0.1 m to 1e13 m.
A working rule of thumb for a single reversed-Z float depth buffer is a
<strong>far/near ratio up to about 1e6 comfortably, 1e7 with visible artefacts</strong>. You
need 1e14.</p>

<p>Three techniques, used together:</p>
<ol>
<li><strong>Layered cameras.</strong> Three cameras sharing a transform, rendered far-to-near
with increasing <code>Camera.depth</code> and a depth clear between them:
<ul>
<li><em>Near</em>: 0.05 m → 20 km. Ship, cockpit, props, near terrain chunks, VFX.</li>
<li><em>Mid</em>: 20 km → 2e7 m. Far terrain chunks, the local planet's full sphere, moons.</li>
<li><em>Far / scaled</em>: 1e3 → 1e9 <em>proxy</em> units. Everything else, in scaled space.</li>
</ul>
Ratios of 4e5, 1e3 and 1e6 — all safe. Culling masks partition the layers; the mid and far
cameras use <code>clearFlags = Depth</code> or <code>Nothing</code>.</li>
<li><strong>Scaled space</strong> for the far camera. Do not render a planet 6e11 m away at its
real size; float cannot express that transform. Place a proxy at a chosen proxy distance
<code>d_p</code> (say 1e6 units) along the true direction, with
<code>scale = trueRadius * d_p / trueDistance</code>. The proxy subtends an identical solid
angle, so it is pixel-identical, but every number involved is small. Kerbal Space Program does
exactly this. The handoff to real geometry lives in <code>ScaleManager</code> (§2.12).</li>
<li><strong>Do not use logarithmic depth in HDRP.</strong> The WebGL prototype uses it
(<code>segLog()</code>) because it is a simple forward path with no depth-buffer consumers. In
HDRP a modified clip-space Z breaks early-Z rejection, hierarchical-Z culling, the depth prepass,
SSAO, SSR, contact shadows, decals and TAA motion-vector reprojection. It is not worth it.
Layered cameras cost you one extra pair of culling passes and nothing else.</li>
</ol>

<h3>1.6 Exposure</h3>
<p>A space game has the widest dynamic range in games: the unattenuated Sun at 1 AU is about
1.36 kW/m² (roughly 120 000 lux at the ground through a clear atmosphere), and the night side of
an airless moon lit only by starlight is nine or ten orders of magnitude below that.</p>
<ul>
<li><strong>Physical Camera on</strong> (aperture, shutter speed, ISO) so exposure is expressed
in EV100 and artists can reason in real units. Set the sun as a directional light in lux, put
albedo in the material, and stop hand-tuning intensities.</li>
<li><strong>Exposure mode: Automatic Histogram.</strong> Plain Automatic meters on an average
and is destroyed by a single sun disc in frame, or by 95 % black space. Histogram mode lets you
discard percentiles: a lower percentile around 40 and an upper around 90 puts both the black of
space and the specular sun outside the metering window.</li>
<li><strong>Clamp the limits per phase</strong> using Volume Profiles: <code>VP_Space</code>
might allow EV100 −4 to +16, <code>VP_Surface_Day</code> +8 to +16,
<code>VP_Surface_Night</code> −6 to +6. Without clamps, crossing a terminator produces a
five-second white-out.</li>
<li><strong>Asymmetric adaptation speed</strong>: fast dark-to-light, slow light-to-dark,
approximating human adaptation and stopping the strobe when the ship tumbles.</li>
<li><strong>Exposure compensation is the artistic knob, not exposure.</strong> Leave metering
physical; expose a compensation curve per phase.</li>
<li><strong>Tonemapping: prefer AgX over ACES</strong> if your HDRP version offers it. The ACES
hue skew turns a bright engine plume or a re-entry shock into a flat white blob; AgX desaturates
toward white far more gracefully across six stops of over-exposure, which is exactly the regime a
rocket exhaust lives in. With ACES only, add a pre-tonemap highlight desaturation.</li>
</ul>

<h3>1.7 Shadows at planetary scale</h3>
<p>Cascaded shadow maps are a local technique. Do not try to shadow a planet with them.</p>
<ul>
<li><strong>Cap shadow distance hard</strong>: 300–800 m on the surface, 2–4 km when high and
fast. Four cascades with a manual, front-loaded split (e.g. 0.05 / 0.15 / 0.4 / 1.0 of max
distance).</li>
<li><strong>Large-scale terrain shadowing comes from the heightfield, not the shadow map.</strong>
Compute a per-chunk horizon-angle map: for N azimuthal directions, march the heightfield and
store the maximum elevation angle; 8 or 16 directions in a compute shader, packed into two
RGBA8 textures. At runtime a mountain shadows a valley by comparing the sun's elevation to the
stored horizon angle. Cost: a fraction of a millisecond per chunk build, one texture fetch per
frame. This is also what gives correct terminator shadowing across tens of kilometres, which no
cascade can do.</li>
<li><strong>Contact shadows</strong> (screen-space or ray-traced) for landing gear and greebles —
the sub-metre detail cascades cannot resolve.</li>
<li><strong>Cast the planet's own shadow analytically.</strong> An eclipse or a night-side
transition is a ray-sphere test against the body radius plus atmosphere, evaluated on the CPU
each frame, feeding a light-intensity multiplier and a reddened tint. One line of maths, and it
is what makes orbital night feel real.</li>
</ul>

<h3>1.8 Volumetric clouds and fog</h3>
<p>HDRP's <strong>Volumetric Clouds</strong> override (Unity 2021.2 / HDRP 12 and later) is
planet-aware — it has an earth-curvature mode and renders correctly when you look down at the
layer from above, which is the hard part. Use it for the local planet and accept its constraints:
one layer, one planet, and a cost that in practice lands in the 1.5–4 ms range on desktop at half
resolution. Above roughly 100 km, cross-fade it out and swap to a cloud <em>impostor</em> — a
low-frequency shell texture on the planet sphere generated from the same weather-map noise — so
the transition is continuous. Doing that swap well is about a week of work and is the difference
between "seamless descent" and "the clouds pop in at 80 km".</p>
<p>HDRP <strong>Fog</strong> with volumetrics is a froxel volume with a bounded distance set in
the HDRP asset; beyond a few kilometres it becomes unaffordable. It is the right tool for a dust
storm, a canyon inversion layer, or engine-plume ground interaction. It is <em>not</em> the tool
for atmospheric perspective at 100 km — that is the aerial-perspective LUT's job (§4.1). Using
volumetric fog for atmospheric scattering is the most common mistake in this genre and it costs
you both performance and correctness.</p>

<h3>1.9 Other HDRP settings, briefly</h3>
<table>
<tr><th>Setting</th><th>Value</th><th>Why</th></tr>
<tr><td>Lit Shader Mode</td><td>Deferred (desktop), Forward (VR)</td><td>Terrain has few materials and near-zero overdraw; deferred wins. Forward only if you need per-material custom lighting.</td></tr>
<tr><td>Color Buffer Format</td><td>RGBA16F unless you have measured no banding</td><td>Sun-adjacent gradients band badly in R11G11B10.</td></tr>
