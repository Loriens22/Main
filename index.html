<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Space Exploration</title>
<meta name="description" content="Space Exploration: a procedurally generated open-universe space exploration game with seamless planetary landings, base building, ship construction and an endless creative mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --holo:#8ff5ff; --holo2:#5fd4ff; --holo-dim:rgba(143,245,255,.55); --holo-faint:rgba(143,245,255,.16);
  --warn:#ffb347; --danger:#ff5a6e; --ok:#7dffb0; --gold:#ffd66b; --nanite:#b99bff;
  --panel:rgba(6,16,26,.62); --panel2:rgba(10,26,40,.78); --line:rgba(143,245,255,.28);
  --txt:#e9fbff; --txt2:#a9c9d6;
  --font:'Rajdhani','Exo 2','Segoe UI',Roboto,system-ui,sans-serif;
  --font2:'Orbitron','Rajdhani','Segoe UI',system-ui,sans-serif;
  --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px); --sal: env(safe-area-inset-left,0px); --sar: env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:var(--txt);font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
.fade{transition:opacity .5s}
button{font-family:var(--font);color:var(--txt);cursor:pointer}
/* ---------- generic holo panel ---------- */
.holo{background:linear-gradient(160deg,rgba(12,30,46,.78),rgba(4,12,20,.72));border:1px solid var(--line);box-shadow:0 0 24px rgba(0,180,255,.08),inset 0 0 40px rgba(0,160,255,.05);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:3px;position:relative}
.holo::before,.holo::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--holo);opacity:.8;pointer-events:none}
.holo::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.holo::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.hbtn{background:linear-gradient(180deg,rgba(143,245,255,.12),rgba(143,245,255,.04));border:1px solid var(--line);padding:10px 18px;font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt);transition:all .15s;border-radius:2px;position:relative}
.hbtn:hover,.hbtn.sel{background:linear-gradient(180deg,rgba(143,245,255,.35),rgba(143,245,255,.12));border-color:var(--holo);box-shadow:0 0 18px rgba(143,245,255,.35);color:#fff}
.hbtn:active{transform:scale(.97)}
.hbtn.primary{border-color:var(--holo);background:linear-gradient(180deg,rgba(143,245,255,.3),rgba(60,150,200,.12))}
.hbtn.small{padding:6px 10px;font-size:14px}
.hbtn.warn{border-color:rgba(255,120,120,.6)}
.hbtn[disabled]{opacity:.35;pointer-events:none}
h1,h2,h3{font-family:var(--font2);font-weight:700;letter-spacing:.12em;margin:0}
.lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--holo-dim)}
.kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--holo-dim);border-radius:3px;font-size:13px;text-align:center;margin-right:6px;background:rgba(143,245,255,.08);color:var(--holo)}
input[type=text],input[type=number],select,textarea{background:rgba(0,20,30,.6);border:1px solid var(--line);color:var(--txt);font-family:var(--font);font-size:16px;padding:7px 10px;border-radius:2px;outline:none}
input[type=range]{accent-color:var(--holo);width:100%}
input:focus,select:focus{border-color:var(--holo)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}::-webkit-scrollbar-track{background:transparent}
/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 60%,#0b2233 0%,#02050a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#loading .logo{font-family:var(--font2);font-size:clamp(28px,6vw,64px);font-weight:900;letter-spacing:.3em;text-align:center;background:linear-gradient(180deg,#fff,#8ff5ff 60%,#3a9fd0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(143,245,255,.4));padding-left:.3em}
#loading .sub{margin-top:10px;letter-spacing:.5em;color:var(--holo-dim);font-size:13px;padding-left:.5em}
#loadBar{width:min(420px,70vw);height:3px;background:rgba(143,245,255,.12);margin-top:40px;position:relative;overflow:hidden}
#loadBar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3cc8ff,#bffaff);box-shadow:0 0 12px #8ff5ff;transition:width .2s}
#loadMsg{margin-top:12px;font-size:14px;letter-spacing:.15em;color:var(--txt2);height:18px}
.ring-spin{width:64px;height:64px;border-radius:50%;border:2px solid rgba(143,245,255,.15);border-top-color:var(--holo);animation:spin 1.2s linear infinite;margin-bottom:34px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;padding-left:max(7vw,calc(var(--sal) + 20px));background:linear-gradient(90deg,rgba(2,6,12,.82) 0%,rgba(2,6,12,.35) 45%,transparent 70%)}
#title .logo{font-family:var(--font2);font-weight:900;font-size:clamp(30px,5.4vw,78px);letter-spacing:.18em;line-height:1.02;background:linear-gradient(180deg,#ffffff 10%,#bff8ff 55%,#48b8e8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(120,230,255,.35))}
#title .tag{color:var(--holo-dim);letter-spacing:.42em;font-size:clamp(11px,1.2vw,15px);margin:14px 0 36px 4px;text-transform:uppercase}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(360px,80vw)}
#title .menu .hbtn{text-align:left;font-size:19px;padding:13px 20px}
#title .ver{position:absolute;bottom:calc(14px + var(--sab));right:calc(18px + var(--sar));font-size:12px;color:var(--txt2);letter-spacing:.2em;opacity:.7}
.modecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.modecard{padding:16px;cursor:pointer;transition:all .15s;border:1px solid var(--line);background:rgba(6,18,28,.65)}
.modecard:hover,.modecard.sel{border-color:var(--holo);background:rgba(20,60,80,.55);box-shadow:0 0 22px rgba(143,245,255,.25)}
.modecard h3{font-size:17px;margin-bottom:6px}
.modecard p{margin:0;font-size:14px;color:var(--txt2);line-height:1.35}
.modecard .rec{color:var(--ok);font-size:12px;letter-spacing:.2em}
/* ---------- overlay windows ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(1,4,8,.45);padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal))}
.window{width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.window .whead{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.window .whead h2{font-size:20px;flex:1}
.window .wbody{padding:16px 18px;overflow:auto;flex:1;min-height:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 14px 0;border-bottom:1px solid var(--line)}
.tab{padding:8px 14px;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1px solid transparent;border-bottom:none;color:var(--txt2);cursor:pointer}
.tab.sel{color:#fff;border-color:var(--line);background:rgba(143,245,255,.1)}
.closeX{width:38px;height:38px;border:1px solid var(--line);background:rgba(143,245,255,.06);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{aspect-ratio:1;border:1px solid var(--line);background:rgba(143,245,255,.04);position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;text-align:center;padding:4px;cursor:pointer}
.slot:hover{border-color:var(--holo)}
.slot .ic{width:34px;height:34px;border-radius:6px;margin-bottom:4px;box-shadow:0 0 10px currentColor}
.slot .ct{position:absolute;bottom:3px;right:5px;font-weight:700;font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);background:rgba(143,245,255,.035)}
.row:hover{border-color:var(--holo-dim)}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:700;font-size:16px}
.row .t2{font-size:13px;color:var(--txt2)}
.pill{font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line);border-radius:20px;color:var(--holo)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(143,245,255,.12);font-size:15px}
.stat b{color:var(--holo)}
.prog{height:6px;background:rgba(143,245,255,.12);position:relative;margin-top:6px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#39c3ff,#aefcff)}
.lore{font-size:16px;line-height:1.55;color:#d8f4ff;font-style:italic}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-weight:600}
#hud .hl{text-shadow:0 0 6px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.5)}
#compass{position:absolute;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);width:min(620px,70vw);height:44px}
#compass canvas{width:100%;height:100%}
#crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px}
#crosshair::before{content:"";position:absolute;left:11px;top:11px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px var(--holo)}
#crosshair::after{content:"";position:absolute;inset:0;border:1.5px solid rgba(255,255,255,.35);border-radius:50%}
#crosshair.ship::after{inset:-6px;border-style:dashed;border-color:rgba(143,245,255,.5)}
#scanRing{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;opacity:0;transition:opacity .2s}
#scanRing svg{width:100%;height:100%;transform:rotate(-90deg)}
#markers{position:absolute;inset:0;overflow:hidden}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;letter-spacing:.08em;white-space:nowrap;text-shadow:0 0 4px #000,0 0 8px #000}
.mk .dia{width:14px;height:14px;border:2px solid currentColor;transform:rotate(45deg);margin-bottom:5px;box-shadow:0 0 8px currentColor}
.mk .dia.round{border-radius:50%;transform:none}
.mk .nm{font-weight:700;font-size:13px}
.mk .ds{opacity:.8}
.mk.tgt .dia{background:currentColor}
#hud.building #bl,#hud.building #toolHud,#hud.building #markers{opacity:0;pointer-events:none;transition:opacity .25s}
.mk.min .nm,.mk.min .ds{display:none}.mk.min .dia{width:9px;height:9px;border-width:1.5px;margin-bottom:0}
#interact{position:absolute;left:50%;top:calc(50% + 46px);transform:translateX(-50%);font-size:17px;padding:6px 14px;background:rgba(0,10,18,.55);border:1px solid var(--line);white-space:nowrap}
#bl{position:absolute;left:calc(22px + var(--sal));bottom:calc(22px + var(--sab));width:300px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar .bi{width:16px;height:16px;opacity:.9}
.bar .bt{flex:1;height:5px;background:rgba(255,255,255,.14);position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.bar .bt i{position:absolute;left:0;top:0;bottom:0;background:#fff;transition:width .25s}
#planetLine{display:flex;align-items:baseline;gap:10px;margin-top:10px}
#planetName{font-size:20px;letter-spacing:.06em}
#envLine{display:flex;gap:14px;align-items:baseline;margin-top:2px}
#tempV{font-size:26px;font-weight:700}
#hazV{font-size:13px;line-height:1.1;color:var(--txt2)}
#notif{position:absolute;right:calc(22px + var(--sar));top:calc(90px + var(--sat));width:min(360px,60vw);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.note{background:linear-gradient(90deg,rgba(6,18,28,.35),rgba(6,18,28,.82));border-right:3px solid var(--holo);padding:8px 14px;text-align:right;animation:noteIn .35s ease-out;max-width:100%}
.note .nt{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--holo)}
.note .nb{font-size:16px}
.note.warn{border-color:var(--warn)}.note.warn .nt{color:var(--warn)}
.note.danger{border-color:var(--danger)}.note.danger .nt{color:var(--danger)}
.note.good{border-color:var(--ok)}.note.good .nt{color:var(--ok)}
@keyframes noteIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
#shipHud{position:absolute;left:50%;bottom:calc(26px + var(--sab));transform:translateX(-50%);display:flex;gap:28px;align-items:flex-end}
.gauge{text-align:center;min-width:90px}
.gauge .gv{font-size:30px;font-weight:700;line-height:1}
.gauge .gl{font-size:11px;letter-spacing:.25em;color:var(--holo-dim)}
#thrBar{width:8px;height:70px;border:1px solid var(--line);position:relative;margin:0 auto}
#thrBar i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#39c3ff,#dffcff)}
#toolHud{position:absolute;right:calc(22px + var(--sar));bottom:calc(22px + var(--sab));text-align:right}
#toolName{font-size:18px;letter-spacing:.1em}
#toolHint{font-size:13px;color:var(--txt2)}
#bigMsg{position:absolute;left:0;right:0;top:26%;text-align:center;opacity:0;transition:opacity 1.2s}
#bigMsg .b1{font-family:var(--font2);font-size:clamp(22px,3.6vw,46px);letter-spacing:.2em;font-weight:700}
#bigMsg .b2{font-size:clamp(13px,1.4vw,18px);letter-spacing:.35em;color:var(--holo);margin-top:8px;text-transform:uppercase}
#bigMsg .b3{font-size:14px;letter-spacing:.2em;color:var(--txt2);margin-top:6px}
#toast{position:absolute;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);min-width:300px;text-align:center;padding:10px 26px;opacity:0;transition:opacity .4s,transform .4s}
#toast .t1{font-size:12px;letter-spacing:.3em;color:var(--ok)}
#toast .t2{font-size:22px;font-weight:700}
#toast .t3{font-size:14px;color:var(--gold)}
#visor{position:absolute;inset:0;opacity:0;transition:opacity .35s;background:radial-gradient(ellipse at center,transparent 45%,rgba(40,20,90,.35) 80%,rgba(10,0,30,.8) 100%)}
#visor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(143,245,255,.04) 0 1px,transparent 1px 3px)}
#visorInfo{position:absolute;left:calc(50% + 60px);top:calc(50% - 70px);min-width:250px;padding:10px 14px;opacity:0;transition:opacity .2s}
#toast,#visorInfo{backdrop-filter:none;-webkit-backdrop-filter:none} /* live over the 3D view: skip the per-frame backdrop blur */
#visorInfo .v1{font-size:12px;letter-spacing:.25em;color:var(--holo)}
#visorInfo .v2{font-size:20px;font-weight:700}
#visorInfo .v3{font-size:13px;color:var(--txt2);line-height:1.35;margin-top:4px}
#buildHud{position:absolute;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);pointer-events:auto;width:min(980px,96vw)}
#buildCats{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
#buildItems{display:flex;gap:6px;overflow-x:auto;padding:6px 4px 8px;scrollbar-width:thin}
.bitem{flex:0 0 auto;width:92px;height:82px;border:1px solid var(--line);background:rgba(4,14,22,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-align:center;cursor:pointer;padding:4px}
.bitem.sel{border-color:var(--holo);box-shadow:0 0 14px rgba(143,245,255,.35);background:rgba(30,80,100,.6)}
.bitem canvas{width:56px;height:44px}
#buildMats{display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.mat{width:34px;height:34px;border:2px solid transparent;border-radius:3px;cursor:pointer}
.mat.sel{border-color:#fff;box-shadow:0 0 10px #fff}
#buildTip{text-align:center;font-size:14px;color:var(--txt2);margin-bottom:4px;text-shadow:0 0 6px #000}
#modeTag{position:absolute;top:calc(14px + var(--sat));left:calc(20px + var(--sal));font-size:12px;letter-spacing:.3em;color:var(--holo-dim)}
#fps{position:absolute;top:calc(30px + var(--sat));left:calc(20px + var(--sal));font-size:11px;color:var(--txt2);letter-spacing:.1em}
#currency{position:absolute;top:calc(14px + var(--sat));right:calc(20px + var(--sar));text-align:right;font-size:14px}
#currency span{margin-left:12px}
#warpFx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#damageFx{position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(255,30,40,.8);opacity:0;transition:opacity .3s}
#subtitle{position:absolute;left:50%;bottom:calc(120px + var(--sab));transform:translateX(-50%);max-width:min(820px,90vw);text-align:center;font-size:19px;line-height:1.4;opacity:0;transition:opacity .6s;text-shadow:0 0 8px #000,0 0 3px #000}
#subtitle .who{display:block;font-size:12px;letter-spacing:.35em;color:var(--nanite)}
/* ---------- galaxy map ---------- */
#galaxyUI{position:fixed;inset:0;z-index:30;pointer-events:none}
#galaxyUI > *{pointer-events:auto}
#gTop{position:absolute;top:calc(14px + var(--sat));left:calc(16px + var(--sal));right:calc(16px + var(--sar));display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
#gTop > *{pointer-events:auto}
#gAddr{padding:10px 14px;min-width:260px}
#gAddr .a1{font-size:12px;letter-spacing:.25em;color:var(--holo-dim)}
#gAddr .a2{font-size:20px;font-weight:700}
#gAddr .a3{font-size:13px;color:var(--txt2)}
#gInfo{position:absolute;right:calc(16px + var(--sar));top:calc(90px + var(--sat));width:min(330px,88vw);padding:14px;max-height:calc(100% - 200px);overflow:auto}
#gInfo h3{font-size:18px;margin-bottom:4px}
#gBottom{position:absolute;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(900px,96vw)}
.glyphs{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.glyph{width:22px;height:22px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:rgba(143,245,255,.06)}
.glyph svg{width:18px;height:18px}
#gLevels{display:flex;gap:4px}
#gSearch{display:flex;gap:6px;align-items:center;padding:8px}
/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;z-index:20;pointer-events:none}
#touch .tz{position:absolute;pointer-events:auto}
#tLeft{left:0;bottom:0;width:42%;height:62%}
#tRight{right:0;top:0;width:58%;height:100%}
.joy{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid rgba(143,245,255,.35);background:radial-gradient(circle,rgba(143,245,255,.08),rgba(143,245,255,.02));pointer-events:none;opacity:.0;transition:opacity .15s}
.joy.on{opacity:1}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(220,252,255,.55),rgba(143,245,255,.18));border:1px solid rgba(255,255,255,.5)}
#joyHint{position:absolute;left:calc(70px + var(--sal));bottom:calc(70px + var(--sab));width:110px;height:110px;margin:-55px;border-radius:50%;border:2px dashed rgba(143,245,255,.18);pointer-events:none}
.tb{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1.5px solid rgba(143,245,255,.45);background:radial-gradient(circle at 50% 35%,rgba(40,90,120,.62),rgba(4,14,24,.66));display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:700;letter-spacing:.06em;color:#dffcff;text-shadow:0 0 4px #000}
.tb svg{width:26px;height:26px;margin-bottom:1px;fill:none;stroke:#dffcff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.big{width:82px;height:82px}
.tb.sm{width:48px;height:48px;font-size:10px}

    this.group.add(this.bg);
    // stars

      fragmentShader: `uniform vec3 uCol; uniform float uTime; uniform sampler3D uNoise; uniform float uI; varying vec3 vN; varying vec3 vP; varying vec3 vV;
        void main(){ float mu=max(dot(normalize(vN),vV),0.0); float limb=0.35+0.65*pow(mu,0.5); vec3 q=normalize(vP)*2.0; float g=texture(uNoise,q+vec3(uTime*0.004)).r*0.6+texture(uNoise,q*3.0-vec3(uTime*0.006)).b*0.4;

  setSystem(sys) {

// ---------------------------------------------------------------- per-planet atmosphere shell
function makeAtmoShell(body) {
  const q = Q();
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.SrcAlphaFactor,
    defines: { ATMO_VS: q.skyV, ATMO_LS: q.skyL },
    uniforms: Object.assign({ uSunDir: SU.uSunDir, uSunCol: SU.uSunCol, uAmbNight: SU.uAmbNight, uGround: { value: new V3(0.05, 0.05, 0.05) }, uLightning: SU.uLightning }, body.atmoU),
    vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: ATMO_GLSL + /* glsl */`
      uniform vec3 uGround; uniform float uLightning; varying vec3 vW;
      void main(){
        vec3 rd=normalize(vW); vec3 ro=-uAtmoC;
        vec2 tg=aRS(ro,rd,uAtmoR.x*0.998); bool hit=tg.x>0.0&&tg.x<1e19;
        vec3 ins,tr; aScatter(ro,rd,hit?tg.x:1e20,ins,tr);
        ins += uLightning*vec3(0.5,0.55,0.7)*uAtmoBM.w*(1.0-dot(tr,vec3(0.333)));
        float a=dot(tr,vec3(0.3333));
        if(hit){ vec3 gp=ro+rd*tg.x; ins+=tr*uGround*aSunT(gp)*max(dot(normalize(gp),uSunDir),0.0)*uSunCol*0.05; a=0.0; }
        gl_FragColor=vec4(ins,a);

  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), mat); m.scale.setScalar(body.atmoR); m.frustumCulled = false; m.renderOrder = 1;
  return m;
}

// ---------------------------------------------------------------- volumetric cloud layer
function makeClouds(body) {
  const q = Q(); const a = body.data.atmo;
  const u = Object.assign({
    uSunDir: SU.uSunDir, uSunCol: SU.uSunCol, uAmbNight: SU.uAmbNight, uNoise: SU.uNoise3D, uTime: SU.uTime,
    uRc: { value: new V2(body.R + a.cloudAlt, body.R + a.cloudAlt + a.cloudThick) }, uRot: { value: new M3() }, uCov: { value: a.clouds }, uCol: { value: new V3(...lin3(a.cloudCol)) },
    uAmb: { value: new V3(0.3, 0.35, 0.45) }, uScale: { value: 1 / 2600 }, uMode: { value: 0 }, uDens: { value: 1 }, uStorm: { value: 0 },
  }, body.atmoU);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.FrontSide, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor, blendEquation: THREE.AddEquation,
    defines: { ATMO_VS: 4, ATMO_LS: 3, CSTEPS: q.clouds },
    uniforms: u,
    vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: ATMO_GLSL + /* glsl */`
      uniform sampler3D uNoise; uniform float uTime; uniform vec2 uRc; uniform mat3 uRot; uniform float uCov; uniform vec3 uCol; uniform vec3 uAmb; uniform float uScale; uniform float uDens; uniform float uStorm; varying vec3 vW;
      float h12(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      float dens(vec3 lp, float hh){
        vec3 q=lp*uScale+vec3(uTime*0.0035,0.0,uTime*0.002);
        float cov=texture(uNoise,lp*uScale*0.11).g; float c=clamp(uCov*(0.35+1.3*cov)+uStorm*0.3,0.0,0.97);
        float base=texture(uNoise,q).r;
        float shape=smoothstep(0.0,0.18,hh)*smoothstep(1.0,0.45,hh);
        float d=clamp((base-(1.0-c))/max(c,0.05),0.0,1.0)*shape;
        if(d>0.0){ d-=texture(uNoise,q*3.7+vec3(uTime*0.006)).b*0.35*(1.0-d); }
        return max(d,0.0);
      }
      void main(){
        vec3 rd=normalize(vW); vec3 ro=-uAtmoC; float h=length(ro);
        vec2 o=aRS(ro,rd,uRc.y), ii=aRS(ro,rd,uRc.x), g=aRS(ro,rd,uAtmoR.x);
        bool hitI=ii.x>0.0&&ii.x<1e19; bool hitG=g.x>0.0&&g.x<1e19;
        float t0,t1;
        if(h>uRc.y){ if(o.x>1e19||o.y<0.0) discard; t0=max(o.x,0.0); t1=hitI?ii.x:o.y; }
        else if(h<uRc.x){ if(hitG) discard; t0=ii.y; t1=o.y; }
        else { t0=0.0; t1=hitI?ii.x:o.y; }
        if(hitG) t1=min(t1,g.x);
        t1=min(t1,t0+(uRc.y-uRc.x)*14.0);
        if(t1<=t0) discard;
        float ds=(t1-t0)/float(CSTEPS); float jit=h12(gl_FragCoord.xy+fract(uTime)*17.0);
        vec3 L=uSunDir; vec3 Ll=uRot*L; float thick=uRc.y-uRc.x;
        vec3 pm=ro+rd*(t0+(t1-t0)*0.5); vec3 sunT=aSunT(pm)*uSunCol*0.075;
        float mu=dot(rd,L); float ph=0.55+0.9*pow(max(mu,0.0),6.0)+0.25*mu;
        float T=1.0; vec3 C=vec3(0.0);
        for(int k=0;k<CSTEPS;k++){
          float t=t0+ds*(float(k)+jit); vec3 p=ro+rd*t; float hh=(length(p)-uRc.x)/thick; vec3 lp=uRot*p;
          float d=dens(lp,hh);
          if(d>0.004){
            float dl=dens(lp+Ll*thick*0.3,hh+0.18*max(dot(normalize(p),L),0.0));
            float beer=exp(-dl*3.2); float powder=1.0-exp(-d*5.0);
            vec3 sc=uCol*(sunT*beer*ph*(0.4+powder*0.9)+uAmb*(0.55+hh*0.6));
            float a=1.0-exp(-d*ds*0.012*uDens);
            C+=T*a*sc; T*=1.0-a; if(T<0.03) break;
          }
        }
        float alpha=1.0-T; if(alpha<0.003) discard;
        vec3 ins,tr; aScatter(ro,rd,t0+(t1-t0)*0.3,ins,tr);
        C=C*tr+ins*alpha*0.85;
        gl_FragColor=vec4(C,alpha);
      }`,
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), mat); m.frustumCulled = false; m.renderOrder = 3;
  m.userData.update = (camDist) => {
    const rc = u.uRc.value;
    if (camDist > rc.y) { m.material.side = THREE.FrontSide; m.scale.setScalar(rc.y); m.material.depthTest = true; }
    else if (camDist < rc.x) { m.material.side = THREE.BackSide; m.scale.setScalar(rc.x); m.material.depthTest = true; }
    else { m.material.side = THREE.BackSide; m.scale.setScalar(rc.y); m.material.depthTest = false; }
  };
  return m;
}

// ---------------------------------------------------------------- planetary rings
function makeRings(body) {
  const rg = body.data.rings;
  const geo = new THREE.RingGeometry(rg.inner, rg.outer, 256, 1); geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { uSunDir: SU.uSunDir, uC: { value: new V3() }, uR: { value: body.R }, uIn: { value: rg.inner }, uOut: { value: rg.outer }, uA: { value: new V3(...lin3(rg.col)) }, uB: { value: new V3(...lin3(rg.col2)) }, uSeed: { value: rg.seed }, uSunCol: SU.uSunCol },
    vertexShader: `varying vec3 vW; varying vec3 vL; void main(){ vL=position; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: /* glsl */`uniform vec3 uSunDir,uC,uA,uB,uSunCol; uniform float uR,uIn,uOut,uSeed; varying vec3 vW; varying vec3 vL;
      float h(float x){ return fract(sin(x*127.1+uSeed)*43758.5453); }
      float n1(float x){ float i=floor(x),f=fract(x); return mix(h(i),h(i+1.0),f*f*(3.0-2.0*f)); }
      void main(){ float r=(length(vL.xz)-uIn)/(uOut-uIn);
        float b=n1(r*18.0)*0.5+n1(r*60.0)*0.3+n1(r*210.0)*0.2; float gap=smoothstep(0.02,0.05,abs(r-0.63))*smoothstep(0.01,0.03,abs(r-0.28));
        float a=b*gap*smoothstep(0.0,0.06,r)*smoothstep(1.0,0.9,r); a=pow(a,1.4)*0.95;
        vec3 p=vW-uC; float t=dot(p,uSunDir); float sh=1.0; if(t<0.0){ float d=length(p-uSunDir*t); sh=smoothstep(uR*0.97,uR*1.03,d); }
        vec3 col=mix(uA,uB,n1(r*33.0))*uSunCol*0.045*(0.25+0.75*sh);
        gl_FragColor=vec4(col*a,a); }`,
  });
  mat.blending = THREE.CustomBlending; mat.blendSrc = THREE.OneFactor; mat.blendDst = THREE.OneMinusSrcAlphaFactor;
  const m = new THREE.Mesh(geo, mat); m.renderOrder = 0; m.frustumCulled = false;
  m.rotation.set(rg.tilt, 0, rg.tilt * 0.5);
  return m;
}

// ---------------------------------------------------------------- weather & dust particles
const Particles = {
  init() {
    const quad = new THREE.PlaneGeometry(1, 1); quad.translate(0, 0.5, 0);
    const N = IS_MOBILE ? 3000 : 7000;
    const g = new THREE.InstancedBufferGeometry(); g.index = quad.index; g.setAttribute('position', quad.getAttribute('position')); g.setAttribute('uv', quad.getAttribute('uv'));
    const seed = new Float32Array(N * 4); for (let i = 0; i < N * 4; i++) seed[i] = Math.random();
    g.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seed, 4)); g.instanceCount = 0; this.N = N;
    this.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: SU.uTime, uCam: { value: new V3() }, uUp: { value: new V3(0, 1, 0) }, uVel: { value: new V3() }, uBox: { value: 50 }, uFall: { value: new V3(0, -8, 0) }, uSize: { value: new V2(0.03, 0.8) }, uCol: { value: new V4(0.6, 0.7, 0.8, 0.5) }, uMode: { value: 0 }, uTex: { value: null }, uStretch: { value: 0 }, uSunCol: SU.uSunCol, uDay: SU.uDayLight },
      vertexShader: /* glsl */`
        attribute vec4 aSeed; uniform float uTime; uniform vec3 uCam; uniform vec3 uUp; uniform vec3 uVel; uniform float uBox; uniform vec3 uFall; uniform vec2 uSize; uniform float uMode; uniform float uStretch;
        varying vec2 vUv; varying float vA;
        void main(){
          vec3 wob=vec3(sin(uTime*0.7+aSeed.w*30.0),cos(uTime*0.5+aSeed.x*20.0),sin(uTime*0.6+aSeed.y*25.0))*(uMode>0.5?0.8:0.0);
          vec3 p=aSeed.xyz*uBox+uFall*uTime*(0.7+aSeed.w*0.6)+wob-uCam;
          p=mod(p,uBox)-uBox*0.5;
          vec3 fwd=normalize(-p+vec3(1e-4));
          vec3 axis; float len=uSize.y; float wid=uSize.x;
          if(uStretch>0.0){ vec3 v=uVel; float sp=length(v); axis=sp>0.01?-v/sp:uUp; len=max(uSize.y,sp*uStretch); }
          else if(uMode<0.5){ vec3 v=uFall-uVel*0.1; axis=normalize(v); len=uSize.y; }
          else { axis=normalize(cross(fwd,vec3(0.3,0.9,0.1))); len=uSize.y; wid=uSize.y; }
          vec3 side=normalize(cross(axis,fwd)+vec3(1e-5));
          vec3 wp=p+side*(uv.x-0.5)*wid*(0.6+aSeed.w*0.8)+axis*(uv.y-0.5)*len;
          float d=length(p); vA=smoothstep(uBox*0.5,uBox*0.25,d)*smoothstep(0.3,1.5,d);
          vUv=uv; gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.0);
        }`,
      fragmentShader: `uniform vec4 uCol; uniform float uMode; uniform sampler2D uTex; uniform float uDay; varying vec2 vUv; varying float vA;
        void main(){ float a; if(uMode<0.5) a=(1.0-abs(vUv.x-0.5)*2.0)*smoothstep(0.0,0.3,vUv.y)*smoothstep(1.0,0.6,vUv.y); else a=texture2D(uTex,vUv).r; a*=vA*uCol.a; if(a<0.003) discard; gl_FragColor=vec4(uCol.rgb*a,a); }`,
    });

  },
  // set type: {mode:0 streak/1 flake, count, box, fall:[x,y,z] (local up frame), size:[w,l], col:[r,g,b,a], additive}
  set(cfg) {
    const u = this.mat.uniforms; this.cfg = cfg;
    if (!cfg) { this.mesh.geometry.instanceCount = 0; return; }

    u.uMode.value = cfg.mode; u.uBox.value = cfg.box; u.uSize.value.set(cfg.size[0], cfg.size[1]); u.uCol.value.set(...cfg.col); u.uTex.value = TEX.sprite; u.uStretch.value = cfg.stretch || 0;
    this.mat.blending = cfg.additive === false ? THREE.NormalBlending : THREE.AdditiveBlending;
  },
  update(camFrame, up, fallLocal, vel) {
    const u = this.mat.uniforms; u.uCam.value.copy(camFrame); u.uUp.value.copy(up); if (fallLocal) u.uFall.value.copy(fallLocal); if (vel) u.uVel.value.copy(vel);
  },

// ---------------------------------------------------------------- hyperspace tunnel
const WarpTunnel = {
  init() {

  },

// ---------------------------------------------------------------- aurora curtains (night skies of cold / exotic worlds)
function makeAurora(body) {
  const r = new RNG(hash(body.data.seed, 0xA0A));
  const g = new THREE.CylinderGeometry(2600, 2600, 900, 96, 1, true, 0, Math.PI * 1.3); g.translate(0, 1900, 0);

// =====================================================================================
//  TELEPORT — instant travel between bases / portal addresses
// =====================================================================================
const Teleport = {
  async to(base) {
    FX.flash(1, 0.5, [0.6, 0.9, 1]); Sound.play('warpJump');
    const same = World.sys && base.sys === World.sys.key;
    if (!same) { await Game.arriveSystem(base.addr, false); }
    if (base.kind === 'planet') {
      const body = World.bodies[base.body]; World.setFrame(body, [Player, Ship]); const anchor = new V3(...base.anchor.p); const up = anchor.clone().normalize();
      Player.mode = 'foot'; Player.model.visible = true; Player.pos.copy(anchor).addScaledVector(up, 2); Player.vel.set(0, 0, 0); Player.up.copy(up);
      if (!same) { Ship.pos.copy(anchor).addScaledVector(up, 3).add(new V3(12, 0, 0).applyQuaternion(new Q4(...base.anchor.q))); const gi = groundInfo(body, Ship.pos); Ship.pos.normalize().multiplyScalar(gi.groundR + Ship.model.gearH); Ship.quat.copy(quatLook(new V3(1, 0, 0).applyQuaternion(new Q4(...base.anchor.q)), up)); Ship.mode = 'landed'; Ship.setGear(1); }
    } else {
      const st = World.others.find(o => o.kind === 'playerStation' && o.data.id === base.id); if (st) { World.setFrame(st, [Player, Ship]); Player.mode = 'foot'; Player.model.visible = true; Player.pos.copy(new V3(0, -1.5, -12)); Player.vel.set(0, 0, 0); if (!same) { Ship.pos.set(0, -2.6 + Ship.model.gearH, 14); Ship.quat.identity(); Ship.mode = 'landed'; Ship.setGear(1); } }
    }
    UI.systemTitle(World.sys, World.frame);
  },
  async toAddress(addr, via = 'Portal') {
    FX.flash(1, 0.4, [0.7, 0.5, 1]); Sound.play('warpJump'); UI.loading(true, via + ' transit…', 0.3);
    await Game.arriveSystem(addr, true); UI.loading(false);
    // land on the first habitable planet surface
    const body = World.bodies.find(b => b.data.atmo) || World.bodies[0]; World.setFrame(body, [Player, Ship]); const dir = Game.findLandingSpot(body); const gi = groundInfo(body, dir.clone().multiplyScalar(body.R + 50));
    Player.mode = 'foot'; Player.model.visible = true; Player.pos.copy(dir).multiplyScalar(gi.groundR + 1); Player.vel.set(0, 0, 0); Player.up.copy(dir);
    const t1 = new V3(0, 1, 0).cross(dir).normalize(); Ship.pos.copy(Player.pos).addScaledVector(t1, 14); const sgi = groundInfo(body, Ship.pos); Ship.pos.normalize().multiplyScalar(sgi.groundR + Ship.model.gearH); Ship.quat.copy(quatLook(t1, dir)); Ship.mode = 'landed'; Ship.setGear(1);
    UI.systemTitle(World.sys, body);
  },
};

const GalaxyMap = {
  active: false, level: 'region', yaw: 0.6, pitch: 0.45, dist: 900, target: new V3(), focus: null, selected: null, stars: [],

      vertexShader: `attribute vec3 aCol; attribute float aSize; attribute float aId; varying vec3 vC; uniform float uPR; uniform float uSel; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; float s=aSize*(aId==uSel?2.5:1.0); gl_PointSize=clamp(s*uPR*1600.0/max(-mv.z,1.0),2.0*uPR,48.0*uPR); vC=aCol*(aId==uSel?2.5:1.0); }`,
      fragmentShader: `uniform sampler2D uTex; varying vec3 vC; void main(){ float a=texture2D(uTex,gl_PointCoord).r; gl_FragColor=vec4(vC*a,1.0); }` });
    this.starMat = starMat;

// =====================================================================================
//  NET — optional co-op. Serverless: WebRTC data channels with copy-paste invite codes
//  (the host relays for everyone it invited), plus BroadcastChannel so several tabs of the
//  same browser share one universe automatically. Everyone with the same universe seed
//  sees the same planets, so only players are synchronised — never the world itself.
// =====================================================================================

  id: '', name: '', since: 0, seq: 0, seen: new Map(), gone: new Map(), peers: new Map(), links: new Set(), bc: null, pending: null, sendT: 0, log: [], timeLocked: false,

  gameplay(dt) {
    Game.update(dt);
    // global inputs
    if (Input.p('pause')) { if (UI.modal) UI.close(); else if (Build.active) Build.exit(); else UI.openPause(); }
    if (!UI.modal) {

    if (Touch.host) Touch.update();

  },
  planetContent(dt) {
    const F = World.frame;
    for (const b of World.bodies) {
      const want = b === F && !Game.inTunnel;

window.addEventListener('beforeunload', () => { if (Game.state === 'play') Game.autosave(); });

// ---- debug / scenario helpers (used by automated visual tests; harmless in normal play)
