<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Island Protocol: Presidential Extraction - a survival-horror escort shooter that runs entirely in one HTML file.">
<title>Island Protocol: Presidential Extraction</title>
</head>
<body>
<style>
  /* ISLAND PROTOCOL - shell styles. The game deliberately commits to a single
     dark look in both themes; every colour below is painted explicitly. */
  :root {
    color-scheme: dark;
    --ip-void: #05070a;
    --ip-ink: #0a0d12;
    --ip-blood: #b8232b;
    --ip-verdigris: #6fe39a;
    --ip-bone: #d7d3c8;
    --ip-dim: #6d7480;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--ip-void); color: var(--ip-bone);
    overflow: hidden; overscroll-behavior: none;
    font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #ip-root {
    position: fixed; inset: 0; background: var(--ip-void);
    display: block; isolation: isolate;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #ip-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; background: #000; touch-action: none;
  }
  #ip-ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

  /* ---- boot / fatal-error curtain (owned by the shell, not by IP.UI) ---- */
  #ip-boot {
    position: absolute; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px; box-sizing: border-box;
    background:
      radial-gradient(120% 90% at 50% 40%, #10161d 0%, #05070a 62%, #000 100%);
    color: var(--ip-bone);
    transition: opacity .6s ease; opacity: 1;
  }
  #ip-boot.gone { opacity: 0; pointer-events: none; }
  #ip-boot h1 {
    margin: 0; font-size: clamp(19px, 5.2vw, 40px); font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase; color: var(--ip-bone);
    text-shadow: 0 0 26px rgba(184,35,43,.42);
  }
  #ip-boot h2 {
    margin: 0; font-size: clamp(9px, 2.4vw, 13px); font-weight: 400;
    letter-spacing: .46em; text-transform: uppercase; color: var(--ip-blood);
  }
  #ip-bar {
    width: min(420px, 76vw); height: 3px; background: #171d26;
    border-radius: 2px; overflow: hidden;
  }
  #ip-bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #4a1116, var(--ip-blood), #ff6b52);
    transition: width .28s ease;
  }
  #ip-status {
    font-size: clamp(10px, 2.6vw, 12px); letter-spacing: .16em;
    text-transform: uppercase; color: var(--ip-dim); min-height: 1.3em;
  }
  #ip-fatal {
    display: none; max-width: 640px; text-align: left; font-size: 13px;
    line-height: 1.6; color: var(--ip-bone);
    background: #0d0f14; border: 1px solid #2a1114; border-left: 3px solid var(--ip-blood);
    padding: 16px 18px; border-radius: 6px; white-space: pre-wrap;
    overflow-x: auto; max-height: 52vh; overflow-y: auto;
  }
  #ip-fatal b { color: var(--ip-blood); letter-spacing: .12em; }
  #ip-rotate {
    display: none; position: absolute; inset: 0; z-index: 10000;
    background: #05070a; color: var(--ip-bone);
    align-items: center; justify-content: center; text-align: center;
    font-size: 15px; letter-spacing: .2em; text-transform: uppercase; padding: 30px;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #ip-rotate.armed { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    #ip-boot, #ip-bar > i { transition: none; }
  }
</style>

<div id="ip-root">
  <canvas id="ip-canvas"></canvas>
  <div id="ip-ui"></div>
  <div id="ip-rotate">Rotate your device to landscape</div>
  <div id="ip-boot">
    <h2>Island Protocol</h2>
    <h1>Presidential Extraction</h1>
    <div id="ip-bar"><i></i></div>
    <div id="ip-status">Initialising</div>
    <div id="ip-fatal"></div>
  </div>
</div>

<script>
"use strict";
/* Shell bootstrap: owns the loading curtain and the fatal-error path so that a
   failure anywhere in the engine still produces a readable screen. Build 2026-08-10 */
(function () {
  var boot = document.getElementById('ip-boot');
  var bar = document.querySelector('#ip-bar > i');
  var status = document.getElementById('ip-status');
  var fatal = document.getElementById('ip-fatal');

  /* The Artifact host supplies its own <head>; make sure a mobile viewport exists. */
  if (!document.querySelector('meta[name="viewport"]')) {
    var mv = document.createElement('meta');
    mv.name = 'viewport';
    mv.content = 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
    (document.head || document.documentElement).appendChild(mv);
  }

  window.IP_BOOT = {
    progress: function (frac, msg) {
      if (bar) { bar.style.width = Math.max(0, Math.min(1, frac)) * 100 + '%'; }
      if (msg && status) { status.textContent = msg; }
    },
    done: function () {
      if (boot) { boot.classList.add('gone'); setTimeout(function () { boot.style.display = 'none'; }, 700); }
    },
    fail: function (title, detail) {
      if (!boot) { return; }
      boot.classList.remove('gone'); boot.style.display = 'flex'; boot.style.opacity = '1';
      if (bar && bar.parentNode) { bar.parentNode.style.display = 'none'; }
      if (status) { status.textContent = title || 'Startup failed'; }
      if (fatal) { fatal.style.display = 'block'; fatal.textContent = String(detail || ''); }
    }
  };

  window.addEventListener('error', function (e) {
    if (window.IP && window.IP.Game && window.IP.Game.running) { return; }
    window.IP_BOOT.fail('Startup failed', (e && e.message ? e.message : 'Unknown error') +
      (e && e.filename ? '\n' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (window.IP && window.IP.Game && window.IP.Game.running) { return; }
    window.IP_BOOT.fail('Startup failed', String((e && e.reason) || 'Unhandled rejection'));
  });

  /* Kill browser gestures that fight a fullscreen game. */
  var stop = function (e) { if (e.cancelable) { e.preventDefault(); } };
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', function (e) {
    if (e.target && e.target.closest && e.target.closest('#ip-root')) { stop(e); }
  });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) { stop(e); }
  }, { passive: false });
})();
</script>

    '  vec4 uSunCol;',
    '  vec4 uAmbient;',
    '  vec4 uFogCol;',
    '  vec4 uFogParams;',
    '  vec4 uScreen;',
    '  vec4 uMisc;',
    '  vec4 uCascadeSplits;',
    '  vec4 uMisc2;',
    '};',
    ''].join('\n');

  var CH_LIGHTS = [
    'layout(std140) uniform Lights {',
    '  vec4 uLightPos[48];',
    '  vec4 uLightCol[48];',
    '};',
    ''].join('\n');

  /* --- tileable procedural noise, used by texgen + sky + lens fx -------- */
  var CH_NOISE = [
    'float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }',
    'float hash12(vec2 p){',
    '  vec3 p3 = fract(vec3(p.xyx) * 0.1031);',
    '  p3 += dot(p3, p3.yzx + 33.33);',
    '  return fract((p3.x + p3.y) * p3.z);',
    '}',
    'vec2 hash22(vec2 p){',
    '  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));',
    '  p3 += dot(p3, p3.yzx + 33.33);',
    '  return fract((p3.xx + p3.yz) * p3.zy);',
    '}',
    'float hash13(vec3 p3){',
    '  p3 = fract(p3 * 0.1031);',
    '  p3 += dot(p3, p3.zyx + 31.32);',
    '  return fract((p3.x + p3.y) * p3.z);',
    '}',
    /* tileable value noise: lattice coords wrapped by "per" */
    'float vnoiseT(vec2 p, float per){',
    '  vec2 i = floor(p), f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  float a = hash12(mod(i, per));',
    '  float b = hash12(mod(i + vec2(1.0, 0.0), per));',
    '  float c = hash12(mod(i + vec2(0.0, 1.0), per));',
    '  float d = hash12(mod(i + vec2(1.0, 1.0), per));',
    '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
    '}',
    'float fbmT(vec2 p, float per, int oct){',
    '  float a = 0.5, s = 0.0, n = 0.0;',
    '  for (int k = 0; k < 8; k++){',
    '    if (k >= oct) break;',
    '    s += a * vnoiseT(p, per); n += a;',
    '    a *= 0.5; p *= 2.0; per *= 2.0;',
    '  }',
    '  return s / max(n, 1e-4);',
    '}',
    /* ridged fbm: veins, cracks, rock fractures */
    'float ridgeT(vec2 p, float per, int oct){',
    '  float a = 0.5, s = 0.0, n = 0.0;',
    '  for (int k = 0; k < 8; k++){',
    '    if (k >= oct) break;',
    '    float v = 1.0 - abs(vnoiseT(p, per) * 2.0 - 1.0);',
    '    s += a * v * v; n += a;',
    '    a *= 0.5; p *= 2.0; per *= 2.0;',
    '  }',
    '  return s / max(n, 1e-4);',
    '}',
    /* tileable worley: returns .x = F1, .y = F2 - F1 (cell edge distance) */
    'vec2 worleyT(vec2 p, float per){',
    '  vec2 i = floor(p), f = fract(p);',
    '  float f1 = 8.0, f2 = 8.0;',
    '  for (int y = -1; y <= 1; y++){',
    '    for (int x = -1; x <= 1; x++){',
    '      vec2 o = vec2(float(x), float(y));',
    '      vec2 h = hash22(mod(i + o, per));',
    '      vec2 d = o + h - f;',
    '      float dd = dot(d, d);',
    '      if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) { f2 = dd; }',
    '    }',
    '  }',
    '  f1 = sqrt(f1); f2 = sqrt(f2);',
    '  return vec2(f1, f2 - f1);',
    '}',
    /* cell id, for per-cell colour jitter (leaves, rock, tiles) */
    'vec3 worleyCell(vec2 p, float per){',
    '  vec2 i = floor(p), f = fract(p);',
    '  float f1 = 8.0; vec2 best = vec2(0.0);',
    '  for (int y = -1; y <= 1; y++){',
    '    for (int x = -1; x <= 1; x++){',
    '      vec2 o = vec2(float(x), float(y));',
    '      vec2 c = mod(i + o, per);',
    '      vec2 h = hash22(c);',
    '      vec2 d = o + h - f;',
    '      float dd = dot(d, d);',
    '      if (dd < f1) { f1 = dd; best = c; }',
    '    }',
    '  }',
    '  return vec3(sqrt(f1), best);',
    '}',
    ''].join('\n');

  /* --- height-fog + tonemap helpers shared by lit passes ---------------- */
  var CH_FOG = [
    /* Analytic exponential height fog. Integrates exp(-b*(y-h0)) along the',
       view ray so vertical motion through the fog slab is continuous. */
    'float heightFog(vec3 camP, vec3 wp){',
    '  vec3 d = wp - camP;',
    '  float dist = length(d);',
    '  if (dist < 1e-4) return 0.0;',
    '  float b = max(uFogParams.y, 1e-4);',
    '  float h0 = uFogParams.x;',
    '  float dens = uFogCol.w;',
    '  float fy = exp(-b * (camP.y - h0));',
    '  float dy = d.y;',
    '  float t = (abs(dy) > 1e-4) ? (1.0 - exp(-b * dy)) / (b * dy) : 1.0;',
    '  float amount = dens * dist * fy * t;',
    '  return 1.0 - exp(-max(amount, 0.0));',
    '}',
    ''].join('\n');

  var CH_PBR = [
    /* Cook-Torrance: GGX NDF + Smith height-correlated visibility + Schlick */
    'float D_GGX(float NoH, float a){',
    '  float a2 = a * a;',
    '  float d = (NoH * a2 - NoH) * NoH + 1.0;',
    '  return a2 / max(PI * d * d, 1e-7);',
    '}',
    'float V_SmithGGX(float NoV, float NoL, float a){',
    '  float a2 = a * a;',
    '  float gv = NoL * sqrt(NoV * NoV * (1.0 - a2) + a2);',
    '  float gl = NoV * sqrt(NoL * NoL * (1.0 - a2) + a2);',
    '  return 0.5 / max(gv + gl, 1e-6);',
    '}',
    'vec3 F_Schlick(vec3 f0, float u){',
    '  float f = pow(1.0 - u, 5.0);',
    '  return f0 + (vec3(1.0) - f0) * f;',
    '}',
    /* Karis analytic split-sum environment BRDF approximation */
    'vec2 envBRDF(float NoV, float rough){',
    '  vec4 c0 = vec4(-1.0, -0.0275, -0.572, 0.022);',
    '  vec4 c1 = vec4(1.0, 0.0425, 1.04, -0.04);',
    '  vec4 r = rough * c0 + c1;',
    '  float a004 = min(r.x * r.x, exp2(-9.28 * NoV)) * r.x + r.y;',
    '  return vec2(-1.04, 1.04) * a004 + r.zw;',
    '}',
    /* smooth range window on top of physical inverse-square falloff */
    'float lightAtten(float dist, float range){',
    '  float f = dist / max(range, 1e-3);',
    '  float w = clamp(1.0 - f * f * f * f, 0.0, 1.0);',
    '  w *= w;',
    '  return w / (dist * dist + 0.02);',
    '}',
    ''].join('\n');

  /* ------------------------------------------------------------------ */
  /* Fullscreen triangle vertex shader (no attributes, gl_VertexID based) */
  var VS_FULLSCREEN = VER + [
    'out vec2 vUV;',
    'void main(){',
    '  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));',
    '  vUV = p;',
    '  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);',
    '}',
    ''].join('\n');

  /* ==================== PROCEDURAL MATERIAL TEXTURE GEN ================= */
  /* One MRT draw per layer writes albedo(sqrt-encoded) / normal+height / ORM.
     Everything is authored tileable so triplanar world-space repeats do not
     seam. Height is evaluated 4 extra times per pixel for the sobel normal. */
  var FS_TEXGEN = VER + CH_PRECISION + CH_NOISE + [
    'in vec2 vUV;',
    'layout(location = 0) out vec4 oAlbedo;',
    'layout(location = 1) out vec4 oNormal;',
    'layout(location = 2) out vec4 oORM;',
    'uniform int uLayer;',
    'uniform sampler2D uNoiseTex;   // CPU-side IP.Noise atlas: r=fbm g=worley b=perlin a=white',
    '',
    '// ---- height field per material (drives the sobel normal map) ------',
    'float heightAt(int L, vec2 p){',
    '  if (L == 1){ // CONCRETE ------------------------------------------',
    '    float h = fbmT(p * 6.0, 6.0, 5) * 0.65 + fbmT(p * 34.0, 34.0, 3) * 0.18;',
    '    vec2 w = worleyT(p * 9.0, 9.0);',
    '    h -= smoothstep(0.45, 0.05, w.x) * 0.30;            // blown-out pits',
    '    float crack = ridgeT(p * 3.0 + 11.0, 3.0, 4);',
    '    h -= smoothstep(0.72, 0.97, crack) * 0.45;          // hairline cracks',
    '    return h;',
    '  } else if (L == 2){ // METAL PLATE ---------------------------------',
    '    vec2 g = fract(p * 3.0);',
    '    float seam = min(min(g.x, 1.0 - g.x), min(g.y, 1.0 - g.y));',
    '    float h = 0.55 + fbmT(vec2(p.x * 90.0, p.y * 6.0), 90.0, 3) * 0.06;',
    '    h -= (1.0 - smoothstep(0.0, 0.035, seam)) * 0.5;    // plate seams',
    '    vec2 rp = fract(p * 3.0) - 0.5;',
    '    vec2 rq = abs(rp) - 0.40;',
    '    float riv = length(max(rq, 0.0));',
    '    h += (1.0 - smoothstep(0.0, 0.035, riv)) * 0.35;    // corner rivets',
    '    return h;',
    '  } else if (L == 3){ // RUST ----------------------------------------',
    '    float base = 0.5 + fbmT(p * 8.0, 8.0, 5) * 0.25;',
    '    vec2 w = worleyT(p * 6.0, 6.0);',
    '    float scab = smoothstep(0.55, 0.1, w.x);',
    '    base -= scab * 0.35 * (0.5 + 0.5 * fbmT(p * 40.0, 40.0, 3));',
    '    return base;',
    '  } else if (L == 4){ // WOOD ----------------------------------------',
    '    float plank = floor(p.y * 4.0);',
    '    vec2 q = vec2(p.x + hash11(plank) * 0.37, p.y);',
    '    float grain = fbmT(vec2(q.x * 3.0, q.y * 48.0), 48.0, 4);',
    '    float rings = fract(q.x * 7.0 + grain * 2.4);',
    '    float h = 0.55 + (rings * rings) * 0.22 + grain * 0.1;',
    '    float gap = abs(fract(p.y * 4.0) - 0.5);',
    '    h -= (1.0 - smoothstep(0.40, 0.49, gap)) * 0.0;',
    '    h -= smoothstep(0.47, 0.5, gap) * 0.35;             // plank gaps',
    '    vec2 kn = worleyT(p * 3.0 + 5.0, 3.0);',
    '    h -= smoothstep(0.25, 0.0, kn.x) * 0.25;            // knots',
    '    return h;',
    '  } else if (L == 5){ // DIRT ----------------------------------------',
    '    float h = fbmT(p * 5.0, 5.0, 6) * 0.7 + fbmT(p * 25.0, 25.0, 3) * 0.25;',
    '    vec2 w = worleyT(p * 22.0, 22.0);',
    '    h += smoothstep(0.4, 0.0, w.x) * 0.22;              // pebbles',
    '    return h;',
    '  } else if (L == 6){ // ROCK ----------------------------------------',
    '    vec2 w = worleyT(p * 4.0, 4.0);',
    '    float h = w.x * 0.55 + fbmT(p * 9.0, 9.0, 5) * 0.35;',
    '    h -= smoothstep(0.12, 0.0, w.y) * 0.4;              // fracture seams',
    '    h += fbmT(p * 40.0, 40.0, 3) * 0.08;',
    '    return h;',
    '  } else if (L == 7){ // FOLIAGE -------------------------------------',
    '    vec3 c = worleyCell(p * 4.0, 4.0);',
    '    float h = 0.6 - c.x * 0.4;',
    '    float vein = ridgeT((p + hash22(c.yz)) * 26.0, 26.0, 3);',
    '    h += vein * 0.14;',
    '    return h;',
    '  } else if (L == 8){ // TILE ----------------------------------------',
    '    vec2 g = fract(p * 6.0);',
    '    float e = min(min(g.x, 1.0 - g.x), min(g.y, 1.0 - g.y));',
    '    float h = smoothstep(0.0, 0.055, e) * 0.55 + 0.2;   // grout recess',
    '    h += fbmT(p * 60.0, 60.0, 2) * 0.03;',
    '    vec2 ch = worleyT(p * 14.0 + 3.0, 14.0);',
    '    h -= smoothstep(0.16, 0.0, ch.x) * 0.35;            // chipped corners',
    '    return h;',
    '  } else if (L == 9){ // FLESH ---------------------------------------',
    '    float h = 0.55 + fbmT(p * 7.0, 7.0, 4) * 0.2;',
    '    float vein = ridgeT(p * 5.0 + 2.0, 5.0, 5);',
    '    h += smoothstep(0.62, 0.95, vein) * 0.28;           // raised veins',
    '    vec2 w = worleyT(p * 13.0, 13.0);',
    '    h += smoothstep(0.3, 0.0, w.x) * 0.30;              // pustules',
    '    return h;',
    '  } else if (L == 10){ // FABRIC -------------------------------------',
    '    float wx = sin(p.x * 120.0 * TAU / 120.0 * 60.0);',
    '    float u = fract(p.x * 60.0), v = fract(p.y * 60.0);',
    '    float weave = (sin(u * TAU) * 0.5 + 0.5) * step(fract(p.y * 30.0), 0.5)',
    '                + (sin(v * TAU) * 0.5 + 0.5) * step(0.5, fract(p.y * 30.0));',
    '    float h = 0.45 + weave * 0.25 + fbmT(p * 70.0, 70.0, 3) * 0.12;',
    '    h += wx * 0.0;',
    '    return h;',
    '  } else if (L == 11){ // GLASS --------------------------------------',
    '    float h = 0.5 + fbmT(p * 3.0, 3.0, 3) * 0.02;',
    '    float smudge = smoothstep(0.35, 0.9, fbmT(p * 6.0 + 7.0, 6.0, 4));',
    '    h += smudge * 0.02;',
    '    return h;',
    '  } else if (L == 12){ // GRATE --------------------------------------',
    '    vec2 q = p * 8.0;',
    '    q.x += step(1.0, mod(floor(q.y), 2.0)) * 0.5;       // hex-ish offset',
    '    vec2 f = fract(q) - 0.5;',
    '    float d = length(f);',
    '    return smoothstep(0.30, 0.36, d) * 0.7 + 0.15;',
    '  } else if (L == 13){ // BLOOD --------------------------------------',
    '    float pool = fbmT(p * 4.0, 4.0, 5);',
    '    float h = 0.5 + smoothstep(0.42, 0.62, pool) * 0.12;',
    '    h += fbmT(p * 30.0, 30.0, 3) * 0.03;',
    '    return h;',
    '  }',
    '  return 0.5; // NONE',
    '}',
    '',
    '// ---- albedo / ao / roughness / metal / alpha ----------------------',
    'void matSample(int L, vec2 p, out vec3 alb, out float ao, out float rough,',
    '               out float metal, out float alpha){',
    '  alpha = 1.0; metal = 0.0; ao = 1.0; rough = 0.85; alb = vec3(0.6);',
    '  vec4 nz = texture(uNoiseTex, p);   // CPU IP.Noise atlas, adds character',
    '  if (L == 1){ // CONCRETE',
    '    float g = 0.34 + fbmT(p * 6.0, 6.0, 5) * 0.20 + nz.r * 0.06;',
    '    float speck = step(0.86, fbmT(p * 90.0, 90.0, 2));',
    '    g += speck * 0.10;',
    '    vec2 w = worleyT(p * 9.0, 9.0);',
    '    float pit = smoothstep(0.45, 0.05, w.x);',
    '    g -= pit * 0.16;',
    '    float crack = smoothstep(0.72, 0.97, ridgeT(p * 3.0 + 11.0, 3.0, 4));',
    '    g -= crack * 0.22;',
    '    float stain = smoothstep(0.5, 0.85, fbmT(p * 2.5 + 21.0, 2.5, 4));',
    '    alb = mix(vec3(g, g * 0.99, g * 0.95), vec3(0.16, 0.15, 0.13), stain * 0.55);',
    '    rough = 0.88 - speck * 0.08 + crack * 0.06;',
    '    ao = 1.0 - pit * 0.5 - crack * 0.45;',
    '  } else if (L == 2){ // METAL PLATE',
    '    float brush = fbmT(vec2(p.x * 90.0, p.y * 6.0), 90.0, 3);',
    '    float g = 0.42 + brush * 0.14;',
    '    vec2 gr = fract(p * 3.0);',
    '    float seam = 1.0 - smoothstep(0.0, 0.035, min(min(gr.x, 1.0 - gr.x), min(gr.y, 1.0 - gr.y)));',
    '    float grime = smoothstep(0.45, 0.85, fbmT(p * 4.0 + 3.0, 4.0, 4));',
    '    alb = mix(vec3(g * 0.86, g * 0.90, g), vec3(0.09, 0.09, 0.10), seam * 0.7);',
    '    alb = mix(alb, vec3(0.13, 0.12, 0.10), grime * 0.45);',
    '    metal = 1.0 - seam * 0.4 - grime * 0.35;',
    '    rough = 0.30 + brush * 0.18 + grime * 0.35 + seam * 0.25;',
    '    ao = 1.0 - seam * 0.55;',
    '  } else if (L == 3){ // RUST',
    '    vec2 w = worleyT(p * 6.0, 6.0);',
    '    float scab = smoothstep(0.55, 0.1, w.x);',
    '    float fine = fbmT(p * 30.0, 30.0, 4);',
    '    vec3 rustA = vec3(0.30, 0.11, 0.045);',
    '    vec3 rustB = vec3(0.46, 0.22, 0.08);',
    '    vec3 steel = vec3(0.30, 0.31, 0.33);',
    '    alb = mix(steel, mix(rustA, rustB, fine), clamp(scab + fine * 0.45, 0.0, 1.0));',
    '    alb *= 0.75 + nz.g * 0.4;',
    '    metal = (1.0 - scab) * 0.85;',
    '    rough = mix(0.42, 0.95, clamp(scab + fine * 0.3, 0.0, 1.0));',
    '    ao = 1.0 - scab * 0.35;',
    '  } else if (L == 4){ // WOOD',
    '    float plank = floor(p.y * 4.0);',
    '    vec2 q = vec2(p.x + hash11(plank) * 0.37, p.y);',
    '    float grain = fbmT(vec2(q.x * 3.0, q.y * 48.0), 48.0, 4);',
    '    float rings = fract(q.x * 7.0 + grain * 2.4);',
    '    float tone = 0.30 + rings * 0.28 + hash11(plank + 4.0) * 0.12;',
    '    alb = vec3(tone, tone * 0.62, tone * 0.36);',
    '    float rot = smoothstep(0.55, 0.9, fbmT(p * 3.0 + 9.0, 3.0, 4));',
    '    alb = mix(alb, vec3(0.10, 0.10, 0.08), rot * 0.7);',
    '    float gap = smoothstep(0.47, 0.5, abs(fract(p.y * 4.0) - 0.5));',
    '    alb *= 1.0 - gap * 0.85;',
    '    rough = 0.68 + grain * 0.2 + rot * 0.15;',
    '    ao = 1.0 - gap * 0.7 - rot * 0.2;',
    '  } else if (L == 5){ // DIRT',
    '    float c = fbmT(p * 5.0, 5.0, 6);',
    '    vec3 wet = vec3(0.075, 0.062, 0.048);',
    '    vec3 dry = vec3(0.19, 0.155, 0.115);',
    '    alb = mix(wet, dry, smoothstep(0.3, 0.75, c));',
    '    vec2 w = worleyT(p * 22.0, 22.0);',
    '    float peb = smoothstep(0.35, 0.0, w.x);',
    '    alb = mix(alb, vec3(0.24, 0.23, 0.21), peb * 0.7);',
    '    rough = 0.94 - peb * 0.2;',
    '    ao = 1.0 - (1.0 - c) * 0.35;',
    '  } else if (L == 6){ // ROCK',
    '    vec2 w = worleyT(p * 4.0, 4.0);',
    '    float g = 0.20 + w.x * 0.22 + fbmT(p * 9.0, 9.0, 5) * 0.14;',
    '    alb = vec3(g * 1.0, g * 0.99, g * 0.96);',
    '    float moss = smoothstep(0.55, 0.9, fbmT(p * 3.5 + 17.0, 3.5, 4));',
    '    alb = mix(alb, vec3(0.075, 0.115, 0.055), moss * 0.65);',
    '    float seam = smoothstep(0.12, 0.0, w.y);',
    '    alb *= 1.0 - seam * 0.6;',
    '    rough = 0.88 + moss * 0.08;',
    '    ao = 1.0 - seam * 0.6;',
    '  } else if (L == 7){ // FOLIAGE (alpha cut)',
    '    vec3 c = worleyCell(p * 4.0, 4.0);',
    '    float leaf = 1.0 - smoothstep(0.30, 0.42, c.x);',
    '    alpha = leaf;',
    '    float tint = hash12(c.yz);',
    '    vec3 g1 = vec3(0.045, 0.115, 0.038);',
    '    vec3 g2 = vec3(0.10, 0.16, 0.05);',
    '    alb = mix(g1, g2, tint);',
    '    float vein = ridgeT((p + hash22(c.yz)) * 26.0, 26.0, 3);',
    '    alb *= 0.8 + vein * 0.5;',
    '    float dead = smoothstep(0.6, 0.95, fbmT(p * 2.0 + 31.0, 2.0, 3));',
    '    alb = mix(alb, vec3(0.16, 0.11, 0.045), dead);',
    '    rough = 0.72;',
    '    ao = 0.75 + c.x * 0.25;',
    '  } else if (L == 8){ // TILE',
    '    vec2 g = fract(p * 6.0);',
    '    vec2 id = floor(p * 6.0);',
    '    float e = min(min(g.x, 1.0 - g.x), min(g.y, 1.0 - g.y));',
    '    float grout = 1.0 - smoothstep(0.0, 0.055, e);',
    '    float v = hash12(id);',
    '    vec3 tile = mix(vec3(0.30, 0.31, 0.30), vec3(0.44, 0.45, 0.42), v);',
    '    float stain = smoothstep(0.5, 0.9, fbmT(p * 2.0 + 5.0, 2.0, 4));',
    '    tile = mix(tile, vec3(0.10, 0.115, 0.075), stain * 0.6);',
    '    alb = mix(tile, vec3(0.11, 0.105, 0.095), grout);',
    '    vec2 ch = worleyT(p * 14.0 + 3.0, 14.0);',
    '    float chip = smoothstep(0.16, 0.0, ch.x);',
    '    alb = mix(alb, vec3(0.20, 0.19, 0.18), chip);',
    '    rough = mix(0.28 + v * 0.12 + stain * 0.4, 0.92, max(grout, chip));',
    '    ao = 1.0 - grout * 0.55 - chip * 0.3;',
    '  } else if (L == 9){ // FLESH',
    '    float base = fbmT(p * 7.0, 7.0, 4);',
    '    alb = mix(vec3(0.32, 0.10, 0.10), vec3(0.50, 0.22, 0.19), base);',
    '    float vein = smoothstep(0.6, 0.95, ridgeT(p * 5.0 + 2.0, 5.0, 5));',
    '    alb = mix(alb, vec3(0.20, 0.045, 0.06), vein * 0.8);',
    '    vec2 w = worleyT(p * 13.0, 13.0);',
    '    float pus = smoothstep(0.3, 0.0, w.x);',
    '    alb = mix(alb, vec3(0.55, 0.50, 0.22), pus * 0.6);',
    '    rough = 0.34 + base * 0.2 - pus * 0.14;',
    '    ao = 1.0 - vein * 0.25;',
    '  } else if (L == 10){ // FABRIC',
    '    float u = fract(p.x * 60.0), v = fract(p.y * 60.0);',
    '    float weave = (sin(u * TAU) * 0.5 + 0.5) * step(fract(p.y * 30.0), 0.5)',
    '                + (sin(v * TAU) * 0.5 + 0.5) * step(0.5, fract(p.y * 30.0));',
    '    float dye = fbmT(p * 3.0, 3.0, 4);',
    '    alb = mix(vec3(0.085, 0.095, 0.105), vec3(0.16, 0.15, 0.14), dye);',
    '    alb *= 0.7 + weave * 0.45;',
    '    float wear = smoothstep(0.6, 0.95, fbmT(p * 5.0 + 13.0, 5.0, 4));',
    '    alb = mix(alb, vec3(0.055, 0.05, 0.045), wear * 0.6);',
    '    rough = 0.93;',
    '    ao = 0.8 + weave * 0.2;',
    '  } else if (L == 11){ // GLASS',
    '    float smudge = smoothstep(0.35, 0.9, fbmT(p * 6.0 + 7.0, 6.0, 4));',
    '    float dust = fbmT(p * 40.0, 40.0, 3);',
    '    alb = mix(vec3(0.045, 0.055, 0.06), vec3(0.20, 0.21, 0.20), smudge * 0.5 + dust * 0.15);',
    '    rough = 0.045 + smudge * 0.30 + dust * 0.08;',
    '    metal = 0.0;',
    '    ao = 1.0;',
    '  } else if (L == 12){ // GRATE (holes punched with alpha)',
    '    vec2 q = p * 8.0;',
    '    q.x += step(1.0, mod(floor(q.y), 2.0)) * 0.5;',
    '    vec2 f = fract(q) - 0.5;',
    '    float d = length(f);',
    '    alpha = smoothstep(0.30, 0.34, d);',
    '    float edge = 1.0 - smoothstep(0.33, 0.46, d);',
    '    float grime = fbmT(p * 12.0, 12.0, 4);',
    '    alb = mix(vec3(0.20, 0.205, 0.215), vec3(0.11, 0.085, 0.06), grime * 0.7);',
    '    alb *= 1.0 - edge * 0.45;',
    '    metal = 0.9 - grime * 0.4;',
    '    rough = 0.42 + grime * 0.35;',
    '    ao = 1.0 - edge * 0.6;',
    '  } else if (L == 13){ // BLOOD',
    '    float pool = fbmT(p * 4.0, 4.0, 5);',
    '    float wetMask = smoothstep(0.44, 0.62, pool);',
    '    vec3 fresh = vec3(0.26, 0.012, 0.012);',
    '    vec3 dried = vec3(0.085, 0.020, 0.016);',
    '    alb = mix(dried, fresh, wetMask);',
    '    float spat = smoothstep(0.72, 0.95, fbmT(p * 16.0 + 4.0, 16.0, 3));',
    '    alb = mix(alb, fresh * 1.2, spat * 0.6);',
    '    alpha = clamp(smoothstep(0.30, 0.48, pool) + spat, 0.0, 1.0);',
    '    rough = mix(0.80, 0.13, wetMask);',
    '    ao = 1.0 - (1.0 - wetMask) * 0.2;',
    '  } else { // NONE - neutral, lets material albedo speak',
    '    alb = vec3(0.5); rough = 0.8; metal = 0.0; ao = 1.0;',
    '  }',
    '  alb = clamp(alb, vec3(0.0), vec3(1.0));',
    '  rough = clamp(rough, 0.035, 1.0);',
    '  metal = clamp(metal, 0.0, 1.0);',
    '  ao = clamp(ao, 0.0, 1.0);',
    '}',
    '',
    'void main(){',
    '  vec2 p = vUV;',
    '  vec3 alb; float ao, rough, metal, alpha;',
    '  matSample(uLayer, p, alb, ao, rough, metal, alpha);',
    '  float e = 1.0 / float(' + TEXGEN_SIZE + ');',
    '  float hL = heightAt(uLayer, p - vec2(e, 0.0));',
    '  float hR = heightAt(uLayer, p + vec2(e, 0.0));',
    '  float hD = heightAt(uLayer, p - vec2(0.0, e));',
    '  float hU = heightAt(uLayer, p + vec2(0.0, e));',
    '  float hC = heightAt(uLayer, p);',
    '  float strength = (uLayer == 11) ? 0.35 : 3.0;',
    '  vec3 n = normalize(vec3((hL - hR) * strength, (hD - hU) * strength, 2.0 * e * 40.0));',
    '  // sqrt-encode albedo: RGBA8 storage with usable precision in the darks',
    '  oAlbedo = vec4(sqrt(alb), alpha);',
    '  oNormal = vec4(n * 0.5 + 0.5, clamp(hC, 0.0, 1.0));',
    '  oORM = vec4(ao, rough, metal, 1.0);',
    '}',
    ''].join('\n');

  /* ===================== PROCEDURAL SKY / ENVIRONMENT =================== */
  /* Storm-at-night analytic sky. Rendered once into a cubemap; higher mips
     are cone-integrated so they double as roughness-prefiltered radiance and
     (last mip) as a crude irradiance probe. */
  var FS_ENV = VER + CH_PRECISION + CH_NOISE + [
    'in vec2 vUV;',
    'out vec4 oCol;',
    'uniform int uFace;',
    'uniform float uRough;',
    'uniform vec3 uSun;        // direction TO the sun/moon',
    'uniform vec3 uSunColor;',
    'uniform float uTime;',
    'uniform float uLightning;',
    'uniform sampler2D uNoiseTex;',
    '',
    'vec3 faceDir(int f, vec2 uv){',
    '  vec2 c = uv * 2.0 - 1.0;',
    '  if (f == 0) return normalize(vec3( 1.0, -c.y, -c.x));',
    '  if (f == 1) return normalize(vec3(-1.0, -c.y,  c.x));',
    '  if (f == 2) return normalize(vec3( c.x,  1.0,  c.y));',
    '  if (f == 3) return normalize(vec3( c.x, -1.0, -c.y));',
    '  if (f == 4) return normalize(vec3( c.x, -c.y,  1.0));',
    '  return normalize(vec3(-c.x, -c.y, -1.0));',
    '}',
    '',
    '// Overcast storm: near-black blue zenith, slightly warmer sodium haze at',
    '// the horizon, heavy fbm cloud deck, dim moon disc bleeding through.',
    'vec3 skyColor(vec3 d){',
    '  float up = clamp(d.y, -1.0, 1.0);',
    '  vec3 zenith  = vec3(0.006, 0.011, 0.024);',
    '  vec3 horizon = vec3(0.030, 0.040, 0.062);',
    '  vec3 ground  = vec3(0.008, 0.008, 0.009);',
    '  float t = clamp(up * 0.5 + 0.5, 0.0, 1.0);',
    '  vec3 col = mix(horizon, zenith, pow(clamp(up, 0.0, 1.0), 0.55));',
    '  col = mix(ground, col, smoothstep(-0.12, 0.06, up));',
    '  // sodium-vapour glow bleeding up from the facility, hugging the horizon',
    '  float hz = pow(1.0 - clamp(abs(up), 0.0, 1.0), 7.0);',
    '  col += vec3(0.055, 0.036, 0.016) * hz;',
    '  // two scrolling cloud decks projected on the sky dome',
    '  if (up > -0.05) {',
    '    vec2 cp = d.xz / max(abs(d.y) + 0.16, 0.16);',
    '    float c1 = fbmT(cp * 0.9 + vec2(uTime * 0.006, uTime * 0.0025), 512.0, 6);',
    '    float c2 = fbmT(cp * 2.3 - vec2(uTime * 0.011, 0.0), 512.0, 5);',
    '    float deck = clamp(c1 * 0.75 + c2 * 0.35, 0.0, 1.0);',
    '    float mask = smoothstep(-0.05, 0.30, up);',
    '    float thick = smoothstep(0.35, 0.85, deck) * mask;',
    '    vec3 cloudLit = vec3(0.055, 0.062, 0.080);',
    '    vec3 cloudDark = vec3(0.010, 0.013, 0.020);',
    '    col = mix(col, mix(cloudDark, cloudLit, deck), thick * 0.85);',
    '    // lightning lights the deck from inside',
    '    col += vec3(0.55, 0.62, 0.85) * uLightning * thick * (0.35 + deck * 0.9);',
    '  }',
    '  // moon / dim sun disc + broad glow, heavily attenuated by the deck',
    '  float sd = max(dot(d, uSun), 0.0);',
    '  col += uSunColor * pow(sd, 900.0) * 6.0;',
    '  col += uSunColor * pow(sd, 8.0) * 0.14;',
    '  col += uSunColor * pow(sd, 2.0) * 0.03;',
    '  col += vec3(0.30, 0.36, 0.55) * uLightning * 0.25;',
    '  return max(col, vec3(0.0));',
    '}',
    '',
    'void main(){',
    '  vec3 N = faceDir(uFace, vUV);',
    '  if (uRough < 0.01){',
    '    oCol = vec4(skyColor(N), 1.0);',
    '    return;',
    '  }',
    '  // cone-integrate the analytic sky: cheap, exact-enough prefilter',
    '  vec3 up = abs(N.y) < 0.95 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);',
    '  vec3 T = normalize(cross(up, N));',
    '  vec3 B = cross(N, T);',
    '  float a = uRough * uRough;',
    '  vec3 sum = vec3(0.0);',
    '  float wsum = 0.0;',
    '  const int NS = 24;',
    '  for (int i = 0; i < NS; i++){',
    '    float fi = float(i);',
    '    float u1 = fract(fi * 0.618033988 + 0.5);',
    '    float u2 = (fi + 0.5) / float(NS);',
    '    float phi = u1 * TAU;',
    '    float ct = sqrt((1.0 - u2) / (1.0 + (a * a - 1.0) * u2));',
    '    float st = sqrt(max(1.0 - ct * ct, 0.0));',
    '    vec3 H = normalize(T * (st * cos(phi)) + B * (st * sin(phi)) + N * ct);',
    '    vec3 L = normalize(2.0 * dot(N, H) * H - N);',
    '    float nl = max(dot(N, L), 0.0);',
    '    if (nl > 0.0){ sum += skyColor(L) * nl; wsum += nl; }',
    '  }',
    '  oCol = vec4(sum / max(wsum, 1e-4), 1.0);',
    '}',
    ''].join('\n');

  /* skybox draw: samples the finished cubemap so the sky and the IBL agree */
  var VS_SKY = VER + CH_FRAME + [
    'out vec3 vDir;',
    'void main(){',
    '  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));',
    '  vec2 ndc = p * 2.0 - 1.0;',
    '  vec4 v = uInvProj * vec4(ndc, 1.0, 1.0);',
    '  vDir = mat3(uInvView) * (v.xyz / v.w);',
    '  gl_Position = vec4(ndc, 1.0, 1.0);',
    '}',
    ''].join('\n');

    'in vec3 vDir;',
    'out vec4 oCol;',
    'uniform samplerCube uEnv;',
    'void main(){',
    '  vec3 d = normalize(vDir);',
    '  vec3 c = textureLod(uEnv, d, 0.0).rgb;',

    '  c = mix(c, uFogCol.rgb, h * 0.92);',
    '  c += uFogCol.rgb * uMisc2.x * 1.4;',

    '}',
    ''].join('\n');

  /* =========================== SHADOW / DEPTH ========================== */
  var VS_DEPTH = VER + CH_FRAME + [
    'layout(location = 0) in vec3 aPos;',
    'uniform mat4 uModel;',
    'uniform mat4 uLightVP;   // identity-ish for the camera prepass',
    'uniform float uUseLightVP;',
    'void main(){',
    '  vec4 wp = uModel * vec4(aPos, 1.0);',

    '  gl_Position = vp * wp;',
    '}',
    ''].join('\n');

    'void main(){}',
    ''].join('\n');

  /* ============================ MAIN PBR =============================== */
  var VS_PBR = VER + CH_FRAME + [
    'layout(location = 0) in vec3 aPos;',
    'layout(location = 1) in vec3 aNrm;',
    'layout(location = 2) in vec2 aUV;',
    'layout(location = 3) in vec3 aCol;',
    'uniform mat4 uModel;',
    'uniform mat3 uNrmMat;',
    'out vec3 vWPos;',
    'out vec3 vNrm;',
    'out vec2 vUV;',
    'out vec3 vCol;',
    'out float vViewZ;',
    'void main(){',
    '  vec4 wp = uModel * vec4(aPos, 1.0);',
    '  vWPos = wp.xyz;',
    '  vNrm = normalize(uNrmMat * aNrm);',
    '  vUV = aUV;',
    '  vCol = aCol;',
    '  vec4 vp = uView * wp;',
    '  vViewZ = -vp.z;',
    '  gl_Position = uProj * vp;',
    '}',
    ''].join('\n');

  var FS_PBR = VER + CH_PRECISION_SHADOWSAMP + CH_FRAME + CH_LIGHTS + CH_PBR + CH_FOG + [
    'in vec3 vWPos;',
    'in vec3 vNrm;',
    'in vec2 vUV;',
    'in vec3 vCol;',
    'in float vViewZ;',
    'out vec4 oCol;',
    '',
    'uniform sampler2DArray uTexAlbedo;',
    'uniform sampler2DArray uTexNormal;',
    'uniform sampler2DArray uTexORM;',
    'uniform sampler2DArrayShadow uShadowMap;',
    'uniform samplerCube uEnv;',
    'uniform sampler2D uAOTex;',
    'uniform vec4 uAlbedo;      // rgb base colour, a = alpha',
    'uniform vec4 uMatParams;   // x rough, y metal, z texLayer(-1=none), w texScale',
    'uniform vec4 uEmissive;    // rgb emissive (already pulse-modulated), w unused',
    '',
    '// ---------------- triplanar material sampling ----------------------',
    'void triplanar(vec3 wp, vec3 N, float layer, float scale,',
    '               out vec4 alb, out vec3 nrm, out vec3 orm){',
    '  vec3 bw = abs(N);',
    '  bw = pow(bw, vec3(4.0));',
    '  bw /= max(bw.x + bw.y + bw.z, 1e-4);',
    '  vec2 uvX = wp.zy * scale;',
    '  vec2 uvY = wp.xz * scale;',
    '  vec2 uvZ = wp.xy * scale;',
    '  if (uMisc.x < 0.5) {',
    '    // quality 0: single dominant-axis projection (1 tap per map)',
    '    bool ax = (bw.x > bw.y && bw.x > bw.z);',
    '    bool ay = (!ax && bw.y > bw.z);',
    '    vec2 uv = ax ? uvX : (ay ? uvY : uvZ);',
    '    alb = texture(uTexAlbedo, vec3(uv, layer));',
    '    orm = texture(uTexORM, vec3(uv, layer)).xyz;',
    '    vec3 tn = texture(uTexNormal, vec3(uv, layer)).xyz * 2.0 - 1.0;',
    '    vec3 sn0 = sign(N);',
    '    vec3 wn = ax ? vec3(0.0, tn.y, tn.x) * sn0.x',
    '                 : (ay ? vec3(tn.x, 0.0, tn.y) * sn0.y : vec3(tn.x, tn.y, 0.0) * sn0.z);',
    '    nrm = normalize(N + wn);',
    '    return;',
    '  }',
    '  vec4 aX = texture(uTexAlbedo, vec3(uvX, layer));',
    '  vec4 aY = texture(uTexAlbedo, vec3(uvY, layer));',
    '  vec4 aZ = texture(uTexAlbedo, vec3(uvZ, layer));',
    '  alb = aX * bw.x + aY * bw.y + aZ * bw.z;',
    '  vec3 oX = texture(uTexORM, vec3(uvX, layer)).xyz;',
    '  vec3 oY = texture(uTexORM, vec3(uvY, layer)).xyz;',
    '  vec3 oZ = texture(uTexORM, vec3(uvZ, layer)).xyz;',
    '  orm = oX * bw.x + oY * bw.y + oZ * bw.z;',
    '  // UDN-style triplanar normal blend',
    '  vec3 nX = texture(uTexNormal, vec3(uvX, layer)).xyz * 2.0 - 1.0;',
    '  vec3 nY = texture(uTexNormal, vec3(uvY, layer)).xyz * 2.0 - 1.0;',
    '  vec3 nZ = texture(uTexNormal, vec3(uvZ, layer)).xyz * 2.0 - 1.0;',
    '  vec3 sn = sign(N);',
    '  vec3 wX = vec3(0.0, nX.y, nX.x) * sn.x;',
    '  vec3 wY = vec3(nY.x, 0.0, nY.y) * sn.y;',
    '  vec3 wZ = vec3(nZ.x, nZ.y, 0.0) * sn.z;',

    '',

    'float sampleShadow(vec3 wp, vec3 N, float ndl, float viewZ, out int cascOut){',
    '  if (uSunCol.w < 0.01) { cascOut = 0; return 1.0; }',
    '  int c = 0;',
    '  if (viewZ > uCascadeSplits.x) c = 1;',
    '  if (viewZ > uCascadeSplits.y) c = 2;',
    '  cascOut = c;',
    '  mat4 m = uCascade0;',
    '  if (c == 1) m = uCascade1;',
    '  else if (c == 2) m = uCascade2;',

    '  float slope = clamp(1.0 - ndl, 0.0, 1.0);',

    '  vec4 sc = m * vec4(offP, 1.0);',

    '  pr = pr * 0.5 + 0.5;',
    '  if (pr.z >= 1.0 || pr.x < 0.0 || pr.x > 1.0 || pr.y < 0.0 || pr.y > 1.0) return 1.0;',
    '  float bias = uMisc2.z * cs * (1.0 + slope * 3.0);',
    '  float ref = pr.z - bias;',
    '  float texel = uMisc2.w;',
    '  float s = 0.0;',
    '  int R = int(uMisc.x) >= 2 ? 2 : 1;',
    '  float cnt = 0.0;',
    '  for (int y = -2; y <= 2; y++){',
    '    if (y < -R || y > R) continue;',
    '    for (int x = -2; x <= 2; x++){',
    '      if (x < -R || x > R) continue;',

    '      s += texture(uShadowMap, vec4(pr.xy + o, float(c), ref));',
    '      cnt += 1.0;',

    '  return mix(1.0, s, fade);',
    '}',
    '',
    'void main(){',
    '  vec3 N = normalize(vNrm);',
    '  vec3 V = normalize(uCamPos.xyz - vWPos);',
    '  if (!gl_FrontFacing) N = -N;',
    '',
    '  vec3 baseCol = uAlbedo.rgb * vCol;',
    '  float rough = uMatParams.x;',
    '  float metal = uMatParams.y;',
    '  float ao = 1.0;',
    '  float alpha = uAlbedo.a;',
    '',
    '  if (uMatParams.z >= 0.0){',
    '    vec4 ta; vec3 tn; vec3 to;',
    '    triplanar(vWPos, N, uMatParams.z, uMatParams.w, ta, tn, to);',

    '    ao = to.x;',

    '  }',
    '  if (alpha < 0.35 && uAlbedo.a >= 0.999) discard;   // alpha-cut foliage/grate',
    '',
    '  float NoV = clamp(dot(N, V), 1e-4, 1.0);',
    '  vec3 f0 = mix(vec3(0.04), baseCol, metal);',
    '  vec3 diffCol = baseCol * (1.0 - metal);',
    '  float a = max(rough * rough, 1e-3);',
    '',
    '  vec3 direct = vec3(0.0);',
    '',
    '  // ---- sun ---------------------------------------------------------',
    '  vec3 L = normalize(uSunDir.xyz);',
    '  float NoL = dot(N, L);',
    '  int casc = 0;',
    '  if (NoL > 0.0){',
    '    float sh = sampleShadow(vWPos, N, NoL, vViewZ, casc);',
    '    if (sh > 0.001){',
    '      vec3 H = normalize(L + V);',
    '      float NoH = clamp(dot(N, H), 0.0, 1.0);',
    '      float VoH = clamp(dot(V, H), 0.0, 1.0);',
    '      vec3 F = F_Schlick(f0, VoH);',
    '      float D = D_GGX(NoH, a);',
    '      float Vs = V_SmithGGX(NoV, NoL, a);',

    '    }',
    '  }',
    '',
    '  // ---- punctual lights (CPU distance-culled into the UBO) -----------',
    '  int n = int(uMisc.y + 0.5);',
    '  for (int i = 0; i < 48; i++){',
    '    if (i >= n) break;',
    '    vec3 lp = uLightPos[i].xyz;',
    '    vec3 dv = lp - vWPos;',
    '    float d2 = dot(dv, dv);',
    '    float range = uLightPos[i].w;',
    '    if (d2 > range * range) continue;',
    '    float dist = sqrt(max(d2, 1e-8));',
    '    vec3 Lp = dv / dist;',

    if (code.indexOf('Digit') === 0) { return code.slice(5); }

    /* ambient Elena chatter keyed to her fear tier */
    if (S.elena && !S.elena.dead && !S.combat) {
      var f = S.elena.fear || 0;
      bark(f > 0.72 ? 'panic' : f > 0.38 ? 'tense' : 'calm');
    }

    /* post-processing responds to player state */
    scene.post.hurt = U.damp(scene.post.hurt, U.clamp(1 - hpFrac * 1.35, 0, 1), 4.0, dt);
    scene.post.vignette = 0.6 + 0.28 * (1 - hpFrac);
    scene.post.saturation = 0.80 - 0.22 * (1 - hpFrac);
    scene.post.chroma = 0.34 + 0.5 * scene.post.hurt;
  }

  /* ------------------------------------------------------------------ */
  /*  Event wiring                                                       */
  /* ------------------------------------------------------------------ */
  function wireEvents() {
    U.on('shot', function (ev) {
      var S = Game.S; if (!S) { return; }
      var w = (ev && ev.weapon) || 'pistol';
      shake(w === 'shotgun' ? 0.055 : w === 'magnum' ? 0.07 : w === 'rifle' ? 0.05 : 0.024, 30);
      cam.recoilVelP += (ev && ev.recoil ? ev.recoil : 0.06) * 5.4;
      cam.recoilVelY += ((IP.Rand.f() - 0.5) * (ev && ev.recoil ? ev.recoil : 0.05)) * 3.4;
      if (ev && ev.muzzle) {
        muzzlePos[0] = ev.muzzle[0]; muzzlePos[1] = ev.muzzle[1]; muzzlePos[2] = ev.muzzle[2];
        muzzleLight = 1.0;
        burst('muzzle', ev.muzzle, ev.dir || [0, 0, -1], 6, 1);
        burst('smoke', ev.muzzle, [0, 1, 0], 3, 0.5);
      }
      if (has('Audio', 'play')) { IP.Audio.play(w + '_shot', { pos: ev && ev.muzzle, volume: 1 }); }
    });

    U.on('hit', function (ev) {
      if (!ev || !ev.pos) { return; }
      var organic = ev.material !== 'metal' && ev.material !== 'stone' && ev.material !== 'wood';
      if (organic) {
        burst('blood', ev.pos, ev.dir || [0, 0, 1], ev.location === 'head' ? 16 : 9, 2.6);
        if (has('Audio', 'play')) { IP.Audio.play(ev.location === 'head' ? 'headshot' : 'flesh_impact', { pos: ev.pos }); }
      } else {
        burst('spark', ev.pos, ev.normal || [0, 1, 0], 7, 1.6);
        burst('smoke', ev.pos, [0, 1, 0], 2, 0.3);
        if (has('Audio', 'play')) { IP.Audio.play('ric_' + (ev.material || 'concrete'), { pos: ev.pos }); }
      }
    });

    U.on('kill', function (ev) {
      if (!ev || !ev.pos) { return; }
      if (ev.mutated) {
        burst('blood', ev.pos, [0, 1, 0], 26, 3.4);
        burst('spore', ev.pos, [0, 1, 0], 18, 1);
        if (has('Audio', 'play')) { IP.Audio.play('parasite_burst', { pos: ev.pos }); }
      } else {
        burst('blood', ev.pos, [0, 1, 0], 14, 2.2);
      }
    });

    U.on('explosion', function (ev) {
      if (!ev || !ev.pos) { return; }
      burst('smoke', ev.pos, [0, 1, 0], 26, 2.5);
      burst('debris', ev.pos, [0, 1, 0], 22, 4.5);
      burst('spark', ev.pos, [0, 1, 0], 30, 5);
      var d = V3.dist(ev.pos, cam.pos);
      shake(U.clamp(0.19 - d * 0.011, 0.02, 0.19), 22);
      scene.post.flashbang = Math.max(scene.post.flashbang, U.clamp(1.4 - d * 0.09, 0, 1));
      if (has('Audio', 'play')) { IP.Audio.play('explosion', { pos: ev.pos }); }
    });

    U.on('damage', function (ev) {
      if (!ev || ev.target !== 'player') { return; }
      shake(0.05 + (ev.amount || 0) * 0.0018, 34);
      scene.post.hurt = Math.min(1, scene.post.hurt + 0.45);
      if (has('Audio', 'play')) { IP.Audio.play('player_hurt'); }
      var S = Game.S;
      if (S && S.player.health / (S.player.maxHealth || 1) < 0.3) { playDialogue('low_health'); }
    });

    U.on('reload', function (ev) {
      if (has('Audio', 'play')) { IP.Audio.play('reload_' + ((ev && ev.weapon) || 'pistol')); }
    });
    U.on('pickup', function (ev) {
      if (has('Audio', 'play')) { IP.Audio.play('pickup'); }
      if (has('UI', 'toast') && ev && ev.name) { IP.UI.toast('Acquired  ' + ev.name); }
    });
    U.on('stagger', function (ev) {
      if (has('Audio', 'play')) { IP.Audio.play('stagger', { pos: ev && ev.pos }); }
    });

    U.on('grab_start', function () {
      shake(0.09, 40);
      if (has('Audio', 'play')) { IP.Audio.play('grab'); }
    });
    U.on('elena_grabbed', function () {
      playDialogue('first_grab_elena');
      if (has('Audio', 'play')) { IP.Audio.play('stinger_elena'); }
      if (has('UI', 'toast')) { IP.UI.toast('ELENA IS BEING TAKEN'); }
    });
    U.on('elena_rescued', function () { playDialogue('elena_rescued', false); });
    U.on('elena_death', function () {
      playDialogue('elena_death', false);
      endGame('elena_lost');
    });
    U.on('player_death', function () {
      playDialogue('player_death', false);
      endGame('player_lost');
    });

    U.on('section_change', function (ev) {
      if (!ev || !ev.to) { return; }
      refreshActiveSections(ev.to);
      playDialogue(ev.to + '_enter');
      if (ev.to === 'compound') { playDialogue('act2_start'); }
      if (ev.to === 'cliffs') { playDialogue('act3_start'); }
      if (has('Systems', 'Save') && IP.Systems.Save.checkpoint) {
        attempt('checkpoint', function () { IP.Systems.Save.checkpoint(Game.S); });
      }
    });

    U.on('objective', function (ev) {
      if (has('UI', 'toast') && ev && ev.text) { IP.UI.toast('OBJECTIVE  ' + ev.text); }
      if (has('Audio', 'play')) { IP.Audio.play('objective'); }
    });

    U.on('dialogue', function (ev) {
      if (ev && ev.trigger) { playDialogue(ev.trigger, ev.once !== false); }
      else if (ev && ev.text) { director.queue.push({ speaker: ev.speaker || 'ANVIL', text: ev.text, dur: ev.dur || 3 }); }
    });

    U.on('boss_phase', function (ev) {
      shake(0.14, 16);
      if (has('Audio', 'play')) { IP.Audio.play('stinger_boss'); }
      if (ev && ev.phase === 1) { playDialogue('boss_serrano'); }
    });

    U.on('save', function () { if (has('UI', 'toast')) { IP.UI.toast('Progress saved'); } });

    U.on('ui_command', function (ev) {
      if (!ev) { return; }
      if (ev.cmd === 'resume') { setPaused(false); }
      else if (ev.cmd === 'quality') { setQuality(ev.value); }
      else if (ev.cmd === 'restart') { restart(); }
      else if (ev.cmd === 'save' && has('Systems', 'Save')) {
        attempt('save', function () { IP.Systems.Save.save(Game.S); });
      }
      else if (ev.cmd === 'load') { loadSave(); }
      else if (ev.cmd === 'newgame') { startNewGame(); }
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Boot                                                               */
  /* ------------------------------------------------------------------ */
  var canvas = null, uiRoot = null;

  function boot() {
    canvas = document.getElementById('ip-canvas');
    uiRoot = document.getElementById('ip-ui');
    if (!canvas) {
      if (window.IP_BOOT) { window.IP_BOOT.fail('Missing canvas', 'ip-canvas element not found'); }
      return;
    }

    progress(0.05, 'Starting renderer');
    var ok = attempt('Renderer.init', function () {
      return has('Renderer', 'init') ? IP.Renderer.init(canvas, {}) : false;
    }, false);
    if (!ok) {
      if (window.IP_BOOT) {
        window.IP_BOOT.fail('WebGL 2 unavailable',
          'This game needs WebGL 2.\n\n' +
          'On iOS make sure you are on iOS 15 or newer.\n' +
          'On desktop enable hardware acceleration in your browser settings.\n\n' +
          Game.err.join('\n'));
      }
      return;
    }

    /* pick a starting quality from the device */
    var isTouch = (has('Input', 'init') && IP.Input.isTouch) ||
                  ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var mem = navigator.deviceMemory || 4;
    Game.quality = isTouch ? (mem >= 6 ? 1 : 0) : (mem >= 8 ? 2 : 1);
    setQuality(Game.quality);

    progress(0.12, 'Building interface');
    attempt('UI.init', function () { if (has('UI', 'init')) { IP.UI.init(uiRoot); } });
    attempt('Input.init', function () { if (has('Input', 'init')) { IP.Input.init(canvas, uiRoot); } });
    attempt('Audio.init', function () { if (has('Audio', 'init')) { IP.Audio.init(); } });

    progress(0.2, 'Assembling characters');
    attempt('Actors.build', function () { if (has('Actors', 'build')) { IP.Actors.build(); } });
    rigs.player = acquireRig('player');
    rigs.elena = acquireRig('elena');

    progress(0.3, 'Generating the island');
    Game.level = attempt('Level.build', function () {
      return has('Level', 'build') ? IP.Level.build(20260810) : null;
    }, null);
    if (!Game.level) {
      Game.level = fallbackLevel();
      note('Level', 'using fallback level');
    }

    progress(0.4, 'Uploading terrain');
    attempt('uploadLevel', function () { uploadLevel(Game.level); });

    progress(0.85, 'Priming systems');
    initWeather(1500);
    wireEvents();

    progress(0.95, 'Ready');
    Game.booted = true;

    startNewGame(true);
    if (window.IP_BOOT) { window.IP_BOOT.done(); }
    if (has('UI', 'show')) { IP.UI.show('title'); }

    Game.running = true;
    last = U.now();
    requestAnimationFrame(frame);
  }

  /* A minimal playable room so the game still boots if level generation dies. */
  function fallbackLevel() {
    var floor = { min: [-30, -1, -30], max: [30, 0, 30], tag: 'floor' };
    return {
      sections: [{
        id: 'fallback', name: 'Containment', act: 'prologue',
        bounds: { min: [-30, 0, -30], max: [30, 8, 30] },
        geo: { opaque: [], transparent: [] },
        props: [], spawns: [], triggers: [],
        lights: [{ pos: [0, 5, 0], color: [1, 0.3, 0.22], range: 30, intensity: 4, flicker: 0.3 }]
      }],
      transitions: [],
      collision: { boxes: [floor], ramps: [], water: [], ladders: [], doors: [] },
      navQuery: {
        isWalkable: function (x, z) { return x > -29 && x < 29 && z > -29 && z < 29; },
        sampleHeight: function () { return 0; },
        findPath: function (from, to, out) {
          out = out || []; out.length = 0;
          out.push([to[0], to[1], to[2]]);
          return out;
        }
      }
    };
  }

  function startNewGame(silent) {
    Game.S = attempt('createWorldState', function () {
      return has('Systems', 'createWorldState') ? IP.Systems.createWorldState(20260810) : null;
    }, null);
    if (!Game.S) { Game.S = minimalState(); note('Systems', 'using minimal state'); }
    Game.S.level = Game.level;
    Game.S._rt = Game.S._rt || {};
    Game.S._rt.level = Game.level;
    director.fired = {}; director.queue.length = 0; director.dialogueTimer = 0;
    refreshActiveSections(Game.S.section || Game.level.sections[0].id);
    cam.yaw = Game.S.player.yaw || 0;
    cam.pitch = 0.05;
    V3.copy(cam.pos, Game.S.player.pos);
    if (!silent) {
      if (has('UI', 'show')) { IP.UI.show('hud'); }
      playDialogue('game_start');
    }
  }

  function minimalState() {
    return {
      time: 0, section: (Game.level && Game.level.sections[0].id) || 'fallback',
      act: 'prologue', objective: '', flags: {}, stats: {}, difficulty: 1,
      player: {
        pos: V3.create(0, 0, 0), vel: V3.create(), yaw: 0, aimYaw: 0, aimPitch: 0,
        health: 100, maxHealth: 100, stamina: 1, aiming: false, sprinting: false,
        crouching: false, flashlight: true, speed: 0, anim: 'idle', animT: 0
      },
      elena: {
        pos: V3.create(1.5, 0, 1.5), yaw: 0, health: 100, maxHealth: 100,
        fear: 0.5, speed: 0, anim: 'idle', animT: 0, dead: false, grabbed: false
      },
      enemies: [], projectiles: [], pickups: [], props: [], effects: []
    };
  }

  function loadSave() {
    var data = attempt('Save.load', function () {
      return has('Systems', 'Save') && IP.Systems.Save.load ? IP.Systems.Save.load() : null;
    }, null);
    if (!data) { if (has('UI', 'toast')) { IP.UI.toast('No save found'); } return; }
    Game.S = data;
    Game.S.level = Game.level;
    Game.S._rt = Game.S._rt || {};
    refreshActiveSections(Game.S.section);
    if (has('UI', 'show')) { IP.UI.show('hud'); }
  }

  function restart() { startNewGame(false); setPaused(false); }

  function endGame(reason) {
    Game.paused = true;
    var ending = attempt('evaluateEnding', function () {
      return has('Systems', 'evaluateEnding') ? IP.Systems.evaluateEnding(Game.S, reason) : null;
    }, null);
    if (has('UI', 'show')) { IP.UI.show(reason === 'extraction' ? 'results' : 'gameover', { reason: reason, ending: ending }); }
    if (has('Audio', 'music')) { IP.Audio.music(reason === 'extraction' ? 'safe' : 'gameover'); }
  }

  function setPaused(p) {
    Game.paused = !!p;
    if (has('UI', 'show')) { IP.UI.show(Game.paused ? 'pause' : 'hud'); }
    if (has('Audio', 'setPaused')) { IP.Audio.setPaused(Game.paused); }
  }

  function setQuality(q) {
    Game.quality = U.clamp(q | 0, 0, 2);
    scene.quality = Game.quality;
    if (has('Renderer', 'setQuality')) { attempt('setQuality', function () { IP.Renderer.setQuality(Game.quality); }); }
  }

  /* ------------------------------------------------------------------ */
  /*  Frame loop                                                         */
  /* ------------------------------------------------------------------ */
  var last = 0, acc = 0, FIXED = 1 / 60, MAXSTEP = 5;
  var fpsAvg = 60, autoScaleTimer = 0;
  var noInput = {
    moveX: 0, moveY: 0, lookX: 0, lookY: 0, aim: false, fire: false, firePressed: false,
    reload: false, sprint: false, crouch: false, interact: false, interactPressed: false,
    melee: false, meleePressed: false, swapPressed: false, inventoryPressed: false,
    flashlight: false, cmdFollow: false, cmdStay: false, cmdHide: false,
    cmdInteract: false, cmdCome: false, pausePressed: false, qteTapped: false, dt: 0
  };

  function frame(now) {
    if (!Game.running) { return; }
    requestAnimationFrame(frame);

    var dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) { dt = FIXED; }
    if (dt > 0.25) { dt = 0.25; }
    fpsAvg = fpsAvg * 0.94 + (1 / Math.max(dt, 1e-4)) * 0.06;

    var S = Game.S;
    if (!S) { return; }

    var input = attempt('Input.poll', function () {
      return has('Input', 'poll') ? IP.Input.poll(dt) : noInput;
    }, noInput) || noInput;

    if (input.pausePressed) { setPaused(!Game.paused); }

    scene.time += Game.paused ? 0 : dt;

    if (!Game.paused) {
      /* fixed-step simulation, variable-step presentation */
      acc += dt;
      var steps = 0;
      while (acc >= FIXED && steps < MAXSTEP) {
        updateCamera(S, steps === 0 ? input : noInput, FIXED);
        attempt('Systems.update', function () {
          if (has('Systems', 'update')) { IP.Systems.update(S, input, FIXED); }
        });
        acc -= FIXED; steps++;
      }
      if (steps === MAXSTEP) { acc = 0; }
      if (steps === 0) { updateCamera(S, input, dt); }

      updateDirector(S, dt);
      updateParticles(dt);
    } else {
      updateCamera(S, noInput, dt);
    }

    /* ---- assemble the frame ---- */
    reset(scene.items);
    reset(scene.transparent);
    reset(scene.sprites);
    spriteCursor = 0;

    for (var i = 0; i < staticItems.length; i++) { scene.items.push(staticItems[i]); }
    for (var k = 0; k < activeSections.length; k++) {
      var e = gpuSections[activeSections[k]];
      if (!e) { continue; }
      for (var t = 0; t < e.transparent.length; t++) { scene.transparent.push(e.transparent[t]); }
    }

    groundY = S.player.pos[1];

    /* the player body is hidden when the camera is inside it */
    if (rigs.player && cam.dist > 0.75) {
      drawActor(rigs.player, S.player.pos, S.player.aimYaw !== undefined ? S.player.aimYaw : S.player.yaw,
                S.player, dt);
    }
    if (rigs.elena && S.elena) {
      drawActor(rigs.elena, S.elena.pos, S.elena.yaw || 0, S.elena, dt);
    }
    syncEnemyRigs(S, dt);

    updateWeather(Game.paused ? 0 : dt, S);
    assembleLights(S, dt);

    scene.post.flashbang = Math.max(0, scene.post.flashbang - dt * 1.6);
    scene.sun.intensity = 0.85 * (1 - weather.indoor * 0.6);
    scene.fog.density = 0.026 + weather.indoor * 0.02 + (1 - weather.indoor) * weather.rainIntensity * 0.014;

    if (!Game.dbg.noRender) {
      attempt('renderFrame', function () {
        if (has('Renderer', 'renderFrame')) { IP.Renderer.renderFrame(scene, dt); }
      });
    }

    attempt('UI.update', function () { if (has('UI', 'update')) { IP.UI.update(S, dt); } });
    if (has('Audio', 'setListener')) {
      attempt('setListener', function () { IP.Audio.setListener(cam.pos, cam.quat); });
    }

    /* auto quality scaling: drop a tier if we stay under budget for 4s */
    autoScaleTimer += dt;
    if (autoScaleTimer > 4) {
      autoScaleTimer = 0;
      var budget = (IP.Input && IP.Input.isTouch) ? 27 : 48;
      if (fpsAvg < budget && Game.quality > 0 &&
          !(IP.UI && IP.UI.settings && IP.UI.settings.lockQuality)) {
        setQuality(Game.quality - 1);
        if (has('UI', 'toast')) { IP.UI.toast('Graphics lowered for performance'); }
      }
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Resize                                                             */
  /* ------------------------------------------------------------------ */
  function onResize() {
    if (!canvas) { return; }
    var dpr = Math.min(window.devicePixelRatio || 1, Game.quality === 0 ? 1.25 : 2);
    var w = Math.max(1, canvas.clientWidth || window.innerWidth);
    var h = Math.max(1, canvas.clientHeight || window.innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    if (has('Renderer', 'resize')) { attempt('resize', function () { IP.Renderer.resize(w, h, dpr); }); }
    if (has('UI', 'resize')) { attempt('ui-resize', function () { IP.UI.resize(w, h); }); }
    var rot = document.getElementById('ip-rotate');
    if (rot) { rot.classList.add('armed'); }
  }

  /* ------------------------------------------------------------------ */
  Game.boot = boot;
  Game.setQuality = setQuality;
  Game.setPaused = setPaused;
  Game.restart = restart;
  Game.shake = shake;
  Game.burst = burst;
  Game.cam = cam;
  Game.scene = scene;
  Game.say = say;
  Game.playDialogue = playDialogue;
  IP.Game = Game;

  if (typeof window !== 'undefined') {
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', function () { setTimeout(onResize, 260); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && Game.running && !Game.paused) { setPaused(true); }
    });
    var go = function () {
      onResize();
      try { boot(); } catch (e) {
        note('boot', e);
        if (window.IP_BOOT) { window.IP_BOOT.fail('Startup failed', (e && e.stack) || String(e)); }
      }
    };
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(go, 0);
    } else {
      document.addEventListener('DOMContentLoaded', go);
    }
  }
})();

</script>

</body>
</html>
