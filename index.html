<style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { VignetteShader } from 'three/addons/shaders/VignetteShader.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

window.addEventListener('error', e=>{ const d=document.getElementById('err'); d.style.display='block'; d.textContent='Error: '+e.message; });

/* ================= RENDERER / SCENE ================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture;

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .12, 500);
camera.position.set(9,4.5,34);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.maxPolarAngle = Math.PI*.495; controls.minDistance = .6; controls.maxDistance = 90;
controls.target.set(0,1.2,0);

/* ---- cinematic post pipeline: GTAO ambient occlusion + bloom + vignette ---- */
const rtA = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {type:THREE.HalfFloatType, samples:4});
const composer = new EffectComposer(renderer, rtA);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.output = GTAOPass.OUTPUT.Default;
gtao.updateGtaoMaterial({radius:.4, distanceExponent:1.2, thickness:1, scale:1.1, samples:12, distanceFallOff:1});
gtao.updatePdMaterial({lumaPhi:10, depthPhi:2.5, normalPhi:5, radius:4, rings:2, samples:12});
gtao.blendIntensity = .95;
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .17, .5, .9);
composer.addPass(bloom);
const vig = new ShaderPass(VignetteShader);
vig.uniforms.offset.value = 1.05; vig.uniforms.darkness.value = 1.12;
composer.addPass(vig);
composer.addPass(new OutputPass());
let ultra = true; // Ultra quality (GTAO+bloom) — toggleable for slower phones

/* ================= PROCEDURAL TEXTURES ================= */
function cnv(s){const c=document.createElement('canvas');c.width=c.height=s;return c;}
let seed = 7;
function rnd(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }
function wrap9(s, draw){ // draw at 9 offsets so the canvas tiles seamlessly
  for(const dx of [-s,0,s]) for(const dy of [-s,0,s]) draw(dx,dy);
}
function valueNoise(c, scale, alpha){ // soft blotches
  const x=c.getContext('2d'), s=c.width;
  for(let i=0;i<scale;i++){
    const r=8+rnd()*s/5, px=rnd()*s, py=rnd()*s, rr=r*(0.4+rnd()*0.9), ro=rnd()*6.28;
    x.fillStyle=`rgba(${140+rnd()*90|0},${125+rnd()*80|0},${105+rnd()*65|0},${alpha})`;
    wrap9(s,(dx,dy)=>{ x.beginPath();x.ellipse(px+dx,py+dy,r,rr,ro,0,6.29);x.fill(); });
  }
}
function texTravertine(base='#ddd2bf', strata=true){
  const c=cnv(512), x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,512,512);
  valueNoise(c, 240, .045);
  if(strata){ // horizontal sedimentary banding
    for(let y=0;y<512;y+=3+rnd()*9){
      x.fillStyle=`rgba(${150+rnd()*60|0},${132+rnd()*52|0},${104+rnd()*44|0},${.05+rnd()*.09})`;
      x.fillRect(0,y,512,1+rnd()*3.2);
    }
  }
  for(let i=0;i<900;i++){ // pores
    const px=rnd()*512, py=rnd()*512, r1=.4+rnd()*2.4, r2=.3+rnd()*1.1, ro=rnd()*6.28;
    x.fillStyle=`rgba(120,102,80,${.06+rnd()*.16})`;
    wrap9(512,(dx,dy)=>{ x.beginPath();x.ellipse(px+dx,py+dy,r1,r2,ro,0,6.29);x.fill(); });
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function texPlaster(base='#e8dfcd'){
  const c=cnv(512), x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ x.fillStyle=`rgba(${170+rnd()*50|0},${158+rnd()*45|0},${135+rnd()*40|0},${.03+rnd()*.05})`;
    x.beginPath();x.arc(rnd()*512,rnd()*512,.5+rnd()*8,0,6.29);x.fill(); }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
function texWood(base='#c8a476', dark='#9a744a'){
  const c=cnv(512), x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,512,512);
  for(let i=0;i<110;i++){
    x.strokeStyle=`rgba(${parseInt(dark.slice(1,3),16)},${parseInt(dark.slice(3,5),16)},${parseInt(dark.slice(5,7),16)},${.07+rnd()*.16})`;
    x.lineWidth=.6+rnd()*2.4; x.beginPath();
    const y0=rnd()*512; x.moveTo(0,y0);
    for(let px=0;px<=512;px+=32){ x.lineTo(px, y0+Math.sin(px*.02+i)*4+rnd()*3); }
    x.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
function texRug(base='#e7dcc4'){
  const c=cnv(512), x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,512,512);
  for(let i=0;i<26000;i++){ // dense boucle knots
    const px=rnd()*512, py=rnd()*512, r=.8+rnd()*1.9;
    x.fillStyle=`rgba(${185+rnd()*55|0},${172+rnd()*48|0},${142+rnd()*42|0},${.5+rnd()*.5})`;
    const near=(px<8||px>504||py<8||py>504);
    if(near) wrap9(512,(dx,dy)=>{x.beginPath();x.arc(px+dx,py+dy,r,0,6.29);x.fill();});
    else { x.beginPath();x.arc(px,py,r,0,6.29);x.fill(); }
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.repeat.set(3,3);return t;
}
function texJute(){
  const c=cnv(512), x=c.getContext('2d');
  x.fillStyle='#c8ab7d';x.fillRect(0,0,512,512);
  for(let y=0;y<512;y+=6){ for(let px=0;px<512;px+=6){
    x.fillStyle=`rgba(${150+rnd()*70|0},${120+rnd()*60|0},${75+rnd()*45|0},.55)`;
    x.beginPath();x.ellipse(px+3,y+3,3.1,1.7,((px/6+y/6)%2)*1.57,0,6.29);x.fill(); }}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.repeat.set(5,5);return t;
}
function texGrass(){
  const c=cnv(512), x=c.getContext('2d');
  x.fillStyle='#5e7a3c';x.fillRect(0,0,512,512);
  for(let i=0;i<9000;i++){ x.fillStyle=`rgba(${55+rnd()*70|0},${95+rnd()*70|0},${35+rnd()*45|0},.5)`;
    x.fillRect(rnd()*512,rnd()*512,1.5,2.5+rnd()*3); }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.repeat.set(30,30);return t;
}
function texWaterfall(){
  const c=cnv(128), x=c.getContext('2d');
  x.clearRect(0,0,128,128);
  for(let i=0;i<90;i++){ x.fillStyle=`rgba(255,255,255,${.12+rnd()*.4})`;
    const w=1+rnd()*3; x.fillRect(rnd()*128, rnd()*128, w, 12+rnd()*60); }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function texCaustic(){
  const c=cnv(256), x=c.getContext('2d');
  x.clearRect(0,0,256,256);
  x.strokeStyle='rgba(255,250,235,.5)';
  for(let i=0;i<46;i++){ x.lineWidth=.8+rnd()*1.6; x.beginPath();
    x.ellipse(rnd()*256,rnd()*256,8+rnd()*26,6+rnd()*20,rnd()*6.28,0,6.29);x.stroke(); }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function normalFromCanvas(src, strength=2){ // Sobel height→normal (luminance as height)
  const s=src.width, sc=src.getContext('2d'), img=sc.getImageData(0,0,s,s).data;
  const h=new Float32Array(s*s);
  for(let i=0;i<s*s;i++) h[i]=(img[i*4]*.299+img[i*4+1]*.587+img[i*4+2]*.114)/255;
  const out=cnv(s), oc=out.getContext('2d'), od=oc.createImageData(s,s);
  const at=(x,y)=>h[((y+s)%s)*s+((x+s)%s)];
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    const dx=(at(x+1,y)-at(x-1,y))*strength, dy=(at(x,y+1)-at(x,y-1))*strength;
    const inv=1/Math.sqrt(dx*dx+dy*dy+1), i=(y*s+x)*4;
    od.data[i]=(-dx*inv*.5+.5)*255; od.data[i+1]=(dy*inv*.5+.5)*255;
    od.data[i+2]=inv*255; od.data[i+3]=255;
  }
  oc.putImageData(od,0,0);
  const t=new THREE.CanvasTexture(out); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; return t;
}
function texWaterHeight(){ // seamless sine-field ripples
  const s=256, c=cnv(s), x=c.getContext('2d'), d=x.createImageData(s,s);
  for(let j=0;j<s;j++) for(let i=0;i<s;i++){
    const u=i/s*Math.PI*2, v=j/s*Math.PI*2;
    let n=Math.sin(u*3+v)*.4+Math.sin(u-v*4+1.7)*.3+Math.sin(u*6+v*5+.6)*.2+Math.sin(u*2-v*9)*.1;
    const g=(n*.5+.5)*255, k=(j*s+i)*4;
    d.data[k]=d.data[k+1]=d.data[k+2]=g; d.data[k+3]=255;
  }
  x.putImageData(d,0,0); return c;
}
function texLeafBig(){ // monstera-ish
  const c=cnv(256), x=c.getContext('2d');
  x.clearRect(0,0,256,256);
  x.fillStyle='#3f6626'; x.beginPath(); x.ellipse(128,128,86,120,0,0,6.29); x.fill();
  x.globalCompositeOperation='destination-out';
  for(let s=-1;s<=1;s+=2) for(let i=0;i<5;i++){ // slits
    x.beginPath(); x.ellipse(128+s*62, 42+i*44, 30, 9, s*.5, 0, 6.29); x.fill(); }
  x.globalCompositeOperation='source-over';
  x.strokeStyle='#54803a';x.lineWidth=5;x.beginPath();x.moveTo(128,10);x.lineTo(128,246);x.stroke();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

/* ================= MATERIALS ================= */
const TRAV = texTravertine();
const TRAVL = texTravertine('#e6dccb', true);
const PLST = texPlaster();
const OAKT = texWood();
const WALN = texWood('#7a5433','#4c3018');
const RUGT = texRug();
const JUTE = texJute();
// generated normal maps (Sobel from the color canvases)
const TRAVN = normalFromCanvas(TRAV.image, 2.2);
const TRAVLN= normalFromCanvas(TRAVL.image, 1.1);
const PLSTN = normalFromCanvas(PLST.image, 1.2);
const OAKN  = normalFromCanvas(OAKT.image, 1.4);
const RUGN  = normalFromCanvas(RUGT.image, 3.2);
const JUTEN = normalFromCanvas(JUTE.image, 3.4);
const ROCKN = normalFromCanvas(TRAV.image, 4.5);
const WATN  = normalFromCanvas(texWaterHeight(), 2.6);
RUGN.repeat.set(3,3); JUTEN.repeat.set(5,5);
const GRASST = texGrass();
const GRASSN = normalFromCanvas(GRASST.image, 1.6); GRASSN.repeat.set(30,30);

const M = {
  trav:      new THREE.MeshStandardMaterial({map:TRAV, normalMap:TRAVN, normalScale:new THREE.Vector2(.7,.7), roughness:.78, envMapIntensity:.4}),
  travFloor: new THREE.MeshPhysicalMaterial({map:TRAVL, normalMap:TRAVLN, normalScale:new THREE.Vector2(.35,.35), roughness:.38, metalness:0, envMapIntensity:.85}),
  plaster:   new THREE.MeshStandardMaterial({map:PLST, normalMap:PLSTN, normalScale:new THREE.Vector2(.35,.35), roughness:.95, envMapIntensity:.25}),
  rock:      new THREE.MeshStandardMaterial({map:PLST, normalMap:ROCKN, normalScale:new THREE.Vector2(1.4,1.4), roughness:1, envMapIntensity:.2, color:0xEfe4cd}),
  rockV:     new THREE.MeshStandardMaterial({map:PLST, normalMap:ROCKN, normalScale:new THREE.Vector2(1.7,1.7), roughness:1, envMapIntensity:.18, color:0xF6ecd6, vertexColors:true}),
  oak:       new THREE.MeshStandardMaterial({map:OAKT, normalMap:OAKN, normalScale:new THREE.Vector2(.4,.4), roughness:.62, envMapIntensity:.4}),
  walnut:    new THREE.MeshStandardMaterial({map:WALN, normalMap:OAKN, normalScale:new THREE.Vector2(.5,.5), roughness:.5, envMapIntensity:.45}),
  velvet:    new THREE.MeshPhysicalMaterial({color:0x45291a, roughness:.92, sheen:1, sheenColor:0x8a5a38, sheenRoughness:.55, envMapIntensity:.25, side:THREE.DoubleSide}),
  velvetD:   new THREE.MeshPhysicalMaterial({color:0x33200f, roughness:.94, sheen:1, sheenColor:0x6b4526, sheenRoughness:.6, envMapIntensity:.2}),
  boucle:    new THREE.MeshStandardMaterial({map:RUGT, normalMap:RUGN, normalScale:new THREE.Vector2(.8,.8), color:0xf0e6d3, roughness:1, envMapIntensity:.25}),
  linenBed:  new THREE.MeshStandardMaterial({color:0xf1e9da, roughness:.96, envMapIntensity:.25}),
  linenBedD: new THREE.MeshStandardMaterial({color:0xf1e9da, roughness:.96, envMapIntensity:.25, side:THREE.DoubleSide}),
  curtainSolid:new THREE.MeshStandardMaterial({color:0xf3ecdc, roughness:1, envMapIntensity:.2, side:THREE.DoubleSide}),
  linenBrn:  new THREE.MeshStandardMaterial({color:0x5e3a22, roughness:.96, envMapIntensity:.2}),
  terracotta:new THREE.MeshStandardMaterial({color:0xc07a4e, roughness:.62, envMapIntensity:.4, side:THREE.DoubleSide}),
  bronze:    new THREE.MeshStandardMaterial({color:0x9a7448, metalness:.92, roughness:.32, envMapIntensity:1}),
  ceramic:   new THREE.MeshStandardMaterial({color:0xe9ddc6, roughness:.55, envMapIntensity:.5}),
  ceramicT:  new THREE.MeshStandardMaterial({color:0xb96f45, roughness:.6, envMapIntensity:.4}),
  glass:     new THREE.MeshPhysicalMaterial({color:0xd8e6df, transparent:true, opacity:.13, roughness:.06, metalness:0, envMapIntensity:1.2, side:THREE.DoubleSide, depthWrite:false}),
  curtain:   new THREE.MeshStandardMaterial({color:0xf7f0e1, transparent:true, opacity:.5, roughness:1, side:THREE.DoubleSide, depthWrite:false, envMapIntensity:.15}),
  water:     new THREE.MeshPhysicalMaterial({color:0x71a894, transparent:true, opacity:.88, roughness:.08, metalness:0, normalMap:WATN, normalScale:new THREE.Vector2(.5,.5), envMapIntensity:.9}),
  rugCream:  new THREE.MeshStandardMaterial({map:RUGT, normalMap:RUGN, normalScale:new THREE.Vector2(1.2,1.2), roughness:1, envMapIntensity:.2}),
  rugJute:   new THREE.MeshStandardMaterial({map:JUTE, normalMap:JUTEN, normalScale:new THREE.Vector2(1.2,1.2), roughness:1, envMapIntensity:.2}),
  grass:     new THREE.MeshStandardMaterial({map:GRASST, normalMap:GRASSN, normalScale:new THREE.Vector2(.7,.7), roughness:1, envMapIntensity:.15}),
  leafDark:  new THREE.MeshStandardMaterial({color:0x2f4a20, roughness:.92, normalMap:RUGN, normalScale:new THREE.Vector2(.9,.9), envMapIntensity:.2}),
  leaf:      new THREE.MeshStandardMaterial({color:0x47702e, roughness:.9, normalMap:RUGN, normalScale:new THREE.Vector2(.9,.9), envMapIntensity:.2}),
  leafOlive: new THREE.MeshStandardMaterial({color:0x7d8a5a, roughness:.9, normalMap:RUGN, normalScale:new THREE.Vector2(.7,.7), envMapIntensity:.2}),
  trunk:     new THREE.MeshStandardMaterial({map:texWood('#8a6b48','#5c4228'), roughness:.95}),
  paper:     new THREE.MeshStandardMaterial({color:0xf7ecd6, emissive:0xffdfa3, emissiveIntensity:.35, transparent:true, opacity:.94, side:THREE.DoubleSide, roughness:1}),
  mirror:    new THREE.MeshStandardMaterial({color:0xbfcdd2, metalness:1, roughness:.06, envMapIntensity:2.2}),
  white:     new THREE.MeshStandardMaterial({color:0xf2eee6, roughness:.35, envMapIntensity:.5}),
};
const MONST = new THREE.MeshStandardMaterial({map:texLeafBig(), transparent:true, alphaTest:.4, side:THREE.DoubleSide, roughness:.85});
const FRONDG=(()=>{ // darker central rib gradient, multiplied over per-frond color
  const c=cnv(64), x=c.getContext('2d');
  const gr=x.createLinearGradient(0,0,64,0);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(.48,'#7e8a68'); gr.addColorStop(.52,'#707c5c'); gr.addColorStop(1,'#ffffff');
  x.fillStyle=gr; x.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; })();
const LEAFGEO=new THREE.SphereGeometry(.05,5,4); LEAFGEO.scale(1,.28,2.5);
function leafCloud(parent, cx,cy,cz, rx,ry,rz, count, color){ // instanced foliage
  const im=new THREE.InstancedMesh(LEAFGEO,
    new THREE.MeshStandardMaterial({color, roughness:.92, side:THREE.DoubleSide, envMapIntensity:.2}), count);
  const d=new THREE.Object3D();
  for(let i=0;i<count;i++){

const world = new THREE.Group(); scene.add(world);
function mesh(g, m, x=0,y=0,z=0, cast=true, recv=true){
  const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.castShadow=cast; o.receiveShadow=recv; world.add(o); return o;

function planShape(pts){ // pts: [[x,z],..] -> Shape in (x,-z); use with rotateX(-PI/2)
  return new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],-p[1])));
}
function blobPts(cx,cz,rx,rz,n=44,irr=.12,sd=1){
  const pts=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2;
    const w=1+Math.sin(a*3+sd)*irr*.55+Math.sin(a*5+sd*2.2)*irr*.45;
    pts.push([cx+Math.cos(a)*rx*w, cz+Math.sin(a)*rz*w]); }
  return pts;

function extrudePlan(pts, h, mat, y=0, bevel=0){
  const g=new THREE.ExtrudeGeometry(planShape(pts), bevel>0
    ? {depth:h,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:3,curveSegments:10}
    : {depth:h,bevelEnabled:false,curveSegments:10});
  g.rotateX(-Math.PI/2); g.translate(0,y+ (bevel>0?bevel:0),0);
  const uv=g.attributes.uv; for(let i=0;i<uv.count;i++){ uv.setXY(i, uv.getX(i)*.3, uv.getY(i)*.3); }
  return mesh(g, mat, 0,0,0);
}
function curveFrom(pts, closed=false){
  return new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])), closed, 'catmullrom', .55);
}
function wallBand(pts, th, h, mat, y=0, closed=false){
  const c=curveFrom(pts, closed), N=Math.max(16, pts.length*7);
  const ps=c.getPoints(N), L=[], R=[];
  for(let i=0;i<ps.length;i++){
    const t=c.getTangent(Math.min(i/(ps.length-1),1)); const nx=-t.z, nz=t.x;
    L.push(new THREE.Vector2(ps[i].x+nx*th/2, -(ps[i].z+nz*th/2)));
    R.push(new THREE.Vector2(ps[i].x-nx*th/2, -(ps[i].z-nz*th/2)));
  }
  const sh=new THREE.Shape([...L,...R.reverse()]);
  const g=new THREE.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false,curveSegments:2});
  g.rotateX(-Math.PI/2); g.translate(0,y,0);
  const uv=g.attributes.uv; for(let i=0;i<uv.count;i++){ uv.setXY(i, uv.getX(i)*.14, uv.getY(i)*.14); }
  return mesh(g, mat);
}
function ribbonGeo(pts3, h, y){ // vertical ribbon along path
  const c=new THREE.CatmullRomCurve3(pts3,false,'catmullrom',.55);
  const N=48, P=c.getPoints(N), pos=[], uvA=[], idx=[];
  for(let i=0;i<=N;i++){ pos.push(P[i].x,y,P[i].z, P[i].x,y+h,P[i].z); uvA.push(i/N,0, i/N,1); }
  for(let i=0;i<N;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvA,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const curtains=[];
function glazing(pts, h=3.0, y=.05, withCurtain=true, mullEvery=1.15){
  const pts3=pts.map(p=>new THREE.Vector3(p[0],0,p[1]));
  const g=ribbonGeo(pts3,h,y);
  const gl=new THREE.Mesh(g,M.glass); gl.castShadow=false; gl.receiveShadow=false; world.add(gl);
  // mullions + rails
  const c=new THREE.CatmullRomCurve3(pts3,false,'catmullrom',.55);
  const len=c.getLength(), n=Math.max(2,Math.round(len/mullEvery));
  const mg=new THREE.BoxGeometry(.045,h,.045);
  for(let i=0;i<=n;i++){ const p=c.getPoint(i/n);
    mesh(mg, M.bronze, p.x, y+h/2, p.z); }
  const railG=ribbonGeo(pts3,.06,y+h-.06); const railB=ribbonGeo(pts3,.08,y);
  const r1=new THREE.Mesh(railG,M.bronze), r2=new THREE.Mesh(railB,M.bronze); world.add(r1,r2);
  if(withCurtain){
    // inset wavy sheer
    const inset=pts3.map((p,i)=>{ const t=c.getTangent(Math.min(i/(pts3.length-1),1));
      return new THREE.Vector3(p.x,0,p.z).add(new THREE.Vector3(-t.z,0,t.x).multiplyScalar(-.28)); });
    const cg=ribbonGeo(inset, h-.14, y+.05);
    const cm=new THREE.Mesh(cg, M.curtain); cm.castShadow=false; world.add(cm);
    const base=cg.attributes.position.array.slice();
    curtains.push({geo:cg, base, phase:Math.random()*6.28});
  }
  return gl;
}
function rockWall(w,h,segX=84,segY=56,depth=.5){
  const g=new THREE.PlaneGeometry(w,h,segX,segY);
  const uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*w/1.55, uv.getY(i)*h/1.55);
  const p=g.attributes.position, cols=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i);
    const n=Math.sin(x*1.7+y*2.3)*.34+Math.sin(x*4.2-y*1.2+2)*.24+Math.sin(x*8.5+y*6.5)*.2
           +Math.sin(x*16+y*12)*.13+Math.sin(x*27+y*21)*.07+Math.sin(x*44+y*35)*.035
           +(Math.random()-.5)*.05;
    const edge=Math.min(1,(h/2-Math.abs(y))*.9+.12);
    const d=Math.max(0,(n*.5+.5));
    p.setZ(i, d*depth*edge);
    const shade=.52+.48*Math.min(1,d*1.25);   // crevices fall into shadow
    cols[i*3]=shade; cols[i*3+1]=shade*.985; cols[i*3+2]=shade*.955;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols,3));
  g.computeVertexNormals();
  return g;
}

function drapedCloth(w,d,mat,droop=.28,folds=6,edge=.25){ // flat plateau, falls only past `edge` of half-width
  const g=new THREE.PlaneGeometry(w,d,40,26), p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), ex=Math.abs(x)/(w/2);

}

/* ================= VEGETATION ================= */
function palm(x,z,h=6,lean=.12){
  const g=new THREE.Group(); g.position.set(x,-.9,z); world.add(g);
  let px=0,py=0,pz=0, dx=lean*(Math.random()-.5)*2, dz=lean*(Math.random()-.5)*2;
  const segs=7;
  for(let i=0;i<segs;i++){
    const r0=.16*(1-i/segs*.5), r1=.16*(1-(i+1)/segs*.5);
    const s=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,h/segs,10), M.trunk);
    px+=dx*h/segs; pz+=dz*h/segs;
    s.position.set(px,py+h/segs/2,pz); s.rotation.z=-dx*.9; s.rotation.x=dz*.9;
    s.castShadow=true; g.add(s); py+=h/segs;
  }
  const crown=new THREE.Group(); crown.position.set(px,py,pz); g.add(crown);
  // two rings of fronds: upper younger/upright, lower older/drooping
  const rings=[{n:7,tilt:.42,len:1,y:.22},{n:9,tilt:.72,len:1.15,y:.1}];
  rings.forEach(ring=>{
    for(let i=0;i<ring.n;i++){
      const fl=(2.6+Math.random()*.9)*ring.len, fg=new THREE.PlaneGeometry(.7,fl,4,16);
      const p=fg.attributes.position;
      for(let vi=0;vi<p.count;vi++){
        const v=Math.min(1,Math.max(0,(p.getY(vi)+fl/2)/fl)); // 0 base → 1 tip
        const teeth=.62+.38*Math.pow(Math.abs(Math.sin(v*46)),.6);      // deep leaflet serration
        const taper=Math.pow(1-v,.5)*teeth*(0.25+v*1.1)*(v<.06?v/.06*.3+.1:1);
        const xx=p.getX(vi)*taper;
        p.setX(vi, xx);
        p.setZ(vi, -Math.pow(v,1.65)*(1.5+ring.tilt) + Math.abs(xx)*.55); // droop + V-fold
      }
      fg.computeVertexNormals();
      const shade=new THREE.MeshStandardMaterial({map:FRONDG,
        color:new THREE.Color().setHSL(.235+Math.random()*.05,.42+Math.random()*.2,.3+Math.random()*.14),
        roughness:.85, side:THREE.DoubleSide, envMapIntensity:.2});
      const f=new THREE.Mesh(fg, shade);
      f.position.y=fl/2*.5; f.rotation.x=-Math.PI/2+ring.tilt+Math.random()*.22;
      f.castShadow=true;
      const holder=new THREE.Group(); holder.rotation.y=i/ring.n*6.283+Math.random()*.3+(ring.n%2)*.35;
      holder.position.y=ring.y; holder.add(f); crown.add(holder);
    }
  });
  // coconuts
  for(let i=0;i<3;i++){ const cc=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8), M.trunk);
    cc.position.set((Math.random()-.5)*.4,.05,(Math.random()-.5)*.4); crown.add(cc); }
  return g;
}
function bush(x,z,s=1,mat=M.leaf,gy=-.9){
  for(let i=0;i<4;i++){
    const b=mesh(shrubGeo((.35+Math.random()*.4)*s), Math.random()<.4?M.leafDark:mat,
      x+(Math.random()-.5)*s, gy+(.25+Math.random()*.3)*s, z+(Math.random()-.5)*s);
    b.scale.y=.68; b.rotation.y=Math.random()*6.28;
  }
}
function birdOfParadise(x,z,s=1,gy=-.9){
  const g=new THREE.Group(); g.position.set(x,gy,z); g.scale.setScalar(s); world.add(g);
  for(let i=0;i<5;i++){ const lf=new THREE.Mesh(new THREE.SphereGeometry(.3,10,8), M.leafDark);
    lf.scale.set(.22,1,.55); lf.position.set((Math.random()-.5)*.5,.55,(Math.random()-.5)*.5);
    lf.rotation.z=(Math.random()-.5)*.7; lf.castShadow=true; g.add(lf); }
  for(let i=0;i<2;i++){ const st=new THREE.Mesh(new THREE.CylinderGeometry(.015,.02,1.1,6), M.leaf);
    st.position.set((Math.random()-.5)*.3,.85,(Math.random()-.5)*.3); st.rotation.z=(Math.random()-.5)*.4; g.add(st);
    const fl=new THREE.Mesh(new THREE.ConeGeometry(.09,.42,6), new THREE.MeshStandardMaterial({color:i?0xe8792b:0xd94f35,roughness:.6}));
    fl.position.copy(st.position); fl.position.y+=.6; fl.rotation.z=.9+(Math.random()-.5)*.3; g.add(fl); }
}
function monstera(x,z,s=1,gy=-.9){
  const g=new THREE.Group(); g.position.set(x,gy,z); g.scale.setScalar(s); world.add(g);
  for(let i=0;i<4;i++){ const st=new THREE.Mesh(new THREE.CylinderGeometry(.02,.03,.9,6), M.leaf);
    st.position.y=.45; st.rotation.z=(Math.random()-.5)*.9; st.rotation.x=(Math.random()-.5)*.9; g.add(st);
    const lf=new THREE.Mesh(new THREE.PlaneGeometry(.85,1.05), MONST);

}

[[-22,6],[-24,-2],[-20,-11],[-11,-14],[0,-15],[9,-14],[17,-12],[22,-5],[22,4],[19,11],[18,17.5],[3,19],[-7,21],[-16,16],[-24,12],[26,-9],[-27,5],[8,22]]

// ferns hugging the pool edges (never in the water)

const VIEWS = {

const chipsEl=document.getElementById('chips');

Object.keys(VIEWS).forEach((k,i)=>{
  const d=document.createElement('div'); d.className='chip'+(i===0?' on':''); d.textContent=k;
  d.onclick=()=>{ goView(k); document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); d.classList.add('on'); };

function goView(k, instant=false){
  const v=VIEWS[k];
  labels.visible=!!v.plan;
  if(window.__rays) window.__rays.visible=!v.plan;
  roofG.visible = v.plan ? false : roofOn;
  if(instant){ camera.position.set(...v.p); controls.target.set(...v.t); tween=null; return; }
  tween={t:0, p0:camera.position.clone(), p1:new THREE.Vector3(...v.p),
         t0:controls.target.clone(), t1:new THREE.Vector3(...v.t)};
}

/* sun modes */
const SUNMODES=[
  {name:'☀ Golden hour', pos:[-32,10,25], col:0xffb970, i:3.3, hemi:.48, exp:1.08, fog:0xeccb9d,
    sky:[0x93b7d8,0xecc795,0xf5d09c], lamp:1, garden:0, spr:1},
  {name:'☼ Midday',     pos:[-14,38,14], col:0xfff2dd, i:3.0, hemi:.75, exp:1.05, fog:0xdfe6e8,
    sky:[0x7fb2e0,0xcfe0ea,0xe8e4d6], lamp:.35, garden:0, spr:.35},
  {name:'☾ Dusk',       pos:[-34,6,26],  col:0xff8a4d, i:.7, hemi:.16, exp:1.0, fog:0x4a4258,
    sky:[0x2c3652,0xb26a48,0x6b4a55], lamp:2.4, garden:5, spr:.8},
];

function applySun(){
  const m=SUNMODES[sunMode];
  tSun.textContent=m.name;
  sun.position.set(...m.pos); sun.color.set(m.col); sun.intensity=m.i;
  hemi.intensity=m.hemi; renderer.toneMappingExposure=m.exp;
  scene.fog.color.set(m.fog);
  skyU.top.value.set(m.sky[0]); skyU.mid.value.set(m.sky[1]); skyU.bot.value.set(m.sky[2]);
  lampLights.forEach(o=>o.l.intensity=o.base*m.lamp);
  coveMats.forEach(c=>c.color.setHex(0xffd9a0).multiplyScalar(Math.min(m.lamp,1.6)));
  gardenLights.forEach(g=>g.intensity=m.garden);
  gardenGlowMats.forEach(g=>g.color.setHex(m.garden>0?0xffdf9e:0xcbb489));
  sunSpr.material.opacity=m.spr; placeSunSprite();
}

/* ================= LOOP ================= */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.1), t=clock.getElapsedTime();
  // camera tween (time-based: ~1.8s regardless of frame rate)
  if(tween){ tween.t=Math.min(1,tween.t+dt/1.8);
    const e=tween.t<.5?2*tween.t*tween.t:1-Math.pow(-2*tween.t+2,2)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e);
    controls.target.lerpVectors(tween.t0,tween.t1,e);
    if(tween.t>=1) tween=null;
  } else if(autoOrbit){
    const o=camera.position.clone().sub(controls.target);
    o.applyAxisAngle(new THREE.Vector3(0,1,0), .0018);
    camera.position.copy(controls.target).add(o);
  }
  // water shimmer (scrolling ripple normals)
  M.water.normalMap.offset.set(t*.02, t*.014);
  fallMats.forEach((m,i)=>{ if(m.map) m.map.offset.y=-t*(.55+i*.07)%1; });
  // curtains sway
  curtains.forEach(c=>{
    const p=c.geo.attributes.position;
    for(let i=0;i<p.count;i+=2){
      const u=i/p.count;
      const off=Math.sin(t*.7+c.phase+u*14)*.05+Math.sin(t*.43+c.phase*2+u*23)*.03;
      p.array[i*3]  =c.base[i*3]  +off; p.array[i*3+2]=c.base[i*3+2]+off*.6;
      p.array[i*3+3]=c.base[i*3+3]+off*.4; p.array[i*3+5]=c.base[i*3+5]+off*.25;
    }
    p.needsUpdate=true;
  });
  if(world.userData.dust) world.userData.dust.userData.anim(t);
  controls.update();
  if(ultra) composer.render(); else renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  gtao.setSize(innerWidth,innerHeight);
});
/* GTAO g-buffer fix: transparent/additive surfaces must not occlude (the pass
   renders with an opaque override material, so hide them during its prepass) */
{ const aoExclude=[];
  scene.traverse(o=>{ if(o.material && (o.material.transparent || o.material.blending===THREE.AdditiveBlending)) aoExclude.push(o); });
  aoExclude.push(sky);
  const orig=gtao.render.bind(gtao);
  gtao.render=(...args)=>{ const vis=aoExclude.map(o=>o.visible);
    aoExclude.forEach(o=>o.visible=false);
    orig(...args);
    aoExclude.forEach((o,i)=>o.visible=vis[i]); };
}
goView('Exterior');
animate();
setTimeout(()=>{ const l=document.getElementById('load'); l.style.opacity=0; setTimeout(()=>l.remove(),900); }, 600);
