<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#100c0a" />
<title>Lo-Fi Octopus — Cozy AI Companion</title>
<style>
  /* ============================================================
     LO-FI OCTOPUS COMPANION — single-file app
     All CSS inline. Post-processing (grain / vignette / scanlines /
     chromatic aberration / color grade) done with layered CSS overlays.
     ============================================================ */
  :root{
    --orange:#e0764a;
    --orange-deep:#c05a34;
    --cream:#f3e2c9;
    --ink:#161113;
    --panel:rgba(24,18,20,.72);
    --panel-solid:#1b1417;
    --accent:#6b8cae;
    --accent-warm:#e8a15c;
    --ok:#7fce8f;
    --font: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0809;color:var(--cream);
    font-family:var(--font);font-size:15px;-webkit-font-smoothing:none;}
  canvas{display:block;}
  #app{position:fixed;inset:0;}

  /* ---- 3D layer ---- */
  #scene{position:absolute;inset:0;z-index:1;}

  /* ---- Post FX overlays (pointer-events none) ---- */
  .fx{position:absolute;inset:0;pointer-events:none;z-index:5;}
  #fx-grade{background:
      radial-gradient(120% 90% at 50% 40%, rgba(255,190,120,.06), transparent 60%),
      linear-gradient(180deg, rgba(40,60,90,.10), rgba(60,20,10,.14));
    mix-blend-mode:overlay;}
  #fx-vignette{box-shadow:inset 0 0 220px 60px rgba(0,0,0,.72);
    background:radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55));}
  #fx-scan{background:repeating-linear-gradient(0deg, rgba(0,0,0,.0) 0px, rgba(0,0,0,.0) 2px, rgba(0,0,0,.18) 3px, rgba(0,0,0,.0) 4px);
    opacity:.5;}
  #fx-grain{opacity:.10;mix-blend-mode:overlay;background-repeat:repeat;}
  #fx-rain{opacity:0;transition:opacity 1.2s;background-repeat:repeat;}
  #fx-chroma{box-shadow:inset 3px 0 0 rgba(255,0,60,.06), inset -3px 0 0 rgba(0,180,255,.06);}
  body.hc .fx{display:none;} /* high contrast disables film grade */

  /* ---- Loading ---- */
  #loader{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:#0b0809;gap:18px;transition:opacity .8s;}
  #loader.hide{opacity:0;pointer-events:none;}
  .loadbar{width:220px;height:8px;background:#241a1c;border-radius:4px;overflow:hidden;}
  .loadbar>i{display:block;height:100%;width:20%;background:var(--orange);
    animation:load 1.1s ease-in-out infinite;}
  @keyframes load{0%{margin-left:-25%;width:35%}50%{width:55%}100%{margin-left:105%;width:35%}}
  #loader small{color:#7a6a63;}

  /* ---- Top bar (now playing) ---- */
  #topbar{position:absolute;top:12px;right:14px;z-index:20;display:flex;gap:8px;align-items:center;
    background:var(--panel);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06);
    padding:7px 12px;border-radius:10px;font-size:12.5px;color:#d9c8b3;}
  #topbar .np{max-width:190px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  #topbar .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;}
  #topbar .eq i{width:3px;background:var(--orange);height:4px;border-radius:1px;}
  #topbar.playing .eq i{animation:eq .9s ease-in-out infinite;}
  #topbar .eq i:nth-child(2){animation-delay:.2s}
  #topbar .eq i:nth-child(3){animation-delay:.4s}
  #topbar .eq i:nth-child(4){animation-delay:.1s}
  @keyframes eq{0%,100%{height:4px}50%{height:13px}}

  /* ---- Left tool rail ---- */
  #rail{position:absolute;top:12px;left:14px;z-index:20;display:flex;flex-direction:column;gap:6px;}
  .rgrp{background:var(--panel);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06);
    border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;}
  .rgrp .lbl{font-size:10px;letter-spacing:.12em;color:#8a7a72;text-transform:uppercase;padding:0 2px;}
  .btnrow{display:flex;gap:5px;flex-wrap:wrap;max-width:196px;}
  button.chip{cursor:pointer;font-family:var(--font);font-size:12px;color:#e9d9c6;
    background:#2a1f22;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 9px;
    transition:transform .08s, background .15s;}
  button.chip:hover{background:#3a2b2f;}
  button.chip:active{transform:scale(.94);}
  button.chip.on{background:var(--orange-deep);border-color:var(--orange);color:#fff;}

  /* ---- Chat dock ---- */
  #chatdock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:22;
    width:min(680px,94vw);display:flex;flex-direction:column;gap:8px;}
  #speech{align-self:center;max-width:100%;background:var(--panel);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 15px;font-size:14px;
    color:#f4e6d3;line-height:1.4;opacity:0;transform:translateY(6px);transition:.25s;position:relative;}
  #speech.show{opacity:1;transform:none;}
  #speech::after{content:"";position:absolute;left:calc(50% - 8px);bottom:-8px;width:0;height:0;
    border:8px solid transparent;border-top-color:var(--panel-solid);border-bottom:0;}
  #speech .who{color:var(--orange);font-weight:bold;margin-right:6px;}
  .inrow{display:flex;gap:8px;}
  #chatin{flex:1;font-family:var(--font);font-size:15px;color:#fff;background:var(--panel-solid);
    border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;outline:none;}
  #chatin:focus{border-color:var(--orange);}
  #sendbtn{cursor:pointer;background:var(--orange);border:0;border-radius:12px;color:#1b1013;
    font-family:var(--font);font-weight:bold;padding:0 18px;font-size:14px;}
  #sendbtn:active{transform:scale(.96);}

  /* ---- Subtitle (accessibility) ---- */
  #subtitle{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:21;
    max-width:80vw;text-align:center;font-size:15px;color:#fff;background:rgba(0,0,0,.62);
    padding:6px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;}
  #subtitle.show{opacity:1;}
  body:not(.subs) #subtitle{display:none;}

  /* ---- Rhythm mini-game ---- */
  #game{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(6,4,5,.72);backdrop-filter:blur(3px);}
  #game.show{display:flex;}
  .gamebox{width:min(420px,92vw);background:var(--panel-solid);border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:18px;text-align:center;}
  #gamelanes{position:relative;height:260px;margin:14px 0;border-radius:12px;overflow:hidden;
    background:linear-gradient(180deg,#120c0e,#1d1417);border:1px solid rgba(255,255,255,.06);}
  #hitline{position:absolute;left:0;right:0;bottom:38px;height:3px;background:var(--orange);opacity:.8;}
  .note{position:absolute;width:44px;height:20px;border-radius:6px;background:var(--accent);
    left:50%;transform:translateX(-50%);box-shadow:0 0 10px rgba(107,140,174,.6);}
  #gamehint{font-size:12px;color:#8a7a72;}
  #tapbtn{margin-top:6px;width:100%;padding:14px;border-radius:12px;border:0;cursor:pointer;
    background:var(--orange);color:#1b1013;font-weight:bold;font-family:var(--font);font-size:16px;}
  .gscore{font-size:22px;color:var(--orange);}
  .close-x{position:absolute;top:10px;right:14px;cursor:pointer;color:#8a7a72;font-size:20px;}

  /* ---- Helper hint ---- */
  #hint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:15;
    font-size:12px;color:#7a6a63;text-align:center;opacity:1;transition:opacity 1s;pointer-events:none;}
  #hint.gone{opacity:0;}

  @media (max-width:640px){
    #rail{transform:scale(.9);transform-origin:top left;}
    #topbar .np{max-width:110px;}
    #chatin{font-size:16px;} /* avoid iOS zoom */
  }
  .hidden{display:none!important;}
</style>
</head>
<body class="subs">
<div id="app">
  <div id="scene"></div>

  <!-- Post-processing overlays -->
  <div class="fx" id="fx-grade"></div>
  <div class="fx" id="fx-rain"></div>
  <div class="fx" id="fx-scan"></div>
  <div class="fx" id="fx-grain"></div>
  <div class="fx" id="fx-chroma"></div>
  <div class="fx" id="fx-vignette"></div>

  <!-- Now playing -->
  <div id="topbar">
    <span class="eq"><i></i><i></i><i></i><i></i></span>
    <span class="np" id="np">lofi radio — paused</span>
  </div>

  <!-- Tool rail -->
  <div id="rail">
    <div class="rgrp">
      <span class="lbl">Music</span>
      <div class="btnrow">
        <button class="chip" id="musicBtn">▶ Play lofi</button>
      </div>
    </div>
    <div class="rgrp">
      <span class="lbl">Scene / Mood</span>
      <div class="btnrow">
        <button class="chip" data-mode="chill">Chill</button>
        <button class="chip" data-mode="study">Study</button>
        <button class="chip" data-mode="cook">Cook</button>
        <button class="chip" data-mode="sleep">Sleep</button>
      </div>
    </div>
    <div class="rgrp">
      <span class="lbl">Weather</span>
      <div class="btnrow">
        <button class="chip" data-weather="clear">Clear</button>
        <button class="chip" data-weather="rain">Rain</button>
        <button class="chip" data-weather="snow">Snow</button>
        <button class="chip" data-weather="night">Night</button>
        <button class="chip" data-weather="sunset">Sunset</button>
      </div>
    </div>
    <div class="rgrp">
      <span class="lbl">Outfit</span>
      <div class="btnrow" id="outfitRow">
        <button class="chip" data-hat="none">Bare</button>
        <button class="chip" data-hat="headphones">Headphones</button>
        <button class="chip" data-hat="chef">Chef</button>
        <button class="chip" data-hat="beanie">Beanie</button>
        <button class="chip" data-hat="glasses">Glasses</button>
      </div>
    </div>
    <div class="rgrp">
      <span class="lbl">Extras</span>
      <div class="btnrow">
        <button class="chip" id="danceBtn">Dance</button>
        <button class="chip" id="gameBtn">Rhythm game</button>
        <button class="chip" id="subBtn">Subtitles: on</button>
        <button class="chip" id="hcBtn">High contrast</button>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div id="chatdock">
    <div id="speech"><span class="who">Octo</span><span id="speechtext"></span></div>
    <div class="inrow">
      <input id="chatin" type="text" autocomplete="off" placeholder="talk to Octo… try “make it rainy”, “let's cook”, “tell me a joke”" />
      <button id="sendbtn">Send</button>
    </div>
  </div>

  <div id="subtitle"></div>
  <div id="hint">tip: click Octo · drag to look around · scroll to zoom</div>

  <!-- Rhythm mini-game -->
  <div id="game">
    <div class="gamebox" style="position:relative;">
      <span class="close-x" id="gameClose">✕</span>
      <h3 style="margin:0 0 2px;color:var(--orange);">Octo Beat</h3>
      <div id="gamehint">tap the button when a note crosses the orange line</div>
      <div id="gamelanes"><div id="hitline"></div></div>
      <div>score <span class="gscore" id="gscore">0</span> · combo <span id="gcombo">0</span></div>
      <button id="tapbtn">TAP</button>
    </div>
  </div>

  <!-- YouTube host (created on demand) -->
  <div id="ythost" style="position:absolute;width:1px;height:1px;overflow:hidden;left:-100px;top:-100px;"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   0. GLOBAL STATE + HELPERS
   ===================================================================== */
const PAL = {
  orange:      0xe0764a,
  orangeDark:  0xb85a30,
  orangeLight: 0xef8f63,
  black:       0x1a1013,
  white:       0xf3e2c9,
  wood:        0x6b4a34,
  woodDark:    0x4a3222,
  wall:        0x2b2226,
  wallWarm:    0x3a2c2a,
  floor:       0x3f2f2a,
  metal:       0x8a8f96,
  leaf:        0x4f8a5a,
  leafDark:    0x3c6b46,
  book:        [0x9e5b4b,0x4f6d8a,0x6f8a5a,0xcaa15c,0x8a5a7a,0x5a5a6a],
  fire:        0xff7a2a,
  blue:        0x3f6da8,
  cream:       0xf3e2c9,
};

const clock = new THREE.Clock();
const state = {
  mode: 'chill',        // chill | study | cook | sleep
  weather: 'clear',     // clear | rain | snow | night | sunset
  hat: 'none',
  music: false,
  danceUntil: 0,
  gestureUntil: 0,
  gesture: null,        // 'wave' | 'jump' | 'nod' | 'cook' | 'type' | 'read'
  blinkAt: 0,
  expression: 'neutral',// neutral | happy | surprised | sleepy | laugh
  walkTargetX: 0,
  subtitles: true,
  highContrast: false,
};

/* small utility */
const rand = (a,b)=>a+Math.random()*(b-a);
const lerp = (a,b,t)=>a+(b-a)*t;
const now = ()=>performance.now()/1000;

function box(w,h,d,color,opts={}){
  const g = new THREE.BoxGeometry(w,h,d);
  const m = new THREE.MeshStandardMaterial({
    color, flatShading:true,
    roughness: opts.rough ?? 0.85,
    metalness: opts.metal ?? 0.0,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 1,
    transparent: opts.transparent ?? false,
    opacity: opts.opacity ?? 1,
  });
  const mesh = new THREE.Mesh(g,m);
  mesh.castShadow = opts.noShadow?false:true;
  mesh.receiveShadow = true;
  if(opts.pos) mesh.position.set(...opts.pos);
  return mesh;
}

/* =====================================================================
   1. RENDERER / SCENE / CAMERA
   ===================================================================== */
const container = document.getElementById('scene');
let renderer, scene, camera, controls;

try{
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
}catch(e){
  document.getElementById('loader').innerHTML =
    '<div style="color:#e0764a">Your browser could not start WebGL.</div>';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0a0b);
scene.fog = new THREE.FogExp2(0x140d0f, 0.028);

camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 2.4, 8.4);

controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.56;
controls.minPolarAngle = Math.PI * 0.18;
controls.enablePan = false;

/* camera focus tween targets per mode */
const camFocus = {
  chill:  { pos:new THREE.Vector3(0, 2.4, 8.4),    tgt:new THREE.Vector3(0,1.4,0) },
  study:  { pos:new THREE.Vector3(3.6, 2.3, 6.6),  tgt:new THREE.Vector3(3.4,1.5,-2.2) },
  cook:   { pos:new THREE.Vector3(-3.6,2.3, 6.6),  tgt:new THREE.Vector3(-3.4,1.6,-2.2) },
  sleep:  { pos:new THREE.Vector3(0, 2.0, 7.2),    tgt:new THREE.Vector3(0,1.0,0) },
};
let autoFocus = true; // stop auto-focus once the user drags
controls.addEventListener('start', ()=>{ autoFocus = false; });

/* =====================================================================
   2. LIGHTING (layered — warm lamps, cool moonlight, fire)
   ===================================================================== */
const lights = {};
lights.ambient   = new THREE.AmbientLight(0xffe6c8, 0.28);
lights.hemi      = new THREE.HemisphereLight(0x6b7ba0, 0x2a1a16, 0.35);
lights.moon      = new THREE.DirectionalLight(0x9fb6e0, 0.35);
lights.moon.position.set(-6, 9, 6);
lights.moon.castShadow = true;
lights.moon.shadow.mapSize.set(1024,1024);
lights.moon.shadow.camera.near = 1; lights.moon.shadow.camera.far = 30;
lights.moon.shadow.camera.left=-10; lights.moon.shadow.camera.right=10;
lights.moon.shadow.camera.top=10; lights.moon.shadow.camera.bottom=-10;

lights.lamp      = new THREE.PointLight(0xffb464, 1.5, 12, 2); // overhead warm
lights.lamp.position.set(0, 4.6, 1.2);
lights.lamp.castShadow = true;
lights.lamp.shadow.mapSize.set(1024,1024);

lights.desk      = new THREE.SpotLight(0xffcf8a, 0.0, 9, Math.PI/6, 0.5, 1.4);
lights.desk.position.set(3.7, 3.0, -1.2);
lights.deskTarget = new THREE.Object3D(); lights.deskTarget.position.set(3.6,0.9,-2.4);
scene.add(lights.deskTarget); lights.desk.target = lights.deskTarget;

lights.stove     = new THREE.PointLight(0xff8a3a, 0.0, 6, 2);
lights.stove.position.set(-3.6, 1.6, -2.0);

lights.fire      = new THREE.PointLight(0xff6a2a, 1.1, 9, 2);
lights.fire.position.set(-0.2, 1.1, -3.6);
lights.fire.castShadow = true;

Object.values(lights).forEach(l=>{ if(l.isLight||l.isObject3D) scene.add(l); });

/* =====================================================================
   3. ENVIRONMENT — the cozy lo-fi apartment
   ===================================================================== */
const room = new THREE.Group();
scene.add(room);

// floor
const floor = box(20, 0.4, 16, PAL.floor, {pos:[0,-0.2,-2], rough:.95});
room.add(floor);
// subtle rug under mascot
const rug = box(4.6, 0.06, 3.4, 0x7a3f3a, {pos:[0,0.03,1.0], rough:1});
room.add(rug);
const rug2 = box(3.6, 0.08, 2.6, 0x8f4a44, {pos:[0,0.05,1.0], rough:1});
room.add(rug2);

// back wall + side walls
room.add(box(20, 9, 0.4, PAL.wall, {pos:[0,3.5,-6], rough:1}));
room.add(box(0.4, 9, 16, PAL.wallWarm, {pos:[-9.8,3.5,-2], rough:1}));
room.add(box(0.4, 9, 16, PAL.wallWarm, {pos:[9.8,3.5,-2], rough:1}));
room.add(box(20, 0.4, 16, 0x241a1c, {pos:[0,8,-2], rough:1})); // ceiling

/* ---- WINDOW (center back) with animated sky + parallax city ---- */
const windowGroup = new THREE.Group();
windowGroup.position.set(0, 3.4, -5.78);
room.add(windowGroup);
// frame
windowGroup.add(box(4.4, 3.4, 0.2, PAL.woodDark, {pos:[0,0,0]}));
// sky plane (emissive gradient via canvas texture)
function makeSkyTexture(){
  const c=document.createElement('canvas');c.width=256;c.height=256;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#20304f');g.addColorStop(.55,'#3a3350');g.addColorStop(1,'#6b4a52');
  x.fillStyle=g;x.fillRect(0,0,256,256);
  // stars
  x.fillStyle='rgba(255,240,210,.8)';
  for(let i=0;i<40;i++){x.fillRect(Math.random()*256,Math.random()*120,1,1);}
  // city silhouette + neon
  x.fillStyle='#140d16';
  for(let i=0;i<14;i++){const w=18+Math.random()*20,h=40+Math.random()*90,px=i*20-10;x.fillRect(px,256-h,w,h);}
  const neon=['#e0764a','#6b8cae','#e8a15c','#7fce8f'];
  for(let i=0;i<28;i++){x.fillStyle=neon[i%4];x.globalAlpha=.7;x.fillRect(Math.random()*256,150+Math.random()*90,2,2);}
  x.globalAlpha=1;
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;return t;
}
const skyTex = makeSkyTexture();
const skyMat = new THREE.MeshBasicMaterial({map:skyTex});
const skyPlane = new THREE.Mesh(new THREE.PlaneGeometry(4.0,3.0), skyMat);
skyPlane.position.set(0,0,-0.12);
windowGroup.add(skyPlane);
// mullions (cross bars)
windowGroup.add(box(0.14, 3.0, 0.14, PAL.woodDark, {pos:[0,0,0.02]}));
windowGroup.add(box(4.0, 0.14, 0.14, PAL.woodDark, {pos:[0,0,0.02]}));
// windowsill
windowGroup.add(box(4.8,0.2,0.5,PAL.wood,{pos:[0,-1.8,0.3]}));

/* ---- STUDY DESK (right side) ---- */
const study = new THREE.Group();
study.position.set(3.6, 0, -2.4);
room.add(study);
study.add(box(3.0, 0.18, 1.5, PAL.wood, {pos:[0,1.2,0]}));           // desktop
study.add(box(0.18,1.2,1.4, PAL.woodDark,{pos:[-1.3,0.6,0]}));       // legs
study.add(box(0.18,1.2,1.4, PAL.woodDark,{pos:[1.3,0.6,0]}));
study.add(box(1.0,0.9,1.3, PAL.woodDark,{pos:[0.9,0.75,0]}));        // drawer block
study.add(box(0.9,0.05,0.9, PAL.black,{pos:[0.9,0.9,0.05]}));        // drawer handle rows
// monitor
const monitor = new THREE.Group(); monitor.position.set(-0.6,1.9,-0.4);
study.add(monitor);
monitor.add(box(1.5,0.9,0.1, 0x120c0e,{pos:[0,0,0]}));
const screenTex = makeScreenTexture();
const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.34,0.74),

  for(let i=0;i<count;i++){pos[i*3]=rand(-9,9);pos[i*3+1]=rand(0,9);pos[i*3+2]=rand(-6,4);}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color,size,transparent:true,opacity:.7,depthWrite:false});
  const p=new THREE.Points(geo,mat); p.visible=false; scene.add(p); return p;
}

function stepWeather(dt){
  for(const [p,speed,drift] of [[rainP,14,0],[snowP,2.2,1]]){
    if(!p.visible)continue;
    const a=p.geometry.attributes.position.array;
    for(let i=0;i<a.length;i+=3){
      a[i+1]-=speed*dt;
      if(drift)a[i]+=Math.sin(now()*2+i)*dt*0.4;
      if(a[i+1]<0){a[i+1]=9;a[i]=rand(-9,9);a[i+2]=rand(-6,4);}
    }
    p.geometry.attributes.position.needsUpdate=true;
  }
}

   ===================================================================== */
let breathT=0;
function animateMascot(dt,t){
  breathT+=dt;
  const gesture = (now()<state.gestureUntil? state.gesture_temp : state.gesture);
  const dancing = now()<state.danceUntil;

  // walk toward target X (tween)
  mascot.position.x = lerp(mascot.position.x, state.walkTargetX, dt*2.2);
  const moving = Math.abs(mascot.position.x-state.walkTargetX)>0.05;

  // base idle breathing bob
  const breath = Math.sin(breathT*1.8)*0.03;
  bodyGroup.position.y = breath;
  bodyGroup.scale.y = 1 + Math.sin(breathT*1.8)*0.015;
  mascot.rotation.y = lerp(mascot.rotation.y, moving? (state.walkTargetX<mascot.position.x?-0.4:0.4):0, dt*3);

  // legs waddle when moving, gentle when idle
  legs.forEach((lg,i)=>{
    const ph=i*0.8;
    const amp = moving?0.6: (dancing?0.4:0.08);
    lg.rotation.x = Math.sin(breathT*(moving?9:2)+ph)*amp;
  });

  // arms default sway
  const armSway=Math.sin(breathT*1.6)*0.15;
  swingArm(rig.armL, 0.3+armSway, 0);
  swingArm(rig.armR, -0.3-armSway, 0);

  // blink
  if(now()>state.blinkAt){ blink(); state.blinkAt=now()+rand(2.5,5.5); }
  updateBlink(dt);

  // gestures
  const g = dancing? 'dance' : gesture;
  spatula.visible = (g==='cook');
  bookItem.visible = (g==='read');
  switch(g){
    case 'wave':
      swingArm(rig.armR, -1.6, Math.sin(t*10)*0.5-0.6);
      break;
    case 'jump':
      mascot.position.y = Math.abs(Math.sin(t*8))*0.4;
      setExpression('surprised');
      break;
    case 'nod':
      bodyGroup.rotation.x = Math.sin(t*4)*0.12;
      break;
    case 'cook':
      swingArm(rig.armR, -1.0+Math.sin(t*5)*0.4, -0.5);
      bodyGroup.rotation.x = Math.sin(t*5)*0.05;
      break;
    case 'type':
      swingArm(rig.armL, -1.1, Math.sin(t*12)*0.25);
      swingArm(rig.armR, -1.1, Math.sin(t*12+1)*0.25);
      bodyGroup.position.y = breath - 0.05;
      break;
    case 'read':
      swingArm(rig.armR, -1.2, -0.3);
      swingArm(rig.armL, -1.2, 0.3);
      bodyGroup.rotation.x=0.15;
      break;
    case 'sleep':
      bodyGroup.rotation.x=lerp(bodyGroup.rotation.x,0.5,dt*2);
      bodyGroup.position.y=breath-0.3;
      if(Math.random()<0.01) spawnEmote('z');
      break;
    case 'dance':
      mascot.rotation.z=Math.sin(t*6)*0.12;
      mascot.position.y=Math.abs(Math.sin(t*6))*0.15;
      swingArm(rig.armL,-1.2+Math.sin(t*6)*0.6,0);
      swingArm(rig.armR,-1.2-Math.sin(t*6)*0.6,0);
      legs.forEach((lg,i)=>lg.rotation.x=Math.sin(t*6+i)*0.4);
      if(Math.random()<0.06) spawnEmote(Math.random()<0.5?'note':'notte');
      break;
    default:
      bodyGroup.rotation.x=lerp(bodyGroup.rotation.x,0,dt*3);
      mascot.rotation.z=lerp(mascot.rotation.z,0,dt*3);
      if(!moving) mascot.position.y=lerp(mascot.position.y,0,dt*4);
  }

  // music head-nod baseline + notes
  if(state.music){
    bodyGroup.rotation.x += Math.sin(t*3.2)*0.05;
    if(Math.random()<0.02) spawnEmote(Math.random()<0.5?'note':'notte');
  }

  // emotes float
  emotePool.forEach(e=>{
    if(!e.s.visible)return;
    const age=now()-e.born;
    e.s.position.y+=e.vy*dt;
    e.s.position.x+=Math.sin(now()*3+e.born)*dt*0.3;
    e.s.material.opacity=Math.max(0,1-age/e.life);
    if(age>e.life)e.s.visible=false;
  });
}

function swingArm(arm,shoulder,elbow){
  const s=arm.userData.segs;
  s[0].rotation.x = lerp(s[0].rotation.x, shoulder, 0.2);
  s[1].rotation.x = lerp(s[1].rotation.x, elbow, 0.2);
}
function blink(){ blinkPhase=1; }
let blinkPhase=0;
function updateBlink(dt){
  if(blinkPhase>0){
    blinkPhase-=dt*8;
    const p=Math.max(0,Math.sin((1-blinkPhase)*Math.PI));
    [rig.eyeL,rig.eyeR].forEach(g=>{ g.userData.lid.position.y=lerp(0.4,-0.02,p); });
  } else {
    [rig.eyeL,rig.eyeR].forEach(g=>{ g.userData.lid.position.y=lerp(g.userData.lid.position.y,0.4,dt*10); });
  }
}

/* fire + stove flicker + steam + drip */
function animateEnv(dt,t){
  const flick=0.8+Math.sin(t*13)*0.2+Math.random()*0.25;
  lights.fire.intensity = (state.weather==='night'||state.mode==='chill'?1.2:0.9)*flick;
  fireBoxes.forEach((fb,i)=>{ fb.scale.y=0.7+Math.sin(t*10+i)*0.3+Math.random()*0.2; fb.position.y=0.6+fb.scale.y*0.1; });
  if(state.mode==='cook'){
    flameCore.scale.y=0.8+Math.sin(t*14)*0.3;

  }
  // faucet drip
  drip.position.y-=dt*1.5; if(drip.position.y<1.45){drip.position.y=1.7;}
  // desk lamp glow pulse
  dlampGlow.material.emissiveIntensity = state.mode==='study'? 1.4+Math.sin(t*2)*0.2 : 0.3;
}

/* camera auto focus */
function stepCamera(dt){
  if(!autoFocus)return;
  const f=camFocus[state.mode]||camFocus.chill;
  camera.position.lerp(f.pos, dt*1.6);
  controls.target.lerp(f.tgt, dt*1.6);
}

/* =====================================================================
   8. RENDER LOOP
   ===================================================================== */
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  animateMascot(dt,t);
  animateEnv(dt,t);
  stepWeather(dt);
  stepCamera(dt);
  // city parallax on sky (subtle offset with camera)
  skyTex.offset.x = camera.position.x*0.006;
  controls.update();
  renderer.render(scene,camera);
}

function respond(raw){
  const text=raw.toLowerCase().trim();
  let reply='', action=null, expr='happy';

  // remember a name
  const nameM = text.match(/my name is (\w+)|i'?m (\w+)|call me (\w+)/);
  if(nameM){ memory.name=(nameM[1]||nameM[2]||nameM[3]); reply=`nice to meet you, ${memory.name}. i'm Octo. we're friends now, no take-backs.`; expr='laugh'; localStorage.setItem('octo.memory',JSON.stringify(memory)); }
  else if(/\b(rain|rainy|storm)\b/.test(text)){ reply=pick(SPEECH.rain); action=()=>{applyWeather('rain');applyMode('chill');}; remember('rainy vibes'); }
  else if(/\b(snow|snowy|winter)\b/.test(text)){ reply="snow mode. everything's quiet and soft now. ❄️"; action=()=>applyWeather('snow'); remember('snow'); }
  else if(/\b(night|dark|late)\b/.test(text)){ reply="lights low, city glowing. late-night lofi hits different 🌃"; action=()=>applyWeather('night'); remember('late nights'); }
  else if(/\b(sunset|evening|golden)\b/.test(text)){ reply="sunset filter, engaged. everything's peachy. 🌇"; action=()=>applyWeather('sunset'); }
  else if(/\b(clear|sunny|stop the rain)\b/.test(text)){ reply="clearing the skies. fresh vibes."; action=()=>applyWeather('clear'); }
  else if(/\b(cook|kitchen|food|hungry|snack|eat)\b/.test(text)){ reply=pick(SPEECH.cook); action=()=>applyMode('cook'); expr='surprised'; remember('cooking'); }
  else if(/\b(study|work|focus|homework|code|coding)\b/.test(text)){ reply=pick(SPEECH.study); action=()=>applyMode('study'); remember('studying'); }
  else if(/\b(sleep|nap|tired|goodnight|bed)\b/.test(text)){ reply=pick(SPEECH.sleep); action=()=>applyMode('sleep'); expr='sleepy'; remember('rest'); }
  else if(/\b(chill|relax|cozy|fireplace|fire)\b/.test(text)){ reply="chill mode. fire's crackling, blanket's metaphorical but warm."; action=()=>applyMode('chill'); remember('chilling'); }
  else if(/\b(dance|dancing|move|groove)\b/.test(text)){ reply=pick(SPEECH.dance); action=()=>triggerDance(); expr='laugh'; }
  else if(/\b(music|play|beats|song|lofi)\b/.test(text)){ reply=pick(SPEECH.music); action=()=>startMusic(true); remember('music'); }
  else if(/\b(joke|funny|laugh)\b/.test(text)){ reply=pick(SPEECH.joke); expr='laugh'; }
  else if(/\b(headphone|chef|beanie|glasses|hat|outfit|wear)\b/.test(text)){
    const h = /headphone/.test(text)?'headphones':/chef/.test(text)?'chef':/beanie/.test(text)?'beanie':/glass/.test(text)?'glasses':'headphones';
    reply=`new drip acquired: ${h}. how do i look? (don't answer that)`; action=()=>setHat(h); }
  else if(/\b(hi|hello|hey|yo|sup)\b/.test(text)){ reply=pick(SPEECH.greet); action=()=>gestureOnce('wave'); }
  else if(/\b(thank|love|awesome|great|nice|cute|good)\b/.test(text)){ reply=pick(SPEECH.compliment); expr='laugh'; }
  else if(/\b(bored|boring|nothing)\b/.test(text)){ reply=pick(SPEECH.bored); }
  else if(/\b(who are you|what are you|your name)\b/.test(text)){ reply="i'm Octo — 8 legs, questionable advice, unlimited lofi. resident of this cozy pixel apartment."; }
  else if(/\b(remember|last time|before)\b/.test(text)){
    reply = memory.topics.length? `course i remember — we were into ${memory.topics.slice(0,3).join(', ')}. good times.` : "we're just getting started, no memories yet. let's make some.";
  }
  else { reply=pick(SPEECH.fallback); remember(text.split(' ').slice(0,3).join(' ')); }

  // occasionally reference memory + name for personality
  if(memory.name && Math.random()<0.3 && !nameM){ reply += ` — right, ${memory.name}?`; }

  setExpression(expr);

  gestureOnce(action?null:'nod');
}

  try{

    const u=new SpeechSynthesisUtterance(msg.replace(/[^\w\s.,!?'-]/g,''));
    u.pitch=1.35; u.rate=1.06; u.volume=0.9;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/female|zira|samantha|google us/i.test(v.name))||vs[0];
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}

let actx=null;
function fallbackTone(on){
  try{
    if(on){
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(musicFallbackOsc)return;
      const o=actx.createOscillator(),g=actx.createGain(),o2=actx.createOscillator();
      o.type='sine';o.frequency.value=110;o2.type='sine';o2.frequency.value=164.81;
      g.gain.value=0.04;o.connect(g);o2.connect(g);g.connect(actx.destination);
      o.start();o2.start();musicFallbackOsc={o,o2,g};
    } else if(musicFallbackOsc){ musicFallbackOsc.o.stop();musicFallbackOsc.o2.stop();musicFallbackOsc=null; }
  }catch(e){}
}

  if(!gameOn)return;

    const el=document.createElement('div');el.className='note';el.style.top='-24px';lanes.appendChild(el);
    gnotes.push({el,y:-24,hit:false}); }

    if(n.y>H+10){ if(!n.hit){gcombo=0;document.getElementById('gcombo').textContent='0';} n.el.remove(); n.dead=true; }});
  gnotes=gnotes.filter(n=>!n.dead);
}
function tapBeat(){
  if(!gameOn)return;
  const H=lanes.clientHeight, hit=H-38;
  let best=null,bd=999;
  gnotes.forEach(n=>{ if(n.hit)return; const d=Math.abs(n.y-hit); if(d<bd){bd=d;best=n;} });
  if(best&&bd<34){ best.hit=true;best.el.style.background='var(--orange)';best.el.style.opacity='.3';
    const pts=bd<14?100:50; gscore+=pts+gcombo*5; gcombo++;
    document.getElementById('gscore').textContent=gscore;
    document.getElementById('gcombo').textContent=gcombo;
    triggerDance(); }
  else { gcombo=0; document.getElementById('gcombo').textContent='0'; }
}

/* =====================================================================
   12. INTERACTION — click mascot, UI wiring, resize, persistence
   ===================================================================== */
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
const clickLines=["boop! …do it again, i dare you.","hey, watch the tentacles.","*giggles in pixel*","that tickles. 8 times.","you clicked me. i shall now dance about it.","10/10 boop. professional technique."];
renderer.domElement.addEventListener('pointerdown',ev=>{
  pointer.x=(ev.clientX/window.innerWidth)*2-1;
  pointer.y=-(ev.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObject(mascot,true);
  if(hits.length){ say(pick(clickLines)); setExpression('laugh'); gestureOnce(Math.random()<0.5?'jump':'wave');
    for(let i=0;i<4;i++)setTimeout(()=>spawnEmote(pick(['note','spark','notte'])),i*90); }
});

// rail buttons
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{applyMode(b.dataset.mode);
  say(pick(SPEECH[b.dataset.mode]||SPEECH.fallback));});
document.querySelectorAll('[data-weather]').forEach(b=>b.onclick=()=>applyWeather(b.dataset.weather));
document.querySelectorAll('[data-hat]').forEach(b=>b.onclick=()=>setHat(b.dataset.hat==='none'?'none':b.dataset.hat));
document.getElementById('musicBtn').onclick=()=>startMusic(!state.music);
document.getElementById('danceBtn').onclick=()=>{triggerDance();say(pick(SPEECH.dance));};
document.getElementById('gameBtn').onclick=openGame;
document.getElementById('gameClose').onclick=closeGame;
document.getElementById('tapbtn').onclick=tapBeat;
window.addEventListener('keydown',e=>{ if(gameOn&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();tapBeat();} });
document.getElementById('subBtn').onclick=function(){ state.subtitles=!state.subtitles;
  document.body.classList.toggle('subs',state.subtitles);
  this.textContent='Subtitles: '+(state.subtitles?'on':'off'); save(); };
document.getElementById('hcBtn').onclick=function(){ state.highContrast=!state.highContrast;
  document.body.classList.toggle('hc',state.highContrast); this.classList.toggle('on',state.highContrast); save(); };

// chat input
const chatin=document.getElementById('chatin');
function send(){ const v=chatin.value.trim(); if(!v)return; chatin.value=''; respond(v);
  document.getElementById('hint').classList.add('gone'); }
document.getElementById('sendbtn').onclick=send;
chatin.addEventListener('keydown',e=>{ if(e.key==='Enter')send(); });

// resize
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

/* persistence */
function save(){
  localStorage.setItem('octo.prefs',JSON.stringify({
    mode:state.mode,weather:state.weather,hat:state.hat,
    subtitles:state.subtitles,highContrast:state.highContrast,music:state.music}));
}
function load(){
  try{
    const p=JSON.parse(localStorage.getItem('octo.prefs')||'{}');
    applyWeather(p.weather||'clear');
    applyMode(p.mode||'chill');
    setHat(p.hat||'none');
    if(p.subtitles===false){state.subtitles=false;document.body.classList.remove('subs');document.getElementById('subBtn').textContent='Subtitles: off';}
    if(p.highContrast){document.body.classList.add('hc');state.highContrast=true;document.getElementById('hcBtn').classList.add('on');}
  }catch(e){ applyWeather('clear'); applyMode('chill'); }
}

/* =====================================================================
   13. GRAIN TEXTURE + BOOT
   ===================================================================== */
(function makeGrain(){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const img=x.createImageData(128,128);
  for(let i=0;i<img.data.length;i+=4){const v=Math.random()*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;}
  x.putImageData(img,0,0);
  document.getElementById('fx-grain').style.backgroundImage=`url(${c.toDataURL()})`;
})();
(function makeRainOverlay(){
  const c=document.createElement('canvas');c.width=200;c.height=200;const x=c.getContext('2d');
  x.strokeStyle='rgba(180,200,230,.35)';x.lineWidth=1;
  for(let i=0;i<40;i++){const px=Math.random()*200,py=Math.random()*200;x.beginPath();x.moveTo(px,py);x.lineTo(px+2,py+14);x.stroke();}
  document.getElementById('fx-rain').style.backgroundImage=`url(${c.toDataURL()})`;
})();
// animate grain flicker
setInterval(()=>{ const g=document.getElementById('fx-grain'); g.style.backgroundPosition=`${Math.random()*128}px ${Math.random()*128}px`; },80);

// warm up TTS voices
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; speechSynthesis.getVoices(); }

// boot
load();
setExpression('happy');
loop();
setTimeout(()=>document.getElementById('loader').classList.add('hide'),600);
setTimeout(()=>{
  say(memory.visits>1? pick(SPEECH.greet)+` (visit #${memory.visits})` : "hi! i'm Octo, your lofi apartment buddy. type something, or click me. try 'make it rainy' 🎧");
  gestureOnce('wave',2);
},1400);
setTimeout(()=>document.getElementById('hint').classList.add('gone'),12000);

// expose a tiny API for tinkering in console
window.OCTO={applyMode,applyWeather,setHat,say,triggerDance,startMusic,state};
</script>
