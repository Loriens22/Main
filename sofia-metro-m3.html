<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sofia Metro M3 — Siemens Inspiro (Siemens–Newag) · 3D Model</title>
<style>
  :root{ --teal:#17b3ac; --panel:rgba(16,20,23,.78); }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#07090b;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:#e8ecee}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #title{position:fixed;top:10px;left:12px;z-index:10;background:var(--panel);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--teal);border-radius:10px;padding:9px 14px;pointer-events:none;max-width:78vw}
  #title h1{font-size:14px;font-weight:600;letter-spacing:.4px}
  #title p{font-size:10.5px;color:#9fb3b6;margin-top:2px;letter-spacing:.3px}
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(5,7,9,.92),rgba(5,7,9,0))}
  .row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid rgba(255,255,255,.14);background:var(--panel);color:#dfe7e8;border-radius:20px;
    padding:8px 13px;font-size:12px;cursor:pointer;user-select:none;white-space:nowrap;backdrop-filter:blur(6px);transition:all .18s}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#04211f;font-weight:600}
  .chip.tog.on{box-shadow:0 0 14px rgba(23,179,172,.5)}
  #hint{position:fixed;right:12px;top:12px;z-index:10;font-size:10.5px;color:#8aa0a3;background:var(--panel);
    border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 10px;pointer-events:none}
  #load{position:fixed;inset:0;z-index:50;background:#07090b;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;transition:opacity .6s}
  #load .sp{width:46px;height:46px;border-radius:50%;border:3px solid rgba(23,179,172,.15);border-top-color:var(--teal);animation:spin 1s linear infinite}
  #load p{font-size:12px;color:#9fb3b6;letter-spacing:1px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #err{position:fixed;inset:auto 12px 90px 12px;z-index:60;background:#3a1518;border:1px solid #a33;border-radius:8px;padding:10px;font-size:11px;display:none;white-space:pre-wrap}
</style>
</head>

</div>
