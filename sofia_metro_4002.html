<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Škoda Sofia Metro EMU 4002 — 3D</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#dfe3e8;font-family:'Segoe UI',system-ui,Arial,sans-serif;}
  #c{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab;}
  #c:active{cursor:grabbing;}
  #panel{
    position:fixed;top:14px;left:14px;z-index:10;
    background:rgba(16,18,22,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);border-radius:14px;
    padding:12px 14px;color:#f2f3f5;max-width:330px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  #panel h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
  #panel h1 .num{background:#fff;color:#111;border-radius:5px;padding:0 6px;font-family:Consolas,monospace;}
  #panel .sub{margin-top:5px;font-size:11px;color:#c4c9cf;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .pill{display:inline-block;border-radius:4px;padding:1px 6px;font-weight:700;font-size:10px;}
  .pill.m1{background:#d2232a;color:#fff;}
  .stripe{display:inline-block;width:34px;height:10px;border-radius:2px;
    background:linear-gradient(180deg,#fff 0 25%,#ffc20e 25% 55%,#fff 55% 65%,#d2232a 65% 100%);}
  #btns{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
  #btns button{
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#eef0f2;
    border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;transition:all .15s;
  }
  #btns button:hover{background:rgba(255,255,255,.16);}
  #btns button.on{background:#ffc20e;border-color:#ffc20e;color:#221a00;font-weight:700;}
  #hint{
    position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(16,18,22,.6);backdrop-filter:blur(8px);color:#d9dde2;
    font-size:11px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.1);
    white-space:nowrap;
  }
  @media (max-width:560px){
    #panel{max-width:calc(100vw - 28px);}
    #hint{font-size:10px;}
  }
  #drive{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:11;
    display:flex;flex-direction:column;align-items:center;gap:7px;}
  #dRow{display:flex;align-items:center;gap:14px;background:rgba(16,18,22,.62);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 12px;}
  #dRow button{width:46px;height:46px;border-radius:50%;font-size:22px;line-height:1;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;}
  #dRow button:active{background:rgba(255,255,255,.28);}
  #dSpd{min-width:96px;text-align:center;font-size:21px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
  #dSpd span{font-size:11px;color:#aeb6bf;font-weight:600;}
  #dDist{font-size:11.5px;color:#e8edf2;background:rgba(16,18,22,.5);padding:4px 12px;
    border-radius:999px;border:1px solid rgba(255,255,255,.1);white-space:nowrap;}
  #dExit{position:fixed;top:14px;right:14px;z-index:11;width:38px;height:38px;border-radius:50%;
    background:rgba(16,18,22,.7);color:#fff;border:1px solid rgba(255,255,255,.18);font-size:16px;cursor:pointer;}
  .hidden{display:none !important;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   Škoda Sofia Metro EMU No. 4002 — high-detail single-file Three.js scene
   - 4-car consist, white / yellow / red livery, black cab canopy
   - lofted multi-facet nose, LED clusters, destination display M1
   - detailed bogies, underframe, pantograph, couplers, gangways
   - 1435mm gauge double track, ballast, sleepers, catenary, stone wall
   ========================================================================= */
(function(){
'use strict';

var RT = 0.5;                 // rail top height (world Y)
var TRACKLEN = 220;
var canvas = document.getElementById('c');

/* ---------------- renderer / scene / camera ---------------- */
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe3e8, 70, 280);

var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 330);

/* ---------------- lights ---------------- */
var hemi = new THREE.HemisphereLight(0xe8edf2, 0x8a8f7c, 1.0);
scene.add(hemi);
var sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(38, 52, -20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 55;   sun.shadow.camera.bottom = -15;
sun.shadow.camera.near = 5;   sun.shadow.camera.far = 180;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 0, 5);

/* ---------------- sky dome (day / night) ---------------- */
function gradTexture(stops){
  var c = document.createElement('canvas'); c.width = 16; c.height = 256;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, 0, 256);
  for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
  x.fillStyle = g; x.fillRect(0, 0, 16, 256);
  var t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.ClampToEdgeWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}
var skyDay   = gradTexture([[0,'#cfd6dc'],[0.45,'#e3e8ec'],[1,'#f2f4f5']]);
var skyNight = gradTexture([[0,'#04070f'],[0.5,'#0a1322'],[1,'#16233a']]);
var domeMat = new THREE.MeshBasicMaterial({map:skyDay, side:THREE.BackSide, fog:false, depthWrite:false});
var dome = new THREE.Mesh(new THREE.SphereGeometry(320, 24, 14), domeMat);
scene.add(dome);
scene.background = new THREE.Color(0xdfe3e8);

/* ---------------- environment reflections (PMREM) ---------------- */
var pmrem = new THREE.PMREMGenerator(renderer);
(function(){
  var es = new THREE.Scene();
  var d = new THREE.Mesh(new THREE.SphereGeometry(50, 16, 10),
          new THREE.MeshBasicMaterial({color:0xcfd6dc, side:THREE.BackSide}));
  es.add(d);
  var top = new THREE.Mesh(new THREE.CircleGeometry(18, 24),
          new THREE.MeshBasicMaterial({color:0xffffff}));
  top.rotation.x = Math.PI/2; top.position.y = 45; es.add(top);
  var gr = new THREE.Mesh(new THREE.CircleGeometry(49, 24),
          new THREE.MeshBasicMaterial({color:0x5e6157}));
  gr.rotation.x = -Math.PI/2; gr.position.y = -8; es.add(gr);
  var rt = pmrem.fromScene(es, 0.05);
  scene.environment = rt.texture;
})();

/* ---------------- procedural textures ---------------- */
function noiseFill(x, w, h, base, n, amp){
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (var i = 0; i < n; i++){
    var v = (Math.random()-0.5)*amp;
    var g = Math.max(0, Math.min(255, 128+v))|0;
    x.fillStyle = 'rgba('+g+','+g+','+g+','+(0.10+Math.random()*0.18)+')';
    x.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*3, 1+Math.random()*3);
  }
}
function makeGravel(){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var x = c.getContext('2d');
  x.fillStyle = '#6e6a64'; x.fillRect(0,0,256,256);
  for (var i = 0; i < 900; i++){
    var g = 70 + (Math.random()*90)|0;
    x.fillStyle = 'rgb('+g+','+(g-4)+','+(g-9)+')';
    x.beginPath();
    x.ellipse(Math.random()*256, Math.random()*256, 1.5+Math.random()*3.5, 1+Math.random()*2.6, Math.random()*3, 0, 6.3);
    x.fill();
  }
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(46, 3.4);
  return t;
}
function makeConcrete(){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var x = c.getContext('2d');
  noiseFill(x, 256, 256, '#b9b6ae', 1500, 70);
  x.strokeStyle = 'rgba(60,58,54,.5)'; x.lineWidth = 1.2;
  for (var i = 0; i < 5; i++){
    x.beginPath();
    var px = Math.random()*256, py = Math.random()*256;
    x.moveTo(px, py);
    for (var j = 0; j < 5; j++){ px += (Math.random()-0.5)*90; py += (Math.random()-0.5)*90; x.lineTo(px, py); }
    x.stroke();
  }
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(26, 2.6);
  return t;
}
function makeStone(){
  var c = document.createElement('canvas'); c.width = 512; c.height = 256;
  var x = c.getContext('2d');
  x.fillStyle = '#46443f'; x.fillRect(0,0,512,256);
  var rows = 6, rh = 256/rows;
  for (var r = 0; r < rows; r++){
    var px = (r%2)*-22;
    while (px < 512){
      var w = 52 + Math.random()*46;
      var g = 92 + (Math.random()*46)|0;
      x.fillStyle = 'rgb('+(g+8)+','+(g+2)+','+(g-6)+')';
      x.beginPath();
      var rx = px+3, ry = r*rh+3, rw = w-6, rhh = rh-6, rad = 7;
      x.moveTo(rx+rad, ry);
      x.arcTo(rx+rw, ry, rx+rw, ry+rhh, rad);
      x.arcTo(rx+rw, ry+rhh, rx, ry+rhh, rad);
      x.arcTo(rx, ry+rhh, rx, ry, rad);
      x.arcTo(rx, ry, rx+rw, ry, rad);
      x.fill();
      x.fillStyle = 'rgba(0,0,0,'+(Math.random()*0.18)+')';
      x.fill();
      px += w;
    }
  }
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 1.6);
  return t;
}
function makeGrass(){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var x = c.getContext('2d');
  x.fillStyle = '#5d7140'; x.fillRect(0,0,256,256);
  for (var i = 0; i < 1400; i++){
    var g = 70 + (Math.random()*70)|0;
    x.fillStyle = 'rgba('+(g-30)+','+g+','+((g*0.45)|0)+','+(0.25+Math.random()*0.4)+')';
    x.fillRect(Math.random()*256, Math.random()*256, 1+Math.random()*2, 2+Math.random()*4);
  }
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(20, 2);
  return t;
}
function makeDest(){
  var c = document.createElement('canvas'); c.width = 512; c.height = 110;
  var x = c.getContext('2d');
  x.fillStyle = '#070707'; x.fillRect(0,0,512,110);
  x.textBaseline = 'middle';
  x.shadowColor = '#ff9d3a'; x.shadowBlur = 10;
  x.fillStyle = '#ffb43c'; x.font = '900 62px Arial';
  x.textAlign = 'left'; x.fillText('M1', 20, 56);
  x.shadowColor = '#ffffff'; x.shadowBlur = 8;
  x.fillStyle = '#f4f6ff'; x.font = '700 38px Arial';
  x.textAlign = 'center';
  x.fillText('БИЗНЕС', 320, 32);
  x.fillText('ПАРК СОФИЯ', 320, 80);
  x.shadowBlur = 0;
  x.fillStyle = 'rgba(0,0,0,.55)';
  for (var i = 0; i < 110; i += 4) x.fillRect(0, i, 512, 1);
  for (var j = 0; j < 512; j += 4) x.fillRect(j, 0, 1, 110);
  var t = new THREE.CanvasTexture(c);
  return t;
}
function makeNumber(){
  var c = document.createElement('canvas'); c.width = 256; c.height = 96;
  var x = c.getContext('2d');
  x.clearRect(0,0,256,96);
  x.fillStyle = '#1c1d1f'; x.font = '700 64px Arial';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('4002', 128, 50);
  return new THREE.CanvasTexture(c);
}
function makeGlow(){
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var x = c.getContext('2d');
  var g = x.createRadialGradient(64,64,2, 64,64,62);
  g.addColorStop(0, 'rgba(255,250,225,1)');
  g.addColorStop(0.35, 'rgba(255,240,190,0.45)');
  g.addColorStop(1, 'rgba(255,240,190,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

/* ---------------- materials ---------------- */
var maxAniso = renderer.capabilities.getMaxAnisotropy();
var texGravel = makeGravel(), texConcrete = makeConcrete(), texStone = makeStone(), texGrass = makeGrass();
texGravel.anisotropy = texConcrete.anisotropy = texStone.anisotropy = maxAniso;

var M = {
  white: new THREE.MeshPhysicalMaterial({color:0xf3f2ee, roughness:0.32, metalness:0.12, clearcoat:1.0, clearcoatRoughness:0.18}),
  whiteDS: null,
  yellow: new THREE.MeshPhysicalMaterial({color:0xffc20e, roughness:0.3, metalness:0.1, clearcoat:1.0, clearcoatRoughness:0.2}),
  red: new THREE.MeshPhysicalMaterial({color:0xc81e25, roughness:0.3, metalness:0.1, clearcoat:1.0, clearcoatRoughness:0.2}),
  blackGloss: new THREE.MeshPhysicalMaterial({color:0x0b0c0e, roughness:0.16, metalness:0.25, clearcoat:1.0, clearcoatRoughness:0.1, side:THREE.DoubleSide}),
  glassSide: new THREE.MeshPhysicalMaterial({color:0x0c1116, roughness:0.05, metalness:0.25, clearcoat:1.0, clearcoatRoughness:0.05, emissive:0x000000}),
  glassFront: new THREE.MeshPhysicalMaterial({color:0x0a0e12, roughness:0.04, metalness:0.2, clearcoat:1.0, clearcoatRoughness:0.04, transparent:true, opacity:0.86}),
  doorPanel: new THREE.MeshPhysicalMaterial({color:0x33373b, roughness:0.35, metalness:0.4, clearcoat:0.6}),
  frameDark: new THREE.MeshStandardMaterial({color:0x17181a, roughness:0.5, metalness:0.5}),
  steelDark: new THREE.MeshStandardMaterial({color:0x2c2e31, roughness:0.55, metalness:0.75}),
  steelMid:  new THREE.MeshStandardMaterial({color:0x55585c, roughness:0.45, metalness:0.8}),
  alu: new THREE.MeshStandardMaterial({color:0x9aa0a5, roughness:0.35, metalness:0.9}),
  rubber: new THREE.MeshStandardMaterial({color:0x101010, roughness:0.92, metalness:0.0}),
  rail: new THREE.MeshStandardMaterial({color:0x6f7276, roughness:0.32, metalness:0.95}),
  railShine: new THREE.MeshStandardMaterial({color:0xc9ccd0, roughness:0.12, metalness:1.0}),
  sleeper: new THREE.MeshStandardMaterial({color:0xb3b0a8, roughness:0.9, metalness:0.0}),
  ballast: new THREE.MeshStandardMaterial({map:texGravel, roughness:0.95, metalness:0.0}),
  concrete: new THREE.MeshStandardMaterial({map:texConcrete, roughness:0.95}),
  stone: new THREE.MeshStandardMaterial({map:texStone, roughness:0.9}),
  grass: new THREE.MeshStandardMaterial({map:texGrass, roughness:1.0}),
  bush: new THREE.MeshStandardMaterial({color:0x3f5a2e, roughness:1.0}),
  bush2: new THREE.MeshStandardMaterial({color:0x53703a, roughness:1.0}),
  hvac: new THREE.MeshStandardMaterial({color:0xc6c8ca, roughness:0.55, metalness:0.4}),
  insulator: new THREE.MeshStandardMaterial({color:0x6b3f24, roughness:0.5}),
  copper: new THREE.MeshStandardMaterial({color:0x4d4f52, roughness:0.4, metalness:0.9}),
  interior: new THREE.MeshStandardMaterial({color:0x2a2d33, roughness:0.8}),
  seatBlue: new THREE.MeshStandardMaterial({color:0x2b3f8c, roughness:0.85}),
  ledOff: new THREE.MeshStandardMaterial({color:0xd8dde2, roughness:0.3, metalness:0.3, emissive:0x222222}),
  ledOn:  new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xfff2d0, emissiveIntensity:0.0}),
  redMarker: new THREE.MeshStandardMaterial({color:0x550000, emissive:0xff2014, emissiveIntensity:0.9}),
  tail: new THREE.MeshStandardMaterial({color:0x550000, emissive:0xff1a10, emissiveIntensity:0.0}),
  display: new THREE.MeshBasicMaterial({map:makeDest()}),
  ceiling: new THREE.MeshStandardMaterial({color:0xeeeeee, emissive:0xfff4dd, emissiveIntensity:0.0})
};
M.whiteDS = M.white.clone(); M.whiteDS.side = THREE.DoubleSide;

/* ---------------- geometry helpers ---------------- */
function rimPts(hw, yB, yT, r, seg){
  seg = seg || 5;
  var p = [], i, a;
  p.push(new THREE.Vector2(-hw+0.06, yB));
  p.push(new THREE.Vector2(-hw, yB+0.3));
  p.push(new THREE.Vector2(-hw, yT-r));
  for (i = 1; i <= seg; i++){
    a = Math.PI - (i/seg)*(Math.PI/2);
    p.push(new THREE.Vector2(-hw+r+Math.cos(a)*r, yT-r+Math.sin(a)*r));
  }
  for (i = 1; i <= seg; i++){
    a = Math.PI/2 - (i/seg)*(Math.PI/2);
    p.push(new THREE.Vector2(hw-r+Math.cos(a)*r, yT-r+Math.sin(a)*r));
  }
  p.push(new THREE.Vector2(hw, yB+0.3));
  p.push(new THREE.Vector2(hw-0.06, yB));
  return p;            // 4 + 2*seg + 2 points, closed loop
}
function archPts(hw, yT, r, yCut, seg){
  seg = seg || 5;
  var p = [], i, a;
  p.push(new THREE.Vector2(-hw, yCut));
  p.push(new THREE.Vector2(-hw, yT-r));
  for (i = 1; i <= seg; i++){
    a = Math.PI - (i/seg)*(Math.PI/2);
    p.push(new THREE.Vector2(-hw+r+Math.cos(a)*r, yT-r+Math.sin(a)*r));
  }
  for (i = 1; i <= seg; i++){
    a = Math.PI/2 - (i/seg)*(Math.PI/2);
    p.push(new THREE.Vector2(hw-r+Math.cos(a)*r, yT-r+Math.sin(a)*r));
  }
  p.push(new THREE.Vector2(hw, yCut));
  return p;
}
function loftGeo(sections, closed){
  var pos = [], N = sections[0].pts.length, i, j;
  for (i = 0; i < sections.length-1; i++){
    var A = sections[i], B = sections[i+1];
    var lim = closed ? N : N-1;
    for (j = 0; j < lim; j++){
      var j2 = (j+1) % N;
      var ax = A.pts[j].x,  ay = A.pts[j].y,  az = A.z;
      var bx = A.pts[j2].x, by = A.pts[j2].y, bz = A.z;
      var cx = B.pts[j2].x, cy = B.pts[j2].y, cz = B.z;
      var dx = B.pts[j].x,  dy = B.pts[j].y,  dz = B.z;
      pos.push(ax,ay,az, bx,by,bz, cx,cy,cz);
      pos.push(ax,ay,az, cx,cy,cz, dx,dy,dz);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
function shapeFromPts(pts){
  var s = new THREE.Shape();
  s.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) s.lineTo(pts[i].x, pts[i].y);
  s.closePath();
  return s;
}
function roundedShape(w, h, r){
  var s = new THREE.Shape(), hw = w/2, hh = h/2;
  s.moveTo(-hw+r, -hh);
  s.lineTo(hw-r, -hh); s.absarc(hw-r, -hh+r, r, -Math.PI/2, 0, false);
  s.lineTo(hw, hh-r);  s.absarc(hw-r, hh-r, r, 0, Math.PI/2, false);
  s.lineTo(-hw+r, hh); s.absarc(-hw+r, hh-r, r, Math.PI/2, Math.PI, false);
  s.lineTo(-hw, -hh+r);s.absarc(-hw+r, -hh+r, r, Math.PI, Math.PI*1.5, false);
  return s;
}
function box(w, h, d, mat, x, y, z){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  return m;
}
function cylZ(r, len, mat, x, y, z, radial){
  var g = new THREE.CylinderGeometry(r, r, len, radial||12);
  g.rotateX(Math.PI/2);
  var m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  return m;
}

/* ---------------- catenary ---------------- */
function buildCatenary(trackX, mastX){
  var g = new THREE.Group();
  var contactY = 5.62, messY = 6.75;
  g.add(cylZ(0.016, TRACKLEN, M.copper, trackX, contactY, 0, 6));
  g.add(cylZ(0.014, TRACKLEN, M.copper, trackX, messY, 0, 6));
  for (var z = -TRACKLEN/2+4; z < TRACKLEN/2; z += 6){
    var dr = cylZ(0.01, messY-contactY, M.copper, trackX, (contactY+messY)/2, z, 4);
    dr.rotation.x = Math.PI/2;   // stand vertical between wires
    g.add(dr);
  }
  for (var mz = -100; mz <= 100; mz += 25){
    var mast = box(0.26, 7.6, 0.26, M.steelMid, mastX, 3.8, mz);
    mast.castShadow = true; g.add(mast);
    var span = Math.abs(trackX - mastX) + 0.35;
    var dir = trackX > mastX ? 1 : -1;
    var beam = cylX(0.045, span, M.steelMid, mastX + dir*span/2, 6.55, mz, 8);
    g.add(beam);
    var strut = cylX(0.035, span*1.12, M.steelMid, mastX + dir*span/2, 6.0, mz, 6);
    strut.rotation.z = dir * 0.32;
    g.add(strut);
    g.add(cylX(0.05, 0.22, M.insulator, mastX + dir*0.25, 6.55, mz, 8));
    var reg = cylZ(0.02, 0.9, M.steelDark, trackX, (6.55+contactY)/2, mz, 6);
    reg.rotation.x = Math.PI/2;
    g.add(reg);
  }
  return g;
}

  // ---------- one car ----------
  function buildCarV(cab, lampMat, withSpots){
    var car = new THREE.Group();
    var xEnd = cab ? 9.35 : 9.55;

    // side walls with openings
    [1, -1].forEach(function(side){
      var g = new THREE.Group();
      var ops = openingListV(cab), cur = -9.55;
      ops.forEach(function(o){
        wallSlabV(g, cur, o.x0, YBv, YTv, side);
        if (o.t === 'w'){
          wallSlabV(g, o.x0, o.x1, YBv, o.y0, side);
          wallSlabV(g, o.x0, o.x1, o.y1, YTv, side);
          addSideWindowV(g, o, side);
        } else {
          wallSlabV(g, o.x0, o.x1, o.y1, YTv, side);
        }
        cur = o.x1;
      });
      wallSlabV(g, cur, xEnd, YBv, YTv, side);
      car.add(g);
    });

    // livery stripes (segments break at doors)
    var stripeSegs = cab
      ? [[-9.55,-7.35], [-5.45,-2.55], [-0.65,2.25], [4.15,6.49], [7.21,9.35]]
      : [[-9.55,-7.35], [-5.45,-2.55], [-0.65,2.25], [4.15,9.55]];
    [1,-1].forEach(function(side){
      var z = side*1.338;
      stripeSegs.forEach(function(s, i){
        var x0 = s[0], x1 = s[1];
        var r = bxV(x1-x0, 0.58, 0.014, MV.redBand);
        r.position.set((x0+x1)/2, 1.71, z); r.castShadow = false; car.add(r);
        var yx1 = (cab && i === 3) ? 6.0 : x1;
        if ((!cab || i < 4) && yx1 > x0){
          var y = bxV(yx1-x0, 0.28, 0.014, MV.yellow);
          y.position.set((x0+yx1)/2, 2.14, z); y.castShadow = false; car.add(y);
        }
      });
      if (cab){
        // arrow tip of the yellow band, ahead of the cab door
        var tri = new THREE.Shape();
        tri.moveTo(0, -0.14); tri.lineTo(0, 0.14); tri.lineTo(0.42, 0); tri.closePath();
        var ag = new THREE.ExtrudeGeometry(tri, {depth:0.014, bevelEnabled:false});
        var am = new THREE.Mesh(ag, MV.yellow);
        am.position.set(6.0, 2.14, side > 0 ? 1.328 : -1.342);
        car.add(am);
      }
    });

    // dark sill under body + underbody equipment
    var sill = bxV(cab ? 18.9 : 19.1, 0.1, 2.56, MV.darkEq);
    sill.position.set(cab ? -0.1 : 0, 1.27, 0); car.add(sill);
    [[-3.4, 2.0],[-0.6, 1.6],[1.9, 1.8]].forEach(function(b){
      var e = bxV(b[1], 0.42, 1.9, MV.darkEq); e.position.set(b[0], 1.02, 0); car.add(e);
    });

    // roof
    var roofSlab = bxV(cab ? 15.75 : 19.1, 0.26, 2.5, MV.roof);
    roofSlab.position.set(cab ? -1.675 : 0, 4.01, 0); car.add(roofSlab);
    [[-2.8],[1.6]].forEach(function(p){
      var h = bxV(2.0, 0.16, 1.7, MV.darkEq); h.position.set(p[0], 4.2, 0); car.add(h);
    });
    if (cab){
      var ant = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 0.26, 8), MV.darkEq);
      ant.position.set(-8.2, 4.27, 0); car.add(ant);
      // cab roof cap (black, sloping brow over the windscreen)
      var sCap = new THREE.Shape();
      sCap.moveTo(6.1, 3.84); sCap.lineTo(6.1, 4.16); sCap.lineTo(8.7, 4.16);
      sCap.quadraticCurveTo(9.45, 4.10, 9.66, 3.62);
      sCap.lineTo(9.66, 3.52); sCap.closePath();
      var gCap = new THREE.ExtrudeGeometry(sCap, {depth:2.56, bevelEnabled:false});
      var mCap = new THREE.Mesh(gCap, MV.black);
      mCap.position.z = -1.28; mCap.castShadow = true;
      car.add(mCap);

      // ---------- front face ----------
      var facePart = function(w, h, cy, cz){
        var m = bxV(0.07, h, w, MV.black);
        m.position.set(FXv, cy, cz); car.add(m); return m;
      };
      facePart(2.24, 1.10, 2.0, 0);                 // below windscreen
      facePart(2.24, 0.12, 3.56, 0);                // strip above windscreen
      facePart(0.145, 0.95, 3.025, 1.05);           // pillars
      facePart(0.145, 0.95, 3.025, -1.05);
      var wsGl = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 0.95), MV.glass);
      wsGl.rotation.y = Math.PI/2; wsGl.position.set(FXv+0.01, 3.025, 0); car.add(wsGl);
      [1,-1].forEach(function(s){
        var ch = bxV(0.06, 2.43, 0.52, MV.black);
        ch.rotation.y = s*0.62;
        ch.position.set(9.41, 2.665, s*1.2);
        car.add(ch);
      });
      // red chevron on the face
      [1,-1].forEach(function(s){
        var gCh = new THREE.PlaneGeometry(1.3, 0.27);
        gCh.rotateZ(-s*0.3);
        var m = new THREE.Mesh(gCh, MV.redFace);
        m.rotation.y = Math.PI/2;
        m.position.set(FXv+0.045, 1.92, s*0.615);
        car.add(m);
      });
      // white headlight panels
      [1,-1].forEach(function(s){
        var gHl = new THREE.PlaneGeometry(0.62, 0.2);
        gHl.rotateZ(-s*0.18);
        var m = new THREE.Mesh(gHl, lampMat);
        m.rotation.y = Math.PI/2;
        m.position.set(FXv+0.045, 2.36, s*0.68);
        car.add(m);
      });
      // sloped brow: destination display + round lamps
      var browN = new THREE.Vector3(0.49, 0.87, 0).normalize();
      var disp = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.21), dispMatV);
      var pD = new THREE.Vector3(9.17, 3.92, 0).addScaledVector(browN, 0.035);
      disp.position.copy(pD);
      disp.lookAt(pD.clone().add(browN));
      car.add(disp);
      [1,-1].forEach(function(s){
        var p = new THREE.Vector3(9.17, 3.92, s*0.92).addScaledVector(browN, 0.035);
        var rim = new THREE.Mesh(new THREE.CircleGeometry(0.1, 24), MV.chrome);
        rim.position.copy(p); rim.lookAt(p.clone().add(browN)); car.add(rim);
        var lamp = new THREE.Mesh(new THREE.CircleGeometry(0.075, 24), lampMat);
        var p2 = p.clone().addScaledVector(browN, 0.004);
        lamp.position.copy(p2); lamp.lookAt(p2.clone().add(browN));
        car.add(lamp);
      });
      // wiper
      car.add(tubeV(new THREE.Vector3(9.62, 2.6, 0.34), new THREE.Vector3(9.62, 3.4, -0.12), 0.014, MV.black));
      car.add(tubeV(new THREE.Vector3(9.62, 3.4, -0.12), new THREE.Vector3(9.62, 3.18, -0.3), 0.011, MV.black));
      var wbase = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.08, 8), MV.black);
      wbase.rotation.z = Math.PI/2; wbase.position.set(9.6, 2.58, 0.34); car.add(wbase);
      // front skirt, coupler, resistor blocks, deflector
      var skirt = bxV(0.5, 0.55, 2.0, MV.body); skirt.position.set(9.3, 1.13, 0); car.add(skirt);
      var skirtB = bxV(0.62, 0.32, 1.5, MV.black); skirtB.position.set(9.28, 0.82, 0); car.add(skirtB);
      var shaft = bxV(0.6, 0.16, 0.16, MV.darkEq); shaft.position.set(9.6, 0.85, 0); car.add(shaft);
      var chead = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.24, 14), MV.darkEq);
      chead.rotation.z = Math.PI/2; chead.position.set(9.95, 0.85, 0); car.add(chead);
      var knuckle = bxV(0.16, 0.2, 0.3, MV.bogie); knuckle.position.set(10.05, 0.85, 0); car.add(knuckle);
      [1,-1].forEach(function(s){
        for (var i = 0; i < 5; i++){
          var fin = bxV(0.5, 0.026, 0.3, MV.bogie);
          fin.position.set(9.42, 0.74 + i*0.09, s*0.82); car.add(fin);
        }
      });
      [1,-1].forEach(function(s){
        car.add(tubeV(new THREE.Vector3(9.45, 1.05, s*0.72), new THREE.Vector3(9.88, 0.52, s*0.45), 0.035, MV.wheel));
      });
      car.add(tubeV(new THREE.Vector3(9.88, 0.52, 0.45), new THREE.Vector3(9.88, 0.52, -0.45), 0.035, MV.wheel));
      // headlight spotlights + glow sprites (front cab only)
      if (withSpots){
        [1,-1].forEach(function(s){
          var sp = new THREE.SpotLight(0xfff6e0, 0, 45, 0.32, 0.5, 1.2);
          sp.position.set(9.6, 2.36, s*0.68);
          sp.target.position.set(30, 0.6, s*1.8);
          car.add(sp); car.add(sp.target); headSpots.push(sp);
          var glo = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0.0}));
          glo.scale.set(1.1, 1.1, 1);
          glo.position.set(9.75, 2.36, s*0.68);
          car.add(glo); glowSprites.push(glo);
        });
      }
      // rear gangway end
      gangwayEndV(car, -1);
    } else {
      // middle car: gangway ends on both ends
      gangwayEndV(car, -1);
      gangwayEndV(car, 1);
    }

    // ---------- interior ----------
    var floorV = bxV(cab ? 18.85 : 19.1, 0.06, 2.5, MV.floor);
    floorV.position.set(cab ? -0.1 : 0, 1.35, 0); floorV.receiveShadow = true; car.add(floorV);
    var ceilV = bxV(cab ? 16.7 : 19.0, 0.05, 2.5, MV.ceil);
    ceilV.position.set(cab ? -1.15 : 0, 3.73, 0); car.add(ceilV);
    [1,-1].forEach(function(s){
      var strip = bxV(cab ? 16.5 : 18.8, 0.022, 0.13, MV.lightStrip);
      strip.position.set(cab ? -1.15 : 0, 3.7, s*0.95); strip.castShadow = false; car.add(strip);
    });

    // benches (segmented red cushions on grey pedestals)
    function benchV(cx, len, sideZ){
      var ped = bxV(len, 0.34, 0.42, MV.floor); ped.position.set(cx, 1.55, sideZ*1.0); car.add(ped);
      var n = Math.max(2, Math.round(len/0.55));
      var cw = (len - 0.05*(n-1)) / n;
      for (var i = 0; i < n; i++){
        var x = cx - len/2 + cw/2 + i*(cw+0.05);
        var cu = bxV(cw, 0.13, 0.46, MV.seatRed); cu.position.set(x, 1.79, sideZ*1.0); car.add(cu);
        var bk = bxV(cw, 0.6, 0.1, MV.seatRed);
        bk.position.set(x, 2.22, sideZ*1.21); bk.rotation.x = -sideZ*0.1; car.add(bk);
      }
    }
    (cab
      ? [[-8.45,1.7],[-4.0,2.4],[0.8,2.4],[5.32,1.9]]
      : [[-8.45,1.7],[-4.0,2.4],[0.8,2.4],[5.32,1.9],[8.45,1.7]]
    ).forEach(function(b){ benchV(b[0], b[1], 1); benchV(b[0], b[1], -1); });

    // draft screens with bent yellow rails beside every door
    function draftScreenV(xe, sideZ){
      var gl = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 1.5), MV.screen);
      gl.rotation.y = Math.PI/2;
      gl.position.set(xe, 2.42, sideZ*0.885);
      car.add(gl);
      var zi = sideZ*0.47;
      car.add(tubeV(new THREE.Vector3(xe, 1.66, zi), new THREE.Vector3(xe, 3.16, zi), 0.023, MV.rail));
      car.add(tubeV(new THREE.Vector3(xe, 3.16, zi), new THREE.Vector3(xe, 3.38, sideZ*0.55), 0.02, MV.rail));
      car.add(tubeV(new THREE.Vector3(xe, 2.02, zi), new THREE.Vector3(xe, 2.02, sideZ*1.24), 0.02, MV.rail));
    }
    DOORSv.forEach(function(c){
      [c-0.99, c+0.99].forEach(function(xe){ draftScreenV(xe, 1); draftScreenV(xe, -1); });
    });

    // ceiling rails + hangers + crossbars
    var railEnd = cab ? 6.9 : 9.2;
    [1,-1].forEach(function(s){
      car.add(tubeV(new THREE.Vector3(-9.2, 3.38, s*0.55), new THREE.Vector3(railEnd, 3.38, s*0.55), 0.023, MV.rail, 12));
      for (var x = -8.6; x < railEnd - 0.1; x += 1.6){
        car.add(tubeV(new THREE.Vector3(x, 3.38, s*0.55), new THREE.Vector3(x, 3.7, s*0.62), 0.015, MV.rail));
      }
    });
    DOORSv.forEach(function(c){
      car.add(tubeV(new THREE.Vector3(c, 3.38, 0.55), new THREE.Vector3(c, 3.38, -0.55), 0.02, MV.rail));
    });
    // vertical grab poles on window pillars
    [-5.11, -2.89, -0.31, 1.91, 4.25, 6.07].forEach(function(x){
      [1,-1].forEach(function(s){
        car.add(tubeV(new THREE.Vector3(x, 1.85, s*1.18), new THREE.Vector3(x, 2.95, s*1.18), 0.02, MV.rail));
      });
    });

    if (cab){
      // cab bulkhead with door
      var bwc = function(w, h, cy, cz){ var m = bxV(0.08, h, w, MV.inwall); m.position.set(7.32, cy, cz); car.add(m); };
      bwc(0.92, 2.56, 2.6, 0.82); bwc(0.92, 2.56, 2.6, -0.82);
      bwc(0.72, 0.62, 3.57, 0);
      var dcb = bxV(0.06, 1.94, 0.66, MV.floor); dcb.position.set(7.32, 2.29, 0); car.add(dcb);
      var dgb = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.42), MV.frost);
      dgb.rotation.y = Math.PI/2; dgb.position.set(7.36, 2.9, 0); car.add(dgb);
      // cab interior
      var dash = bxV(0.55, 0.5, 2.1, MV.darkEq); dash.position.set(9.15, 2.05, 0); car.add(dash);
      var dashTop = bxV(0.5, 0.07, 1.6, MV.darkEq);
      dashTop.position.set(8.95, 2.32, 0); dashTop.rotation.z = 0.18; car.add(dashTop);
      [0.5,-0.5].forEach(function(z){
        var cu = bxV(0.45, 0.12, 0.45, MV.cream); cu.position.set(8.35, 1.95, z); car.add(cu);
        var bk = bxV(0.12, 0.6, 0.45, MV.cream); bk.position.set(8.12, 2.32, z); car.add(bk);
      });
    }

    // bogies
    [6.7, -6.7].forEach(function(x){
      var b = makeBogieV(); b.position.x = x; car.add(b);
    });

    // plug doors (pop out then slide; animated from the game's doorT)
    DOORSv.forEach(function(c){
      [1,-1].forEach(function(side){
        var pair = new THREE.Group();
        pair.position.set(c, (YBv+DOOR_TOPv)/2, side*1.303);
        var L = makeLeafV(side, 1);  L.position.x = -0.475;
        var R = makeLeafV(side, -1); R.position.x = 0.475;
        pair.add(L); pair.add(R);
        car.add(pair);
        versoviaDoors.push({L:L, R:R, side:side});
      });
    });

    if (cab){
      // static cab door (black) + chrome handrails
      [1,-1].forEach(function(side){
        var z = side*1.3;
        var d = bxV(0.66, 2.14, 0.05, MV.door); d.position.set(6.85, 2.41, z); car.add(d);
        var fr = bxV(0.4, 0.56, 0.052, MV.black); fr.position.set(6.85, 3.0, z + side*0.004); car.add(fr);
        var gl = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.48), MV.glass);
        gl.position.set(6.85, 3.0, z + side*0.032);
        if (side < 0) gl.rotation.y = Math.PI;
        car.add(gl);
        [6.36, 7.34].forEach(function(hx){
          car.add(tubeV(new THREE.Vector3(hx, 1.75, side*1.35), new THREE.Vector3(hx, 3.2, side*1.35), 0.016, MV.chrome));
        });
      });
    }

    // side number 4002
    var numX = cab ? 7.7 : 8.8;
    [1,-1].forEach(function(side){
      var p = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.17), numMatV);
      p.position.set(numX, 2.62, side*1.334);
      if (side < 0) p.rotation.y = Math.PI;
      car.add(p);
    });

    return car;
  }

  // ---------- assemble the 4-car consist ----------
  var g = new THREE.Group();
  var VSPACE = 19.8;
  [
    {cab:true,  lamp:MV.headlight, spots:true,  ry:-Math.PI/2, z: 1.5*VSPACE},
    {cab:false, lamp:null,         spots:false, ry:-Math.PI/2, z: 0.5*VSPACE},
    {cab:false, lamp:null,         spots:false, ry:-Math.PI/2, z:-0.5*VSPACE},
    {cab:true,  lamp:MV.taillight, spots:false, ry: Math.PI/2, z:-1.5*VSPACE}
  ].forEach(function(d){
    var car = buildCarV(d.cab, d.lamp, d.spots);
    car.rotation.y = d.ry;
    car.position.set(0, RT, d.z);
    g.add(car);
  });
  // inter-car coupler bars under the gangways
  [VSPACE, 0, -VSPACE].forEach(function(z){
    g.add(cylZ(0.07, 1.1, M.steelMid, 0, RT + 0.5, z, 8));
  });
  return g;
}

/* =========================================================================
   JOURNEY EXTENSION + SOFIA AIRPORT STATION
   - 500 m open-country run, then elevated terminal on concrete pillars
   - platform hall: white diagrid truss, curved glass facade, marble floor
   - fountain atrium with statue + hanging light-rod curtain
   ========================================================================= */
var STOP = 500;                          // drive distance in metres
var SC = -2.7, SA = 10.5, SB = 6.9, SY0 = 3.0;   // hall arch: center x, half-span, rise, spring y
function archXY(t){ return {x: SC + SA*Math.cos(t), y: SY0 + SB*Math.sin(t)}; }
function arcStrip(t0, t1, n){
  var p = [];
  for (var i = 0; i <= n; i++){
    var a = archXY(t0 + (t1-t0)*i/n);
    p.push(new THREE.Vector2(a.x, a.y));
  }
  return p;
}
var dummy = new THREE.Object3D();
var YUP = new THREE.Vector3(0, 1, 0);
var unitCyl = new THREE.CylinderGeometry(1, 1, 1, 6);
function seg(im, idx, x1, y1, z1, x2, y2, z2, r){
  var dx = x2-x1, dy = y2-y1, dz = z2-z1;
  var len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  dummy.position.set((x1+x2)/2, (y1+y2)/2, (z1+z2)/2);
  dummy.quaternion.setFromUnitVectors(YUP, new THREE.Vector3(dx/len, dy/len, dz/len));
  dummy.scale.set(r, len, r);
  dummy.updateMatrix();
  im.setMatrixAt(idx, dummy.matrix);
}

function makeMarble(){

  var x = c.getContext('2d');

    x.fillRect(Math.random()*512, Math.random()*512, 2+Math.random()*26, 1+Math.random()*4);
  }
  x.strokeStyle = 'rgba(225,214,198,.35)'; x.lineWidth = 1.4;
  for (i = 0; i < 7; i++){
    x.beginPath();
    var px = Math.random()*512, py = Math.random()*512;
    x.moveTo(px, py);
    for (var j = 0; j < 4; j++){ px += (Math.random()-0.3)*120; py += (Math.random()-0.5)*140; x.lineTo(px, py); }
    x.stroke();
  }
  // slab joints
  x.strokeStyle = 'rgba(60,50,44,.5)'; x.lineWidth = 2;
  for (i = 0; i <= 512; i += 128){ x.beginPath(); x.moveTo(0,i); x.lineTo(512,i); x.stroke();
    x.beginPath(); x.moveTo(i,0); x.lineTo(i,512); x.stroke(); }
  // dark granite dot band
  x.fillStyle = '#4a3f37'; x.fillRect(396, 0, 84, 512);

  for (i = 8; i < 512; i += 22) for (j = 402; j < 474; j += 22) x.fillRect(j, i, 13, 13);
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1.6, 14);

}
function makeStarFloor(){
  var c = document.createElement('canvas'); c.width = c.height = 1024;
  var x = c.getContext('2d');
  x.fillStyle = '#e6dcc6'; x.fillRect(0,0,1024,1024);
  x.strokeStyle = 'rgba(150,134,108,.55)'; x.lineWidth = 2;
  for (var i = 0; i <= 1024; i += 86){
    x.beginPath(); x.moveTo(0,i); x.lineTo(1024,i); x.stroke();
    x.beginPath(); x.moveTo(i,0); x.lineTo(i,1024); x.stroke();
  }
  var cx = 512, cy = 512;
  // outer ring
  x.beginPath(); x.arc(cx, cy, 332, 0, 6.3); x.lineWidth = 26; x.strokeStyle = '#8a6f4f'; x.stroke();
  x.beginPath(); x.arc(cx, cy, 300, 0, 6.3); x.lineWidth = 8; x.strokeStyle = '#5e4a35'; x.stroke();
  // 16-point star
  for (i = 0; i < 16; i++){
    var a0 = i/16*Math.PI*2, a1 = (i+0.5)/16*Math.PI*2, a2 = (i+1)/16*Math.PI*2;
    x.beginPath();
    x.moveTo(cx + Math.cos(a0)*96, cy + Math.sin(a0)*96);
    x.lineTo(cx + Math.cos(a1)*286, cy + Math.sin(a1)*286);
    x.lineTo(cx + Math.cos(a2)*96, cy + Math.sin(a2)*96);
    x.closePath();
    x.fillStyle = (i%2) ? '#6e4f33' : '#c2a878';
    x.fill();
  }
  x.beginPath(); x.arc(cx, cy, 96, 0, 6.3); x.fillStyle = '#54402c'; x.fill();
  x.beginPath(); x.arc(cx, cy, 60, 0, 6.3); x.fillStyle = '#d9c8a6'; x.fill();
  return new THREE.CanvasTexture(c);
}

function buildTrackRange(x0, z0, z1){

    var r = new THREE.Mesh(rg, M.rail); r.position.set(x0+dx, RT-0.082, zc); g.add(r);
    var hd = new THREE.Mesh(hg, M.railShine); hd.position.set(x0+dx, RT-0.001, zc); g.add(hd);

function sleepersRange(x0, z0, z1){
  var n = Math.floor((z1-z0)/0.66);

  return im;

function buildCatRange(trackX, mastX, z0, z1){
  var g = new THREE.Group();
  var contactY = 5.62, messY = 6.75, L = z1-z0, zc = (z0+z1)/2;
  g.add(cylZ(0.016, L, M.copper, trackX, contactY, zc, 6));
  g.add(cylZ(0.014, L, M.copper, trackX, messY, zc, 6));
  var nD = Math.floor((z1-z0)/6);
  var im = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.01, 0.01, messY-contactY, 4), M.copper, nD);
  im.frustumCulled = false;
  for (var i = 0; i < nD; i++){
    dummy.position.set(trackX, (contactY+messY)/2, z0 + 3 + i*6);
    dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1);
    dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix);
  }
  g.add(im);
  for (var mz = z0 + 12; mz <= z1 - 8; mz += 25.4){
    var mast = box(0.26, 7.6, 0.26, M.steelMid, mastX, 3.8, mz);
    g.add(mast);
    var span = Math.abs(trackX - mastX) + 0.35;
    var dir = trackX > mastX ? 1 : -1;
    g.add(cylX(0.045, span, M.steelMid, mastX + dir*span/2, 6.55, mz, 8));
    var strut = cylX(0.035, span*1.12, M.steelMid, mastX + dir*span/2, 6.0, mz, 6);
    strut.rotation.z = dir * 0.32; g.add(strut);
    g.add(cylX(0.05, 0.22, M.insulator, mastX + dir*0.25, 6.55, mz, 8));
    var reg = cylZ(0.02, 0.9, M.steelDark, trackX, (6.55+contactY)/2, mz, 6);
    reg.rotation.x = Math.PI/2; g.add(reg);
  }
  return g;
}

/* ---------------- portal rings + end wall ---------------- */
function archShape(extra, yBase){
  var s = new THREE.Shape();
  s.moveTo(SC - SA - extra, yBase);
  s.lineTo(SC - SA - extra, SY0);
  for (var k = 0; k <= 20; k++){
    var t = Math.PI - Math.PI*k/20;
    s.lineTo(SC + (SA+extra)*Math.cos(t), SY0 + (SB+extra)*Math.sin(t));
  }
  s.lineTo(SC + SA + extra, yBase);
  s.closePath();
  return s;
}
function archHole(shr, yBase){
  var h = new THREE.Path();
  h.moveTo(SC - SA + shr, yBase);
  h.lineTo(SC - SA + shr, SY0);
  for (var k = 0; k <= 20; k++){
    var t = Math.PI - Math.PI*k/20;
    h.lineTo(SC + (SA-shr)*Math.cos(t), SY0 + (SB-shr)*Math.sin(t));
  }
  h.lineTo(SC + SA - shr, yBase);
  h.closePath();
  return h;
}
function portalRing(z, shr, yBase){
  var s = archShape(0.45, yBase);
  s.holes.push(archHole(shr, yBase + 0.001));
  var m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, {depth:0.7, bevelEnabled:false}), M.panelWhite);
  m.position.z = z;
  return m;
}

var XC3 = 2.2, A3 = 13.6, B3 = 5.6, Y03 = 3.4;     // Sveta Gora arch profile
function arch3(t){ return {x: XC3 + A3*Math.cos(t), y: Y03 + B3*Math.sin(t)}; }
function arc3Strip(t0, t1, n){
  var p = [];
  for (var i = 0; i <= n; i++){
    var a = arch3(t0 + (t1-t0)*i/n);
    p.push(new THREE.Vector2(a.x, a.y));
  }
  return p;
}

function svgPortal(z){
  var s = new THREE.Shape();
  s.moveTo(XC3 - A3 - 0.4, 1.3);
  s.lineTo(XC3 - A3 - 0.4, Y03);
  for (var k = 0; k <= 20; k++){
    var t = Math.PI - Math.PI*k/20;
    s.lineTo(XC3 + (A3+0.4)*Math.cos(t), Y03 + (B3+0.4)*Math.sin(t));
  }
  s.lineTo(XC3 + A3 + 0.4, 1.3);
  s.closePath();
  var h = new THREE.Path();
  h.moveTo(-3.7, 1.31); h.lineTo(8.1, 1.31); h.lineTo(8.1, 4.6);
  h.quadraticCurveTo(2.2, 6.7, -3.7, 4.6);
  h.closePath();
  s.holes.push(h);
  var m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, {depth:0.7, bevelEnabled:false}), M.panelWhite);
  m.position.z = z;
  return m;
}

/* =========================================================================
   LEG 3: DESCENT + 5 KM TUNNEL + ISKARSKO SHOSE (underground)
   - 700 m more glass tube, then eased 520 m descent into a portal
   - detailed running tunnel: cables, brackets, lamps, third rail
   - mauve-tiled island-hall station with gold ribbed pendants
   - end-of-platform stairs up to a glazed street exit + tram stop
   ========================================================================= */
function yTrack(z){
  if (z < 3290) return 0;
  if (z < 3810) return -9*(1 - Math.cos(Math.PI*(z - 3290)/520));
  return -18;
}
function sweepLocal(pts, L, mat){
  var geo = loftGeo([{pts:pts, z:-L/2}, {pts:pts, z:L/2}], false);
  return new THREE.Mesh(geo, mat);
}
function railSetLocal(x0, L){
  var g = new THREE.Group();
  var rg = new THREE.BoxGeometry(0.07, 0.152, L);
  var fg = new THREE.BoxGeometry(0.15, 0.03, L);
  var hg = new THREE.BoxGeometry(0.074, 0.012, L);
  [-0.7175, 0.7175].forEach(function(dx){
    var f = new THREE.Mesh(fg, M.rail); f.position.set(x0+dx, RT-0.165, 0); g.add(f);
    var r = new THREE.Mesh(rg, M.rail); r.position.set(x0+dx, RT-0.082, 0); g.add(r);
    var hd = new THREE.Mesh(hg, M.railShine); hd.position.set(x0+dx, RT-0.001, 0); g.add(hd);
  });
  return g;
}
function trackChord(x0, z0, z1){
  var y0 = yTrack(z0), y1 = yTrack(z1);
  var L = Math.hypot(z1-z0, y1-y0);
  var g = railSetLocal(x0, L);
  g.position.set(0, (y0+y1)/2, (z0+z1)/2);
  g.rotation.x = -Math.atan2(y1-y0, z1-z0);
  return g;
}

function makeModernTex(accent){
  var c = document.createElement('canvas'); c.width = 256; c.height = 512;
  var x = c.getContext('2d');
  x.fillStyle = '#e7e4df'; x.fillRect(0,0,256,512);
  var rows = 10, cols = 5;
  for (var r = 1; r < rows; r++) for (var cc = 0; cc < cols; cc++){
    var wx = 12 + cc*48, wy = 14 + r*47;
    if (cc % 2 === 1){
      x.fillStyle = accent;
      x.fillRect(wx - 6, wy - 6, 42, 40);
    }
    x.fillStyle = (Math.random() < 0.12) ? '#ffd9a0' : '#32404e';
    x.fillRect(wx, wy, 30, 28);
  }
  return new THREE.CanvasTexture(c);
}
function makeHexPave(){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var x = c.getContext('2d');
  x.fillStyle = '#a7a59f'; x.fillRect(0,0,256,256);
  x.strokeStyle = 'rgba(70,68,64,.5)'; x.lineWidth = 2;
  var s = 18;
  for (var row = 0; row < 12; row++){
    for (var col = 0; col < 10; col++){
      var cx = col*s*1.5 + (row % 2 ? s*0.75 : 0), cy = row*s*0.87;
      x.beginPath();
      for (var k2 = 0; k2 < 6; k2++){
        var a = Math.PI/3*k2 + Math.PI/6;
        var px = cx + Math.cos(a)*s*0.55, py = cy + Math.sin(a)*s*0.55;
        if (k2 === 0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.closePath(); x.stroke();
    }
  }
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 22);
  return t;
}

/* ---------------- camera controls (custom orbit) ---------------- */
var sph = {theta:-0.42, phi:1.5, r:26};
var target = new THREE.Vector3(0, 3.0, 27);
var autoOrbit = true;
function updateCam(){
  sph.phi = Math.max(0.12, Math.min(Math.PI/2 - 0.015, sph.phi));
  sph.r = Math.max(5, Math.min(140, sph.r));
  camera.position.set(
    target.x + sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),
    target.y + sph.r*Math.cos(sph.phi),
    target.z + sph.r*Math.sin(sph.phi)*Math.cos(sph.theta)
  );
  camera.lookAt(target);
}
updateCam();

var pointers = new Map();
var lastPinch = 0;
canvas.addEventListener('pointerdown', function(e){
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY, b:e.buttons});
  canvas.setPointerCapture(e.pointerId);
  setOrbit(false);
});
canvas.addEventListener('pointermove', function(e){
  if (!pointers.has(e.pointerId)) return;
  var p = pointers.get(e.pointerId);
  var dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (pointers.size === 1){
    if (e.buttons === 2 || e.shiftKey){
      var pan = new THREE.Vector3();
      var right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      var up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
      pan.addScaledVector(right, -dx*0.0016*sph.r);
      pan.addScaledVector(up, dy*0.0016*sph.r);
      target.add(pan);
    } else {
      sph.theta -= dx*0.0052;
      sph.phi -= dy*0.0052;
    }
    updateCam();
  } else if (pointers.size === 2){
    p.x = e.clientX; p.y = e.clientY;
    var arr = Array.from(pointers.values());
    var d = Math.hypot(arr[0].x-arr[1].x, arr[0].y-arr[1].y);
    if (lastPinch > 0){
      sph.r *= lastPinch/d;
      updateCam();
    }
    lastPinch = d;
  }
  p.x = e.clientX; p.y = e.clientY;
});
function endPtr(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) lastPinch = 0;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  sph.r *= 1 + Math.sign(e.deltaY)*0.09;
  updateCam();
}, {passive:false});
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

function initAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    var len = 2*AC.sampleRate;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
    var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    rumbleFilter = AC.createBiquadFilter();
    rumbleFilter.type = 'lowpass'; rumbleFilter.frequency.value = 100;
    rumbleGain = AC.createGain(); rumbleGain.gain.value = 0;
    src.connect(rumbleFilter); rumbleFilter.connect(rumbleGain); rumbleGain.connect(AC.destination);
    src.start();
  } catch(e){}
}
function chime(){
  if (!AC) return;
  try {
    [[659, 0], [880, 0.22]].forEach(function(n){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, AC.currentTime + n[1]);
      g.gain.exponentialRampToValueAtTime(0.18, AC.currentTime + n[1] + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + n[1] + 0.5);
      o.connect(g); g.connect(AC.destination);
      o.start(AC.currentTime + n[1]); o.stop(AC.currentTime + n[1] + 0.55);
    });
  } catch(e){}
}
function updSpd(){ dSpd.firstChild.nodeValue = Math.round(v*3.6); }
function setDrive(on){
  driving = on;
  document.getElementById('panel').classList.toggle('hidden', on);
  document.getElementById('hint').classList.toggle('hidden', on);
  document.getElementById('drive').classList.toggle('hidden', !on);
  document.getElementById('dExit').classList.toggle('hidden', !on);
  if (on){
    initAudio();
    if (AC && AC.state === 'suspended') AC.resume();
    setOrbit(false);
    if (!arrived && doorTarget > 0.5){ doorTarget = 0; setBtn('bDoors', false); }
    stepIdx = 0; updSpd();
    dDist.textContent = arrived
      ? '🛬 ' + stations[stIdx].name + (stIdx < stations.length-1 ? ' · ＋ за тръгване' : ' · Крайна спирка')
      : Math.ceil(stations[stIdx].stop - train.position.z) + ' м до ' + stations[stIdx].name;
  } else {
    v = 0; stepIdx = 0; updSpd();
    target.set(0.5, 3.0 + yTrack(train.position.z), train.position.z + 20);
    sph.theta = -0.55; sph.phi = 1.42; sph.r = 30;
    updateCam();
    setOrbit(true);
    if (rumbleGain) rumbleGain.gain.value = 0;
  }
}

/* ---------------- resize / loop ---------------- */
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

var clock = new THREE.Clock();
var tGlobal = 0;
function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  tGlobal += dt;
  // drive physics
  if (driving && !arrived){
    var z = train.position.z;
    var curStop = stations[stIdx].stop;
    var remain = curStop - z;
    var allowed = Math.sqrt(2*1.15*Math.max(0, remain - 0.4));
    var vMax = Math.min(speedSteps[stepIdx]/3.6, allowed);
    if (v < vMax) v = Math.min(vMax, v + 1.05*dt);
    else v = Math.max(vMax, v - 1.5*dt);
    z = Math.min(curStop, z + v*dt);
    train.position.z = z;
    var remain2 = curStop - z;
    if (z > 430 && pantoTarget > 0.5){ pantoTarget = 0; setBtn('bPanto', false); }
    if (remain2 < 0.45 && v < 0.6){
      v = 0; arrived = true; stepIdx = 0;
      doorTarget = 1; setBtn('bDoors', true);
      dDist.textContent = '🛬 ' + stations[stIdx].name +
        (stIdx < stations.length-1 ? ' · ＋ за тръгване' : ' · Крайна спирка');
      chime();
    } else {
      dDist.textContent = Math.max(0, Math.ceil(remain2)) + ' м до ' + stations[stIdx].name;
    }
    updSpd();
  }
  // vertical profile: train height + pitch
  var tz0 = train.position.z;
  var yA = yTrack(tz0 - 28), yB = yTrack(tz0 + 38);
  train.position.y = (yA + yB)/2;
  train.rotation.x = -Math.atan2(yB - yA, 66);
  // wheel spin
  if (v > 0.001){
    var wr = v*dt/0.43;
    for (var wi = 0; wi < wheels.length; wi++) wheels[wi].rotation.x += wr;
    for (var wv = 0; wv < wheelsV.length; wv++) wheelsV[wv].rotation.z -= wr;
  }
  // rumble follows speed
  if (rumbleGain){
    rumbleGain.gain.value = driving ? Math.min(0.2, (v/22)*0.16) : 0;
    rumbleFilter.frequency.value = 80 + v*16;
  }
  // camera
  if (driving){
    var zz = train.position.z;
    var sway = Math.min(1, v/14);
    camera.position.set(
      0.35 + Math.sin(tGlobal*2.3)*0.012*sway,
      3.02 + yTrack(zz + noseOff) + Math.sin(tGlobal*3.1)*0.008*sway,
      zz + noseOff
    );
    camera.lookAt(0.1, 2.5 + yTrack(zz + 160), zz + 160);
  } else if (autoOrbit){
    sph.theta += dt*0.07; updateCam();
  }
  // sun + sky follow the train / camera
  sun.position.set(38, 52, -20 + train.position.z);
  sun.target.position.set(0, 0, 5 + train.position.z);
  dome.position.copy(camera.position);
  // underground ambience blend (tunnel + Iskarsko Shose)
  var uIn = Math.min(1, Math.max(0, (camera.position.z - 3560)/120));
  var uOut = Math.min(1, Math.max(0, (camera.position.y + 10.5)/4.5));
  var ug = uIn * (1 - uOut);
  var hemiBase = night ? 0.18 : 1.0;
  var sunBase  = night ? 0.1 : 0.75;
  hemi.intensity = hemiBase*(1-ug) + 0.2*ug;
  sun.intensity  = sunBase*(1-ug) + 0.04*ug;
  scene.fog.near = 70*(1-ug) + 16*ug;
  scene.fog.far  = 280*(1-ug) + 150*ug;
  fogBaseCol.set(night ? 0x0a1120 : 0xdfe3e8);
  fogBlendCol.copy(fogBaseCol).lerp(tunnelCol, ug);
  scene.fog.color.copy(fogBlendCol);
  if (scene.background && scene.background.isColor) scene.background.copy(fogBlendCol);
  // doors
  var nd = doorT + (doorTarget - doorT)*Math.min(1, dt*4.5);
  if (Math.abs(nd - doorT) > 0.0001){
    doorT = nd;
    doorLeaves.forEach(function(d){
      d.m.position.z = d.z0 + d.dz*doorT;
      d.m.position.x = d.x0 + d.dx*doorT;
    });
    // Versovia plug doors: pop out first, then slide
    var plugV = Math.sin(Math.min(doorT*2, 1)*Math.PI/2);
    var sV = Math.max(0, Math.min(1, (doorT - 0.45)/0.55));
    sV = sV*sV*(3 - 2*sV);
    versoviaDoors.forEach(function(p){
      p.L.position.x = -0.475 - sV*0.86;
      p.R.position.x =  0.475 + sV*0.86;
      p.L.position.z = p.side*0.082*plugV;
      p.R.position.z = p.side*0.082*plugV;
    });
  }
  // pantograph
  var np = pantoT + (pantoTarget - pantoT)*Math.min(1, dt*2.2);
  if (panto && Math.abs(np - pantoT) > 0.0001){
    pantoT = np;
    panto.setT(pantoT);
  }
  renderer.render(scene, camera);
}
