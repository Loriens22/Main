    /* squad alert decays */
    if (S.squad.hasContact && S.time - S.squad.lastKnownT > 12) {
      S.squad.hasContact = false;
      S.squad.alert = 0;
    }
  }

  var FOLLOW_DIST = { close: 1.8, medium: 3.2, far: 5.0 };

  function setBehavior(S, name) {
    var el = S.elena;
    if (el.behavior === name) { return; }
    el.prevBehavior = el.behavior;
    el.behavior = name;
    el.behaviorT = 0;
    el.path.length = 0;
    el.pathI = 0;
    el.repathT = 0;
    emit('elena_behavior', { behavior: name, prev: el.prevBehavior });
  }

  function damageElena(S, amount, type) {
    var el = S.elena;
    if (!el.alive || el.downed) { return 0; }
    amount *= diffOf(S).dmgIn;
    el.hp = Math.max(0, el.hp - amount);
    el.lastHitT = S.time;
    el.hurtT = 0.5;
    el.fear = clamp(el.fear + 0.22, 0, 1);
    emit('damage', { who: 'elena', amount: amount, type: type, hp: el.hp, max: el.maxHp });
    if (el.hp <= 0) { killElena(S, type); }
    return amount;
  }

  function startElenaGrab(S, e) {
    var el = S.elena;
    if (!el.alive || el.grabbedBy >= 0) { return; }
    el.grabbedBy = e.id;
    el.carryT = 0;
    el.carried = true;
    e.grabbing = 'elena';
    e.grabT = 0;
    setBehavior(S, 'Struggle');
    el.fear = 1;
    emit('elena_grabbed', { by: e.id, kind: e.kind, pos: vcopy(el.pos) });
  }

  function releaseElenaGrab(S, e, reason) {
    var el = S.elena;
    if (el.grabbedBy !== (e && e.id)) {
      if (e) { e.grabbing = null; }
      return;
    }
    el.grabbedBy = -1;
    el.carried = false;
    el.carryT = 0;
    if (e) { e.grabbing = null; unmarkElenaHunter(S, e); }

    emit('elena_rescued', { reason: reason || 'released' });

  /* A point behind and to the side of the player, never in his firing line. */
  function followSlot(S, out) {
    var p = S.player;
    var dist = FOLLOW_DIST[S.elena.followDist] || 3.2;
    var side = S.elena.slotSide || 1;
    var yaw = p.aimYaw !== undefined ? p.aimYaw : p.yaw;
    var bx = -Math.sin(yaw), bz = -Math.cos(yaw);
    var rx = Math.cos(yaw), rz = -Math.sin(yaw);
    out[0] = p.pos[0] + bx * dist + rx * side * 0.9;
    out[1] = p.pos[1];
    out[2] = p.pos[2] + bz * dist + rz * side * 0.9;
    return out;
  }

  /* If she has drifted into the player's aim cone, step out of it. */
  function avoidFiringLine(S, dt) {
    var el = S.elena, p = S.player;
    var dx = el.pos[0] - p.pos[0], dz = el.pos[2] - p.pos[2];
    var d = Math.sqrt(dx * dx + dz * dz);
    if (d > 6 || d < 0.05) { return false; }
    var yaw = p.aimYaw !== undefined ? p.aimYaw : p.yaw;
    var toEl = Math.atan2(dx, dz);
    var off = angleWrap(toEl - yaw);
    var coneHalf = Math.atan2(0.75, Math.max(1, d));
    if (Math.abs(off) > coneHalf) { return false; }
    var push = off >= 0 ? 1 : -1;
    var px = Math.cos(yaw) * push, pz = -Math.sin(yaw) * push;
    moveEntity(S, el, px * 2.4 * dt, pz * 2.4 * dt, el.radius, el.height);
    el.speed = 2.4;
    el.sidestepT = 0.4;
    return true;
  }

  function elenaStress(S, dt) {
    var el = S.elena, p = S.player;
    var st = el.stress;
    /* threat: nearest live enemy */
    var nearest = 1e9, i, e;
    for (i = 0; i < S.enemies.length; i++) {
      e = S.enemies[i];
      if (e.dead) { continue; }
      var dd = distXZ(e.pos, el.pos);
      if (dd < nearest) { nearest = dd; }
    }
    st.threat = nearest < 1e9 ? clamp(1 - nearest / 18, 0, 1) : 0;
    st.gunfire = clamp(st.gunfire - dt * 0.35, 0, 1);
    if (S.time - p.lastFireT < 0.2) { st.gunfire = Math.min(1, st.gunfire + 0.30); }
    st.playerHurt = 1 - (p.health.hp / p.health.max);
    st.dark = el.inDark ? 1 : 0;

    var target = clamp(st.threat * 0.55 + st.gunfire * 0.2 + st.playerHurt * 0.25 +
                       st.dark * 0.15 + (el.grabbedBy >= 0 ? 1 : 0), 0, 1);
    /* proximity to the player is calming - this is the mechanic that teaches
       players to stay close without a tutorial saying so */
    var pd = distXZ(el.pos, p.pos);
    if (pd < 2.5) { target -= 0.20; }
    if (S.flags.safeRoom) { target -= 0.5; }
    target = clamp(target, 0, 1);

    var rate = target > el.fear ? 1.4 : 0.35;
    el.fear += (target - el.fear) * Math.min(1, dt * rate);
    el.fear = clamp(el.fear, 0, 1);
    el.fearSmoothed += (el.fear - el.fearSmoothed) * Math.min(1, dt * 2);

    var tier = el.fear > 0.72 ? 'panic' : (el.fear > 0.38 ? 'tense' : 'calm');
    if (tier !== el.fearTier) {
      el.fearTier = tier;
      emit('elena_fear', { fear: el.fear, tier: tier });
    }
  }

  function updateElena(S, input, dt) {
    var el = S.elena, p = S.player;
    if (!el.alive) { el.anim = 'death'; return; }
    el.behaviorT += dt;
    el.animT += dt;
    el.speed = 0;
    el.barkCD = Math.max(0, el.barkCD - dt);
    el.screamCD = Math.max(0, el.screamCD - dt);
    el.throwCD = Math.max(0, el.throwCD - dt);
    if (el.hurtT > 0) { el.hurtT -= dt; }

    elenaStress(S, dt);

    /* --- commands ------------------------------------------------------ */
    if (input) {
      if (input.cmdFollow) { el.order = 'follow'; setBehavior(S, 'Follow'); }
      else if (input.cmdStay) { el.order = 'stay'; setBehavior(S, 'Stay'); }
      else if (input.cmdHide) { el.order = 'hide'; setBehavior(S, 'Hide'); }
      else if (input.cmdCome) { el.order = 'follow'; setBehavior(S, 'ComeHere'); }
      else if (input.cmdInteract) { setBehavior(S, 'Interact'); }
    }

    /* --- forced states override orders --------------------------------- */
    if (el.grabbedBy >= 0 && el.behavior !== 'Struggle') { setBehavior(S, 'Struggle'); }
    if (el.downed && el.behavior !== 'Downed') { setBehavior(S, 'Downed'); }

    var slot = _pv2;

    switch (el.behavior) {
      case 'Struggle': {
        var carrier = enemyById(S, el.grabbedBy);
        el.anim = 'grabbed';
        if (!carrier || carrier.dead) { releaseElenaGrab(S, carrier, 'carrier_down'); break; }
        el.carryT += dt;
        /* the carrier drags her toward the section edge */
        var ex = carrier.pos[0], ez = carrier.pos[2];
        el.pos[0] = ex + Math.sin(carrier.yaw) * 0.6;
        el.pos[2] = ez + Math.cos(carrier.yaw) * 0.6;
        el.pos[1] = carrier.pos[1];
        if (el.carryT > TUNE.elenaCarryTime) {
          killElena(S, 'taken');

      case 'Downed':

        el.downT += dt;

          el.downed = false; el.downT = 0;
          el.hp = Math.max(el.hp, el.maxHp * 0.35);
          el.revives++;
          setBehavior(S, 'Follow');
          emit('elena_revived', {});
        }
        break;

      case 'Stay':
        el.anim = el.fear > 0.6 ? 'cower' : 'idle';
        /* she still cowers if something gets close, but holds position */
        if (el.stress.threat > 0.6) { el.anim = 'cower'; }
        break;

      case 'Hide':
        el.anim = 'hide';
        break;

      case 'ComeHere':
        followSlot(S, slot);
        repath(S, el, p.pos, dt, 0.35);
        stepAlongPath(S, el, dt, 3.4);
        el.anim = 'run';
        if (distXZ(el.pos, p.pos) < 1.6) { setBehavior(S, 'Follow'); }
        break;

      case 'Interact':
        el.anim = 'idle';
        if (el.behaviorT > 1.6) { setBehavior(S, 'Follow'); }
        break;

      case 'TakeCover': {
        el.anim = 'walk';
        if (el.stress.threat < 0.35) { setBehavior(S, 'Follow'); break; }
        /* put the player between her and the threat */
        var bx = p.pos[0] * 2 - S.squad.lastKnown[0];
        var bz = p.pos[2] * 2 - S.squad.lastKnown[2];
        _pv[0] = bx; _pv[1] = p.pos[1]; _pv[2] = bz;
        repath(S, el, _pv, dt, 0.6);
        stepAlongPath(S, el, dt, 3.0);
        if (distXZ(el.pos, _pv) < 1.2) { el.anim = 'cower'; }
        break;
      }

      case 'Follow':
      default: {
        followSlot(S, slot);
        var dToSlot = distXZ(el.pos, slot);
        var dToPlayer = distXZ(el.pos, p.pos);

        /* combat: get behind the player rather than trailing into fire */
        if (el.stress.threat > 0.55 && S.player.inCombat > 0) {
          setBehavior(S, 'TakeCover');
          break;
        }

        /* high fear: hesitate at the threshold of somewhere dark */
        if (el.fear > 0.8 && dToPlayer > 5 && !el.hesitating) {
          el.hesitating = true;
          el.hesitateT = 0;
          vset(el.hesitateAt, el.pos[0], el.pos[1], el.pos[2]);
          emit('elena_hesitate', { pos: vcopy(el.pos) });
        }
        if (el.hesitating) {
          el.hesitateT += dt;
          el.anim = 'cower';
          /* a ComeHere order, or the player getting close, breaks it */
          if (dToPlayer < 3.0 || el.fear < 0.62 || el.hesitateT > 6) {
            el.hesitating = false;
          }
          break;
        }

        if (dToSlot > 0.85) {
          var speed = dToPlayer > 8 ? 4.2 : (dToPlayer > 4 ? 3.2 : 1.9);
          speed *= (1 - el.fear * 0.18);
          repath(S, el, slot, dt, dToPlayer > 6 ? 0.3 : 0.55);
          var moved = stepAlongPath(S, el, dt, speed);
          el.anim = speed > 3.6 ? 'run' : (speed > 2.2 ? 'run' : 'walk');
          if (!moved) { el.anim = 'idle'; }
        } else {
          el.anim = el.fear > 0.7 ? 'cower' : 'idle';
          faceToward(el, p.pos[0], p.pos[2], 4, dt);
        }
        break;
      }
    }

    /* always keep out of the player's line of fire */
    if (el.behavior !== 'Struggle' && el.behavior !== 'Downed') { avoidFiringLine(S, dt); }

    /* --- limited self-defence ------------------------------------------ */
    if (el.behavior !== 'Struggle' && el.alive) {
      /* emergency scream pulls aggro off the player */
      if (el.screamCD <= 0 && p.health.hp / p.health.max < 0.25 && el.stress.threat > 0.7) {
        el.screamCD = 45;
        S.squad.lastKnownT = S.time;
        vset(S.squad.lastKnown, el.pos[0], el.pos[1], el.pos[2]);
        for (var si = 0; si < S.enemies.length; si++) {
          var se = S.enemies[si];
          if (se.dead) { continue; }
          if (distXZ(se.pos, el.pos) < 14) { se.distracted = 4.0; }
        }
        emit('elena_scream', { pos: vcopy(el.pos) });
      }
      /* throw something at a staggered enemy */
      if (el.throwCD <= 0 && el.fear < 0.8) {
        for (var ti = 0; ti < S.enemies.length; ti++) {
          var te = S.enemies[ti];
          if (te.dead || !te.staggered) { continue; }
          if (distXZ(te.pos, el.pos) > 9) { continue; }
          el.throwCD = 8;
          damageEnemy(S, te, 12, 'thrown', te.pos, null, 'torso', 8);
          emit('elena_throw', { target: te.id, pos: vcopy(el.pos) });
          break;
        }
      }
      /* call out an enemy the player cannot see */
      if (S.time - el.lastCallout > 6) {
        for (var ci = 0; ci < S.enemies.length; ci++) {
          var ce = S.enemies[ci];
          if (ce.dead) { continue; }
          if (distXZ(ce.pos, p.pos) > 16) { continue; }
          if (canSee(S, { pos: p.pos, yaw: p.aimYaw || p.yaw, height: 1.7, kind: 'player' }, ce.pos)) { continue; }
          if (!canSee(S, { pos: el.pos, yaw: el.yaw, height: 1.6, kind: 'elena' }, ce.pos)) { continue; }
          el.lastCallout = S.time;
          emit('elena_callout', { target: ce.id, pos: vcopy(ce.pos), kind: ce.kind });
          break;
        }
      }
    }

    /* keep her on the ground and inside the world */
    el.pos[1] = navSampleHeight(S, el.pos[0], el.pos[2]);
    sanitizeVec(el.pos);
  }

  /* ======================================================================
     SECTION -- INVENTORY
     ====================================================================== */
  var Inventory = {
    fits: function (S, item, x, y, rot, ignoreUid) {
      var inv = S.inventory;
      var def = ITEMS[item.item || item.id] || ITEMS[item];
      if (!def) { return false; }
      var w = rot ? def.h : def.w, h = rot ? def.w : def.h;
      if (x < 0 || y < 0 || x + w > inv.w || y + h > inv.h) { return false; }
      for (var i = 0; i < inv.items.length; i++) {
        var o = inv.items[i];
        if (ignoreUid !== undefined && o.uid === ignoreUid) { continue; }
        var od = ITEMS[o.item];
        if (!od) { continue; }
        var ow = o.rot ? od.h : od.w, oh = o.rot ? od.w : od.h;
        if (x < o.x + ow && x + w > o.x && y < o.y + oh && y + h > o.y) { return false; }
      }
      return true;
    },
    findSlot: function (S, itemId) {
      var inv = S.inventory;
      for (var r = 0; r < 2; r++) {
        for (var y = 0; y < inv.h; y++) {
          for (var x = 0; x < inv.w; x++) {
            if (Inventory.fits(S, { item: itemId }, x, y, r === 1)) {
              return { x: x, y: y, rot: r === 1 };
            }
          }
        }
      }
      return null;
    },
    add: function (S, itemId, qty) {
      var def = ITEMS[itemId];
      if (!def) { return false; }
      qty = qty || 1;
      var i, o;
      /* stack first */
      if (def.stack > 1) {
        for (i = 0; i < S.inventory.items.length; i++) {
          o = S.inventory.items[i];
          if (o.item === itemId && o.qty < def.stack) {
            var room = def.stack - o.qty;
            var take = Math.min(room, qty);
            o.qty += take; qty -= take;
            if (qty <= 0) { emit('pickup', { item: itemId, name: def.name, qty: take }); return true; }
          }
        }
      }
      while (qty > 0) {
        var slot = Inventory.findSlot(S, itemId);
        if (!slot) { emit('inventory_full', { item: itemId }); return false; }
        var take2 = Math.min(def.stack || 1, qty);
        S.inventory.items.push({
          uid: S.inventory.nextUid++, item: itemId,
          x: slot.x, y: slot.y, rot: slot.rot, qty: take2

        qty -= take2;
      }
      emit('pickup', { item: itemId, name: def.name, qty: qty });
      return true;
    },
    remove: function (S, uid, qty) {
      var items = S.inventory.items;
      for (var i = 0; i < items.length; i++) {
        if (items[i].uid !== uid) { continue; }
        items[i].qty -= (qty || 1);
        if (items[i].qty <= 0) { items.splice(i, 1); }
        return true;
      }
      return false;
    },
    count: function (S, itemId) {
      var n = 0;
      for (var i = 0; i < S.inventory.items.length; i++) {
        if (S.inventory.items[i].item === itemId) { n += S.inventory.items[i].qty; }
      }
      return n;
    },
    consume: function (S, itemId, qty) {
      qty = qty || 1;
      var items = S.inventory.items;
      for (var i = items.length - 1; i >= 0 && qty > 0; i--) {
        if (items[i].item !== itemId) { continue; }
        var take = Math.min(items[i].qty, qty);
        items[i].qty -= take; qty -= take;
        if (items[i].qty <= 0) { items.splice(i, 1); }
      }
      return qty === 0;
    },
    move: function (S, uid, x, y, rot) {
      var items = S.inventory.items;
      for (var i = 0; i < items.length; i++) {
        if (items[i].uid !== uid) { continue; }
        if (!Inventory.fits(S, items[i], x, y, rot, uid)) { return false; }
        items[i].x = x; items[i].y = y; items[i].rot = !!rot;
        return true;
      }
      return false;
    },
    combine: function (S, uidA, uidB) {
      var a = null, b = null, i;
      for (i = 0; i < S.inventory.items.length; i++) {
        if (S.inventory.items[i].uid === uidA) { a = S.inventory.items[i]; }
        if (S.inventory.items[i].uid === uidB) { b = S.inventory.items[i]; }
      }
      if (!a || !b) { return false; }
      for (i = 0; i < RECIPES.length; i++) {
        var r = RECIPES[i];
        var match = (r.a === a.item && r.b === b.item) || (r.a === b.item && r.b === a.item);
        if (!match) { continue; }
        Inventory.remove(S, a.uid, 1);
        Inventory.remove(S, b.uid, 1);

  function updateUI(S, dt) {
    if (!S || !el.hud) { return; }

      var segCount = h.segments || 6;
      var perSeg = h.max / segCount;

      for (i = 0; i < el.segEls.length; i++) {
        var lo = i * perSeg;

    if (S.objective) {
      var otxt = S.objective;

    /* extraction clock */
    var ec = S.extractionClock;
    if (ec && ec.active) {
      showEl(el.clock, true);
      var t = Math.max(0, ec.timeLeft);
      setText(el.clock, Math.floor(t / 60) + ':' + ('0' + Math.floor(t % 60)).slice(-2));
    } else { showEl(el.clock, false); }

    /* reticle */
    var aiming = !!S.player.aiming;
    togC(el.ret, 'on', aiming);
    togC(el.dot, 'on', aiming);
    if (aiming && IP.Systems && IP.Systems.getAimCone) {
      var cone = IP.Systems.getAimCone(S) || 0.05;
      var spread = 8 + cone * 260;
      for (i = 0; i < el.retParts.length; i++) {
        var p2 = el.retParts[i];
        if (!p2 || !p2.style) { continue; }
        var axis = i < 2 ? 'translateY' : 'translateX';
        var signed = (i === 0 || i === 2) ? -spread : spread;
        sty(p2, 'transform', axis + '(' + signed + 'px)');
      }
    }

    /* subtitle timer */
    if (subT > 0) {
      subT -= dt;
      if (subT <= 0) { el.subs.replaceChildren(); nextSub(); }

    /* toasts */
    for (i = toastQ.length - 1; i >= 0; i--) {
      toastQ[i].t -= dt;

        remC(toastQ[i].el, 'on');

    if (grabbed !== IN.qte) { Input_.setQTE(grabbed); }

  var UI_ = {

    { id: 'r_p01', speaker: 'ANVIL', trigger: 'game_start', dur: 4.9, text: "WARDEN, ANVIL. Confirming custody of PHOENIX. Do not transmit her name on this net again." },
    { id: 'r_p02', speaker: 'ANVIL', trigger: 'p_reach_lift', dur: 4.6, text: "Your exfil window moved. I want to say weather. It is not weather. Keep moving east." },
    { id: 'r_p03', speaker: 'CARRION-6', trigger: 'p_reach_lift', dur: 5.8, text: "WARDEN, CARRION-6 on the boat, cold and dry and drinking coffee from a thermos that leaks. Life is unfair." },

    { id: 'r_a101', speaker: 'ANVIL', trigger: 'a1_cross_labs', dur: 5.8, text: "West research is ARGOS proper. Hostiles in there wore lab coats this morning. It will not slow them down." },
    { id: 'r_a102', speaker: 'ANVIL', trigger: 'a1_seal_gas', dur: 6.7, text: "Cryo line three ruptured at oh-one-fifty. That is thirty minutes before you cut her lock. Somebody vented it deliberately." },
    { id: 'r_a103', speaker: 'CARRION-6', trigger: 'a1_seal_gas', dur: 5.3, text: "Reminder from the aviation community: fuel-air explosions are indoor sports. Do not play indoors." },
    { id: 'r_a104', speaker: 'ANVIL', trigger: 'a1_containment', dur: 6.3, text: "Containment B has hard UV emitters on the ceiling rail. They still hold charge. The organism hates 265 nanometers." },
    { id: 'r_a105', speaker: 'ANVIL', trigger: 'a1_power', dur: 5.8, text: "Feeders in order: yard, then plant, then main. Wrong order trips the bus and I lose you for four minutes." },
    { id: 'r_a106', speaker: 'ANVIL', trigger: 'power_restored', dur: 4.6, text: "Cameras are live. I have eyes on you for the first time tonight. You look terrible." },
    { id: 'r_a107', speaker: 'ANVIL', trigger: 'a1_intercom', dur: 6.3, text: "That voice on the overhead is Doctor Miren Haldane. She is a named subject on three warrants and I want her alive." },
    { id: 'r_a108', speaker: 'ANVIL', trigger: 'opt_okonkwo', dur: 5.9, text: "There is a heat signature in a locker down there and lockers do not have heat signatures. Your call, WARDEN." },
    { id: 'r_a109', speaker: 'ANVIL', trigger: 'safe_room', dur: 7.4, text: "Elena. The incision at your brainstem is a delivery site. It is dormant. Dormant is not the same as safe and I will not tell you it is." },
    { id: 'r_a110', speaker: 'ANVIL', trigger: 'a1_yard', dur: 5.0, text: "Roll door is chain-hoist. Two people, one minute. Put her on the chain and cover the ramp." },
    { id: 'r_a111', speaker: 'CARRION-6', trigger: 'a1_yard', dur: 5.8, text: "Weather is walking in from the southeast like it owns the place. If you are going outside, go outside now." },
    { id: 'r_a112', speaker: 'ANVIL', trigger: 'a1_boss', dur: 4.6, text: "Whatever that is, it was a person at shift change. Aim for the growth, not the man." },

    { id: 'r_a201', speaker: 'ANVIL', trigger: 'act2_start', dur: 6.0, text: "Rain is going to cost you twenty meters of sight and every footstep you have. It costs them the same. Use it." },
    { id: 'r_a202', speaker: 'ANVIL', trigger: 'a2_motor_pool', dur: 6.1, text: "Motor pool is open ground with sight lines from the tower. Do not cross the middle. Nobody crosses the middle." },
    { id: 'r_a203', speaker: 'ANVIL', trigger: 'a2_mast', dur: 5.9, text: "I am losing you on the primary. Get that mast vertical or the next thirty minutes are you alone in the dark." },
    { id: 'r_a204', speaker: 'ANVIL', trigger: 'a2_mast_down', dur: 3.9, text: "WARDEN, say again. WARDEN. ...Static. All stations, hold this net open." },
    { id: 'r_a205', speaker: 'CARRION-6', trigger: 'a2_comms_restored', dur: 5.7, text: "There he is. There he is. Twenty-two minutes of nothing and I aged a year, WARDEN. Do not do that again." },
    { id: 'r_a206', speaker: 'ANVIL', trigger: 'a2_chapel', dur: 6.3, text: "That is not a church, it is a switchboard. Serrano preaches into a PA loop and the whole island hears him at once." },
    { id: 'r_a207', speaker: 'ANVIL', trigger: 'a2_causeway', dur: 5.0, text: "Correction to my last: PHOENIX has the tide right and I had it wrong. Plot updated. Go now." },
    { id: 'r_a208', speaker: 'ANVIL', trigger: 'a2_sluice', dur: 5.4, text: "The village drowned in 1974 on purpose. Somebody opened those sluices to bury a quarantine failure." },
    { id: 'r_a209', speaker: 'ANVIL', trigger: 'a2_cistern', dur: 6.2, text: "Sonar off the Fitzgerald says the cistern has a mass in it that is moving against the current. Just so you know." },
    { id: 'r_a210', speaker: 'ANVIL', trigger: 'a2_cannery', dur: 6.0, text: "Merse has forty men and a payroll problem. Half of them will run if he goes down. The other half already ran." },
    { id: 'r_a211', speaker: 'ANVIL', trigger: 'a2_merse', dur: 5.7, text: "Viktor Merse. Six years on the ARGOS gate, one very bad decision, and a spreadsheet he will die holding." },
    { id: 'r_a212', speaker: 'CARRION-6', trigger: 'a2_merse_down', dur: 4.7, text: "Thermal shows the compound quieting down. That was the man with the radio, then. Nice." },
    { id: 'r_a213', speaker: 'ANVIL', trigger: 'opt_tomas', dur: 5.0, text: "There is a kid in that tower, WARDEN. Eleven years old. I am not going to make it an order." },
    { id: 'r_a214', speaker: 'ANVIL', trigger: 'a2_quiet', dur: 5.7, text: "You have not asked me about the abort criteria. I know you read the OPORD annex. I am aware you read it." },
    { id: 'r_a215', speaker: 'ANVIL', trigger: 'a2_quiet2', dur: 6.1, text: "Section four says if the ovule matures you leave her. I wrote that section. I would like you to know I argued." },

    { id: 'r_a301', speaker: 'CARRION-6', trigger: 'act3_start', dur: 6.5, text: "CARRION-6 is airborne. Ceiling four hundred, viz garbage, and a headwind with a personal grudge. Thirty-eight minutes." },
    { id: 'r_a302', speaker: 'ANVIL', trigger: 'act3_start', dur: 5.7, text: "Clock is on your display now. It is real. Everything you do from here costs seconds you do not get back." },
    { id: 'r_a303', speaker: 'ANVIL', trigger: 'a3_cliffs', dur: 5.7, text: "Fixed line on that cliff is 1990s Spanish Navy. Two sections are rotten. Send the lighter climber first." },
    { id: 'r_a304', speaker: 'ANVIL', trigger: 'a3_catacombs', dur: 6.2, text: "The catacombs predate everything. Monastery ossuary, sixteenth century. Serrano moved the archive into the annex." },
    { id: 'r_a305', speaker: 'ANVIL', trigger: 'a3_serrano', dur: 6.8, text: "Serrano is the broadcaster. Every dormant ovule on this rock is waiting on his voice. Take the voice, you take the harvest." },
    { id: 'r_a306', speaker: 'ANVIL', trigger: 'opt_archive', dur: 6.4, text: "If you burn that core, ARGOS loses twelve years and so does everybody else. Command wants it intact. I want it gone." },
    { id: 'r_a307', speaker: 'ANVIL', trigger: 'a3_bridge', dur: 6.0, text: "Trestle 3 was condemned in 2019 and never repaired. It is the only span. I am sorry, that is the whole brief." },
    { id: 'r_a308', speaker: 'CARRION-6', trigger: 'bridge_collapse', dur: 3.8, text: "Yeah, I saw that. I am going to pretend I did not see that. Continue." },
    { id: 'r_a309', speaker: 'ANVIL', trigger: 'a3_signal', dur: 5.1, text: "Dock lamp, three long flashes. He will pick it out of the storm. He is better than he sounds." },
    { id: 'r_a310', speaker: 'CARRION-6', trigger: 'a3_signal_ack', dur: 4.9, text: "I have your lamp. Three long, tally. Turning inbound. Do not die in the next six minutes." },
    { id: 'r_a311', speaker: 'ANVIL', trigger: 'a3_hold', dur: 6.3, text: "Everything left on that island is walking up the access road in one column. Fight the road. Do not fight the field." },
    { id: 'r_a312', speaker: 'CARRION-6', trigger: 'final_stand', dur: 6.1, text: "Two minutes. I am going to put this thing down in a place that will look reckless. It is reckless. Stand clear." },
    { id: 'r_a313', speaker: 'ANVIL', trigger: 'extraction', dur: 4.3, text: "Skids down. WARDEN, get her aboard and then get yourself aboard. In that order." },

    });

    U.on('boss_phase', function (ev) {
      shake(0.14, 16);
      if (has('Audio', 'play')) { IP.Audio.play('stinger_boss'); }
      if (ev && ev.phase === 1) { playDialogue('boss_serrano'); }
    });

    U.on('save', function () { if (has('UI', 'toast')) { IP.UI.toast('Progress saved'); } });

    U.on('ui_command', function (ev) {
      if (!ev) { return; }
      if (ev.cmd === 'resume') { setPaused(false); }
      else if (ev.cmd === 'quality') { setQuality(ev.value); }
      else if (ev.cmd === 'restart') { restart(); }
      else if (ev.cmd === 'save' && has('Systems', 'Save')) {
        attempt('save', function () { IP.Systems.Save.save(Game.S); });
      }
      else if (ev.cmd === 'load') { loadSave(); }
      else if (ev.cmd === 'newgame') { startNewGame(); }
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Boot                                                               */
  /* ------------------------------------------------------------------ */
  var canvas = null, uiRoot = null;

  function boot() {
    canvas = document.getElementById('ip-canvas');
    uiRoot = document.getElementById('ip-ui');
    if (!canvas) {
      if (window.IP_BOOT) { window.IP_BOOT.fail('Missing canvas', 'ip-canvas element not found'); }
      return;
    }

    progress(0.05, 'Starting renderer');
    var ok = attempt('Renderer.init', function () {
      return has('Renderer', 'init') ? IP.Renderer.init(canvas, {}) : false;
    }, false);
    if (!ok) {
      if (window.IP_BOOT) {
        window.IP_BOOT.fail('WebGL 2 unavailable',
          'This game needs WebGL 2.\n\n' +
          'On iOS make sure you are on iOS 15 or newer.\n' +
          'On desktop enable hardware acceleration in your browser settings.\n\n' +
          Game.err.join('\n'));
      }
      return;
    }

    /* pick a starting quality from the device */
    var isTouch = (has('Input', 'init') && IP.Input.isTouch) ||
                  ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var mem = navigator.deviceMemory || 4;
    Game.quality = isTouch ? (mem >= 6 ? 1 : 0) : (mem >= 8 ? 2 : 1);
    setQuality(Game.quality);

    progress(0.12, 'Building interface');
    attempt('UI.init', function () { if (has('UI', 'init')) { IP.UI.init(uiRoot); } });
    attempt('Input.init', function () { if (has('Input', 'init')) { IP.Input.init(canvas, uiRoot); } });
    attempt('Audio.init', function () { if (has('Audio', 'init')) { IP.Audio.init(); } });

    progress(0.2, 'Assembling characters');
    attempt('Actors.build', function () { if (has('Actors', 'build')) { IP.Actors.build(); } });
    rigs.player = acquireRig('player');
    rigs.elena = acquireRig('elena');

    progress(0.3, 'Generating the island');
    Game.level = attempt('Level.build', function () {
      return has('Level', 'build') ? IP.Level.build(20260810) : null;
    }, null);
    if (!Game.level) {
      Game.level = fallbackLevel();
      note('Level', 'using fallback level');
    }

    progress(0.4, 'Uploading terrain');
    attempt('uploadLevel', function () { uploadLevel(Game.level); });

    progress(0.85, 'Priming systems');
    initWeather(1500);
    wireEvents();

    progress(0.95, 'Ready');
    Game.booted = true;

    startNewGame(true);
    if (window.IP_BOOT) { window.IP_BOOT.done(); }
    if (has('UI', 'show')) { IP.UI.show('title'); }

    Game.running = true;
    last = U.now();
    requestAnimationFrame(frame);
  }

  /* A minimal playable room so the game still boots if level generation dies. */
  function fallbackLevel() {
    var floor = { min: [-30, -1, -30], max: [30, 0, 30], tag: 'floor' };
    return {
      sections: [{
        id: 'fallback', name: 'Containment', act: 'prologue',
        bounds: { min: [-30, 0, -30], max: [30, 8, 30] },
        geo: { opaque: [], transparent: [] },
        props: [], spawns: [], triggers: [],
        lights: [{ pos: [0, 5, 0], color: [1, 0.3, 0.22], range: 30, intensity: 4, flicker: 0.3 }]
      }],
      transitions: [],
      collision: { boxes: [floor], ramps: [], water: [], ladders: [], doors: [] },
      navQuery: {
        isWalkable: function (x, z) { return x > -29 && x < 29 && z > -29 && z < 29; },
        sampleHeight: function () { return 0; },
        findPath: function (from, to, out) {
          out = out || []; out.length = 0;
          out.push([to[0], to[1], to[2]]);
          return out;
        }
      }
    };
  }

  function startNewGame(silent) {
    Game.S = attempt('createWorldState', function () {
      return has('Systems', 'createWorldState') ? IP.Systems.createWorldState(20260810) : null;
    }, null);
    if (!Game.S) { Game.S = minimalState(); note('Systems', 'using minimal state'); }
    Game.S.level = Game.level;
    Game.S._rt = Game.S._rt || {};
    Game.S._rt.level = Game.level;
    director.fired = {}; director.queue.length = 0; director.dialogueTimer = 0;
    refreshActiveSections(Game.S.section || Game.level.sections[0].id);
    placeAtStart(Game.S);
    cam.yaw = Game.S.player.yaw || 0;
    cam.pitch = 0.05;
    V3.copy(cam.pos, Game.S.player.pos);
    if (!silent) {
      if (has('UI', 'show')) { IP.UI.show('hud'); }
      playDialogue('game_start');
    }
  }

  /* Authored spawn points: the prologue opens at the west end of the holding
     block, facing the corridor the player has to run down. */
  var SECTION_STARTS = {
    cells: { pos: [-19.5, 0, 0], yaw: 1.5708 },
    labs: { pos: [0, 0, 7.5], yaw: 3.1416 },
    power: { pos: [0, 0, 18], yaw: 3.1416 },
    compound: { pos: [0, 0, 30], yaw: 3.1416 },
    village: { pos: [0, 0, -26], yaw: 0 },
    cliffs: { pos: [-32, 0.25, -28], yaw: 1.5708 },
    tunnels: { pos: [-25, 0, 0], yaw: 1.5708 },
    docks: { pos: [-27, 0, 0], yaw: 1.5708 }
  };
  function placeAtStart(S) {
    var st = SECTION_STARTS[S.section];
    if (!st) { return; }
    S.player.pos[0] = st.pos[0]; S.player.pos[1] = st.pos[1]; S.player.pos[2] = st.pos[2];
    S.player.yaw = st.yaw; S.player.pitch = 0;
    cam.yaw = st.yaw;
    if (S.elena) {
      S.elena.pos[0] = st.pos[0] - Math.sin(st.yaw) * 1.6;
      S.elena.pos[1] = st.pos[1];
      S.elena.pos[2] = st.pos[2] - Math.cos(st.yaw) * 1.6;
      if (S.elena.path) { S.elena.path.length = 0; }
    }
    V3.copy(cam.pos, S.player.pos);
  }

  function minimalState() {
    return {
      time: 0, section: (Game.level && Game.level.sections[0].id) || 'fallback',
      act: 'prologue', objective: '', flags: {}, stats: {}, difficulty: 1,
      player: {
        pos: V3.create(0, 0, 0), vel: V3.create(), yaw: 0, aimYaw: 0, aimPitch: 0,
        health: { hp: 600, max: 600, segments: 6 }, stamina: 100,
        aiming: false, sprinting: false, pitch: 0,
        crouching: false, flashlight: true, speed: 0, anim: 'idle', animT: 0
      },
      elena: {
        pos: V3.create(1.5, 0, 1.5), yaw: 0, hp: 240, maxHp: 240, alive: true,
        fear: 0.5, speed: 0, anim: 'idle', animT: 0, dead: false, grabbed: false
      },
      enemies: [], projectiles: [], pickups: [], props: [], effects: []
    };
  }

  function loadSave() {
    var data = attempt('Save.load', function () {
      return has('Systems', 'Save') && IP.Systems.Save.load ? IP.Systems.Save.load() : null;
    }, null);
    if (!data) { if (has('UI', 'toast')) { IP.UI.toast('No save found'); } return; }
    Game.S = data;
    Game.S.level = Game.level;
    Game.S._rt = Game.S._rt || {};
    refreshActiveSections(Game.S.section);
    cam.yaw = Game.S.player.yaw || 0;
    V3.copy(cam.pos, Game.S.player.pos);
    if (has('UI', 'show')) { IP.UI.show('hud'); }
  }

  function restart() { startNewGame(false); setPaused(false); }

  function endGame(reason) {
    Game.paused = true;
    var ending = attempt('evaluateEnding', function () {
      return has('Systems', 'evaluateEnding') ? IP.Systems.evaluateEnding(Game.S, reason) : null;
    }, null);
    if (has('UI', 'show')) { IP.UI.show(reason === 'extraction' ? 'results' : 'gameover', { reason: reason, ending: ending }); }
    if (has('Audio', 'music')) { IP.Audio.music(reason === 'extraction' ? 'safe' : 'gameover'); }
  }

  function setPaused(p) {
    Game.paused = !!p;
    if (has('UI', 'show')) { IP.UI.show(Game.paused ? 'pause' : 'hud'); }
    if (has('Audio', 'setPaused')) { IP.Audio.setPaused(Game.paused); }
  }

  function setQuality(q) {
    Game.quality = U.clamp(q | 0, 0, 2);
    scene.quality = Game.quality;
    if (has('Renderer', 'setQuality')) { attempt('setQuality', function () { IP.Renderer.setQuality(Game.quality); }); }
  }

  /* ------------------------------------------------------------------ */
  /*  Frame loop                                                         */
  /* ------------------------------------------------------------------ */
  var last = 0, acc = 0, FIXED = 1 / 60, MAXSTEP = 5;
  var fpsAvg = 60, autoScaleTimer = 0;
  var noInput = {
    moveX: 0, moveY: 0, lookX: 0, lookY: 0, aim: false, fire: false, firePressed: false,
    reload: false, sprint: false, crouch: false, interact: false, interactPressed: false,
    melee: false, meleePressed: false, swapPressed: false, inventoryPressed: false,
    flashlight: false, cmdFollow: false, cmdStay: false, cmdHide: false,
    cmdInteract: false, cmdCome: false, pausePressed: false, qteTapped: false, dt: 0
  };

  function frame(now) {
    if (!Game.running) { return; }
    requestAnimationFrame(frame);

    var dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) { dt = FIXED; }
    if (dt > 0.25) { dt = 0.25; }
    fpsAvg = fpsAvg * 0.94 + (1 / Math.max(dt, 1e-4)) * 0.06;

    var S = Game.S;
    if (!S) { return; }

    var input = attempt('Input.poll', function () {
      return has('Input', 'poll') ? IP.Input.poll(dt) : noInput;
    }, noInput) || noInput;

    if (input.pausePressed) { setPaused(!Game.paused); }

    scene.time += Game.paused ? 0 : dt;

    if (!Game.paused) {
      /* fixed-step simulation, variable-step presentation */
      acc += dt;
      var steps = 0;
      while (acc >= FIXED && steps < MAXSTEP) {
        updateCamera(S, steps === 0 ? input : noInput, FIXED);
        attempt('Systems.update', function () {
          if (has('Systems', 'update')) { IP.Systems.update(S, input, FIXED); }
        });
        acc -= FIXED; steps++;
      }
      if (steps === MAXSTEP) { acc = 0; }
      if (steps === 0) { updateCamera(S, input, dt); }

      updateDirector(S, dt);
      updateParticles(dt);
    } else {
      updateCamera(S, noInput, dt);
    }

    /* ---- assemble the frame ---- */
    reset(scene.items);
    reset(scene.transparent);
    reset(scene.sprites);
    spriteCursor = 0;

    for (var i = 0; i < staticItems.length; i++) { scene.items.push(staticItems[i]); }
    for (var k = 0; k < activeSections.length; k++) {
      var e = gpuSections[activeSections[k]];
      if (!e) { continue; }
      for (var t = 0; t < e.transparent.length; t++) { scene.transparent.push(e.transparent[t]); }
    }

    groundY = S.player.pos[1];

    /* the player body is hidden when the camera is inside it */
    if (rigs.player && cam.dist > 0.75) {
      drawActor(rigs.player, S.player.pos, S.player.aimYaw !== undefined ? S.player.aimYaw : S.player.yaw,
                S.player, dt);
    }
    if (rigs.elena && S.elena) {
      S.elena.anim = S.elena.anim || 'idle';
      drawActor(rigs.elena, S.elena.pos, S.elena.yaw || 0, S.elena, dt);
    }
    syncEnemyRigs(S, dt);

    updateWeather(Game.paused ? 0 : dt, S);
    assembleLights(S, dt);

    scene.post.flashbang = Math.max(0, scene.post.flashbang - dt * 1.6);
    scene.post.rainLens = (1 - weather.indoor) * weather.rainIntensity * 0.45;
    scene.sun.intensity = 0.80 * (1 - weather.indoor * 0.55);
    scene.fog.density = 0.026 + weather.indoor * 0.02 + (1 - weather.indoor) * weather.rainIntensity * 0.014;

    if (!Game.dbg.noRender) {
      attempt('renderFrame', function () {
        if (has('Renderer', 'renderFrame')) { IP.Renderer.renderFrame(scene, dt); }
      });
    }

    attempt('UI.update', function () { if (has('UI', 'update')) { IP.UI.update(S, dt); } });
    if (has('Audio', 'setListener')) {
      attempt('setListener', function () { IP.Audio.setListener(cam.pos, cam.quat); });
    }

    /* auto quality scaling: drop a tier if we stay under budget for 4s */
    autoScaleTimer += dt;
    if (autoScaleTimer > 12) {
      autoScaleTimer = 0;
      var budget = (IP.Input && IP.Input.isTouch) ? 27 : 48;
      if (fpsAvg < budget && Game.quality > 0 &&
          !(IP.UI && IP.UI.settings && IP.UI.settings.lockQuality)) {
        setQuality(Game.quality - 1);
        if (has('UI', 'toast')) { IP.UI.toast('Graphics lowered for performance'); }
      }
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Resize                                                             */
  /* ------------------------------------------------------------------ */
  function onResize() {
    if (!canvas) { return; }
    var dpr = Math.min(window.devicePixelRatio || 1, Game.quality === 0 ? 1.25 : 2);
    var w = Math.max(1, canvas.clientWidth || window.innerWidth);
    var h = Math.max(1, canvas.clientHeight || window.innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    if (has('Renderer', 'resize')) { attempt('resize', function () { IP.Renderer.resize(w, h, dpr); }); }
    if (has('UI', 'resize')) { attempt('ui-resize', function () { IP.UI.resize(w, h); }); }
    var rot = document.getElementById('ip-rotate');
    if (rot) { rot.classList.add('armed'); }
  }

  /* ------------------------------------------------------------------ */
  Game.boot = boot;
  Game.setQuality = setQuality;
  Game.setPaused = setPaused;
  Game.restart = restart;
  Game.shake = shake;
  Game.burst = burst;
  Game.cam = cam;
  Game.scene = scene;
  Game.say = say;
  Game.playDialogue = playDialogue;
  IP.Game = Game;

  if (typeof window !== 'undefined') {
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', function () { setTimeout(onResize, 260); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && Game.running && !Game.paused) { setPaused(true); }
    });
    var go = function () {
      onResize();
      try { boot(); } catch (e) {
        note('boot', e);
        if (window.IP_BOOT) { window.IP_BOOT.fail('Startup failed', (e && e.stack) || String(e)); }
      }
    };
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(go, 0);
    } else {
      document.addEventListener('DOMContentLoaded', go);
    }
  }
})();

</script>
