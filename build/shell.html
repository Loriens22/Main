<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STEVE — The PC Repair Man</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="description" content="Steve fixes computers. Steve also fixes other things.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05070a; color: #cfe8dc;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", monospace;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* ---- boot screen (pre-UI, must stand alone) ---- */
  #boot {
    position: fixed; inset: 0; z-index: 100; background: #05070a;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; transition: opacity .6s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .logo {
    font-size: clamp(18px, 5.2vw, 34px); letter-spacing: .34em;
    color: #39d98a; text-shadow: 0 0 18px rgba(57,217,138,.35);
    text-align: center; line-height: 1.5;
  }
  #boot .sub {
    font-size: 12px; letter-spacing: .22em; color: #4d6b60; text-align: center;
  }
  #boot .track {
    width: min(320px, 72vw); height: 2px; background: #12211b; overflow: hidden;
  }
  #boot-bar {
    height: 100%; width: 0%; background: #39d98a; transition: width .25s ease;
    box-shadow: 0 0 10px rgba(57,217,138,.6);
  }
  #boot-label { font-size: 11px; letter-spacing: .16em; color: #3d5a50; height: 14px; }
  #boot .tip {
    position: absolute; bottom: calc(22px + env(safe-area-inset-bottom));
    font-size: 10px; letter-spacing: .14em; color: #2a3f38; text-align: center;
    padding: 0 18px; max-width: 90vw;
  }
  .sg-fatal {
    position: fixed; inset: 0; z-index: 999; background: #05070a; color: #ff6b6b;
    display: flex; align-items: center; justify-content: center; padding: 32px;
    text-align: center; font-size: 15px; line-height: 1.6;
  }
  @keyframes sg-blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
  #boot .cursor { animation: sg-blink 1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001s !important; transition-duration: .001s !important; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>

<div id="boot">
  <div class="logo">STEVE<br><span style="font-size:.52em;letter-spacing:.3em;color:#7fd6ae">THE PC REPAIR MAN</span></div>
  <div class="track"><div id="boot-bar"></div></div>
  <div id="boot-label">Starting<span class="cursor">_</span></div>
  <div class="sub">NO PARTS ORDERED · NO DATA LOST · CASH ONLY</div>
  <div class="tip">Everything you are about to see — every texture, every sound, every voice — is generated on your device as it loads.</div>
</div>

<script>/*__THREE__*/</script>
<script>/*__GAME__*/</script>
<script>
  (function () {
    function go() {
      if (window.SG && window.SG.main) { window.SG.main(); }
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(go, 0);
    } else {
      document.addEventListener('DOMContentLoaded', go);
    }
  })();
</script>
</body>
</html>
