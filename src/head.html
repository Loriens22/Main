<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rate Problem — A Quantitative Audit of Human Life Extension</title>
<meta name="description" content="A rigorous, citation-audited study of what is actually proven about extending human lifespan, and a formal framework separating interventions that shift the survival curve from those that slow aging itself.">
<style>
/* ============================ RESET & TOKENS ============================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,figure,blockquote,dl,dd,ul,ol{margin:0}
ul[role=list],ol[role=list]{list-style:none;padding:0}
img,svg,canvas{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}

:root{
  --bg:#07080b; --bg2:#0b0d12; --panel:#10131a; --panel2:#151924;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#e9ecf3; --tx2:#aab3c4; --tx3:#6f7a8f;
  --rate:#3fd0c9;      /* teal  - true rate change / good */
  --offset:#f3a952;    /* amber - offset interventions */
  --err:#f2777a;       /* red   - errors, harms */
  --theory:#a98bf5;    /* violet- theory */
  --data:#63a4ff;      /* blue  - data/evidence */
  --ok:#5fd28a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --maxw:900px;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.35);
}
html[data-theme=light]{
  --bg:#fbfaf8; --bg2:#f4f2ee; --panel:#ffffff; --panel2:#f7f6f3;
  --line:rgba(10,15,25,.12); --line2:rgba(10,15,25,.22);
  --tx:#15181f; --tx2:#4a5262; --tx3:#78808f;
  --rate:#0d8f88; --offset:#b26a09; --err:#c0392f; --theory:#6d43c9; --data:#1f5fbf; --ok:#1f8a4c;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 8px 30px rgba(20,25,40,.08);
}

/* ============================ BASE ============================ */
body{
  background:var(--bg); color:var(--tx);
  font-family:var(--serif); font-size:18px; line-height:1.72;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
p{margin:0 0 1.1em;color:var(--tx)}
p.lead{font-size:1.16em;line-height:1.62;color:var(--tx)}
a{color:var(--data);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--data) 35%,transparent)}
a:hover{border-bottom-color:var(--data)}
strong{font-weight:650;color:var(--tx)}
em{font-style:italic}
code,kbd{font-family:var(--mono);font-size:.86em;background:var(--panel2);padding:.12em .38em;border-radius:4px;border:1px solid var(--line)}
sup.ref{font-family:var(--sans);font-size:.62em;font-weight:600;vertical-align:super;color:var(--data);cursor:pointer;padding:0 .12em}
h1,h2,h3,h4{font-family:var(--sans);font-weight:640;line-height:1.2;letter-spacing:-.02em;color:var(--tx)}
h2{font-size:clamp(1.7rem,4.2vw,2.5rem);margin:0 0 .5em}
h3{font-size:clamp(1.18rem,2.6vw,1.42rem);margin:2.4em 0 .7em;letter-spacing:-.012em}
h4{font-size:1.02rem;margin:1.8em 0 .5em;color:var(--tx2);font-weight:620;
   text-transform:uppercase;letter-spacing:.09em;font-size:.78rem}

/* ============================ NAV ============================ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:90;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 16px;
  font-family:var(--sans);font-size:.8rem;
}
#topbar .brand{font-weight:660;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .brand span{color:var(--tx3);font-weight:450}
#progress{position:fixed;top:52px;left:0;height:2px;background:linear-gradient(90deg,var(--rate),var(--data));z-index:91;width:0;transition:width .1s linear}
.btn{
  background:var(--panel);border:1px solid var(--line2);color:var(--tx2);
  border-radius:7px;padding:6px 11px;cursor:pointer;font-family:var(--sans);
  font-size:.76rem;font-weight:560;transition:.16s;white-space:nowrap;
}
.btn:hover{background:var(--panel2);color:var(--tx);border-color:var(--tx3)}
.btn.on{background:var(--rate);color:#04211f;border-color:var(--rate)}
html[data-theme=light] .btn.on{color:#fff}
#navtoggle{margin-left:auto}

#toc{
  position:fixed;top:52px;bottom:0;left:0;width:310px;z-index:89;
  background:var(--bg2);border-right:1px solid var(--line);
  overflow-y:auto;padding:18px 0 60px;font-family:var(--sans);
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#toc.open{transform:none}
#toc .grp{padding:16px 22px 6px;font-size:.66rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--tx3)}
#toc a{
  display:flex;gap:11px;align-items:baseline;padding:7px 22px;font-size:.83rem;
  color:var(--tx2);border:0;line-height:1.35;transition:.14s;
}
#toc a:hover{background:var(--panel);color:var(--tx)}
#toc a.active{color:var(--rate);background:color-mix(in srgb,var(--rate) 9%,transparent);
  box-shadow:inset 3px 0 0 var(--rate)}
#toc a .n{font-family:var(--mono);font-size:.72rem;color:var(--tx3);min-width:1.9em;flex:none}
#toc a.active .n{color:var(--rate)}
#scrim{position:fixed;inset:52px 0 0;background:rgba(0,0,0,.5);z-index:88;opacity:0;
  pointer-events:none;transition:opacity .28s}
#scrim.on{opacity:1;pointer-events:auto}
@media(min-width:1400px){
  #toc{transform:none;width:290px}
  #scrim{display:none}
  #navtoggle{display:none}
  main{margin-left:290px}
}

/* ============================ SECTIONS ============================ */
main{padding-top:52px}
section.page{
  padding:76px 0 84px;border-top:1px solid var(--line);position:relative;
  scroll-margin-top:54px;
}
section.page:first-of-type{border-top:0}
.eyebrow{
  font-family:var(--sans);font-size:.7rem;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx3);margin-bottom:1.1em;display:flex;
  align-items:center;gap:11px;
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--tx3);flex:none}
.eyebrow.rate{color:var(--rate)} .eyebrow.rate::before{background:var(--rate)}
.eyebrow.err{color:var(--err)} .eyebrow.err::before{background:var(--err)}
.eyebrow.theory{color:var(--theory)} .eyebrow.theory::before{background:var(--theory)}
.eyebrow.offset{color:var(--offset)} .eyebrow.offset::before{background:var(--offset)}
.dek{font-size:1.2em;line-height:1.6;color:var(--tx2);margin:-.2em 0 1.9em;max-width:46em}

/* ============================ FIGURES / PANELS ============================ */
.fig{
  margin:2.4em 0;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
}
.fig-head{
  padding:15px 20px 13px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
}
.fig-title{font-family:var(--sans);font-size:.83rem;font-weight:650;letter-spacing:.01em}
.fig-title .tag{
  font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);display:block;margin-bottom:3px;
}
.fig-body{padding:18px 20px 20px}
.fig-body.tight{padding:10px}
.fig-cap{
  padding:13px 20px 16px;border-top:1px solid var(--line);background:var(--panel2);
  font-family:var(--sans);font-size:.78rem;line-height:1.62;color:var(--tx2);
}
.fig-cap b{color:var(--tx);font-weight:640}
.canvas-host{position:relative;width:100%}
canvas{width:100%;display:block;border-radius:8px;touch-action:pan-y}

/* full-bleed figure */
.fig.wide{max-width:1180px;margin-left:50%;transform:translateX(-50%);width:calc(100vw - 48px)}
@media(min-width:1400px){.fig.wide{width:min(1180px,calc(100vw - 290px - 48px))}}

/* ============================ CONTROLS ============================ */
.ctrls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;
  padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel2);
  font-family:var(--sans)}
.ctrl{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1 1 150px}
.ctrl label{font-size:.68rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tx3);display:flex;justify-content:space-between;gap:8px}
.ctrl label .v{font-family:var(--mono);color:var(--rate);letter-spacing:0;text-transform:none;font-weight:600}
.ctrl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:2px}
.ctrl input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:2px}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--rate);margin-top:-6px;border:2px solid var(--bg);
  box-shadow:0 0 0 1px var(--rate)}
.ctrl input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
  background:var(--rate);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--rate)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;font-size:.74rem;font-weight:560;
  color:var(--tx2);cursor:pointer;transition:.14s;font-family:var(--sans)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--rate);color:#04211f}
html[data-theme=light] .seg button.on{color:#fff}
.seg button:not(.on):hover{background:var(--panel)}

/* ============================ READOUTS ============================ */
.readout{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);
  border-top:1px solid var(--line);font-family:var(--sans)}
.readout .r{flex:1 1 120px;background:var(--panel);padding:12px 16px}
.readout .r .k{font-size:.62rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:3px}
.readout .r .v{font-family:var(--mono);font-size:1.3rem;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.readout .r .v.rate{color:var(--rate)} .readout .r .v.offset{color:var(--offset)}
.readout .r .v.err{color:var(--err)} .readout .r .v.data{color:var(--data)}
.readout .r .s{font-size:.66rem;color:var(--tx3);margin-top:2px}

/* ============================ CALLOUTS ============================ */
.callout{
  margin:2.2em 0;padding:20px 24px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);position:relative;font-size:.97em;
}
.callout .ct{font-family:var(--sans);font-size:.68rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;margin-bottom:.7em}
.callout p:last-child{margin-bottom:0}
.callout.key{border-left:3px solid var(--rate);background:color-mix(in srgb,var(--rate) 6%,var(--panel))}
.callout.key .ct{color:var(--rate)}
.callout.warn{border-left:3px solid var(--err);background:color-mix(in srgb,var(--err) 6%,var(--panel))}
.callout.warn .ct{color:var(--err)}
.callout.theory{border-left:3px solid var(--theory);background:color-mix(in srgb,var(--theory) 6%,var(--panel))}
.callout.theory .ct{color:var(--theory)}
.callout.caveat{border-left:3px solid var(--tx3);background:var(--panel2)}
.callout.caveat .ct{color:var(--tx3)}

/* ============================ MATH ============================ */
.eq{
  margin:1.7em 0;padding:20px 24px;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;font-family:var(--mono);font-size:1.02rem;text-align:center;
  overflow-x:auto;color:var(--tx);letter-spacing:.01em;
}
.eq .lbl{display:block;font-family:var(--sans);font-size:.66rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:.8em;text-align:left}
.eq sub{font-size:.72em} .eq sup{font-size:.76em}
.eq .hl{color:var(--rate);font-weight:600}
.eq .hl2{color:var(--offset);font-weight:600}
.varlist{font-family:var(--sans);font-size:.79rem;color:var(--tx2);margin-top:1em;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 20px;text-align:left}
.varlist b{font-family:var(--mono);color:var(--tx);font-weight:600}

/* ============================ TABLES ============================ */
.tbl-scroll{overflow-x:auto;margin:2em 0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.data{font-family:var(--sans);font-size:.8rem;min-width:620px}
table.data th{
  text-align:left;padding:11px 14px;font-size:.64rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx3);border-bottom:1px solid var(--line2);
  background:var(--panel2);position:sticky;top:0;white-space:nowrap;cursor:default;
}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--tx)}
table.data th.sortable::after{content:"⇅";opacity:.3;margin-left:5px;font-size:.9em}
table.data th.asc::after{content:"↑";opacity:.9;color:var(--rate)}
table.data th.desc::after{content:"↓";opacity:.9;color:var(--rate)}
table.data td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover{background:var(--panel2)}
table.data td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
table.data td.name{font-weight:600;color:var(--tx)}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:.66rem;font-weight:700;
  letter-spacing:.04em;border:1px solid;white-space:nowrap;font-family:var(--sans)}
.pill.A{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.B{color:var(--rate);border-color:color-mix(in srgb,var(--rate) 45%,transparent);background:color-mix(in srgb,var(--rate) 12%,transparent)}
.pill.C{color:var(--data);border-color:color-mix(in srgb,var(--data) 45%,transparent);background:color-mix(in srgb,var(--data) 12%,transparent)}
.pill.D{color:var(--offset);border-color:color-mix(in srgb,var(--offset) 45%,transparent);background:color-mix(in srgb,var(--offset) 12%,transparent)}
.pill.E{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent);background:color-mix(in srgb,var(--err) 12%,transparent)}
.pill.n{color:var(--tx3);border-color:var(--line2);background:transparent}

/* ============================ LISTS ============================ */
ul.tick,ol.num{margin:1.2em 0;padding-left:0;list-style:none}
ul.tick li,ol.num li{position:relative;padding-left:1.9em;margin-bottom:.75em}
ul.tick li::before{content:"";position:absolute;left:.35em;top:.62em;width:6px;height:6px;
  border-radius:50%;background:var(--rate)}
ol.num{counter-reset:n}
ol.num li{counter-increment:n}
ol.num li::before{content:counter(n);position:absolute;left:0;top:.16em;font-family:var(--mono);
  font-size:.74em;font-weight:700;color:var(--rate);border:1px solid color-mix(in srgb,var(--rate) 40%,transparent);
  width:1.55em;height:1.55em;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ============================ MISC ============================ */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:2em 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h5{font-family:var(--sans);font-size:.9rem;font-weight:650;margin:0 0 .5em}
.card p{font-size:.88rem;line-height:1.6;color:var(--tx2);margin-bottom:0}
.srcnote{font-family:var(--sans);font-size:.72rem;color:var(--tx3);margin-top:.6em;line-height:1.5}
hr.rule{border:0;border-top:1px solid var(--line);margin:3em 0}
.center{text-align:center}
.muted{color:var(--tx2)}
.small{font-size:.86em}

/* refs */
ol.refs{counter-reset:r;list-style:none;padding:0;font-family:var(--sans);font-size:.79rem;line-height:1.6}
ol.refs li{counter-increment:r;position:relative;padding-left:2.6em;margin-bottom:.85em;color:var(--tx2)}
ol.refs li::before{content:"[" counter(r) "]";position:absolute;left:0;font-family:var(--mono);
  font-size:.76em;color:var(--tx3);font-weight:600}
ol.refs li b{color:var(--tx);font-weight:620}

/* Reveal on scroll. Uses the independent `translate` property, NOT `transform`,
   so it composes with the translateX(-50%) that centres full-bleed figures
   instead of clobbering it. */
.rv{opacity:0;translate:0 16px;transition:opacity .7s cubic-bezier(.2,.6,.2,1),translate .7s cubic-bezier(.2,.6,.2,1)}
.rv.in{opacity:1;translate:none}
@media(prefers-reduced-motion:reduce){
  .rv{opacity:1;translate:none;transition:none}
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
@media(max-width:640px){
  body{font-size:16.5px}
  .wrap{padding:0 18px}
  section.page{padding:56px 0 62px}
  .fig.wide{width:calc(100vw - 36px)}
  .eq{font-size:.9rem;padding:16px 14px}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">The Rate Problem <span>· a quantitative audit of human life extension</span></div>
  <button class="btn" id="themebtn" title="Toggle light/dark">◐</button>
  <button class="btn" id="navtoggle">☰ Contents</button>
</div>
<div id="progress"></div>
<div id="scrim"></div>
<nav id="toc" aria-label="Table of contents"></nav>

<main>
