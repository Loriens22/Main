const LOG = [
  { id: 'r4', g: 'geometry', t: { en: 'The fourth spatial dimension', bg: 'Четвъртото пространствено измерение' }, holo: 'extrude',
    eq: ['\\mathbb{R}^4=\\{(x,y,z,w)\\mid x,y,z,w\\in\\mathbb{R}\\}', 'd(\\mathbf{p},\\mathbf{q})=\\sqrt{\\Delta x^2+\\Delta y^2+\\Delta z^2+\\Delta w^2}', '\\mathbf{e}_i\\cdot\\mathbf{e}_j=\\delta_{ij},\\quad i,j\\in\\{1,2,3,4\\}'],
    en: '<p>A point of four-dimensional Euclidean space ℝ⁴ is simply a list of four real numbers (x, y, z, w). The fourth coordinate is a <i>spatial</i> direction perpendicular to x, y and z — not time. Every rule of Euclidean geometry carries over: distance is Pythagoras’ theorem with one more term, and the four unit vectors are mutually orthogonal.</p>{eq0}{eq1}{eq2}<p>Charles Howard Hinton (1888) named the two directions along w <i>ana</i> and <i>kata</i>. ℝ⁴ is as consistent as ℝ³; whether physical space has a fourth macroscopic dimension is a separate, experimental question — see “Do extra dimensions exist?”.</p>',
    bg: '<p>Точка от четиримерното евклидово пространство ℝ⁴ е просто наредена четворка реални числа (x, y, z, w). Четвъртата координата е <i>пространствена</i> посока, перпендикулярна на x, y и z — не време. Всички правила на евклидовата геометрия се запазват: разстоянието се дава от Питагоровата теорема с още едно събираемо, а четирите единични вектора са взаимно ортогонални.</p>{eq0}{eq1}{eq2}<p>Чарлз Хауърд Хинтън (1888) нарича двете посоки по w <i>ана</i> и <i>ката</i>. ℝ⁴ е толкова непротиворечиво, колкото и ℝ³; дали физичното пространство има четвърто макроскопично измерение, е отделен, експериментален въпрос — вижте „Съществуват ли допълнителни измерения?“.</p>',
    refs: ['hinton88', 'coxeter', 'banchoff'] },
  { id: 'tesseract', g: 'geometry', t: { en: 'Extrusion and the tesseract', bg: 'Екструзия и тесерактът' }, holo: 'extrude',
    eq: ['V=\\{(\\pm1,\\pm1,\\pm1,\\pm1)\\}', 'f_k(\\gamma_n)=2^{\\,n-k}\\,\\frac{n!}{k!\\,(n-k)!}', 'f(\\gamma_4)=(16,\\;32,\\;24,\\;8)', 'V-E+F-C=16-32+24-8=0'],
    en: '<p>Sweeping a k-dimensional cube one unit along a new perpendicular axis produces a (k+1)-cube: every vertex is doubled and every old vertex contributes one new edge. The 4-cube — Hinton’s <i>tesseract</i>, also called the 8-cell, Schläfli symbol {4,3,3} — has the 16 vertices below. Its boundary is made of 8 cubic cells, 24 squares, 32 edges and 16 vertices.</p>{eq0}<p>The number of k-dimensional faces of the n-cube γₙ is</p>{eq1}{eq2}<p>Euler’s relation for convex 4-polytopes checks the count:</p>{eq3}<div class="note">In the hologram the tesseract is drawn in perspective: the cell farther along w looks smaller and sits inside the nearer one. All eight cells are congruent cubes.</div>',
    bg: '<p>Ако преместим k-мерен куб с една единица по нова перпендикулярна ос, получаваме (k+1)-мерен куб: всеки връх се удвоява, а всеки стар връх дава един нов ръб. Четиримерният куб — <i>тесерактът</i> на Хинтън, наричан още осмоклетник, символ на Шлефли {4,3,3} — има 16-те върха по-долу. Границата му се състои от 8 кубични клетки, 24 квадрата, 32 ръба и 16 върха.</p>{eq0}<p>Броят на k-мерните стени на n-мерния куб γₙ е</p>{eq1}{eq2}<p>Формулата на Ойлер за изпъкнали четиримерни политопи потвърждава преброяването:</p>{eq3}<div class="note">В холограмата тесерактът е в перспектива: клетката, която е по-далеч по w, изглежда по-малка и стои вътре в по-близката. И осемте клетки са еднакви кубове.</div>',
    refs: ['hinton88', 'hinton04', 'coxeter'] },
  { id: 'slices', g: 'geometry', t: { en: 'Slices, Flatland and the hypersphere', bg: 'Сечения, „Плоска земя“ и хиперсферата' }, holo: 'slice',
    eq: ['r(w)=\\sqrt{R^2-w^2},\\qquad |w|\\le R', '\\mathrm{Vol}_3(S^3_R)=2\\pi^2R^3', '\\mathrm{Vol}_4(B^4_R)=\\frac{1}{2}\\pi^2R^4'],
    en: '<p>A three-dimensional observer perceives only the intersection of a four-dimensional object with their own hyperplane — a 3D slice. Abbott’s <i>Flatland</i> (1884) is the classic analogy: a sphere crossing a plane appears to its inhabitants as a point that grows into a circle and shrinks away.</p><p>A 3-sphere (glome) of radius R crossing our space along w appears as an ordinary sphere of radius</p>{eq0}<p>Its three-dimensional “surface” volume and the four-dimensional volume it encloses are</p>{eq1}{eq2}<p>The same object produces very different slices depending on the orientation of the slicing hyperplane — see “Hinton’s slices of the tesseract”.</p>',
    bg: '<p>Тримерният наблюдател възприема само сечението на четиримерния обект със своята хиперравнина — тримерно сечение. „Плоска земя“ на Абът (1884) е класическата аналогия: сфера, която пресича равнина, изглежда за обитателите ѝ като точка, която нараства в кръг и после изчезва.</p><p>Тримерна сфера (хиперсфера) с радиус R, преминаваща през нашето пространство по w, изглежда като обикновена сфера с радиус</p>{eq0}<p>Нейният тримерен „повърхнинен“ обем и заграденият четиримерен обем са</p>{eq1}{eq2}<p>Един и същ обект дава много различни сечения в зависимост от ориентацията на сечащата хиперравнина — вижте „Сеченията на Хинтън“.</p>',
    refs: ['abbott', 'hinton04', 'banchoff'] },
  { id: 'projection', g: 'geometry', t: { en: 'Projections: orthographic, perspective, stereographic', bg: 'Проекции: ортографска, перспективна, стереографска' }, holo: 'project',
    eq: ['P_{\\mathrm{orth}}(x,y,z,w)=(x,y,z)', 'P_{\\mathrm{persp}}(x,y,z,w)=\\frac{d}{d-w}\\,(x,y,z)', 'P_{\\mathrm{stereo}}(x,y,z,w)=\\frac{(x,y,z)}{1-w},\\qquad x^2+y^2+z^2+w^2=1'],
    en: '<p>Projections map <i>all</i> of a 4D object into 3D, as a shadow maps a 3D object onto a wall.</p>{eq0}<p>Orthographic projection discards w. Perspective projection divides by the distance along w from a 4D eye at w = d, so the far cell of a tesseract appears smaller and nested inside the near one — the familiar “cube within a cube”.</p>{eq1}<p>Stereographic projection first places points on the unit 3-sphere and projects from the pole (0,0,0,1). It is conformal (angle-preserving) and maps circles to circles or lines — which is why edges appear as arcs.</p>{eq2}<p>A. Michael Noll produced some of the first computer animations of rotating hyperobjects at Bell Labs in the 1960s.</p>',
    bg: '<p>Проекциите изобразяват <i>целия</i> четиримерен обект в 3D, така както сянката изобразява тримерен обект върху стена.</p>{eq0}<p>Ортографската проекция изпуска w. Перспективната проекция дели на разстоянието по w от четиримерно око при w = d, затова далечната клетка на тесеракта изглежда по-малка и вложена в близката — познатият „куб в куб“.</p>{eq1}<p>Стереографската проекция първо поставя точките върху единичната тримерна сфера и проектира от полюса (0,0,0,1). Тя е конформна (запазва ъглите) и изобразява окръжностите в окръжности или прави — затова ръбовете изглеждат като дъги.</p>{eq2}<p>А. Майкъл Нол създава едни от първите компютърни анимации на въртящи се хиперобекти в Bell Labs през 60-те години.</p>',
    refs: ['noll', 'hollasch', 'hanson92', 'banchoff'] },
  { id: 'rotation', g: 'geometry', t: { en: 'Rotation in four dimensions', bg: 'Въртене в четири измерения' }, holo: 'project',
    eq: ['R_{xw}(\\theta):\\;\\; x\'=x\\cos\\theta-w\\sin\\theta,\\quad w\'=x\\sin\\theta+w\\cos\\theta', '\\#\\,\\text{planes}=\\frac{n(n-1)}{2}=6\\quad (n=4)', 'R(\\alpha,\\beta)=R_{xy}(\\alpha)\\,R_{zw}(\\beta)', '\\mathbf{q}\\mapsto\\mathbf{l}\\,\\mathbf{q}\\,\\mathbf{r},\\qquad |\\mathbf{l}|=|\\mathbf{r}|=1'],
    en: '<p>A rotation of ℝⁿ that turns in a single plane fixes the orthogonal subspace of dimension n − 2. In 3D that subspace is a line — an axis. In 4D it is a whole plane, so a rotation is described by the plane in which it turns, not by an axis.</p>{eq0}{eq1}<p>The general rotation of ℝ⁴ is a <i>double rotation</i>: angle α in one plane and β in the completely orthogonal plane; when both are non-zero only the origin stays fixed. When α = ±β the rotation is <i>isoclinic</i>.</p>{eq2}<p>Identifying ℝ⁴ with the quaternions ℍ, every rotation can be written as below with unit quaternions l and r; pure left or pure right multiplications are exactly the isoclinic rotations.</p>{eq3}',
    bg: '<p>Въртене в ℝⁿ, което завърта само една равнина, оставя неподвижно ортогоналното подпространство с размерност n − 2. В 3D то е права — ос. В 4D то е цяла равнина, затова въртенето се описва с равнината, в която се върти, а не с ос.</p>{eq0}{eq1}<p>Общото въртене в ℝ⁴ е <i>двойно въртене</i>: ъгъл α в една равнина и β в напълно ортогоналната ѝ; когато и двата са ненулеви, неподвижно остава само началото. При α = ±β въртенето е <i>изоклинно</i>.</p>{eq2}<p>Ако отъждествим ℝ⁴ с кватернионите ℍ, всяко въртене се записва както по-долу с единични кватерниони l и r; само ляво или само дясно умножение дава точно изоклинните въртения.</p>{eq3}',
    refs: ['conway', 'coxeter', 'hanson06'] },
  { id: 'hinton_slices', g: 'geometry', t: { en: 'Hinton’s slices of the tesseract', bg: 'Сеченията на Хинтън на тесеракта' }, holo: 'slice',
    eq: ['\\mathbf{n}\\cdot\\mathbf{x}=s,\\qquad \\mathbf{x}\\in[-1,1]^4', 'O=R_{xw}(30^\\circ)\\,R_{yw}(\\arctan\\tfrac{1}{\\sqrt{2}})\\,R_{zw}(45^\\circ),\\qquad O\\,\\tfrac{1}{2}(1,1,1,1)=\\mathbf{e}_w'],
    en: '<p>Slicing the tesseract [−1,1]⁴ by the hyperplanes n·x = s gives different families of polyhedra depending on n:</p>{eq0}<table><tr><th>orientation</th><th>normal n ∝</th><th>slices</th></tr><tr><td>cell-first</td><td>(0,0,0,1)</td><td>cubes</td></tr><tr><td>face-first</td><td>(0,0,1,1)</td><td>square prisms, 2×2×2√2 at the centre</td></tr><tr><td>edge-first</td><td>(0,1,1,1)</td><td>triangular prisms near the ends, hexagonal prisms through the middle</td></tr><tr><td>vertex-first</td><td>(1,1,1,1)</td><td>tetrahedra → truncated tetrahedra → a regular octahedron at the centre</td></tr></table><p>The lever in the Bulk applies the rotations below, which carry these normals onto the w-axis, so walking along w sweeps the slice through the tesseract. The game identifies each slice by intersecting the polytope’s edges, 2-faces and cells with your hyperplane.</p>{eq1}',
    bg: '<p>Сечението на тесеракта [−1,1]⁴ с хиперравнините n·x = s дава различни семейства многостени в зависимост от n:</p>{eq0}<table><tr><th>ориентация</th><th>нормала n ∝</th><th>сечения</th></tr><tr><td>с клетка напред</td><td>(0,0,0,1)</td><td>кубове</td></tr><tr><td>със стена напред</td><td>(0,0,1,1)</td><td>квадратни призми, 2×2×2√2 в центъра</td></tr><tr><td>с ръб напред</td><td>(0,1,1,1)</td><td>триъгълни призми близо до краищата, шестоъгълни през средата</td></tr><tr><td>с връх напред</td><td>(1,1,1,1)</td><td>тетраедри → пресечени тетраедри → правилен октаедър в центъра</td></tr></table><p>Лостът в Обема прилага въртенията по-долу, които пренасят тези нормали върху оста w, така че движението по w мести сечението през тесеракта. Играта разпознава всяко сечение, като пресича ръбовете, двумерните стени и клетките на политопа с вашата хиперравнина.</p>{eq1}',
    refs: ['hinton04', 'banchoff', 'coxeter'] },
  { id: 'polytopes', g: 'geometry', t: { en: 'The six regular 4-polytopes', bg: 'Шестте правилни четиримерни политопа' }, holo: 'poly',
    eq: ['\\{p,q,r\\}:\\;\\text{cells }\\{p,q\\},\\; r\\text{ cells around each edge}'],
    en: '<p>A regular convex polytope has congruent regular faces and congruent vertex figures. In four dimensions there are exactly six, found by Ludwig Schläfli around 1852 (published 1901). In five or more dimensions only three families remain: simplex, hypercube and cross-polytope.</p>{eq0}<table><tr><th>polytope</th><th>Schläfli</th><th>V</th><th>E</th><th>F</th><th>C</th><th>cells</th></tr><tr><td>5-cell</td><td>{3,3,3}</td><td>5</td><td>10</td><td>10</td><td>5</td><td>tetrahedra</td></tr><tr><td>tesseract</td><td>{4,3,3}</td><td>16</td><td>32</td><td>24</td><td>8</td><td>cubes</td></tr><tr><td>16-cell</td><td>{3,3,4}</td><td>8</td><td>24</td><td>32</td><td>16</td><td>tetrahedra</td></tr><tr><td>24-cell</td><td>{3,4,3}</td><td>24</td><td>96</td><td>96</td><td>24</td><td>octahedra</td></tr><tr><td>120-cell</td><td>{5,3,3}</td><td>600</td><td>1200</td><td>720</td><td>120</td><td>dodecahedra</td></tr><tr><td>600-cell</td><td>{3,3,5}</td><td>120</td><td>720</td><td>1200</td><td>600</td><td>tetrahedra</td></tr></table><p>The 5-cell and 24-cell are self-dual; the tesseract and 16-cell are duals, as are the 120-cell and 600-cell. The 24-cell has no analogue in any other dimension. Here all six are generated from coordinates (the 600-cell from the 120 unit quaternions of the binary icosahedral group, the 120-cell as its dual) and their combinatorics are computed, then rendered by clipping your 4D view rays against their facet half-spaces.</p>',
    bg: '<p>Правилният изпъкнал политоп има еднакви правилни стени и еднакви върхови фигури. В четири измерения те са точно шест, открити от Лудвиг Шлефли около 1852 г. (публикувано 1901 г.). В пет и повече измерения остават само три семейства: симплекс, хиперкуб и кросполитоп.</p>{eq0}<table><tr><th>политоп</th><th>Шлефли</th><th>V</th><th>E</th><th>F</th><th>C</th><th>клетки</th></tr><tr><td>петоклетник</td><td>{3,3,3}</td><td>5</td><td>10</td><td>10</td><td>5</td><td>тетраедри</td></tr><tr><td>тесеракт</td><td>{4,3,3}</td><td>16</td><td>32</td><td>24</td><td>8</td><td>кубове</td></tr><tr><td>16-клетник</td><td>{3,3,4}</td><td>8</td><td>24</td><td>32</td><td>16</td><td>тетраедри</td></tr><tr><td>24-клетник</td><td>{3,4,3}</td><td>24</td><td>96</td><td>96</td><td>24</td><td>октаедри</td></tr><tr><td>120-клетник</td><td>{5,3,3}</td><td>600</td><td>1200</td><td>720</td><td>120</td><td>додекаедри</td></tr><tr><td>600-клетник</td><td>{3,3,5}</td><td>120</td><td>720</td><td>1200</td><td>600</td><td>тетраедри</td></tr></table><p>Петоклетникът и 24-клетникът са самодуални; тесерактът и 16-клетникът са дуални, както и 120- и 600-клетникът. 24-клетникът няма аналог в никое друго измерение. Тук и шестте са генерирани от координати (600-клетникът — от 120-те единични кватерниона на бинарната икосаедрична група, 120-клетникът — като негов дуален), комбинаториката им е изчислена, а изобразяването става чрез отрязване на вашите 4D лъчи с полупространствата на стените им.</p>',
    refs: ['schlafli', 'coxeter', 'conway'] },
  { id: 'glome', g: 'geometry', t: { en: 'The 3-sphere and the Hopf fibration', bg: 'Тримерната сфера и фибрацията на Хопф' }, holo: 'hopf',
    eq: ['S^3=\\{\\mathbf{x}\\in\\mathbb{R}^4:\\;|\\mathbf{x}|=1\\}=\\{(z_1,z_2)\\in\\mathbb{C}^2:\\;|z_1|^2+|z_2|^2=1\\}', 'h(z_1,z_2)=\\left(2z_1\\bar{z}_2,\\;|z_1|^2-|z_2|^2\\right)\\in S^2', 'T_{\\mathrm{Cl}}=\\{|z_1|=|z_2|=\\tfrac{1}{\\sqrt{2}}\\}'],
    en: '<p>The 3-sphere S³ is the set of points at a fixed distance from a centre in ℝ⁴: a curved three-dimensional space without boundary.</p>{eq0}<p>Heinz Hopf (1931) defined a map from S³ onto the ordinary sphere S² whose fibres are great circles; any two fibres are linked exactly once.</p>{eq1}<p>Under stereographic projection the fibres become linked circles that fill all of space, lying on nested tori (Villarceau circles). The Clifford torus sits at the “equator”. The same structure describes the Bloch sphere of a qubit and appears in Dirac’s magnetic monopole.</p>{eq2}',
    bg: '<p>Тримерната сфера S³ е множеството от точки на фиксирано разстояние от център в ℝ⁴: извито тримерно пространство без граница.</p>{eq0}<p>Хайнц Хопф (1931) дефинира изображение от S³ върху обикновената сфера S², чиито слоеве са големи окръжности; всеки два слоя са свързани точно веднъж.</p>{eq1}<p>При стереографска проекция слоевете стават свързани окръжности, които запълват цялото пространство и лежат върху вложени тори (окръжности на Вийарсо). Торът на Клифорд е на „екватора“. Същата структура описва сферата на Блох за кюбит и се появява в магнитния монопол на Дирак.</p>{eq2}',
    refs: ['hopf', 'banchoff', 'hanson06'] },
  { id: 'chirality', g: 'geometry', t: { en: 'Mirror images and the fourth dimension', bg: 'Огледалните образи и четвъртото измерение' },
    eq: ['R_{xw}(\\pi):\\;(x,y,z,w)\\mapsto(-x,\\,y,\\,z,\\,-w)', 'R_{xw}(\\pi)\\big|_{w=0}=\\;\\text{reflection } x\\mapsto -x'],
    en: '<p>No rotation in 3D turns a left hand into a right hand. August Möbius (1827) observed that a rotation through a fourth dimension can — just as a flat letter “L” can be flipped into its mirror image by lifting it out of its plane and turning it over.</p>{eq0}{eq1}<p>In the Bulk, turn 180° in a plane that contains w and the world returns mirror-reversed. Your slice is then the original space seen “from the other side” of the fourth dimension.</p>',
    bg: '<p>Никое въртене в 3D не превръща лява ръка в дясна. Аугуст Мьобиус (1827) забелязва, че въртене през четвърто измерение може — така както плоската буква „L“ може да се превърне в огледалния си образ, ако я вдигнем от равнината и я обърнем.</p>{eq0}{eq1}<p>В Обема се завъртете на 180° в равнина, съдържаща w, и светът ще се върне огледално обърнат. Тогава вашето сечение е първоначалното пространство, видяно „от другата страна“ на четвъртото измерение.</p>',
    refs: ['mobius', 'hinton04'] },
  { id: 'curvature', g: 'geometry', t: { en: 'Tensors, curvature and parallel transport', bg: 'Тензори, кривина и паралелно пренасяне' }, holo: 'curvature',
    eq: ['\\Gamma^\\lambda_{\\mu\\nu}=\\frac{1}{2}g^{\\lambda\\sigma}\\left(\\partial_\\mu g_{\\sigma\\nu}+\\partial_\\nu g_{\\sigma\\mu}-\\partial_\\sigma g_{\\mu\\nu}\\right)', '\\frac{dV^\\mu}{d\\lambda}+\\Gamma^\\mu_{\\nu\\rho}V^\\nu\\frac{dx^\\rho}{d\\lambda}=0', 'R^\\rho{}_{\\sigma\\mu\\nu}=\\partial_\\mu\\Gamma^\\rho_{\\nu\\sigma}-\\partial_\\nu\\Gamma^\\rho_{\\mu\\sigma}+\\Gamma^\\rho_{\\mu\\lambda}\\Gamma^\\lambda_{\\nu\\sigma}-\\Gamma^\\rho_{\\nu\\lambda}\\Gamma^\\lambda_{\\mu\\sigma}', 'N_{\\mathrm{Riem}}=\\frac{n^2(n^2-1)}{12}=20\\quad(n=4)', '\\Delta\\theta=\\iint_\\Sigma K\\,dA=\\frac{\\pi}{2}\\quad(\\text{octant of the unit sphere})'],
    en: '<p>Riemann (1854) generalised geometry to curved spaces of any dimension, described by a metric tensor g<sub>μν</sub>. Ricci-Curbastro and Levi-Civita (1901) built the “absolute differential calculus” — tensor calculus — and Levi-Civita (1917) defined parallel transport. The Christoffel symbols say how coordinate bases change from point to point:</p>{eq0}<p>A vector is parallel-transported along a curve x(λ) when</p>{eq1}<p>Carried around a closed loop, it returns rotated by an angle fixed by the curvature enclosed — the holonomy. The Riemann tensor measures this for every pair of directions; in n dimensions it has n²(n²−1)/12 independent components.</p>{eq2}{eq3}<p>On the unit sphere the octant triangle has three right angles and area π/2, so the transported arrow comes back turned by π/2:</p>{eq4}<p>Flat ℝ⁴ has R = 0 everywhere; the Schwarzschild spacetime does not, which is why light bends near Gargantua.</p>',
    bg: '<p>Риман (1854) обобщава геометрията за извити пространства с произволна размерност, описани с метричен тензор g<sub>μν</sub>. Ричи-Курбастро и Леви-Чивита (1901) създават „абсолютното диференциално смятане“ — тензорното смятане — а Леви-Чивита (1917) дефинира паралелното пренасяне. Символите на Кристофел показват как се променят координатните бази от точка до точка:</p>{eq0}<p>Вектор се пренася паралелно по крива x(λ), когато</p>{eq1}<p>Пренесен по затворен контур, той се връща завъртян на ъгъл, определен от заградената кривина — холономията. Тензорът на Риман измерва това за всяка двойка посоки; в n измерения той има n²(n²−1)/12 независими компоненти.</p>{eq2}{eq3}<p>Върху единичната сфера триъгълникът на октанта има три прави ъгъла и лице π/2, затова пренесената стрелка се връща завъртяна на π/2:</p>{eq4}<p>Плоското ℝ⁴ има R = 0 навсякъде; пространство-времето на Шварцшилд — не, и затова светлината се огъва около Гаргантюа.</p>',
    refs: ['riemann', 'ricci', 'levicivita', 'mtw'] },
  { id: 'schwarzschild', g: 'physics', t: { en: 'Schwarzschild black holes and gravitational lensing', bg: 'Черни дупки на Шварцшилд и гравитационно лещене' }, holo: 'lensing',
    eq: ['ds^2=-\\left(1-\\frac{r_s}{r}\\right)c^2dt^2+\\left(1-\\frac{r_s}{r}\\right)^{-1}dr^2+r^2\\,d\\Omega^2,\\qquad r_s=\\frac{2GM}{c^2}', '\\frac{d^2u}{d\\varphi^2}+u=\\frac{3}{2}\\,r_s\\,u^2,\\qquad u=\\frac{1}{r}', 'r_{\\mathrm{ph}}=\\frac{3}{2}\\,r_s,\\qquad b_c=\\frac{3\\sqrt{3}}{2}\\,r_s\\approx 2.598\\,r_s', '\\ddot{\\mathbf{x}}=-\\frac{3}{2}\\,r_s\\,h^2\\,\\frac{\\mathbf{x}}{|\\mathbf{x}|^5},\\qquad h=|\\mathbf{x}\\times\\dot{\\mathbf{x}}|=\\text{const}'],
    en: '<p>Karl Schwarzschild (1916) found the exact spacetime outside a non-rotating mass:</p>{eq0}<p>Light follows null geodesics. In the orbital plane their shape obeys the orbit equation</p>{eq1}<p>The photon sphere holds unstable circular light orbits; rays arriving with impact parameter b below b<sub>c</sub> are captured, which fixes the edge of the black hole’s shadow:</p>{eq2}<p><b>How this game renders it.</b> Every pixel integrates the Cartesian equation below, whose central force reproduces the orbit equation exactly, with velocity-Verlet steps that shrink near the hole. Wherever a path crosses the equatorial plane the accretion disk is sampled, so the lensed far side of the disk, the thin secondary ring and the Einstein ring of background stars all emerge from the physics rather than being painted.</p>{eq3}<p>Jean-Pierre Luminet computed the first such image of a black hole with a thin disk in 1979.</p>',
    bg: '<p>Карл Шварцшилд (1916) намира точното пространство-време извън невъртяща се маса:</p>{eq0}<p>Светлината следва нулеви геодезични. В равнината на орбитата формата им се подчинява на уравнението</p>{eq1}<p>Фотонната сфера съдържа неустойчиви кръгови орбити на светлина; лъчите с прицелен параметър b под b<sub>c</sub> биват погълнати, което определя ръба на сянката на черната дупка:</p>{eq2}<p><b>Как играта го изобразява.</b> Всеки пиксел интегрира декартовото уравнение по-долу, чиято централна сила възпроизвежда точно уравнението на орбитата, със стъпки по метода velocity-Verlet, които намаляват близо до дупката. Където пътят пресече екваториалната равнина, се взема проба от акреционния диск — така огънатата далечна страна на диска, тънкият вторичен пръстен и пръстенът на Айнщайн от фоновите звезди възникват от физиката, а не са нарисувани.</p>{eq3}<p>Жан-Пиер Люмине изчислява първото подобно изображение на черна дупка с тънък диск през 1979 г.</p>',
    refs: ['schwarzschild', 'mtw', 'luminet', 'james1'] },
  { id: 'kerr', g: 'physics', t: { en: 'Kerr black holes and Gargantua', bg: 'Черни дупки на Кер и Гаргантюа' },
    eq: ['ds^2=-\\left(1-\\frac{2Mr}{\\Sigma}\\right)dt^2-\\frac{4Mar\\sin^2\\theta}{\\Sigma}\\,dt\\,d\\phi+\\frac{\\Sigma}{\\Delta}dr^2+\\Sigma\\,d\\theta^2+\\left(r^2+a^2+\\frac{2Ma^2r\\sin^2\\theta}{\\Sigma}\\right)\\sin^2\\theta\\,d\\phi^2', '\\Sigma=r^2+a^2\\cos^2\\theta,\\qquad\\Delta=r^2-2Mr+a^2,\\qquad a=\\frac{J}{M}\\quad(G=c=1)'],
    en: '<p>Real black holes spin. Roy Kerr (1963) found the exact solution; in Boyer–Lindquist coordinates:</p>{eq0}{eq1}<p>Frame dragging shifts and flattens one side of the shadow and moves the innermost stable circular orbit inward for prograde orbits (Bardeen, Press & Teukolsky 1972).</p><p>For <i>Interstellar</i>, Double Negative’s renderer DNGR traced ray bundles through the Kerr metric (James, von Tunzelmann, Franklin & Thorne 2015). The plot calls for a nearly extremal spin, but the published imagery used a more moderate spin, and it deliberately omitted Doppler beaming and colour shifts so the disk would not look lopsided.</p><div class="note">This game traces the non-rotating Schwarzschild geometry exactly and does not claim to model frame dragging. Physical Doppler beaming (g⁴) can be switched on in Settings → Graphics.</div>',
    bg: '<p>Реалните черни дупки се въртят. Рой Кер (1963) намира точното решение; в координати на Бойер–Линдквист:</p>{eq0}{eq1}<p>Увличането на отправните системи измества и сплесква едната страна на сянката и придвижва навътре най-вътрешната устойчива кръгова орбита при правите орбити (Бардийн, Прес и Тюколски, 1972).</p><p>За <i>„Интерстелар“</i> рендерерът DNGR на Double Negative проследява снопове лъчи в метриката на Кер (Джеймс, фон Тунцелман, Франклин и Торн, 2015). Сюжетът изисква почти екстремално въртене, но публикуваните изображения използват по-умерено въртене и съзнателно изключват доплеровото усилване и цветните отмествания, за да не изглежда дискът несиметричен.</p><div class="note">Тази игра проследява точно геометрията на невъртящата се дупка на Шварцшилд и не твърди, че моделира увличането. Физичното доплерово усилване (g⁴) може да се включи от Настройки → Графика.</div>',
    refs: ['kerr', 'bpt', 'james1', 'thorne'] },
  { id: 'dilation', g: 'physics', t: { en: 'Time dilation, redshift and aberration', bg: 'Забавяне на времето, червено отместване и аберация' },
    eq: ['\\frac{d\\tau}{dt}=\\sqrt{1-\\frac{r_s}{r}}', '1+z=\\frac{1}{\\sqrt{1-r_s/r}}', '\\beta_{\\mathrm{ff}}=\\sqrt{\\frac{r_s}{r}}', '\\cos\\theta_s=\\frac{\\cos\\theta_o-\\beta}{1-\\beta\\cos\\theta_o},\\qquad \\frac{\\nu_o}{\\nu_s}=\\gamma\\,(1+\\beta\\cos\\theta_s)'],
    en: '<p>A clock held at rest at radius r ticks slowly compared with one far away; light climbing out of the well is redshifted by the same factor.</p>{eq0}{eq1}<p>An observer falling freely from rest at infinity passes the local static observers at speed β<sub>ff</sub>. Relativistic aberration then crowds incoming light toward the direction of motion and the Doppler factor shifts its frequency:</p>{eq2}{eq3}<p>The plunge display shows the static-observer values; the sky is rendered with aberration applied per pixel.</p>',
    bg: '<p>Часовник, държан неподвижно на радиус r, тиктака по-бавно от далечен часовник; светлината, която се изкачва от ямата, е отместена към червено със същия множител.</p>{eq0}{eq1}<p>Наблюдател, падащ свободно от покой в безкрайността, минава покрай локалните неподвижни наблюдатели със скорост β<sub>ff</sub>. Релативистката аберация събира идващата светлина към посоката на движение, а доплеровият множител променя честотата ѝ:</p>{eq2}{eq3}<p>Дисплеят при падането показва стойностите за неподвижен наблюдател; небето се изобразява с аберация, приложена за всеки пиксел.</p>',
    refs: ['mtw', 'thorne'] },
  { id: 'tidal', g: 'physics', t: { en: 'Tidal forces', bg: 'Приливни сили' },
    eq: ['\\Delta a\\approx\\frac{2GM}{r^3}\\,L', '\\Delta a_h=\\frac{c^6L}{4G^2M^2}\\;\\approx\\;2\\times10^{-6}\\,\\mathrm{m\\,s^{-2}}\\qquad(M=10^8M_\\odot,\\;L=2\\,\\mathrm{m})'],
    en: '<p>The difference in gravitational acceleration across a body of length L is</p>{eq0}<p>At the horizon r = r<sub>s</sub> = 2GM/c², so the tidal acceleration there falls as 1/M²: lethal for a stellar-mass black hole, utterly negligible for one of a hundred million solar masses.</p>{eq1}<p>That is why Thorne could let Cooper survive the plunge into Gargantua. In the game the hull stress is attributed to debris, and the readout “tidal Δa” shows the real value.</p>',
    bg: '<p>Разликата в гравитационното ускорение по протежение на тяло с дължина L е</p>{eq0}<p>На хоризонта r = r<sub>s</sub> = 2GM/c², така че приливното ускорение там намалява като 1/M²: смъртоносно за черна дупка със звездна маса и пренебрежимо за такава със сто милиона слънчеви маси.</p>{eq1}<p>Затова Торн може да остави Купър да оцелее при падането в Гаргантюа. В играта натоварването на корпуса идва от отломките, а показанието „приливно Δa“ дава реалната стойност.</p>',
    refs: ['mtw', 'thorne'] },
  { id: 'disk', g: 'physics', t: { en: 'Accretion disks', bg: 'Акреционни дискове' },
    eq: ['T(r)\\propto r^{-3/4}\\left(1-\\sqrt{\\frac{r_{\\mathrm{in}}}{r}}\\right)^{1/4}', 'r_{\\mathrm{ISCO}}=3\\,r_s\\quad(\\text{Schwarzschild}),\\qquad\\Omega=\\sqrt{\\frac{GM}{r^3}}', 'g=\\frac{\\nu_{\\mathrm{obs}}}{\\nu_{\\mathrm{em}}}=\\frac{\\sqrt{1-r_s/r}}{\\gamma\\,(1-\\beta\\cos\\theta)},\\qquad I_{\\mathrm{obs}}=g^4I_{\\mathrm{em}}'],
    en: '<p>Gas spiralling toward a black hole forms a thin disk that radiates as it loses orbital energy. In the standard thin-disk model (Shakura & Sunyaev 1973; relativistic form by Novikov & Thorne 1973) the effective temperature varies as</p>{eq0}<p>vanishing at the inner edge, taken here as the innermost stable circular orbit of the Schwarzschild metric. Material orbits at the Keplerian rate, so the inner disk turns faster; this differential rotation shears turbulence into the streaks you see.</p>{eq1}<p>With Doppler beaming enabled, each photon’s frequency ratio g and the invariance of I<sub>ν</sub>/ν³ give an observed bolometric intensity ∝ g⁴:</p>{eq2}<div class="note">The temperature scale is chosen for visible colour, as in the film; a real supermassive black hole’s disk peaks in the ultraviolet. The pod’s plunge path uses the Paczyński–Wiita style of pseudo-Newtonian reasoning only for pacing, not for the light.</div>',
    bg: '<p>Газът, който спираловидно пада към черна дупка, образува тънък диск, излъчващ при загубата на орбитална енергия. В стандартния модел на тънък диск (Шакура и Сюняев, 1973; релативистка форма — Новиков и Торн, 1973) ефективната температура се изменя като</p>{eq0}<p>и се анулира на вътрешния ръб, тук най-вътрешната устойчива кръгова орбита в метриката на Шварцшилд. Веществото обикаля с кеплерова скорост, затова вътрешният диск се върти по-бързо; това диференциално въртене разтегля турбулентността в ивиците, които виждате.</p>{eq1}<p>При включено доплерово усилване честотното отношение g на всеки фотон и инвариантността на I<sub>ν</sub>/ν³ дават наблюдаван болометричен интензитет ∝ g⁴:</p>{eq2}<div class="note">Температурната скала е избрана заради видимия цвят, както във филма; дискът на истинска свръхмасивна черна дупка излъчва най-силно в ултравиолетовото. Траекторията на капсулата използва псевдонютонови съображения в духа на Пачински–Вийта само за темпото, не и за светлината.</div>',
    refs: ['ss', 'nt', 'bpt', 'luminet', 'pw'] },
  { id: 'horizon', g: 'physics', t: { en: 'Crossing the horizon', bg: 'Преминаване през хоризонта' },
    eq: ['ds^2=-\\left(1-\\frac{r_s}{r}\\right)c^2dt^2+2\\sqrt{\\frac{r_s}{r}}\\;c\\,dt\\,dr+dr^2+r^2d\\Omega^2'],
    en: '<p>The event horizon is not a material surface. Schwarzschild’s coordinates misbehave there, but Painlevé–Gullstrand coordinates — adapted to observers falling freely from rest at infinity — are perfectly regular across r = r<sub>s</sub>:</p>{eq0}<p>A falling observer crosses the horizon in finite proper time and, for a supermassive black hole, notices nothing locally; but no signal sent from inside can ever reach the outside. What happens deeper inside lies beyond tested physics: classical general relativity predicts a singularity, which quantum gravity is expected to modify.</p><div class="note">The interior sequence of this game — like the film’s — is a dramatization, and is labelled as such.</div>',
    bg: '<p>Хоризонтът на събитията не е материална повърхност. Координатите на Шварцшилд там се държат лошо, но координатите на Пенлеве–Гулстранд — пригодени за наблюдатели, падащи свободно от покой в безкрайността — са напълно регулярни при r = r<sub>s</sub>:</p>{eq0}<p>Падащият наблюдател пресича хоризонта за крайно собствено време и при свръхмасивна черна дупка не забелязва нищо локално; но никакъв сигнал отвътре не може да достигне външността. Какво става по-навътре, е отвъд проверената физика: класическата обща теория на относителността предсказва сингулярност, която квантовата гравитация вероятно променя.</p><div class="note">Сцената във вътрешността в тази игра — както във филма — е драматизация и е обозначена като такава.</div>',
    refs: ['painleve', 'gullstrand', 'mtw'] },
  { id: 'tesseract_film', g: 'film', t: { en: 'World-lines and the tesseract of Interstellar', bg: 'Световните линии и тесерактът в „Интерстелар“' }, holo: 'worldline',
    eq: ['x^\\mu(\\tau)=\\left(ct(\\tau),\\,x(\\tau),\\,y(\\tau),\\,z(\\tau)\\right)', 'B_x=\\{\\,|y|+|w|\\le h,\\;|z|+|w|\\le h\\,\\},\\qquad B_w=\\{\\,|x|,|y|,|z|\\le h\\,\\}'],
    en: '<p>In <i>Interstellar</i> Cooper falls into Gargantua and finds himself inside a tesseract built by beings who live in the bulk. Kip Thorne’s <i>The Science of Interstellar</i> describes it as a hypercube whose three-dimensional faces are copies of Murph’s bedroom at different times; the bedroom’s contents are extruded along channels in which time runs like a spatial direction, so that moving along a channel moves through the room’s history.</p><p>A world-line is the path of an object through spacetime; an extended object sweeps out a world-tube.</p>{eq0}<p><b>In this game</b> the tesseract is a genuine four-dimensional lattice. Bars along x, y and z carry the extrusions, with square-bipyramid cross-sections in their three perpendicular axes so that their 3D slices shrink smoothly to nothing as you move along w; bars along w are the rooms’ world-lines. The “closing” is a true rotation of the whole lattice in the xw, yw and zw planes.</p>{eq1}<div class="note">Thorne is explicit that the tesseract is speculation built on real ideas (the bulk, world-lines, gravity crossing between dimensions). So is this.</div>',
    bg: '<p>В <i>„Интерстелар“</i> Купър пада в Гаргантюа и се озовава в тесеракт, построен от същества, живеещи в обема. Книгата на Кип Торн <i>„Науката в Интерстелар“</i> го описва като хиперкуб, чиито тримерни стени са копия на стаята на Мърф в различни моменти; съдържанието на стаята е разтеглено по канали, в които времето тече като пространствена посока, така че движението по канала е движение през историята на стаята.</p><p>Световната линия е пътят на обект в пространство-времето; протяжен обект описва световна тръба.</p>{eq0}<p><b>В тази игра</b> тесерактът е истинска четиримерна решетка. Гредите по x, y и z носят разтегнатите образи и имат напречно сечение — квадратна бипирамида в трите перпендикулярни оси, така че тримерните им сечения плавно изчезват при движение по w; гредите по w са световните линии на стаите. „Затварянето“ е истинско въртене на цялата решетка в равнините xw, yw и zw.</p>{eq1}<div class="note">Торн изрично казва, че тесерактът е спекулация, изградена върху истински идеи (обемът, световните линии, гравитацията, преминаваща между измеренията). Същото важи и тук.</div>',
    refs: ['thorne', 'mtw'] },
  { id: 'bulk', g: 'film', t: { en: 'The bulk, branes and gravity', bg: 'Обемът, браните и гравитацията' }, holo: 'brane',
    eq: ['ds^2=e^{-2k|y|}\\,\\eta_{\\mu\\nu}\\,dx^\\mu dx^\\nu+dy^2', 'M_{\\mathrm{Pl}}^2\\sim M_*^{\\,n+2}R^{\\,n}', 'F(r)\\propto\\frac{1}{r^{\\,2+n}}\\qquad(r\\ll R)'],
    en: '<p>In braneworld scenarios our universe is a 3+1-dimensional membrane (a <i>brane</i>) inside a higher-dimensional <i>bulk</i>. Standard-model fields are confined to the brane; gravity propagates in the bulk.</p><p>Randall and Sundrum (1999) proposed a warped extra dimension y; the graviton’s zero mode is localised near the brane:</p>{eq0}<p>Arkani-Hamed, Dimopoulos and Dvali (1998) proposed large flat extra dimensions of size R, which would make gravity steeper than Newton’s law below R:</p>{eq1}{eq2}<p>Thorne’s account of <i>Interstellar</i> uses exactly this idea: gravity is the one force that can carry a message across the bulk. Maldacena’s AdS/CFT correspondence (1998) is a related, rigorous example of a higher-dimensional gravitational “bulk” being equivalent to a field theory on its boundary — here it is cited only as an analogy.</p><div class="note">These are viable theoretical frameworks, not established facts — see “Do extra dimensions exist?”.</div>',
    bg: '<p>В сценариите с брани нашата Вселена е 3+1-мерна мембрана (<i>брана</i>) в многомерен <i>обем</i>. Полетата от стандартния модел са затворени в браната; гравитацията се разпространява в обема.</p><p>Рандъл и Сундрум (1999) предлагат изкривено допълнително измерение y; нулевата мода на гравитона е локализирана близо до браната:</p>{eq0}<p>Аркани-Хамед, Димопулос и Двали (1998) предлагат големи плоски допълнителни измерения с размер R, при които гравитацията под R би намалявала по-стръмно от закона на Нютон:</p>{eq1}{eq2}<p>Описанието на Торн за <i>„Интерстелар“</i> използва точно тази идея: гравитацията е единствената сила, която може да пренесе съобщение през обема. Съответствието AdS/CFT на Малдасена (1998) е сроден, строг пример, при който многомерен гравитационен „обем“ е еквивалентен на теория на полето върху границата му — тук то е споменато само като аналогия.</p><div class="note">Това са жизнеспособни теоретични рамки, а не установени факти — вижте „Съществуват ли допълнителни измерения?“.</div>',
    refs: ['rs1', 'rs2', 'add', 'maldacena', 'thorne'] },
  { id: 'kk', g: 'beyond', t: { en: 'Kaluza–Klein theory', bg: 'Теорията на Калуца–Клайн' }, holo: 'kk',
    eq: ['ds^2=g_{\\mu\\nu}dx^\\mu dx^\\nu+\\phi^2\\left(dy+\\kappa A_\\mu dx^\\mu\\right)^2', '\\psi(x,y)=\\sum_{n}\\psi_n(x)\\,e^{\\,iny/R}', 'm_n=\\frac{|n|\\,\\hbar}{R\\,c}'],
    en: '<p>Theodor Kaluza (1921) showed that general relativity in five dimensions, with the fifth coordinate y as below, contains Maxwell’s electromagnetism through the components A<sub>μ</sub>. Oskar Klein (1926) proposed that y is a circle of tiny radius R.</p>{eq0}<p>Fields must be periodic around the circle, so they split into modes; seen from four dimensions each mode is a particle of mass m<sub>n</sub> — the Kaluza–Klein tower.</p>{eq1}{eq2}<p>String theory requires six or seven extra compact dimensions; braneworld models allow larger ones. None has been observed. In this game Kaluza–Klein ideas appear only as clearly labelled theoretical frameworks.</p>',
    bg: '<p>Теодор Калуца (1921) показва, че общата теория на относителността в пет измерения, с пета координата y както по-долу, съдържа електромагнетизма на Максуел чрез компонентите A<sub>μ</sub>. Оскар Клайн (1926) предлага y да е окръжност с много малък радиус R.</p>{eq0}<p>Полетата трябва да са периодични по окръжността, затова се разлагат на моди; погледнато от четири измерения, всяка мода е частица с маса m<sub>n</sub> — кулата на Калуца–Клайн.</p>{eq1}{eq2}<p>Теорията на струните изисква шест или седем допълнителни компактни измерения; моделите с брани допускат и по-големи. Нито едно не е наблюдавано. В тази игра идеите на Калуца–Клайн се появяват само като ясно обозначени теоретични рамки.</p>',
    refs: ['kaluza', 'klein', 'add'] },
  { id: 'experiments', g: 'beyond', t: { en: 'Do extra dimensions exist? Experiments', bg: 'Съществуват ли допълнителни измерения? Експерименти' },
    eq: ['V(r)=-\\frac{Gm_1m_2}{r}\\left(1+\\alpha\\,e^{-r/\\lambda}\\right)', 'h\\propto d_L^{\\,-(D-2)/2}\\quad\\Rightarrow\\quad D\\approx 4'],
    en: '<p>If gravity leaked into extra dimensions of size R, Newton’s law would change below R. Torsion-balance experiments of the Eöt-Wash group constrain any Yukawa-type deviation; Lee et al. (2020) found none down to 52 μm.</p>{eq0}<p>Gravitational waves from the neutron-star merger GW170817, compared with the distance inferred from its light, are consistent with D = 4 spacetime dimensions under the leakage models tested by Pardo et al. (2018).</p>{eq1}<p>Yet four-dimensional physics <i>has</i> been measured: using “synthetic dimensions”, Lohse et al. (2018, ultracold atoms) and Zilberberg et al. (2018, photonic waveguides) observed signatures of the four-dimensional quantum Hall effect — genuine 4D topological physics in systems that themselves live in 3D.</p>',
    bg: '<p>Ако гравитацията изтичаше в допълнителни измерения с размер R, законът на Нютон би се променил под R. Експериментите с торзионни везни на групата Eöt-Wash ограничават всяко отклонение от тип Юкава; Лий и колеги (2020) не намират такова до 52 μm.</p>{eq0}<p>Гравитационните вълни от сливането на неутронни звезди GW170817, сравнени с разстоянието, определено от светлината му, са съвместими с D = 4 измерения на пространство-времето при моделите на изтичане, проверени от Пардо и колеги (2018).</p>{eq1}<p>И все пак четиримерна физика <i>е</i> измерена: чрез „синтетични измерения“ Лозе и колеги (2018, ултрастудени атоми) и Зилберберг и колеги (2018, фотонни вълноводи) наблюдават признаци на четиримерния квантов ефект на Хол — истинска 4D топологична физика в системи, които сами живеят в 3D.</p>',
    refs: ['kapner', 'lee', 'pardo', 'lohse', 'zilberberg', 'add'] },
  { id: 'phase', g: 'beyond', t: { en: 'Phase space: Hénon–Heiles', bg: 'Фазово пространство: Енон–Хейлс' }, holo: 'phase',
    eq: ['H=\\frac{1}{2}\\left(p_x^2+p_y^2\\right)+\\frac{1}{2}\\left(x^2+y^2\\right)+x^2y-\\frac{1}{3}y^3', '\\dot{x}=\\frac{\\partial H}{\\partial p_x},\\quad\\dot{p}_x=-\\frac{\\partial H}{\\partial x},\\quad\\dot{y}=\\frac{\\partial H}{\\partial p_y},\\quad\\dot{p}_y=-\\frac{\\partial H}{\\partial y}'],
    en: '<p>Phase space has one dimension per coordinate and one per momentum, so a particle moving in a plane lives in a four-dimensional phase space (x, y, p<sub>x</sub>, p<sub>y</sub>). Michel Hénon and Carl Heiles (1964) studied stellar motion in a galactic potential with the Hamiltonian</p>{eq0}{eq1}<p>Energy conservation confines an orbit to a 3D surface in 4D; at low energy a further “third integral” confines it to 2D tori, while above E ≈ 1/8 most orbits become chaotic. The hologram integrates Hamilton’s equations with fourth-order Runge–Kutta and projects the 4D trajectory into 3D while rotating it in four dimensions.</p>',
    bg: '<p>Фазовото пространство има по едно измерение за всяка координата и всеки импулс, така че частица, движеща се в равнина, живее в четиримерно фазово пространство (x, y, p<sub>x</sub>, p<sub>y</sub>). Мишел Енон и Карл Хейлс (1964) изследват движението на звезди в галактичен потенциал с хамилтониана</p>{eq0}{eq1}<p>Запазването на енергията ограничава орбитата до тримерна повърхнина в 4D; при ниска енергия допълнителен „трети интеграл“ я ограничава до двумерни тори, а над E ≈ 1/8 повечето орбити стават хаотични. Холограмата интегрира уравненията на Хамилтон с метод на Рунге–Кута от четвърти ред и проектира четиримерната траектория в 3D, като я върти в четири измерения.</p>',
    refs: ['henon'] },
  { id: 'waves4d', g: 'beyond', t: { en: 'Sound and light in four dimensions', bg: 'Звук и светлина в четири измерения' },
    eq: ['I(r)=\\frac{P}{2\\pi^2r^3}\\qquad(\\text{area of }S^3_r=2\\pi^2r^3)'],
    en: '<p>In n spatial dimensions the power of a point source spreads over a sphere S<sup>n−1</sup>. In four dimensions that is a 3-sphere, so intensity falls as 1/r³:</p>{eq0}<p>A subtler difference: Huygens’ principle in its strong form — sharp signals staying sharp — holds for the wave equation only in odd numbers of spatial dimensions (three and up). In four spatial dimensions a clap would leave a lingering tail behind its wavefront (Hadamard 1923).</p><p>The Bulk’s sound sources use 4D distances and 1/r³ attenuation, so you can hear an object that is hidden from your slice.</p>',
    bg: '<p>В n пространствени измерения мощността на точков източник се разпределя по сфера S<sup>n−1</sup>. В четири измерения това е тримерна сфера, затова интензитетът намалява като 1/r³:</p>{eq0}<p>По-фина разлика: принципът на Хюйгенс в силната си форма — резките сигнали остават резки — важи за вълновото уравнение само при нечетен брой пространствени измерения (три и повече). В четири пространствени измерения едно пляскане би оставило проточена „опашка“ зад вълновия фронт (Адамар, 1923).</p><p>Звуковите източници в Обема използват 4D разстояния и затихване 1/r³, така че можете да чуете обект, скрит от вашето сечение.</p>',
    refs: ['hadamard'] },
  { id: 'history', g: 'method', t: { en: 'A short history of seeing the fourth dimension', bg: 'Кратка история на виждането на четвъртото измерение' },
    eq: [],
    en: '<p><b>1827</b> Möbius: mirror images via a fourth dimension. <b>c. 1852</b> Schläfli: the six regular 4-polytopes. <b>1854</b> Riemann: geometry in any number of dimensions. <b>1884</b> Abbott: <i>Flatland</i>. <b>1888</b> Hinton: <i>A New Era of Thought</i>, the word “tesseract”, coloured cubes for training 4D intuition. <b>1901</b> Ricci-Curbastro & Levi-Civita: tensor calculus. <b>1916</b> Schwarzschild. <b>1921–26</b> Kaluza and Klein. <b>1931</b> Hopf. <b>1963</b> Kerr. <b>1964</b> Hénon & Heiles. <b>1967</b> Noll: computer animation of hyperobjects. <b>1979</b> Luminet: the first image of a black hole with a thin disk. <b>1990–92</b> Banchoff; Hollasch; Hanson & Heng: interactive 4D graphics and 4D illumination. <b>1998–99</b> ADD and Randall–Sundrum braneworlds. <b>2014–15</b> <i>Interstellar</i> and the DNGR papers. <b>2018</b> 4D quantum Hall physics with synthetic dimensions.</p>',
    bg: '<p><b>1827</b> Мьобиус: огледални образи чрез четвърто измерение. <b>ок. 1852</b> Шлефли: шестте правилни четиримерни политопа. <b>1854</b> Риман: геометрия в произволен брой измерения. <b>1884</b> Абът: <i>„Плоска земя“</i>. <b>1888</b> Хинтън: <i>„Нова ера на мисълта“</i>, думата „тесеракт“, цветни кубчета за тренировка на 4D интуиция. <b>1901</b> Ричи-Курбастро и Леви-Чивита: тензорно смятане. <b>1916</b> Шварцшилд. <b>1921–26</b> Калуца и Клайн. <b>1931</b> Хопф. <b>1963</b> Кер. <b>1964</b> Енон и Хейлс. <b>1967</b> Нол: компютърна анимация на хиперобекти. <b>1979</b> Люмине: първото изображение на черна дупка с тънък диск. <b>1990–92</b> Банчоф; Холаш; Хансън и Хенг: интерактивна 4D графика и 4D осветление. <b>1998–99</b> Брани на ADD и на Рандъл–Сундрум. <b>2014–15</b> <i>„Интерстелар“</i> и статиите за DNGR. <b>2018</b> 4D квантов ефект на Хол чрез синтетични измерения.</p>',
    refs: ['mobius', 'schlafli', 'riemann', 'abbott', 'hinton88', 'ricci', 'noll', 'luminet', 'banchoff', 'hollasch', 'hanson92', 'james1'] },
  { id: 'method', g: 'method', t: { en: 'How this game renders four dimensions', bg: 'Как тази игра изобразява четири измерения' },
    eq: ['\\mathbf{X}(t)=\\mathbf{P}+t\\,(u\\,\\mathbf{R}+v\\,\\mathbf{U}+\\mathbf{F}),\\qquad \\mathbf{P},\\mathbf{R},\\mathbf{U},\\mathbf{F}\\in\\mathbb{R}^4', 't_{\\mathrm{in}}=\\max_{\\mathbf{n}_i\\cdot\\mathbf{d}<0}\\frac{d_i-\\mathbf{n}_i\\cdot\\mathbf{q}_0}{\\mathbf{n}_i\\cdot\\mathbf{d}},\\qquad t_{\\mathrm{out}}=\\min_{\\mathbf{n}_i\\cdot\\mathbf{d}>0}\\frac{d_i-\\mathbf{n}_i\\cdot\\mathbf{q}_0}{\\mathbf{n}_i\\cdot\\mathbf{d}}'],
    en: '<p>Each pixel defines a ray that is a straight line in ℝ⁴ lying in your current hyperplane, spanned by the camera’s right, up and forward vectors (a fourth vector, “ana”, completes your 4D frame):</p>{eq0}<p><b>The Bulk.</b> Every object is a convex 4-polytope stored as half-spaces n<sub>i</sub>·q ≤ d<sub>i</sub>. Cyrus–Beck clipping gives the exact entry and exit of the 4D line, so the solid you see is exactly the 3D cross-section; edges glow where two facet hyperplanes meet; shadows are cast by tracing 4D rays toward the light.</p>{eq1}<p><b>The Tesseract.</b> A four-dimensional extension of the Amanatides–Woo voxel traversal walks the lattice cell by cell and clips each cell’s four bars analytically; translucent layers are composited front to back.</p><p><b>The black hole.</b> Schwarzschild null geodesics are integrated per pixel (see that entry). <b>Collisions</b> use 4D signed distances, so walls exist only where they exist in 4D. <b>Holograms</b> are 4D wireframes projected orthographically, in perspective or stereographically.</p><div class="note">Real-time limits: lighting is a 3D-slice approximation (key light, ambient terms, 4D shadow rays in the Bulk), and the image uses ACES filmic tone mapping. Colour-vision assist uses the dichromat simulation of Viénot, Brettel & Mollon. Plucked threads are Karplus–Strong strings.</div>',
    bg: '<p>Всеки пиксел определя лъч — права линия в ℝ⁴, лежаща във вашата текуща хиперравнина, опъната от векторите надясно, нагоре и напред на камерата (четвърти вектор, „ана“, допълва вашата 4D отправна система):</p>{eq0}<p><b>Обемът.</b> Всеки обект е изпъкнал четиримерен политоп, записан като полупространства n<sub>i</sub>·q ≤ d<sub>i</sub>. Отрязването по Сайръс–Бек дава точния вход и изход на четиримерната права, така че тялото, което виждате, е точно тримерното сечение; ръбовете светят там, където се срещат две хиперравнини на стени; сенките се хвърлят чрез 4D лъчи към светлината.</p>{eq1}<p><b>Тесерактът.</b> Четиримерно обобщение на обхождането на воксели на Аманатидес–Ву минава през решетката клетка по клетка и аналитично отрязва четирите греди във всяка клетка; полупрозрачните слоеве се смесват отпред назад.</p><p><b>Черната дупка.</b> Нулевите геодезични на Шварцшилд се интегрират за всеки пиксел (вижте тази статия). <b>Сблъсъците</b> използват 4D разстояния със знак, така че стените съществуват само там, където съществуват в 4D. <b>Холограмите</b> са 4D скелетни модели, проектирани ортографски, перспективно или стереографски.</p><div class="note">Ограничения на реалното време: осветлението е приближение в тримерното сечение (ключова светлина, околни членове, 4D лъчи за сенки в Обема), а изображението използва филмово тонално картографиране ACES. Помощта при цветна слепота използва симулацията на дихромати на Виено, Брете и Молън. Нишките са струни по Карплъс–Стронг.</div>',
    refs: ['cyrus', 'amanatides', 'hollasch', 'hanson92', 'vienot', 'ks'] },
];
const LOGMAP = Object.fromEntries(LOG.map(e => [e.id, e]));

    const grp = LOG_GROUPS[e.g];
    ent.innerHTML = `<h3>${L(e.t)}</h3><div class="tag">${S.lang === 'bg' ? grp[1] : grp[0]}</div>${html}` + (e.holo && Game.playing ? `<button class="btn small" id="replay-holo">${S.lang === 'bg' ? '◎ Покажи холограмата' : '◎ Project this hologram'}</button>` : '') + `<div class="refs"><b>${S.lang === 'bg' ? 'Източници' : 'Sources'}</b><ol>${e.refs.map(r => `<li>${REF[r]}</li>`).join('')}</ol></div>`;
    ent.scrollTop = 0;
    $$('[data-tex]', ent).forEach(b => b.onclick = () => b.closest('.eq').classList.toggle('showtex'));
    const rb = $('#replay-holo'); if (rb) rb.onclick = () => { this.close('log'); Game.pause(false); Game.projectHolo(e.holo); };
  },
  buildChapters() {
    const g = $('#ch-grid'); g.innerHTML = ''; const n = Save.chaptersUnlocked();
    CHAPTER_INFO.forEach((c, i) => { const d = document.createElement('div'); d.className = 'ch' + (i + 1 > n ? ' locked' : ''); d.innerHTML = `<div class="n">${c.n}</div><div class="t">${L(c.t)}</div><div class="s">${L(c.s)}</div>`; if (i + 1 <= n) d.onclick = () => { this.close('chapters'); Game.start(c.id); }; g.appendChild(d); });
  },
  credits(ending) {
    const refs = Object.values(REF).sort();
    const bg = S.lang === 'bg';
    $('#credits-body').innerHTML = `${ending ? `<p style="font-size:18px;font-weight:300;color:#fff">${bg ? 'Благодаря, че се разходи в четири измерения.' : 'Thank you for walking in four dimensions.'}</p>` : ''}
      <h4>Hyperspace Walk</h4><p>${bg ? 'Самостоятелен HTML файл: WebGL 2, Web Audio и Web Speech. Всяко изображение и звук се синтезират процедурно в реално време — геодезични лъчи около черна дупка на Шварцшилд, точни тримерни сечения на четиримерни политопи и решетки, процедурна музика и Етер, която говори чрез синтезатора на реч на вашето устройство.' : 'A single self-contained HTML file: WebGL 2, Web Audio and Web Speech. Every image and sound is synthesised procedurally in real time — geodesic light paths around a Schwarzschild black hole, exact 3D cross-sections of four-dimensional polytopes and lattices, a procedural score, and Aether speaking through your device’s speech synthesiser.'}</p>
      <h4>${bg ? 'Вдъхновение' : 'Inspiration'}</h4><p>${bg ? '„Интерстелар“ (2014), режисьор Кристофър Нолан; научен консултант Кип Торн; визуални ефекти Double Negative. Не се използват кадри, музика или други материали от филма. Референтните изображения, предоставени от собственика на проекта (включително произведения на Акош Халас), са използвани само като визуален ориентир и не са включени.' : 'Interstellar (2014), directed by Christopher Nolan; scientific adviser Kip Thorne; visual effects by Double Negative. No footage, music or other material from the film is used. Reference images supplied by the project owner (including artwork by Ákos Halász) were used only as visual guidance and are not included.'}</p>
      <h4>${bg ? 'Създадено с' : 'Made with'}</h4><p>Claude Code (Anthropic).</p>
      <h4>${bg ? 'Научни източници' : 'Scientific sources'}</h4><ol style="margin-left:18px;font-size:12.5px;color:#a9b6c6">${refs.map(r => `<li style="margin:5px 0">${r}</li>`).join('')}</ol>`;
    this.open('credits');
  },
};
const CHAPTER_INFO = [
  { id: 'station', n: 'I', t: { en: 'Euclid Station', bg: 'Станция „Евклид“' }, s: { en: 'Familiar three-dimensional space, and three lessons about a fourth.', bg: 'Познатото тримерно пространство и три урока за четвъртото измерение.' } },
  { id: 'plunge', n: 'II', t: { en: 'The Plunge', bg: 'Падането' }, s: { en: 'A geodesic fall through the horizon of a Gargantua-class black hole.', bg: 'Геодезично падане през хоризонта на черна дупка от класа на Гаргантюа.' } },
  { id: 'tesseract', n: 'III', t: { en: 'The Tesseract', bg: 'Тесерактът' }, s: { en: 'A slice of a four-dimensional lattice of world-lines.', bg: 'Сечение на четиримерна решетка от световни линии.' } },
  { id: 'bulk', n: 'IV', t: { en: 'The Bulk', bg: 'Обемът' }, s: { en: 'Open ℝ⁴: walk, turn into w, and solve its puzzles.', bg: 'Открито ℝ⁴: ходи, завърти се към w и реши загадките му.' } },
];

/* ---------- §12b the game loop ---------- */
const Game = {
  time: 0, dt: 0, frame: 0, playing: false, paused: false, ch: null, chName: '', tok: { dead: false }, waiters: [], fade: { v: 1, to: 1, rate: 1, col: [0, 0, 0] }, settingsOpen: false, fpsE: 60, dtE: 1 / 60, resT: 0,
  init() { this.chapters = { title: new TitleCh(), station: new StationCh(), plunge: new PlungeCh(), tesseract: new TesseractCh(), bulk: new BulkCh() }; },
  run(fn) { const tok = this.tok; Promise.resolve().then(() => fn(tok)).catch(e => console.error(e)); },
  wait(s, tok) { return new Promise(res => this.waiters.push({ t: this.time + s, res, tok })); },
  fadeTo(v, sec, col) { this.fade.to = v; this.fade.rate = 1 / Math.max(sec, .01); if (col) this.fade.col = col; },
  modalOpen() { return $$('.modal').some(m => !m.classList.contains('hidden')); },
  start(name, cp = {}) {
    if (this.ch && this.ch.exit) this.ch.exit();
    this.tok.dead = true; this.waiters.forEach(w => w.res()); this.waiters = []; this.tok = { dead: false };
    Dialogue.clear(); Dialogue.paused = false; Particles.clear(); Labels.reset();
    this.chName = name; this.ch = this.chapters[name]; this.playing = name !== 'title';
    Player.cam = S.cam; Player.free = false; Player.snapTo = null; this.fade.col = this.fade.col || [0, 0, 0];
    if (this.fade.v < .99 && !cp.fromPlunge && !cp.fromTesseract) { this.fade.v = 1; }
    this.fadeTo(0, 1.6);
    this.ch.enter(cp);
    $('#title').classList.toggle('hidden', this.playing); $('#hudui').style.display = this.playing ? '' : 'none';
    if (this.playing) {
      Save.unlockChapter(this.ch.idx); this.save();
      const info = CHAPTER_INFO[this.ch.idx - 1]; HUD.card(S.lang === 'bg' ? 'ГЛАВА ' + info.n : 'CHAPTER ' + info.n, L(info.t), L(info.s));
    } else UIX.titleFoot();
    UIX.touchVis();
  },
  save() { if (!this.playing || !this.ch) return; Save.write({ ch: this.chName, flags: this.ch.f ? JSON.parse(JSON.stringify(this.ch.f)) : {} }); },
  unlock(id) { if (!LOGMAP[id]) return; if (Save.unlock(id) && this.playing) HUD.toast(`<b>${tr('logNew')}</b> · ${L(LOGMAP[id].t)}`, 4.5); },
  pause(on) {
    if (on === this.paused || !this.playing) return; this.paused = on;
    $('#pause').classList.toggle('hidden', !on);
    if (on) { if (Dialogue.cur) { Dialogue.q.unshift({ line: Object.assign({}, Dialogue.cur.line, { cue: null }), res: Dialogue.cur.res }); Dialogue.cur = null; } Voice.stop(); if (document.pointerLockElement) document.exitPointerLock(); }
    UIX.touchVis();
  },
  projectHolo(kind) {
    const ch = this.ch; if (!ch || !ch.holo) return;
    const B = Player.body(); const anc = V4.add(V4.madd(Player.P, B.F, 3.2), [0, Player.mode === 'walk' ? 1.6 : .3, 0, 0]);
    const st = { target: 5, mode: 'glome', auto: true, proj: 'persp', rot: 'iso', p: 'c24', title: '24-cell', col: [.5, .85, 1] };
    const h = ch.holo(kind, anc, { scale: kind === 'lensing' ? .8 : .45, state: st }); h.fadeDist = 12; Aether.present(h, 1);
    Sound.chime(Aether.camPos());
  },
  interactions() {
    const ch = this.ch, P = Player.mode === 'walk' ? V4.madd(Player.P, Player.U, 1) : Player.P; let best = null, bd = 1e9;
    for (const it of ch.inter || []) { if (it.ok && !it.ok()) continue; const p = typeof it.p === 'function' ? it.p() : it.p; const d = V4.dist(P, p); if (d < it.r && d < bd) { const c = Cam.pt(p); if (c[2] > 0 || d < 1.4 || it.r > 50) { best = it; bd = d; } } }
    const el = $('#prompt');
    if (best) { const key = Input.P.on ? 'X' : 'F'; const txt = `<kbd>${key}</kbd>${best.label()}`; if (el.innerHTML !== txt) el.innerHTML = txt; el.style.opacity = 1; if (Input.act.interact) { Sound.ui(); best.act(); } }
    else el.style.opacity = 0;
  },
  fatal(msg) { const e = $('#err'); e.classList.remove('hidden'); e.textContent = msg; },
  loop() {
    const t = performance.now() / 1000; const rdt = Math.min(.1, t - (this.last || t)); this.last = t; const dt = Math.min(rdt, .05) * (HW.timeScale || 1);
    this.dtE = lerp(this.dtE, rdt, .05);
    try {
      Input.compute(dt);
      const a = Input.act;
      if (this.playing) {
        if (a.menu && !this.modalOpen()) this.pause(!this.paused);
        if (!this.paused && !this.modalOpen()) {
          if (a.log) { UIX.buildLog(); UIX.open('log'); }
          if (a.cam && this.ch.name !== 'title') { Player.cam = Player.cam === 'third' ? 'first' : 'third'; S.cam = Player.cam; saveSettings(); }
          if (a.free && this.ch.idx >= 3 && Player.allowW && !Player.lockMove) { Player.free = !Player.free; if (this.ch.idx === 4) Player.mode = Player.free ? 'float' : 'walk'; if (Player.free) Player.allow4 = true; else if (this.ch.idx === 3) Player.allow4 = false; HUD.toast(Player.free ? lbl('Free-fly 4D camera ON — no collisions, all 4D turns enabled', 'Свободна 4D камера ВКЛ. — без сблъсъци, всички 4D въртения') : lbl('Free-fly OFF', 'Свободна камера ИЗКЛ.')); }
          if (a.rewind) Dialogue.rewind(); if (a.repeat) Dialogue.repeat(); if (a.more) Dialogue.more(); if (a.skip) Dialogue.skip(); if (a.pauseVoice) Dialogue.togglePause();
          if (a.ptt && !VoiceCmd.on) VoiceCmd.start(); if (!a.ptt && VoiceCmd.on && !Input.down.has('KeyK')) VoiceCmd.stop();
        }
      }
      if (a.fps) { S.showFps = !S.showFps; saveSettings(); }
      const frozen = this.paused || (this.playing && this.modalOpen());
      if (!frozen) {
        this.time += dt; this.dt = dt; this.frame++;
        for (let i = this.waiters.length - 1; i >= 0; i--) { const w = this.waiters[i]; if (w.tok && w.tok.dead) { this.waiters.splice(i, 1); w.res(); continue; } if (this.time >= w.t) { this.waiters.splice(i, 1); w.res(); } }
        Dialogue.update(dt);
        if (this.playing) Player.update(dt);
        this.ch.update(dt);
        if (!this.ch.customCam && this.ch.name !== 'title' && this.ch.name !== 'plunge') Player.updateCamera(dt);
        if (this.playing) Aether.update(dt);
        Particles.update(dt);
        for (const h of this.ch.holos) if (h.fadeDist && V4.dist(h.anchor, Player.P) > h.fadeDist) h.on = false;
        if (this.playing) this.interactions();
        const ms = this.ch.music ? this.ch.music() : {};
        Sound.update(dt, Object.assign({ w: Player.P[3], rot4: this.playing ? Player.rot4 : 0, rot4s: Player.rot4s }, ms));
        this.fade.v = this.fade.v < this.fade.to ? Math.min(this.fade.to, this.fade.v + this.fade.rate * dt) : Math.max(this.fade.to, this.fade.v - this.fade.rate * dt);
        if (this.playing) HUD.setObjective(this.ch.objective());
        const ro = $('#readout'); const rt = this.ch.readout || ''; if (ro._t !== rt) { ro._t = rt; ro.innerHTML = rt; ro.style.opacity = rt ? 1 : 0; }
      }
      this.render();
      HUD.draw(1 / this.dtE);
      // dynamic resolution keeps frame time near the display's refresh
      this.resT += rdt;
      if (S.autoRes && this.resT > .8 && this.frame > 30) {
        this.resT = 0; const maxS = Math.min(S.renderScale, Q().maxScale); let s = GL.scale;
        if (this.dtE > 1 / 48) s -= .08; else if (this.dtE > 1 / 55) s -= .04; else if (this.dtE < 1 / 58.5) s += .03;
        s = clamp(s, .3, maxS); if (Math.abs(s - GL.scale) > .01) { GL.scale = s; GL.resize(true); }
      } else if (!S.autoRes && Math.abs(GL.scale - Math.min(S.renderScale, Q().maxScale)) > .01) { GL.scale = Math.min(S.renderScale, Q().maxScale); GL.resize(true); }
    } catch (e) { console.error(e); this.fatal('Runtime error:\n' + (e && e.stack || e)); return; }
    Input.endFrame();
    requestAnimationFrame(() => this.loop());
  },
  render() {
    const gl = GL.gl, ch = this.ch;
    Lines.reset(); Labels.reset();
    if (this.playing || ch.name === 'title') { ch.holos.forEach(h => h.emit()); if (ch.emit) ch.emit(); Particles.draw(); }
    GL.bindTarget(GL.tA); gl.disable(gl.BLEND);
    ch.render();
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, GL.tA.fb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, GL.tB.fb);
    gl.blitFramebuffer(0, 0, GL.iw, GL.ih, 0, 0, GL.iw, GL.ih, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    GL.bindTarget(GL.tB);
    if (this.playing) Chars.draw(GL.tA.tex, ch.light());
    Lines.draw(GL.tA.tex);
    const g = ch.grade(); g.fade = Math.max(g.fade, this.fade.v); g.fadeCol = this.fade.col;
    Post.run(GL.tB, g);
  },
};

/* ---------- boot ---------- */
(async function boot() {
  applyI18n();
  const status = $('#boot-status');
  if (!GL.init($('#gl'))) { status.textContent = tr('nowebgl'); return; }
  HUD.init(); Input.init($('#gl')); UIX.bind(); Game.init();
  status.textContent = tr('compiling') + '…';
  const progs = [...Post.init(), ...Lines.init(), ...Chars.init()];
  Progs.plunge = GL.program('plunge', VS_FULL, FS_PLUNGE); Progs.station = GL.program('station', VS_FULL, FS_STATION);
  Progs.lattice = GL.program('lattice', VS_FULL, FS_LATTICE); Progs.bulk = GL.program('bulk', VS_FULL, FS_BULK);
  progs.push(Progs.plunge, Progs.station, Progs.lattice, Progs.bulk);
  const t0 = now();
  await new Promise(res => { const poll = () => { const done = progs.filter(p => GL.isDone(p)).length; status.textContent = `${tr('compiling')} ${done}/${progs.length}`; if (done === progs.length || now() - t0 > 60) res(); else setTimeout(poll, 60); }; poll(); });
  try { progs.forEach(p => GL.finish(p)); } catch (e) { console.error(e); Game.fatal(String(e.message || e)); status.textContent = 'Shader error — see details.'; return; }
  status.textContent = tr('ready');
  Game.start('title'); $('#title').classList.add('hidden'); Game.fade.v = 1;
  $('#boot').style.background = 'rgba(0,0,0,.55)';
  requestAnimationFrame(() => Game.loop());
  const btn = $('#boot-start'); btn.disabled = false;
  const go = () => {
    Sound.init(); if (Sound.pendingMood === undefined) Sound.setMood('title');
    if (Voice.ok) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* */ } }
    $('#boot').classList.add('hidden'); $('#title').classList.remove('hidden'); UIX.titleFoot(); Game.fadeTo(0, 2.5);
    if (IS_TOUCH) { Input.T.used = true; }
    const q = new URLSearchParams(location.search); if (q.get('chapter')) { const m = { 1: 'station', 2: 'plunge', 3: 'tesseract', 4: 'bulk' }[q.get('chapter')]; if (m) Game.start(m); }
  };
  btn.onclick = go;
  $('#boot-lang').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; saveSettings(); applyI18n(); }));
  HW.Game = Game; HW.Lines = Lines; HW.Labels = Labels; HW.Cam = Cam; HW.Player = Player; HW.GL = GL; HW.S = S; HW.Poly = Poly; HW.go = go; HW.Aether = Aether; HW.Dialogue = Dialogue; HW.Sound = Sound; HW.Save = Save;
})();
Game.showTouch = () => { UIX.touchVis(); };
Voice.onChange = () => { if (Game.settingsOpen) UIX.buildSettings(); };
</script>
