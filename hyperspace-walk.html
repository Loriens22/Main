<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Hyperspace Walk — a scientifically grounded exploration of four-dimensional Euclidean space, a Schwarzschild/Kerr black-hole plunge and an Interstellar-inspired tesseract. Single-file WebGL2.">
<title>Hyperspace Walk</title>
<style>
:root{
  --aether:#8fdcff; --aether2:#3aa8ff; --gold:#e8c27a; --ink:#e9eef5; --dim:#93a1b3; --panel:rgba(7,11,18,.84);
  --line:rgba(143,220,255,.22); --line2:rgba(143,220,255,.45);
  --ax-x:#ff7a59; --ax-y:#3fd19b; --ax-z:#59b0ff; --ax-w:#d08cff;
  --sub-size:21px; --sub-bg:.55; --safe-b:env(safe-area-inset-bottom,0px); --safe-r:env(safe-area-inset-right,0px); --safe-l:env(safe-area-inset-left,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:"Segoe UI",Inter,"Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
.hidden{display:none!important}
button{font:inherit;color:inherit}
#fx-fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:none;z-index:5}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui > *{pointer-events:auto}
#hudui{pointer-events:none!important;position:fixed;inset:0}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.btn{display:block;min-width:250px;padding:12px 22px;margin:7px auto;background:rgba(10,18,30,.55);border:1px solid var(--line);border-radius:10px;letter-spacing:.18em;text-transform:uppercase;font-size:13px;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s,transform .15s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn:hover,.btn:focus-visible{background:rgba(40,90,130,.35);border-color:var(--line2);box-shadow:0 0 22px rgba(80,180,255,.18);outline:none}
.btn:active{transform:scale(.98)}
.btn.primary{border-color:rgba(232,194,122,.55);color:#fff3da}
.btn.primary:hover{box-shadow:0 0 26px rgba(232,194,122,.25);background:rgba(90,70,30,.3)}
.btn:disabled{opacity:.35;cursor:default}
.btn.small{min-width:0;display:inline-block;padding:8px 14px;font-size:11px;margin:4px}
.logo{font-weight:200;letter-spacing:.55em;font-size:clamp(26px,6vw,64px);text-align:center;text-indent:.55em;color:#f4f7fb;text-shadow:0 0 30px rgba(140,200,255,.25)}
.logo span{display:block;font-size:.42em;letter-spacing:1.4em;text-indent:1.4em;color:var(--gold);margin-top:.5em;font-weight:300}
.subtitle{margin-top:14px;color:var(--dim);letter-spacing:.25em;font-size:12px;text-transform:uppercase;text-align:center}
#boot{background:radial-gradient(ellipse at 50% 60%,#0a1018 0%,#000 70%);z-index:30}
.boot-inner{max-width:640px;padding:24px;text-align:center}
#boot-status{margin:28px 0 18px;color:var(--dim);font-size:13px;letter-spacing:.12em;min-height:20px}
.warn{margin-top:22px;color:#a9b4c2;font-size:12px;line-height:1.6;max-width:560px;margin-left:auto;margin-right:auto}
.warn b{color:var(--gold);font-weight:600}
.langsel{margin-top:16px}
.langsel button{background:none;border:1px solid var(--line);border-radius:20px;padding:5px 14px;margin:0 4px;font-size:12px;letter-spacing:.15em;cursor:pointer;color:var(--dim)}
.langsel button.on{color:#fff;border-color:var(--gold);background:rgba(232,194,122,.12)}
#title{background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,0) 70%);align-items:flex-start;padding-left:max(6vw,calc(var(--safe-l) + 20px))}
#title .menu{margin-top:34px}
#title .btn{margin:8px 0;text-align:left;min-width:280px}
#title .logo{text-align:left;text-indent:0}
#title .logo span{text-indent:0}
#title .subtitle{text-align:left}
#title .foot{position:fixed;bottom:calc(14px + var(--safe-b));left:max(6vw,20px);right:20px;color:#6f7d8f;font-size:11px;letter-spacing:.08em;line-height:1.6}
#pause{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:20}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:25}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 80px rgba(0,0,0,.6),inset 0 0 40px rgba(60,140,220,.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);max-width:min(1100px,94vw);max-height:90vh;width:100%;display:flex;flex-direction:column;overflow:hidden}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.panel header h2{font-weight:300;letter-spacing:.3em;font-size:15px;text-transform:uppercase}
.panel .x{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;color:var(--dim)}
.panel .body{overflow:auto;padding:18px 22px;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 22px 0}
.tabs button{background:none;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:8px 14px;cursor:pointer;color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.tabs button.on{color:#fff;border-color:var(--line);background:rgba(143,220,255,.06)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid rgba(143,220,255,.07)}
.row label{font-size:14px;color:#d5dde8}
.row small{display:block;color:#7d8a9b;font-size:11.5px;margin-top:2px}
.row select,.row input[type=range]{min-width:180px}
select{background:#0c1420;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
input[type=range]{accent-color:#8fdcff}
input[type=checkbox]{width:20px;height:20px;accent-color:#8fdcff}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px}
.keys kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0d1724;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;white-space:nowrap}
#log .body{display:flex;gap:0;padding:0;min-height:60vh}
#log-list{width:290px;min-width:220px;border-right:1px solid var(--line);overflow:auto;padding:10px 0}
#log-list .grp{padding:12px 18px 4px;font-size:10.5px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
#log-list button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 18px;cursor:pointer;color:#b8c4d3;font-size:13.5px;line-height:1.3}
#log-list button:hover{background:rgba(143,220,255,.06)}
#log-list button.on{color:#fff;background:rgba(143,220,255,.1);box-shadow:inset 2px 0 0 var(--aether)}
#log-list button.locked{color:#4d5968;cursor:default}
#log-entry{flex:1;overflow:auto;padding:22px 28px 40px;line-height:1.65;font-size:15px;color:#d8e0ea}
#log-entry h3{font-weight:300;font-size:24px;letter-spacing:.04em;margin-bottom:6px;color:#fff}
#log-entry .tag{font-size:11px;letter-spacing:.2em;color:var(--aether);text-transform:uppercase;margin-bottom:16px}
#log-entry p{margin:10px 0}
#log-entry .eq{margin:14px 0;padding:12px 16px;background:rgba(143,220,255,.04);border:1px solid rgba(143,220,255,.12);border-radius:10px;overflow-x:auto}
#log-entry .eq math{font-size:1.18em;color:#f2f6ff}
#log-entry .eq .tex{display:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#9fb3c8;margin-top:8px;white-space:pre-wrap;word-break:break-word}
#log-entry .eq.showtex .tex{display:block}
#log-entry .eq .eqbar{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#6d7c8e;margin-bottom:6px}
#log-entry .eq .eqbar button{background:none;border:1px solid rgba(143,220,255,.18);color:#8fb4cf;border-radius:6px;font-size:10.5px;padding:2px 7px;cursor:pointer;letter-spacing:.08em}
#log-entry .refs{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:#9aa8b8}
#log-entry .refs li{margin:6px 0 6px 18px}
#log-entry .note{border-left:2px solid var(--gold);padding:6px 12px;background:rgba(232,194,122,.05);color:#e6dcc6;font-size:13.5px;margin:14px 0}
#log-entry table{border-collapse:collapse;margin:12px 0;font-size:13px}
#log-entry td,#log-entry th{border:1px solid rgba(143,220,255,.15);padding:5px 9px;text-align:center}
#log-entry th{color:var(--gold);font-weight:500}
#objective{position:fixed;top:calc(18px + var(--safe-t));left:calc(20px + var(--safe-l));max-width:max(210px,33vw);font-size:12.5px;letter-spacing:.06em;color:#dfe8f2;text-shadow:0 1px 6px #000;transition:opacity .6s}
#objective .lbl{font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:3px}
#toast{position:fixed;top:calc(18px + var(--safe-t));right:calc(20px + var(--safe-r));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#toast .t{background:rgba(8,14,24,.78);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;max-width:340px;color:#dbe6f2;animation:tin .35s ease-out;backdrop-filter:blur(6px)}
#toast .t b{color:var(--aether);font-weight:500}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#prompt{position:fixed;left:50%;bottom:calc(30% + var(--safe-b));transform:translateX(-50%);font-size:14px;letter-spacing:.08em;color:#fff;text-shadow:0 0 10px #000;opacity:0;transition:opacity .25s;white-space:nowrap}
#prompt kbd{display:inline-block;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:1px 8px;margin-right:8px;font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.4)}
#subs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5vh + var(--safe-b));width:min(920px,92vw);text-align:center;opacity:0;transition:opacity .35s}
#subs .box{display:inline-block;padding:10px 18px 12px;border-radius:12px;background:rgba(0,0,0,var(--sub-bg))}
#subs .spk{font-size:10.5px;letter-spacing:.38em;color:var(--aether);margin-bottom:4px;text-transform:uppercase}
#subs .txt{font-size:var(--sub-size);line-height:1.42;color:#f4f8fc;text-shadow:0 1px 3px rgba(0,0,0,.9)}
#subs .txt .said{color:#ffffff}
#subs .txt .rest{color:#c9d6e3}
#subs .hint{margin-top:5px;font-size:10.5px;color:#7f8fa3;letter-spacing:.12em}
#readout{position:fixed;left:50%;top:calc(16px + var(--safe-t));transform:translateX(-50%);font-size:12.5px;letter-spacing:.1em;color:#e8f3ff;text-shadow:0 0 8px #000;text-align:center;opacity:0;transition:opacity .4s}
#readout .big{font-size:15px;color:var(--gold);letter-spacing:.12em}
#chapter-card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s;pointer-events:none;text-align:center}
#chapter-card .n{font-size:12px;letter-spacing:.6em;color:var(--gold);text-indent:.6em}
#chapter-card .t{font-size:clamp(26px,5vw,52px);font-weight:200;letter-spacing:.3em;text-indent:.3em;margin-top:14px;color:#fff}
#chapter-card .s{margin-top:12px;font-size:13px;letter-spacing:.2em;color:var(--dim)}
#voice-ind{position:fixed;right:calc(20px + var(--safe-r));bottom:calc(20px + var(--safe-b));padding:8px 14px;border-radius:20px;background:rgba(200,40,60,.35);border:1px solid rgba(255,120,140,.5);font-size:12px;letter-spacing:.1em;opacity:0;transition:opacity .2s}
#err{position:fixed;inset:20px;background:rgba(30,0,0,.92);border:1px solid #f55;border-radius:10px;padding:20px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;z-index:100;color:#fdd;user-select:text}
#credits .body{line-height:1.7;font-size:14px;color:#cdd7e2}
#credits h4{color:var(--gold);letter-spacing:.2em;font-weight:400;font-size:12px;text-transform:uppercase;margin:18px 0 6px}
#chapters .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
#chapters .ch{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:rgba(143,220,255,.03);text-align:left}
#chapters .ch:hover{background:rgba(143,220,255,.08)}
#chapters .ch.locked{opacity:.35;cursor:default}
#chapters .ch .n{font-size:10px;letter-spacing:.3em;color:var(--gold)}
#chapters .ch .t{font-size:17px;margin-top:6px;font-weight:300}
#chapters .ch .s{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none!important;z-index:15}
#touch .zone{position:absolute;pointer-events:auto}
#tz-move{left:0;top:18%;width:42%;bottom:0}
#tz-look{right:0;top:12%;width:58%;bottom:0}
#joy-base{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:radial-gradient(circle,rgba(143,220,255,.08),rgba(0,0,0,.15));opacity:0;transition:opacity .15s;pointer-events:none}
#joy-knob{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(220,240,255,.28);border:1.5px solid rgba(255,255,255,.55);opacity:0;pointer-events:none}
.tb{position:absolute;width:58px;height:58px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(10,20,34,.42);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;letter-spacing:.02em;color:#eaf4ff;pointer-events:auto;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:none}
.tb.on,.tb.held{background:rgba(143,220,255,.35);border-color:#bfeaff}
.tb.w{border-color:rgba(208,140,255,.6);color:#f0dcff}
.tb.act{border-color:rgba(232,194,122,.7);color:#fff1d6}
.tb.sm{width:44px;height:44px;font-size:13px}
.tb.dis{opacity:.25}
body.touch-ui #subs{left:calc(14px + var(--safe-l));transform:none;width:min(560px,calc(100vw - 300px));text-align:left;bottom:calc(10px + var(--safe-b))}
body.touch-ui #subs .txt{font-size:calc(var(--sub-size) * .74)}
body.touch-ui #subs .box{padding:8px 13px 9px}
body.touch-ui #prompt{bottom:auto;top:58%}
body.touch-ui #toast{top:calc(70px + var(--safe-t))}
@media (max-height:560px){
  #title .menu{margin-top:14px}
  #title .btn{margin:5px 0;padding:8px 18px}
  .logo{font-size:clamp(22px,4.2vw,44px)}
  #title .foot{display:none}
  #title .langsel{margin-top:8px}
}
@media (max-width:700px){
  .btn{min-width:220px;padding:11px 16px}
  #title .btn{min-width:230px}
  #log .body{flex-direction:column}
  #log-list{width:100%;max-height:30vh;border-right:none;border-bottom:1px solid var(--line)}
  #log-entry{padding:16px}
  #objective{max-width:60vw;font-size:12px}
  #subs .txt{font-size:calc(var(--sub-size) * .82)}
  .row{flex-wrap:wrap}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="fx-fade"></div>
<div id="ui">
  <div id="boot" class="screen">
    <div class="boot-inner">
      <div class="logo">HYPERSPACE<span>WALK</span></div>
      <div class="subtitle" data-i18n="tagline">A walk through four-dimensional space</div>
      <div id="boot-status">…</div>
      <button id="boot-start" class="btn primary" disabled data-i18n="begin">Begin</button>
      <div class="langsel" id="boot-lang"><button data-lang="en">ENGLISH</button><button data-lang="bg">БЪЛГАРСКИ</button></div>
      <p class="warn" id="boot-warn"></p>
    </div>
  </div>
  <div id="title" class="screen hidden">
    <div class="logo">HYPERSPACE<span>WALK</span></div>
    <div class="subtitle" data-i18n="tagline">A walk through four-dimensional space</div>
    <div class="menu">
      <button class="btn primary" id="m-continue" data-i18n="continue">Continue</button>
      <button class="btn" id="m-new" data-i18n="newgame">New Journey</button>
      <button class="btn" id="m-chapters" data-i18n="chapters">Chapters</button>
      <button class="btn" id="m-log" data-i18n="log">Research Log</button>
      <button class="btn" id="m-settings" data-i18n="settings">Settings</button>
      <button class="btn" id="m-credits" data-i18n="credits">Sources &amp; Credits</button>
    </div>
    <div class="langsel" id="title-lang"><button data-lang="en">ENGLISH</button><button data-lang="bg">БЪЛГАРСКИ</button></div>
    <div class="foot" id="title-foot"></div>
  </div>
  <div id="pause" class="screen hidden">
    <div class="logo" style="font-size:28px">PAUSED</div>
    <div style="margin-top:26px">
      <button class="btn primary" id="p-resume" data-i18n="resume">Resume</button>
      <button class="btn" id="p-log" data-i18n="log">Research Log</button>
      <button class="btn" id="p-settings" data-i18n="settings">Settings</button>
      <button class="btn" id="p-skip" data-i18n="skipsection">Skip to next objective</button>
      <button class="btn" id="p-restart" data-i18n="restartch">Restart chapter</button>
      <button class="btn" id="p-title" data-i18n="totitle">Save &amp; quit to title</button>
    </div>
  </div>
  <div id="settings" class="modal hidden"><div class="panel"><header><h2 data-i18n="settings">Settings</h2><button class="x" data-close>×</button></header><div class="tabs" id="set-tabs"></div><div class="body" id="set-body"></div></div></div>
  <div id="log" class="modal hidden"><div class="panel" style="height:86vh"><header><h2 data-i18n="log">Research Log</h2><button class="x" data-close>×</button></header><div class="body"><div id="log-list"></div><div id="log-entry"></div></div></div></div>
  <div id="credits" class="modal hidden"><div class="panel"><header><h2 data-i18n="credits">Sources &amp; Credits</h2><button class="x" data-close>×</button></header><div class="body" id="credits-body"></div></div></div>
  <div id="chapters" class="modal hidden"><div class="panel"><header><h2 data-i18n="chapters">Chapters</h2><button class="x" data-close>×</button></header><div class="body"><div class="grid" id="ch-grid"></div></div></div></div>
  <div id="hudui">
    <div id="objective"></div>
    <div id="toast"></div>
    <div id="prompt"></div>
    <div id="readout"></div>
    <div id="subs"><div class="box"><div class="spk">AETHER</div><div class="txt"></div><div class="hint"></div></div></div>
    <div id="chapter-card"><div class="n"></div><div class="t"></div><div class="s"></div></div>
    <div id="voice-ind">● LISTENING</div>
  </div>
  <div id="touch" class="hidden">
    <div class="zone" id="tz-move"></div>
    <div class="zone" id="tz-look"></div>
    <div id="joy-base"></div><div id="joy-knob"></div>
    <div class="tb" id="tb-up" style="right:calc(20px + var(--safe-r));bottom:calc(150px + var(--safe-b))">↑</div>
    <div class="tb" id="tb-down" style="right:calc(20px + var(--safe-r));bottom:calc(84px + var(--safe-b))">↓</div>
    <div class="tb w" id="tb-wp" style="right:calc(88px + var(--safe-r));bottom:calc(184px + var(--safe-b))">w+</div>
    <div class="tb w" id="tb-wm" style="right:calc(88px + var(--safe-r));bottom:calc(118px + var(--safe-b))">w−</div>
    <div class="tb w" id="tb-4d" style="right:calc(156px + var(--safe-r));bottom:calc(150px + var(--safe-b))">4D</div>
    <div class="tb act" id="tb-act" style="right:calc(88px + var(--safe-r));bottom:calc(52px + var(--safe-b))">F</div>
    <div class="tb" id="tb-run" style="right:calc(156px + var(--safe-r));bottom:calc(84px + var(--safe-b));font-size:12px">RUN</div>
    <div class="tb sm" id="tb-aether" style="right:calc(20px + var(--safe-r));bottom:calc(20px + var(--safe-b))">◎</div>
    <div class="tb sm" id="tb-menu" style="right:calc(20px + var(--safe-r));top:calc(14px + var(--safe-t))">≡</div>

  start(it) {

const Post = {
  init() {

    this.flare = GL.program('flare', VS_FULL, FS_FLARE); this.final = GL.program('final', VS_FULL, FS_FINAL);

  },
  run(src, grade) {

    p = GL.use(this.down);
    for (let i = 1; i < B.length; i++) { GL.bindTarget(B[i].d); p.set('uSrc', B[i - 1].d.tex); p.set('uPx', [1 / B[i - 1].d.w, 1 / B[i - 1].d.h]); GL.fullscreen(); }
    p = GL.use(this.up);

    for (let i = B.length - 2; i >= 0; i--) { GL.bindTarget(B[i].u); p.set('uSrc', last.tex); p.set('uCur', B[i].d.tex); p.set('uPx', [1 / last.w, 1 / last.h]); p.set('uRad', 1); GL.fullscreen(); last = B[i].u; }

      p = GL.use(this.flare); const s2 = B[Math.min(2, B.length - 1)].d;
      GL.bindTarget(GL.fl1); p.set('uSrc', s2.tex); p.set('uPx', [1 / s2.w, 1 / s2.h]); p.set('uDir', [1, 0]); p.set('uThr', grade.flareThr || 1.2); GL.fullscreen();
      GL.bindTarget(GL.fl2); p.set('uSrc', GL.fl1.tex); p.set('uPx', [1 / GL.fl1.w, 1 / GL.fl1.h]); p.set('uDir', [1, 0]); p.set('uThr', 0); GL.fullscreen();
    } else { GL.bindTarget(GL.fl2); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }

    p = GL.use(this.final); GL.bindTarget(null);
    p.set('uScene', src.tex); p.set('uBloom', bloomTex); p.set('uFlare', flareTex);
    p.set('uRes', [GL.W, GL.H]); p.set('uTime', Game.time);
    p.set('uExposure', grade.exposure); p.set('uBloomStr', grade.bloom * S.bloom); p.set('uFlareStr', S.flare ? grade.flare : 0);
    p.set('uVig', grade.vig); p.set('uCA', S.ca ? grade.ca : 0); p.set('uGrain', S.grain ? grade.grain : 0);
    p.set('uLetter', grade.letter); p.set('uFade', grade.fade); p.set('uFadeCol', grade.fadeCol); p.set('uSat', grade.sat);
    p.set('uLift', grade.lift); p.set('uGain', grade.gain); p.set('uGamma', grade.gamma);
    p.set('uFlash', grade.flash); p.set('uFlashCol', grade.flashCol); p.set('uShake', S.reducedMotion ? 0 : grade.shake);

/* ---------- §6 GLSL scenes ---------- */
// Common header for every scene: the camera is a 3D slice-frame (R,U,F) embedded in ℝ⁴ at position P.
// A pixel's ray is P + t·(x R + y U + z F): a straight line in ℝ⁴ that lies inside the viewer's hyperplane.
const GLSL_COMMON = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform vec2 uRes;
uniform float uTime;
uniform float uTanFov;
uniform vec4 uCP, uCR, uCU, uCF, uCA;

const float PI=3.14159265359;

            mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}

vec3 bb(float T){

float sdRBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}

/* Black hole: null geodesics of the Schwarzschild metric (r_s = 1).
   In the orbital plane the photon orbit obeys u'' + u = (3/2) r_s u²  (u = 1/r).  Integrating the
   Cartesian "Binet analogue"  a = −(3/2) h² r̂ / r⁴  with h = |r × v| conserved reproduces exactly that
   orbit equation, so the bending, photon sphere (1.5 r_s) and shadow (b_c = 3√3/2 r_s) are exact up to
   integration error (velocity-Verlet, adaptive step).  Thin disk: Novikov–Thorne/Shakura–Sunyaev
   temperature profile T ∝ r^(-3/4)(1-√(r_in/r))^(1/4), inner edge at the Schwarzschild ISCO (3 r_s). */
const GLSL_BH = `
uniform float uBHTime, uDiskIn, uDiskOut, uDiskT, uDiskBright, uDoppler, uCamZ, uObsDop;
uniform int uSteps;

  col-=vec3(.03,.025,.02)*band*smoothstep(.5,.75,n2);

vec4 diskCol(vec3 hp, vec3 vd, float r){
  float x=uDiskIn/r;

  float phi=atan(hp.z,hp.x);
  float om=2.4*pow(r,-1.5);                                   // Keplerian Ω ∝ r^(-3/2) (time scaled for viewing)
  float a=phi-om*uBHTime;
  vec2 cs=vec2(cos(a),sin(a));
  float lr=log(r);
  float n=fbm3(vec3(cs*2.6,lr*5.5+3.));
  float st=vnoise(vec3(cs*1.3,lr*48.))*.55+vnoise(vec3(cs*2.9,lr*125.))*.45;

    float gam=inversesqrt(1.-beta*beta);

vec3 sky4(vec4 d){

vec2 edgeD(int i,vec4 q,int skip){

vec3 floorShade(vec4 X,float t,vec3 dl,out float rough){

float decD(float a){ return 10.*a/max(1.-a,1e-4); }

    const D = this.objData; D.fill(0);

      D.set([o.start, o.count, o.d, o.type], b + 24); D.set([o.hue, o.R, o.glow, o.alpha], b + 28);
    });

  }

  render() {

  }
  grade() { const g = GRADE_DEFAULT(); g.exposure = 1.05; g.bloom = .5; g.flare = .2; g.thresh = 1.25; g.gain = [.97, 1, 1.04]; g.lift = [.004, .006, .014]; g.vig = .55; return g; }
  music() { return { bells: true, air: .6 }; }
  skip() { Dialogue.clear(); if (!this.f.intro) this.f.intro = true; else if (!this.f.vault) { this.f.vault = true; this.key.hidden = true; } else { const i = this.f.hinton.indexOf(false); if (i >= 0) { this.f.hinton[i] = true; this.plinths[i].h.state.solved = true; } } }
}

  c2_eject: [{ en: 'We can’t take the pod any further. Eject — now!', bg: 'Не можем да продължим с капсулата. Катапултирай — сега!' }],
  c2_ejected: [{ en: 'Ejection complete. From here, it’s just you and me.', bg: 'Катапултирането е успешно. Оттук нататък сме само ти и аз.' }],
  c2_horizon: [{ en: 'Horizon in a few seconds. Locally, nothing special happens as we cross — no wall, no flash. But no signal from inside can ever reach the universe outside again.', bg: 'Хоризонтът е след няколко секунди. Локално нищо особено не се случва, когато го пресечем — няма стена, няма проблясък. Но никакъв сигнал отвътре вече не може да достигне външната Вселена.' }],
  c2_inside: [
    { en: 'We’re through.', bg: 'Преминахме.' },
    { en: 'From here on, physics as we know it is uncertain. In Kip Thorne’s account of the film, the tesseract was placed here by beings who live in the bulk — a space with more dimensions. What follows is a dramatization of that idea.', bg: 'Оттук нататък познатата физика е несигурна. Според описанието на Кип Торн за филма, тесерактът е поставен тук от същества, живеещи в обема — пространство с повече измерения. Това, което следва, е драматизация на тази идея.' },
  ],
  c3_intro: [
    { en: 'Breathe. We’re inside a tesseract — or rather, inside a three-dimensional slice of one.', bg: 'Дишай. Намираме се в тесеракт — или по-точно, в тримерно сечение на тесеракт.' },
    { en: 'Every chamber you see is the same room, each shown at a different moment. The long beams are that room’s history, stretched out along time — its world-lines.', bg: 'Всяка стая, която виждаш, е една и съща стая, показана в различен момент. Дългите греди са историята на тази стая, разтеглена във времето — нейните световни линии.',
      more: { en: 'In Thorne’s description, the beings in the bulk laid the room’s time out like a dimension of space, so that Cooper could reach any moment by moving. Here each step along a channel moves you through the room’s timeline; the diagonal leads toward the future.', bg: 'Според Торн съществата от обема са подредили времето на стаята като пространствено измерение, за да може Купър да достигне всеки момент, като се движи. Тук всяка стъпка по канал те придвижва по историята на стаята; диагоналът води към бъдещето.' } },
    { en: 'You’re weightless. Float with your movement controls — Space and C move you up and down. Follow the beacon: that room is the one we need.', bg: 'В безтегловност си. Движи се с контролите — Space и C те изместват нагоре и надолу. Следвай маяка: тази стая ни трябва.' },
  ],
  c3_near: [
    { en: 'This is the room, at the moment its occupants are listening for a signal. But the channels are in the way.', bg: 'Това е стаята — в момента, в който обитателите ѝ чакат сигнал. Но каналите ни пречат.' },
    { en: 'Time to use the fourth dimension. Move along w with Q and E.', bg: 'Време е да използваме четвъртото измерение. Движи се по w с Q и E.' },
  ],
  c3_wmove: [{ en: 'Watch the channels thin and fade. They only exist near this layer of w. The rooms remain: each room is itself a beam that runs along w. You’re slicing a four-dimensional lattice — just as you sliced the hypersphere.', bg: 'Виж как каналите изтъняват и изчезват. Те съществуват само близо до този слой по w. Стаите остават: всяка стая сама е греда, простираща се по w. Ти срязваш четиримерна решетка — точно както сряза хиперсферата.' }],
  c3_alone: [
    { en: 'Now the room stands alone. Only gravity can cross from the bulk into their space: in braneworld models such as Randall and Sundrum’s, gravity spreads through the extra dimension while light and matter stay confined to the brane.', bg: 'Сега стаята стои сама. Само гравитацията може да премине от обема в тяхното пространство: в модели на брани като този на Рандъл и Сундрум гравитацията се разпространява в допълнителното измерение, а светлината и материята остават затворени в браната.' },
    { en: 'Those six threads are the world-lines of the dust on their floor. Pluck one and a gravitational pulse runs along it into the room; the dust settles into a stripe. Six stripes, six binary digits.', bg: 'Тези шест нишки са световните линии на праха по пода им. Докосни една и по нея ще премине гравитационен импулс към стаята; прахът ще се подреди в ивица. Шест ивици — шест двоични цифри.' },
    { en: 'Send them the number of cubic cells that bound a tesseract, in binary. The leftmost thread is thirty-two, the rightmost is one. Then pluck the golden thread above to transmit.', bg: 'Изпрати им броя на кубичните клетки, които ограждат тесеракт, в двоичен код. Най-лявата нишка е трийсет и две, най-дясната — едно. После докосни златната нишка отгоре, за да предадеш.' },
  ],
  c3_wrong: { en: 'The dust reads {N}. That isn’t it — think back to Node I: how many cubes enclose a tesseract?', bg: 'Прахът показва {N}. Не е това — спомни си възел I: колко куба ограждат тесеракта?' },
  c3_right: [{ en: 'Eight — zero, zero, one, zero, zero, zero. They’ve received it. And look: the stripes now appear in every later room along the lattice.', bg: 'Осем — нула, нула, едно, нула, нула, нула. Получиха го. И виж: ивиците вече се появяват във всяка по-късна стая в решетката.' }],
  c3_close: [
    { en: 'The tesseract is closing. Watch closely: this is a genuine rotation in four dimensions — through the xw, yw and zw planes. The lattice isn’t breaking; it’s turning in a direction we can’t point to.', bg: 'Тесерактът се затваря. Гледай внимателно: това е истинско въртене в четири измерения — през равнините xw, yw и zw. Решетката не се руши; тя се върти в посока, която не можем да посочим.' },
    { en: 'And as it turns, it opens onto the bulk itself.', bg: 'И докато се върти, тя се отваря към самия обем.' },
  ],
  c3_nudge: [{ en: 'You felt that? A nudge on a world-line reaches every slice it threads. Somewhere, books just fell from a shelf.', bg: 'Усети ли? Побутването на световна линия достига всяко сечение, през което минава. Някъде книги току-що паднаха от рафта.' }],
  c4_intro: [
    { en: 'We’re out — into an open region of four-dimensional space. Gravity here pulls along y, so the floor beneath you isn’t a plane. It’s a three-dimensional hyperplane, stretching through x, z and w.', bg: 'Излязохме — в открита област на четиримерното пространство. Гравитацията тук дърпа по y, така че подът под теб не е равнина. Той е тримерна хиперравнина, простираща се по x, z и w.' },
    { en: 'The grid shows its axes: red for x, blue for z, violet for w. Right now w is the same everywhere in your slice, so the violet lines hide.', bg: 'Решетката показва осите: червено за x, синьо за z, виолетово за w. В момента w е еднакво навсякъде в твоето сечение, затова виолетовите линии не се виждат.' },
    { en: 'So turn into the fourth dimension. Hold R and move the mouse — or use Z and X, or the 4D button — to rotate in the forward–w plane. Press T to snap back if you get lost.', bg: 'Затова се завърти към четвъртото измерение. Задръж R и движи мишката — или използвай Z и X, или бутона 4D — за въртене в равнината напред–w. Натисни T, за да се изравниш, ако се изгубиш.' },
  ],
  c4_rotated: [{ en: 'There — the violet lines sweep in, and things ahead slide in and out of existence. Turn 180° in such a plane and you return mirror-reversed: in four dimensions, a left hand can be rotated into a right hand. August Möbius noticed this in 1827.', bg: 'Ето — виолетовите линии се появяват, а нещата пред теб изникват и изчезват. Завърти се на 180° в такава равнина и ще се върнеш огледално обърнат: в четири измерения лява ръка може да се завърти в дясна. Аугуст Мьобиус забелязва това през 1827 г.' }],
  c4_gallery: [
    { en: 'Ahead stand the six convex regular 4-polytopes, first classified by Ludwig Schläfli around 1852: the 5-cell, the tesseract, the 16-cell, the 24-cell, the 120-cell and the 600-cell. In five or more dimensions there are only three.', bg: 'Пред нас са шестте изпъкнали правилни четиримерни политопа, класифицирани за първи път от Лудвиг Шлефли около 1852 г.: петоклетник, тесеракт, шестнайсетоклетник, двайсет и четириклетник, стодвайсетоклетник и шестстотинклетник. В пет и повече измерения те са само три.' },
    { en: 'Each crystal shows its true slice through your hyperplane; the hologram above it shows the whole object in stereographic projection. They turn slowly in four dimensions, so their slices keep changing.', bg: 'Всеки кристал показва истинското си сечение с твоята хиперравнина; холограмата над него показва целия обект в стереографска проекция. Те бавно се въртят в четири измерения, затова сеченията им постоянно се променят.' },
    { en: 'Two of them rest elsewhere along w. Listen for them — in four dimensions sound spreads over a 3-sphere and fades as 1⁄r³ — and watch the w-ruler on the right. There’s also a sealed vault to the west, and Hinton’s tesseract straight ahead.', bg: 'Два от тях се намират другаде по w. Ослушай се — в четири измерения звукът се разпространява по тримерна сфера и отслабва като 1⁄r³ — и следи w-линийката вдясно. На запад има и запечатан трезор, а точно пред теб е тесерактът на Хинтън.' },
  ],
  c4_c5: { en: 'The 5-cell, or pentachoron: five vertices, ten edges, ten triangles and five tetrahedral cells. It is the four-dimensional simplex, Schläfli symbol {3,3,3}.', bg: 'Петоклетникът, или пентахорон: пет върха, десет ръба, десет триъгълника и пет тетраедрични клетки. Това е четиримерният симплекс, символ на Шлефли {3,3,3}.' },
  c4_c16: { en: 'The 16-cell, {3,3,4}: eight vertices on the axes, twenty-four edges, thirty-two triangles and sixteen tetrahedra. It is the dual of the tesseract.', bg: 'Шестнайсетоклетникът, {3,3,4}: осем върха по осите, двайсет и четири ръба, трийсет и два триъгълника и шестнайсет тетраедъра. Той е дуален на тесеракта.' },
  c4_c24: { en: 'The 24-cell, {3,4,3}: twenty-four octahedral cells. It is self-dual and has no analogue in any other dimension — a uniquely four-dimensional object.', bg: 'Двайсет и четириклетникът, {3,4,3}: двайсет и четири октаедрични клетки. Той е самодуален и няма аналог в никое друго измерение — уникално четиримерен обект.' },
  c4_glome: { en: 'The glome — the 3-sphere. Watch its size as you move along w: r = √(R² − w²). The violet arcs on its surface are Clifford circles.', bg: 'Хиперсферата — тримерната сфера. Следи размера ѝ, докато се движиш по w: r = √(R² − w²). Виолетовите дъги по повърхността ѝ са окръжности на Клифорд.' },
  c4_c120: { en: 'You found the 120-cell, {5,3,3}: one hundred and twenty dodecahedra, six hundred vertices, twelve hundred edges. The hologram above shows it whole, in stereographic projection.', bg: 'Откри стодвайсетоклетника, {5,3,3}: сто и двайсет додекаедъра, шестстотин върха, хиляда и двеста ръба. Холограмата отгоре го показва цял, в стереографска проекция.' },
  c4_c600: { en: 'And the 600-cell, {3,3,5}: six hundred tetrahedra around one hundred and twenty vertices. Read as unit quaternions, those vertices form the binary icosahedral group.', bg: 'А това е шестстотинклетникът, {3,3,5}: шестстотин тетраедъра около сто и двайсет върха. Като единични кватерниони тези върхове образуват бинарната икосаедрична група.' },
  c4_vault: [
    { en: 'This vault is sealed on every side — in three dimensions. A Flatlander locked in a square can’t escape it, yet you could lift a coin out of their square without crossing a single line. Can you reach the crystal inside?', bg: 'Този трезор е запечатан от всички страни — в три измерения. Плосък жител, затворен в квадрат, не може да избяга, а ти би могъл да вдигнеш монета от квадрата му, без да пресичаш нито една линия. Можеш ли да стигнеш до кристала вътре?' },
    { en: 'A hint: the walls extend only a short way along w. Step out of our slice with E, walk to where the crystal is, then step back with Q.', bg: 'Подсказка: стените се простират само малко по w. Излез от нашето сечение с E, отиди до мястото на кристала и се върни с Q.' },
    { en: 'Exactly. You went around the walls through the fourth dimension — no wall was crossed. To a three-dimensional observer, you vanished and reappeared inside.', bg: 'Точно така. Заобиколи стените през четвъртото измерение — без да пресечеш нито една. За тримерен наблюдател ти изчезна и се появи вътре.' },
  ],
  c4_hinton: [
    { en: 'These four plinths show shapes hidden inside one tesseract: a tetrahedron, a regular octahedron, a triangular prism and a hexagonal prism. Use this lever to tip the tesseract — cell-first, face-first, edge-first or vertex-first — then walk along w until the slice matches.', bg: 'Тези четири постамента показват форми, скрити в един тесеракт: тетраедър, правилен октаедър, триъгълна призма и шестоъгълна призма. С този лост наклони тесеракта — с клетка, стена, ръб или връх напред — после се движи по w, докато сечението съвпадне.',
      more: { en: 'The trick is the orientation of the slicing hyperplane. Vertex-first slices run tetrahedron, truncated tetrahedron, octahedron. Edge-first slices are prisms: triangular near the ends, hexagonal through the centre.', bg: 'Тайната е в ориентацията на сечащата хиперравнина. Сеченията с връх напред са тетраедър, пресечен тетраедър, октаедър. Сеченията с ръб напред са призми: триъгълни близо до краищата, шестоъгълни през центъра.' } },
  ],
  c4_found: { en: '{s} — found.', bg: '{s} — открит.' },
  c4_allfound: { en: 'All four. Hinton made sets of coloured wooden cubes to train exactly this intuition — to imagine the whole from its slices.', bg: 'И четирите. Хинтън е създал комплекти цветни дървени кубчета, за да тренира точно тази интуиция — да си представиш цялото по неговите сечения.' },
  c4_curv: hs => [
    { en: 'Carry an arrow around a closed path on a sphere, keeping it as straight as the surface allows: down a meridian, along the equator, and back up to the pole.', bg: 'Пренеси стрелка по затворен път върху сфера, като я държиш възможно най-права спрямо повърхността: надолу по меридиан, по екватора и обратно до полюса.' },
    { en: 'It returns rotated by ninety degrees. That rotation — the holonomy — equals the curvature enclosed by the loop. This is parallel transport, made precise by Levi-Civita in 1917.', bg: 'Тя се връща завъртяна на деветдесет градуса. Това завъртане — холономията — е равно на кривината, заградена от контура. Това е паралелното пренасяне, прецизирано от Леви-Чивита през 1917 г.' },
    { en: 'The tensor calculus of Ricci-Curbastro and Levi-Civita lets us describe curvature in any number of dimensions. The metric tensor g measures lengths; in four dimensions the Riemann curvature tensor has twenty independent components.', bg: 'Тензорното смятане на Ричи-Курбастро и Леви-Чивита ни позволява да описваме кривина в произволен брой измерения. Метричният тензор g измерва дължини; в четири измерения тензорът на кривината на Риман има двайсет независими компоненти.', cue: () => { hs[0].on = false; hs[1].on = true; } },
    { en: 'Flat ℝ⁴ has g equal to the identity and zero curvature everywhere. Spacetime near Gargantua does not — that is what bent the light you saw.', bg: 'Плоското ℝ⁴ има g, равно на единичната матрица, и нулева кривина навсякъде. Пространство-времето около Гаргантюа не е такова — затова светлината, която видя, се огъваше.' },
  ],
  c4_kk: hs => [
    { en: 'In 1921 Theodor Kaluza showed that gravity in five dimensions could contain electromagnetism. In 1926 Oskar Klein proposed that the extra dimension is curled into a tiny circle.', bg: 'През 1921 г. Теодор Калуца показва, че гравитацията в пет измерения може да съдържа електромагнетизма. През 1926 г. Оскар Клайн предлага допълнителното измерение да е свито в малка окръжност.' },
    { en: 'Waves around that circle must fit a whole number of times, giving a tower of particles with masses proportional to n over R — the Kaluza–Klein tower.', bg: 'Вълните около окръжността трябва да се вместват цял брой пъти, което дава поредица от частици с маси, пропорционални на n върху R — кулата на Калуца–Клайн.' },
    { en: 'Modern braneworld models — Arkani-Hamed, Dimopoulos and Dvali in 1998, Randall and Sundrum in 1999 — confine our particles to a brane, while gravity alone spreads into the bulk.', bg: 'Съвременните модели на брани — Аркани-Хамед, Димопулос и Двали през 1998 г., Рандъл и Сундрум през 1999 г. — затварят нашите частици в брана, а само гравитацията се разпространява в обема.', cue: () => { hs[0].on = false; hs[1].on = true; } },
    { en: 'These are theories, not established facts. Torsion-balance experiments at the University of Washington find Newton’s inverse-square law holding down to about fifty micrometres, and gravitational waves from the neutron-star merger GW170817 are consistent with four spacetime dimensions.', bg: 'Това са теории, а не установени факти. Експерименти с торзионни везни във Вашингтонския университет показват, че законът на Нютон за обратния квадрат важи до около петдесет микрометра, а гравитационните вълни от сливането на неутронни звезди GW170817 са съвместими с четири измерения на пространство-времето.' },
    { en: 'And yet four-dimensional physics has been measured in the lab: in 2018 two teams used “synthetic dimensions” — cold atoms and photonic waveguides — to observe signatures of the four-dimensional quantum Hall effect.', bg: 'И все пак четиримерна физика е измерена в лаборатория: през 2018 г. два екипа използват „синтетични измерения“ — студени атоми и фотонни вълноводи — за да наблюдават признаци на четиримерния квантов ефект на Хол.' },
  ],
  c4_phase: hs => [
    { en: 'Higher dimensions also appear wherever physics has more variables. A star moving in a galaxy’s potential has a four-dimensional phase space: two positions and two momenta.', bg: 'Повече измерения се появяват навсякъде, където физиката има повече променливи. Звезда, движеща се в потенциала на галактика, има четиримерно фазово пространство: две координати и два импулса.' },
    { en: 'This is a real trajectory of the Hénon–Heiles system from 1964, integrated numerically and projected from 4D into 3D. At low energy it winds around a smooth torus; at higher energy it turns chaotic.', bg: 'Това е истинска траектория на системата на Енон–Хейлс от 1964 г., интегрирана числено и проектирана от 4D в 3D. При ниска енергия тя се навива около гладък тор; при по-висока става хаотична.' },
  ],
  c4_hopf: hs => [
    { en: 'Here is the 3-sphere itself, seen through stereographic projection. In 1931 Heinz Hopf showed that it can be filled entirely by circles, one for each point of an ordinary sphere.', bg: 'Това е самата тримерна сфера, видяна чрез стереографска проекция. През 1931 г. Хайнц Хопф показва, че тя може да бъде изцяло запълнена с окръжности — по една за всяка точка на обикновена сфера.' },
    { en: 'Every pair of these circles is linked exactly once. The Hopf fibration turns up in quantum mechanics — the Bloch sphere of a qubit — and in the theory of magnetic monopoles.', bg: 'Всеки две от тези окръжности са свързани точно веднъж. Фибрацията на Хопф се появява в квантовата механика — сферата на Блох за кюбит — и в теорията на магнитните монополи.' },
  ],
  c4_film: hs => [
    { en: 'A last word about the film that inspired our plunge. Kip Thorne asked that nothing in Interstellar violate established physical law, and that its speculation spring from real science.', bg: 'Последна дума за филма, вдъхновил нашето падане. Кип Торн настоява нищо в „Интерстелар“ да не нарушава установените физични закони, а спекулациите му да произтичат от истинска наука.' },
    { en: 'Gargantua’s image came from genuine geodesic ray tracing and led to two research papers. The tesseract is openly speculative — a dramatization of the bulk, of world-lines, and of gravity leaking between dimensions. I’ve tried to keep that same line visible to you.', bg: 'Образът на Гаргантюа е създаден чрез истинско проследяване на геодезични лъчи и доведе до две научни статии. Тесерактът е открито спекулативен — драматизация на обема, на световните линии и на гравитацията, изтичаща между измеренията. Опитах се да ти покажа същата граница.' },
  ],
  c4_end: [
