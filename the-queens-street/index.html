<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Queen's Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<style>
/* Layout concept: the 3D street is the page; UI sits on it as enamel street plates, wrought iron and a Nokia LCD. */
:root{
  color-scheme: dark;
  --ink:#101215;
  --iron:#1c1a19;
  --iron-2:#2a2624;
  --enamel:#1d4e9e;
  --enamel-deep:#123673;
  --plate:#f2f0e9;
  --stucco:#e59b77;
  --spray:#e2261c;
  --lcd:#a7c27c;
  --lcd-ink:#1d2911;
  --gold:#f3c24f;
  --hp:#e5412f;
  --hunger:#f39a2e;
  --ultra:#f3c24f;
  --stamina:#59c8e8;
  --magic:#b36bff;
  --ok:#5ccf6b;
  --shadow:rgba(0,0,0,.55);
  --font-display:"Russo One","Arial Black",Impact,system-ui,sans-serif;
  --font-ui:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-lcd:"Press Start 2P",ui-monospace,Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;background:var(--ink);color:var(--plate);overflow:hidden;font-family:var(--font-ui);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#app canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:absolute;inset:0;z-index:30}
[hidden]{display:none!important}

/* ---------- loading ---------- */
#loading{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(120% 90% at 30% 20%,#2a1d17 0%,var(--ink) 60%);padding:16px}
.load-card{width:min(520px,100%);display:grid;gap:18px}
.load-title{font-family:var(--font-display);font-size:clamp(28px,6vw,46px);line-height:1;letter-spacing:.01em;color:var(--stucco);text-wrap:balance}
.load-sub{font-size:14px;color:#c9c1b8;min-height:1.4em}
.load-bar{height:10px;border-radius:2px;background:#2b2522;overflow:hidden;box-shadow:inset 0 0 0 1px #3a332f}
.load-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--stucco) 0 10px,#d4845e 10px 20px);transition:width .2s}
.load-note{font-size:12px;color:#9a918a;line-height:1.5;max-width:60ch}
#start-btn{justify-self:start}

/* ---------- enamel plate buttons ---------- */
.plate{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 18px 12px 18px;background:linear-gradient(180deg,#2560b8 0%,var(--enamel) 45%,var(--enamel-deep) 100%);border:0;border-radius:7px;box-shadow:inset 0 0 0 3px var(--plate),inset 0 0 0 5px var(--enamel-deep),0 6px 0 #0b2149,0 10px 22px var(--shadow);color:var(--plate);text-align:left;transition:transform .15s ease,filter .15s;min-width:0}
.plate:hover{transform:translateY(-2px) rotate(-.4deg);filter:brightness(1.08)}
.plate:active{transform:translateY(2px)}
.plate b{font-family:var(--font-display);font-weight:400;font-size:clamp(17px,2.2vw,22px);letter-spacing:.02em;line-height:1.1}
.plate small{font-size:12.5px;opacity:.85;letter-spacing:.02em}
.plate.ghost{background:linear-gradient(180deg,#3a3532,#26221f);box-shadow:inset 0 0 0 2px #5b534d,0 5px 0 #0c0b0a,0 8px 18px var(--shadow)}
.plate.red{background:linear-gradient(180deg,#e8463a,#b81d14);box-shadow:inset 0 0 0 3px var(--plate),inset 0 0 0 5px #8c140d,0 6px 0 #5e0c07,0 10px 22px var(--shadow)}
.plate.green{background:linear-gradient(180deg,#43a956,#2a7a3a);box-shadow:inset 0 0 0 3px var(--plate),inset 0 0 0 5px #1d5a2a,0 6px 0 #133c1c,0 10px 22px var(--shadow)}
.plate kbd{position:absolute;right:10px;top:9px;font-family:var(--font-ui);font-size:11px;background:rgba(255,255,255,.18);border-radius:3px;padding:1px 6px}

/* ---------- main menu ---------- */
#menu{display:flex;flex-direction:column;justify-content:space-between;padding:calc(18px + var(--safe-t)) calc(16px + var(--safe-r)) calc(18px + var(--safe-b)) calc(16px + var(--safe-l));pointer-events:none;background:linear-gradient(90deg,rgba(10,10,12,.72) 0%,rgba(10,10,12,.35) 38%,rgba(10,10,12,0) 60%)}
#menu > *{pointer-events:auto}
.menu-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sign-stack{display:grid;gap:10px;width:min(560px,100%);transform-origin:0 0;animation:signIn .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes signIn{from{transform:translateY(-30px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.sign{position:relative;background:linear-gradient(180deg,#2763bd,var(--enamel) 50%,#17427f);border-radius:8px;box-shadow:inset 0 0 0 4px var(--plate),inset 0 0 0 7px #143a74,0 12px 30px rgba(0,0,0,.6);color:var(--plate);padding:12px 22px;overflow:hidden}
.sign::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 18%,rgba(120,70,30,.55) 0 3px,transparent 4px),radial-gradient(circle at 88% 82%,rgba(120,70,30,.5) 0 4px,transparent 5px),radial-gradient(circle at 70% 10%,rgba(255,255,255,.08) 0 30%,transparent 31%);pointer-events:none}
.sign .bolt{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e6e6e6,#6c6c6c);top:50%;transform:translateY(-50%)}
.sign .bolt.l{left:10px}.sign .bolt.r{right:10px}
.sign.old{width:fit-content;max-width:90%;padding-right:34px;font-family:var(--font-display);font-size:clamp(20px,3.2vw,30px);letter-spacing:.04em;transform:rotate(-1.2deg);filter:saturate(.75) brightness(.9)}
.sign.old .x{position:absolute;inset:-8px -6px;width:calc(100% + 12px);height:calc(100% + 16px);overflow:visible}
.sign.new{display:grid;gap:0;padding:14px 30px 16px;transform:rotate(.6deg);width:fit-content;max-width:100%}
.sign-kicker{font-family:var(--font-display);font-size:clamp(15px,2.2vw,20px);letter-spacing:.22em;opacity:.92}
.sign-main{font-family:var(--font-display);font-size:clamp(34px,6.4vw,74px);white-space:nowrap;line-height:.92;letter-spacing:.01em;text-shadow:0 3px 0 #0c2a5c}
.sign-en{font-family:var(--font-display);font-size:clamp(13px,1.6vw,16px);letter-spacing:.42em;color:var(--stucco);padding-left:4px;text-shadow:0 2px 8px #000}
.menu-tools{display:flex;gap:8px}
.chip{border:0;border-radius:4px;padding:7px 11px;font-size:13px;font-weight:700;letter-spacing:.06em;background:rgba(20,18,17,.75);box-shadow:inset 0 0 0 1px #5b534d}
.chip[aria-pressed="true"]{background:var(--plate);color:var(--ink)}
.menu-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.menu-buttons{display:grid;gap:14px;width:min(420px,100%)}
.menu-buttons .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-foot{font-size:12px;color:#d9d1c9;max-width:42ch;line-height:1.5;text-shadow:0 1px 4px #000;text-align:right}
.menu-foot strong{color:var(--gold);font-variant-numeric:tabular-nums}

/* ---------- panels (settings / controls / pause / over) ---------- */
.panel-wrap{display:grid;place-items:center;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));background:rgba(8,8,10,.62);backdrop-filter:blur(3px)}
.panel{width:min(760px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#24201e,#171514);border-radius:10px;box-shadow:inset 0 0 0 2px #4d4540,0 20px 60px rgba(0,0,0,.7);padding:20px 22px;display:grid;gap:16px}
.panel h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(24px,4vw,32px);color:var(--stucco);letter-spacing:.02em}
.panel h3{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#bdb3aa}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;padding:8px 14px;border-radius:4px;background:#2f2a27;font-weight:700;font-size:13px;letter-spacing:.05em}
.tab[aria-selected="true"]{background:var(--enamel);box-shadow:inset 0 0 0 2px var(--plate)}
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px 18px;align-items:center}
.set-grid label{font-size:14px;color:#e6dfd8}
.set-grid .hint{display:block;font-size:11.5px;color:#9b928b;margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:0;padding:7px 10px;border-radius:3px;background:#332d2a;font-size:13px;font-weight:600;min-width:44px}
.seg button[aria-pressed="true"]{background:var(--plate);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--stucco)}
.panel-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.panel-actions .plate{padding:10px 18px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 22px;font-size:14px}
.keys div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #3d3633;padding:5px 0}
.keys kbd{font-family:var(--font-ui);font-size:12px;background:#3a3330;border-radius:3px;padding:2px 7px;white-space:nowrap}
.over-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#2a2523;border-radius:6px;padding:10px 12px;display:grid;gap:2px}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a99f97}
.stat b{font-family:var(--font-display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;color:var(--gold)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none}
.hud-tl{position:absolute;left:calc(14px + var(--safe-l));top:calc(12px + var(--safe-t));display:grid;gap:7px;width:min(300px,46vw)}
.bar{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:7px}
.bar svg{width:20px;height:20px;filter:drop-shadow(0 1px 2px #000)}
.bar .track{position:relative;height:13px;background:rgba(15,14,13,.7);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.4);overflow:hidden}
.bar .fill{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(1);transition:transform .15s linear}
.bar .lag{position:absolute;inset:0;transform-origin:0 50%;background:rgba(255,255,255,.55);transition:transform .6s ease .25s}
.bar.hp .fill{background:linear-gradient(180deg,#ff6a55,var(--hp))}
.bar.hunger .fill{background:linear-gradient(180deg,#ffbf5e,var(--hunger))}
.bar.ultra .fill{background:linear-gradient(180deg,#fff1a8,var(--ultra))}
.bar.stamina .fill{background:linear-gradient(180deg,#a7ecff,var(--stamina))}
.bar.ultra.ready .track{box-shadow:inset 0 0 0 1px #fff3b0,0 0 14px #ffd75e;animation:pulse 1s infinite}
.bar.hunger.full .track{animation:pulse .5s infinite}
@keyframes pulse{50%{filter:brightness(1.5)}}
.bar .label{position:absolute;right:5px;top:-1px;font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;text-shadow:0 1px 2px #000}
.hud-tr{position:absolute;right:calc(14px + var(--safe-r));top:calc(12px + var(--safe-t));display:grid;justify-items:end;gap:8px}
.money{font-family:var(--font-display);font-size:22px;color:var(--gold);text-shadow:0 2px 0 #4a3200,0 2px 8px #000;font-variant-numeric:tabular-nums}
.damage{font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.scandal{display:flex;gap:2px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.12em;color:#fff;text-shadow:0 1px 3px #000}
.scandal i{width:15px;height:15px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.22)}
.scandal i.on{background:var(--gold);animation:pulse 1s infinite}
#minimap{width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 3px rgba(242,240,233,.85),0 0 0 6px rgba(20,18,17,.6),0 6px 18px rgba(0,0,0,.5);background:rgba(20,22,20,.55)}
#objective{position:absolute;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);max-width:min(560px,60vw);text-align:center;font-size:14px;font-weight:600;padding:7px 14px;border-radius:4px;background:rgba(16,14,13,.62);box-shadow:inset 0 0 0 1px rgba(242,240,233,.25);text-wrap:balance;transition:opacity .3s}
#objective:empty{opacity:0}
#boss{position:absolute;left:50%;top:calc(52px + var(--safe-t));transform:translateX(-50%);width:min(520px,70vw);display:grid;gap:4px;text-align:center}
#boss .name{font-family:var(--font-display);font-size:15px;letter-spacing:.08em;color:var(--stucco);text-shadow:0 2px 4px #000}
#boss .track{height:10px;background:rgba(15,14,13,.7);border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
#boss .fill{height:100%;background:linear-gradient(180deg,#ff8a6a,#c3261a);transform-origin:0 50%;transition:transform .2s}
#timer{position:absolute;left:50%;top:calc(88px + var(--safe-t));transform:translateX(-50%);font-family:var(--font-display);font-size:30px;color:#fff;text-shadow:0 3px 0 #000,0 0 12px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
#toasts{position:absolute;right:calc(14px + var(--safe-r));top:calc(230px + var(--safe-t));display:grid;justify-items:end;gap:6px}
.toast{font-weight:800;font-size:14px;letter-spacing:.03em;padding:6px 10px;border-radius:3px;background:rgba(16,14,13,.72);box-shadow:inset 3px 0 0 var(--gold);animation:toastIn .25s ease-out both, toastOut .4s ease-in 2.4s forwards;font-variant-numeric:tabular-nums}
.toast.red{box-shadow:inset 3px 0 0 var(--hp)}.toast.purple{box-shadow:inset 3px 0 0 var(--magic)}.toast.green{box-shadow:inset 3px 0 0 var(--ok)}
@keyframes toastIn{from{transform:translateX(30px);opacity:0}}
@keyframes toastOut{to{transform:translateX(30px);opacity:0}}
#combo{position:absolute;right:calc(180px + var(--safe-r));top:calc(40px + var(--safe-t));font-family:var(--font-display);font-size:34px;color:var(--gold);text-shadow:0 3px 0 #5a3a00,0 0 16px rgba(255,180,0,.5);transform:rotate(-6deg);transition:opacity .3s}
#weapon{position:absolute;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:6px;background:rgba(16,14,13,.66);box-shadow:inset 0 0 0 1px rgba(242,240,233,.22)}
#weapon canvas{width:44px;height:44px}
#weapon .wname{font-family:var(--font-display);font-size:16px;letter-spacing:.04em}
#weapon .wsub{font-size:11px;color:#bdb3aa}
#weapon .slots{display:flex;gap:4px;margin-left:6px}
#weapon .slots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
#weapon .slots i.have{background:rgba(255,255,255,.6)}
#weapon .slots i.cur{background:var(--gold);box-shadow:0 0 6px var(--gold)}
#interact{position:absolute;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);font-weight:700;font-size:15px;padding:7px 14px;border-radius:4px;background:rgba(242,240,233,.92);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.4)}
#interact kbd{font-family:var(--font-ui);background:var(--ink);color:var(--plate);border-radius:3px;padding:1px 7px;margin-right:6px}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 0 3px rgba(0,0,0,.4)}
#crosshair::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff}
#zlata{position:absolute;left:calc(14px + var(--safe-l));top:calc(108px + var(--safe-t));display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:30px;background:rgba(40,16,60,.72);box-shadow:inset 0 0 0 1px rgba(179,107,255,.6),0 0 18px rgba(179,107,255,.35)}
#zlata svg{width:38px;height:38px}
#zlata b{font-family:var(--font-display);font-weight:400;font-size:14px;color:#e4cbff;letter-spacing:.04em}
#zlata span{display:block;font-size:11px;color:#cdb6ea}
#bigtitle{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--font-display);font-size:clamp(34px,7vw,84px);line-height:1;color:var(--plate);text-shadow:0 5px 0 var(--enamel-deep),0 0 30px rgba(0,0,0,.6);letter-spacing:.02em;padding:0 16px;text-wrap:balance;opacity:0;transform:scale(.8);transition:opacity .35s,transform .5s cubic-bezier(.2,1.6,.4,1)}
#bigtitle.show{opacity:1;transform:scale(1)}
#bigtitle small{display:block;font-family:var(--font-ui);font-weight:700;font-size:clamp(13px,2vw,18px);letter-spacing:.3em;color:var(--stucco);margin-top:12px;text-shadow:0 2px 6px #000}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,10,0,.55) 100%);transition:opacity .25s}
#flash{position:absolute;inset:0;pointer-events:none;z-index:9;background:#fff;opacity:0}

/* ---------- subtitles ---------- */
#subs{position:absolute;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);z-index:12;width:min(860px,calc(100% - 32px));display:grid;gap:6px;justify-items:center;pointer-events:none}
.sub{background:rgba(10,10,12,.72);border-radius:4px;padding:6px 12px;font-size:clamp(14px,1.9vw,19px);font-weight:500;line-height:1.35;text-align:center;text-wrap:balance;animation:toastIn .2s ease-out both}
.sub b{font-weight:800;letter-spacing:.04em;margin-right:6px}
.sub em{display:block;font-style:normal;font-size:.78em;color:#c9c1b8;margin-top:2px}

/* ---------- letterbox / fade ---------- */
#letterbox .lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:11;transition:height .6s ease}
#letterbox .lb.top{top:0}#letterbox .lb.bot{bottom:0}
#letterbox.on .lb{height:11vh}
#fade{position:absolute;inset:0;background:#000;z-index:60;opacity:1;pointer-events:none;transition:opacity .8s}
#skip{position:absolute;right:calc(16px + var(--safe-r));bottom:calc(16px + var(--safe-b));z-index:40;border:0;border-radius:4px;background:rgba(242,240,233,.15);box-shadow:inset 0 0 0 1px rgba(242,240,233,.4);padding:9px 16px;font-weight:700;letter-spacing:.06em;font-size:13px}
#pause-btn{position:absolute;right:calc(176px + var(--safe-r));top:calc(12px + var(--safe-t));z-index:20;width:40px;height:40px;border-radius:50%;border:0;background:rgba(16,14,13,.66);box-shadow:inset 0 0 0 2px rgba(242,240,233,.5);font-weight:900;font-size:14px}
.cine-caption{position:absolute;left:calc(24px + var(--safe-l));bottom:calc(14vh + 16px);z-index:12;font-family:var(--font-display);font-size:clamp(16px,2.4vw,24px);letter-spacing:.06em;color:var(--plate);text-shadow:0 2px 8px #000;opacity:0;transition:opacity .6s}
.cine-caption.show{opacity:1}
.cine-caption small{display:block;font-family:var(--font-ui);font-size:.6em;letter-spacing:.24em;color:var(--stucco)}

/* ---------- choice modal ---------- */
#choice{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding:16px;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.6))}
.choice-card{width:min(560px,100%);display:grid;gap:14px;padding:20px;border-radius:10px;background:linear-gradient(180deg,#26211f,#171413);box-shadow:inset 0 0 0 2px #5b4f47,0 20px 50px rgba(0,0,0,.7);animation:popIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.88) rotate(-1deg)}}
.choice-card h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(20px,3.4vw,28px);color:var(--stucco);text-wrap:balance}
.choice-card p{margin:0;color:#ddd5ce;line-height:1.45}
.choice-card .amount{font-family:var(--font-display);font-size:44px;color:var(--gold);text-shadow:0 3px 0 #5a3a00}
.choice-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice-timer{height:5px;background:#2e2826;border-radius:2px;overflow:hidden}
.choice-timer i{display:block;height:100%;background:var(--stucco);transform-origin:0 50%}

/* ---------- Nokia ---------- */
#nokia{position:absolute;right:calc(8% + var(--safe-r));bottom:-10px;z-index:36;width:190px;height:400px;perspective:900px;transform:translateY(110%);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
#nokia.show{transform:translateY(0)}
.nk-base{position:absolute;left:0;right:0;bottom:0;height:200px;border-radius:14px 14px 34px 34px;background:linear-gradient(90deg,#3a3d42,#5f646b 45%,#33363a);box-shadow:inset 0 0 0 2px #24262a,0 20px 40px rgba(0,0,0,.6);padding:16px 18px;display:grid;grid-template-rows:auto 1fr;gap:10px}
.nk-nav{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;align-items:center}
.nk-nav i{height:16px;border-radius:8px;background:#26282c;box-shadow:inset 0 1px 0 #6d727a}
.nk-nav b{height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c9ccd1,#7d828a);box-shadow:0 1px 0 #1b1c1f}
.nk-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nk-keys span{display:grid;place-items:center;height:22px;border-radius:7px;background:linear-gradient(180deg,#d9dce0,#a8adb3);color:#1d1f22;font-size:11px;font-weight:800;box-shadow:0 1px 0 #2a2c30}
.nk-keys span.hit{background:#7ce07c}
.nk-lid{position:absolute;left:0;right:0;bottom:200px;height:200px;transform-origin:50% 100%;transform:rotateX(-178deg);transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
#nokia.open .nk-lid{transform:rotateX(-8deg)}
.nk-lid-face{position:absolute;inset:0;border-radius:34px 34px 14px 14px;background:linear-gradient(90deg,#3a3d42,#62676e 45%,#33363a);box-shadow:inset 0 0 0 2px #24262a;padding:22px 16px 18px;display:grid;grid-template-rows:auto 1fr auto;gap:8px;backface-visibility:hidden}
.nk-speaker{justify-self:center;width:46px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#1b1c1f 0 3px,#4b4f55 3px 5px)}
.nk-screen{border-radius:6px;background:linear-gradient(180deg,#b8d18c,var(--lcd));box-shadow:inset 0 0 0 3px #2a2f22,inset 0 0 18px rgba(30,45,15,.45);padding:10px 9px;font-family:var(--font-lcd);color:var(--lcd-ink);font-size:9px;line-height:1.65;display:grid;align-content:start;gap:4px;overflow:hidden}
.nk-screen .big{font-size:11px}
.nk-screen .blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.nk-brand{justify-self:center;font-size:10px;letter-spacing:.35em;color:#c7cbd0;font-weight:800}
.nk-back{position:absolute;inset:0;border-radius:34px 34px 14px 14px;background:linear-gradient(90deg,#2c2f33,#4b4f55 45%,#26282b);transform:rotateX(180deg);backface-visibility:hidden;display:grid;place-items:center}
.nk-back i{width:58px;height:30px;border-radius:5px;background:#101c10;box-shadow:inset 0 0 0 2px #1d1f22}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;z-index:15;pointer-events:none}
#touch .zone-l{position:absolute;left:0;top:18%;bottom:0;width:45%;pointer-events:auto}
#touch .zone-r{position:absolute;right:0;top:0;bottom:0;width:55%;pointer-events:auto}
#joy{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.16));box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);pointer-events:none;opacity:.0;transition:opacity .15s}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.9),rgba(220,220,220,.55));box-shadow:0 3px 10px rgba(0,0,0,.4)}
.tbtns{position:absolute;right:calc(14px + var(--safe-r));bottom:calc(14px + var(--safe-b));width:250px;height:250px;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border:0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:10.5px;letter-spacing:.04em;color:#fff;background:rgba(20,18,17,.5);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 4px 10px rgba(0,0,0,.35);text-shadow:0 1px 2px #000;touch-action:none}
.tb svg{width:24px;height:24px;margin-bottom:-6px}
.tb.down{background:rgba(242,240,233,.38)}
.tb.big{width:92px;height:92px;right:0;bottom:0;background:rgba(229,65,47,.55);font-size:12px}
.tb.big svg{width:34px;height:34px}
.tb.m{width:62px;height:62px}
.tb.s{width:52px;height:52px}
.tb.ready{box-shadow:inset 0 0 0 3px var(--gold),0 0 16px var(--gold);animation:pulse 1s infinite}
.tb.off{opacity:.35}
#tb-jump{right:104px;bottom:2px}
#tb-throw{right:98px;bottom:78px}
#tb-use{right:30px;bottom:104px}
#tb-weap{right:168px;bottom:6px}
#tb-ultra{right:160px;bottom:84px}
#tb-phone{right:96px;bottom:156px}
#tb-sprint{right:20px;bottom:178px}
.tb-top{position:absolute;left:calc(14px + var(--safe-l));bottom:calc(14px + var(--safe-b));font-size:11px;color:rgba(255,255,255,.55);pointer-events:none}

/* ---------- responsive ---------- */
@media (max-width:760px){
  #menu{background:linear-gradient(180deg,rgba(10,10,12,.55) 0%,rgba(10,10,12,0) 40%,rgba(10,10,12,.7) 100%)}
  .menu-bottom{flex-direction:column;align-items:stretch}
  .menu-buttons{width:100%}
  .menu-foot{text-align:left}
  .set-grid{grid-template-columns:1fr}
  #minimap{width:104px;height:104px}
  #pause-btn{right:calc(128px + var(--safe-r))}
  #toasts{top:calc(170px + var(--safe-t))}
  #combo{right:calc(130px + var(--safe-r));font-size:26px}
  #objective{font-size:12px;max-width:min(360px,48vw);top:calc(64px + var(--safe-t))}
  .hud-tl{width:min(220px,44vw)}
  #weapon{bottom:auto;top:calc(116px + var(--safe-t));left:calc(14px + var(--safe-l));transform:none;padding:4px 10px 4px 4px}
  #weapon canvas{width:34px;height:34px}
  #weapon .slots{display:none}
  #subs{bottom:calc(270px + var(--safe-b))}
  #interact{bottom:calc(272px + var(--safe-b))}
  #nokia{right:auto;left:50%;margin-left:-95px}
  #zlata{top:calc(160px + var(--safe-t))}
  #boss{top:calc(104px + var(--safe-t))}
  #timer{top:calc(130px + var(--safe-t));font-size:24px}
}
@media (max-height:480px){
  .sign-main{font-size:clamp(30px,7vh,60px)}
  .menu-buttons{gap:7px}
  .plate{padding:6px 14px}
  .plate small{font-size:11px}
  .sign.old{display:none}
  #subs{bottom:calc(16px + var(--safe-b));width:min(520px,calc(100% - 340px))}
  #interact{bottom:calc(16px + var(--safe-b));left:calc(160px + var(--safe-l));transform:none}
}
@media (max-height:480px){
  .hud-tl{width:min(190px,30vw);gap:5px}
  .bar{grid-template-columns:18px 1fr}
  .bar svg{width:16px;height:16px}
  .bar .track{height:10px}
  .bar .label{font-size:8.5px;top:-1px}
  #minimap{width:92px;height:92px}
  .hud-tr{gap:5px}
  .money{font-size:17px}
  #damage{display:none}
  .scandal{font-size:9px}
  .scandal i{width:11px;height:11px}
  #objective{font-size:11.5px;max-width:38vw;top:calc(8px + var(--safe-t));padding:5px 10px}
  #pause-btn{right:calc(116px + var(--safe-r));width:34px;height:34px}
  #weapon{bottom:auto;top:calc(72px + var(--safe-t));left:calc(14px + var(--safe-l));transform:none;padding:3px 9px 3px 3px}
  #weapon canvas{width:30px;height:30px}
  #weapon .wname{font-size:13px}
  #weapon .slots{display:none}
  #zlata{top:calc(114px + var(--safe-t));padding:3px 10px 3px 3px}
  #zlata svg{width:30px;height:30px}
  .tbtns{transform:scale(.8);transform-origin:100% 100%}
  #boss{top:calc(54px + var(--safe-t));width:min(380px,40vw)}
  #boss .name{font-size:11px}
  #timer{top:calc(74px + var(--safe-t));font-size:22px}
  #toasts{top:calc(150px + var(--safe-t))}
  .toast{font-size:12px;padding:4px 8px}
  #combo{right:calc(110px + var(--safe-r));font-size:22px;top:calc(112px + var(--safe-t))}
  .cine-caption{bottom:calc(11vh + 8px)}
  #nokia{transform-origin:100% 100%;scale:.72}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="letterbox"><div class="lb top"></div><div class="lb bot"></div></div>
  <div class="cine-caption" id="cine-caption"></div>

  <div id="hud" hidden>
    <div class="hud-tl">
      <div class="bar hp" id="bar-hp"><svg viewBox="0 0 24 24"><path fill="#ff5a48" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg><div class="track"><div class="lag"></div><div class="fill"></div><span class="label"></span></div></div>
      <div class="bar hunger" id="bar-hunger"><svg viewBox="0 0 24 24"><path fill="#f6a443" d="M15.5 3.2c3 0 5.3 2.4 5.3 5.3 0 3.4-3 5.8-6.4 5.8-.8 0-1.5-.1-2.1-.4l-4.6 4.6c.3.9 0 1.9-.8 2.5-1 .7-2.4.4-3-.6-.3-.4-.4-.9-.3-1.4-.5.1-1 0-1.4-.3-1-.7-1.3-2-.6-3 .6-.8 1.6-1.1 2.5-.8l4.6-4.6c-.3-.6-.4-1.3-.4-2.1 0-3.4 2.4-6.4 5.8-6.4z"/></svg><div class="track"><div class="fill"></div><span class="label"></span></div></div>
      <div class="bar ultra" id="bar-ultra"><svg viewBox="0 0 24 24"><path fill="#f6cc55" d="M3 18h18l-1.5-10-4.6 4L12 4.5 9.1 12 4.5 8z"/><rect x="3" y="19.2" width="18" height="2" fill="#f6cc55"/></svg><div class="track"><div class="fill"></div><span class="label"></span></div></div>
      <div class="bar stamina" id="bar-stamina" hidden><svg viewBox="0 0 24 24"><path fill="#7fd8f0" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><div class="track"><div class="fill"></div><span class="label"></span></div></div>
    </div>
    <div class="hud-tr">
      <canvas id="minimap" width="300" height="300"></canvas>
      <div class="money" id="money">0 €</div>
      <div class="damage" id="damage"></div>
      <div class="scandal" id="scandal"></div>
    </div>
    <div id="objective"></div>
    <div id="boss" hidden><div class="name" id="boss-name"></div><div class="track"><div class="fill" id="boss-fill"></div></div></div>
    <div id="timer" hidden></div>
    <div id="toasts"></div>
    <div id="combo" style="opacity:0"></div>
    <div id="weapon"><canvas id="weapon-icon" width="88" height="88"></canvas><div><div class="wname" id="wname"></div><div class="wsub" id="wsub"></div></div><div class="slots" id="wslots"></div></div>
    <div id="interact" hidden></div>
    <div id="crosshair" hidden></div>
    <div id="zlata" hidden><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="rgba(179,107,255,.3)" stroke-width="4"/><circle id="zlata-ring" cx="20" cy="20" r="17" fill="none" stroke="#c48bff" stroke-width="4" stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="0" transform="rotate(-90 20 20)"/><text x="20" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#f1e4ff" id="zlata-sec">35</text></svg><div><b id="zlata-name"></b><span id="zlata-sub"></span></div></div>
  </div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="bigtitle"></div>
  <div id="subs"></div>

  <div id="touch" hidden>
    <div class="zone-l" id="zone-l"></div>
    <div class="zone-r" id="zone-r"></div>
    <div id="joy"><i></i></div>
    <div class="tbtns">
      <button class="tb big" id="tb-attack" data-act="attack"><svg viewBox="0 0 24 24"><path fill="#fff" d="M14.5 3 21 9.5l-2 2-1.3-1.3-6.4 6.4 1.3 1.3-2 2-1.3-1.3L5 22l-3-3 3.6-4.3-1.3-1.3 2-2 1.3 1.3 6.4-6.4L12.5 5z"/></svg><span data-i18n="t_attack"></span></button>
      <button class="tb m" id="tb-jump" data-act="jump"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3 4 12h5v8h6v-8h5z"/></svg><span data-i18n="t_jump"></span></button>
      <button class="tb m" id="tb-throw" data-act="throw"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="7" ry="5.5" fill="#cfc6bb"/><path d="M8 11c2-1 5-1 7 .5" stroke="#8e857b" stroke-width="1.4" fill="none"/></svg><span data-i18n="t_throw"></span></button>
      <button class="tb s" id="tb-use" data-act="use"><svg viewBox="0 0 24 24"><path fill="#fff" d="M9 11V5a1.5 1.5 0 0 1 3 0v5h.5V3.5a1.5 1.5 0 0 1 3 0V10h.5V5a1.5 1.5 0 0 1 3 0v9c0 4-2.5 7-6.5 7-3 0-4.6-1.6-6-4l-2.6-4.4a1.4 1.4 0 0 1 2.3-1.5z"/></svg><span data-i18n="t_use"></span></button>
      <button class="tb s" id="tb-weap" data-act="weapon"><svg viewBox="0 0 24 24"><path fill="#fff" d="M4 7h11V4l5 5-5 5v-3H4zm16 10H9v3l-5-5 5-5v3h11z"/></svg><span data-i18n="t_weap"></span></button>
      <button class="tb s" id="tb-ultra" data-act="ultra"><svg viewBox="0 0 24 24"><path fill="#f6cc55" d="M3 18h18l-1.5-10-4.6 4L12 4.5 9.1 12 4.5 8z"/></svg><span data-i18n="t_ultra"></span></button>
      <button class="tb s" id="tb-phone" data-act="phone"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" fill="#aab0b8"/><rect x="8.5" y="4" width="7" height="6" fill="#a7c27c"/><g fill="#33363a"><rect x="8.5" y="12" width="2" height="1.6"/><rect x="11" y="12" width="2" height="1.6"/><rect x="13.5" y="12" width="2" height="1.6"/><rect x="8.5" y="15" width="2" height="1.6"/><rect x="11" y="15" width="2" height="1.6"/><rect x="13.5" y="15" width="2" height="1.6"/></g></svg><span data-i18n="t_phone"></span></button>
      <button class="tb s" id="tb-sprint" data-act="sprint"><svg viewBox="0 0 24 24"><path fill="#fff" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span data-i18n="t_sprint"></span></button>
    </div>
  </div>
  <button id="pause-btn" hidden aria-label="Pause">II</button>

  <div id="choice" hidden>
    <div class="choice-card">
      <h3 id="choice-title"></h3>
      <p id="choice-text"></p>
      <div class="amount" id="choice-amount" hidden></div>
      <div class="choice-timer"><i id="choice-timer"></i></div>
      <div class="choice-btns">
        <button class="plate green" id="choice-a"><b></b><small></small><kbd></kbd></button>
        <button class="plate red" id="choice-b"><b></b><small></small><kbd></kbd></button>
      </div>
    </div>
  </div>

  <div id="nokia" aria-hidden="true">
    <div class="nk-base">
      <div class="nk-nav"><i></i><b></b><i></i></div>
      <div class="nk-keys" id="nk-keys"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>*</span><span>0</span><span>#</span></div>
    </div>
    <div class="nk-lid">
      <div class="nk-lid-face"><div class="nk-speaker"></div><div class="nk-screen" id="nk-screen"></div><div class="nk-brand">MOBI</div></div>
      <div class="nk-back"><i></i></div>
    </div>
  </div>

  <div id="menu" class="screen" hidden>
    <div class="menu-top">
      <div class="sign-stack">
        <div class="sign old"><span class="bolt l"></span><span style="font-size:.6em;opacity:.85">ул.</span> „ЗДРАВЕЦ“<span class="bolt r"></span>
          <svg class="x" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
            <defs><filter id="spray" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs>
            <g filter="url(#spray)" stroke="#e2261c" stroke-linecap="round" fill="none" opacity=".93">
              <path d="M6 4 L94 36" stroke-width="5.5" vector-effect="non-scaling-stroke" style="stroke-width:11px"/>
              <path d="M93 3 L8 37" stroke-width="5.5" vector-effect="non-scaling-stroke" style="stroke-width:11px"/>
              <path d="M30 16 v9 M66 22 v12 M52 20 v7" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke-width:3px"/>
            </g>
          </svg>
        </div>
        <div class="sign new"><span class="bolt l"></span><span class="sign-kicker" id="sign-kicker">УЛИЦАТА НА</span><span class="sign-main" id="sign-main">КРАЛИЦАТА</span><span class="bolt r"></span></div>
        <div class="sign-en" id="sign-en">THE QUEEN'S STREET</div>
      </div>
      <div class="menu-tools">
        <button class="chip" id="lang-bg" aria-pressed="true">БГ</button>
        <button class="chip" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="menu-bottom">
      <nav class="menu-buttons">
        <button class="plate" id="btn-m1"><b data-i18n="m1"></b><small data-i18n="m1s"></small></button>
        <button class="plate" id="btn-m2"><b data-i18n="m2"></b><small data-i18n="m2s"></small></button>
        <button class="plate green" id="btn-m3"><b data-i18n="m3"></b><small data-i18n="m3s"></small></button>
        <div class="row">
          <button class="plate ghost" id="btn-settings"><b data-i18n="settings"></b></button>
          <button class="plate ghost" id="btn-controls"><b data-i18n="controls"></b></button>
        </div>
      </nav>
      <div class="menu-foot" id="menu-foot"></div>
    </div>
  </div>

  <div id="settings" class="screen panel-wrap" hidden>
    <div class="panel" role="dialog" aria-labelledby="set-title">
      <h2 id="set-title" data-i18n="settings"></h2>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="gfx" aria-selected="true" data-i18n="tab_gfx"></button>
        <button class="tab" role="tab" data-tab="ctl" aria-selected="false" data-i18n="tab_ctl"></button>
        <button class="tab" role="tab" data-tab="snd" aria-selected="false" data-i18n="tab_snd"></button>
        <button class="tab" role="tab" data-tab="gen" aria-selected="false" data-i18n="tab_gen"></button>
      </div>
      <div class="set-grid" data-pane="gfx">
        <label data-i18n="s_quality"></label><div class="seg" id="s-quality" data-key="quality"><button data-v="low" data-i18n="q_low"></button><button data-v="medium" data-i18n="q_med"></button><button data-v="high" data-i18n="q_high"></button><button data-v="ultra" data-i18n="q_ultra"></button></div>
        <label data-i18n="s_shadows"></label><div class="seg" id="s-shadows" data-key="shadows"><button data-v="0" data-i18n="off"></button><button data-v="1024">1K</button><button data-v="2048">2K</button><button data-v="4096">4K</button></div>
        <label data-i18n="s_ao"></label><div class="seg" id="s-ao" data-key="ao"><button data-v="false" data-i18n="off"></button><button data-v="true" data-i18n="on"></button></div>
        <label data-i18n="s_bloom"></label><div class="seg" id="s-bloom" data-key="bloom"><button data-v="false" data-i18n="off"></button><button data-v="true" data-i18n="on"></button></div>
        <label for="s-res"><span data-i18n="s_res"></span> <span id="s-res-v"></span></label><input type="range" id="s-res" min="0.5" max="1" step="0.05">
        <label data-i18n="s_dynres"></label><div class="seg" id="s-dynres" data-key="dynres"><button data-v="false" data-i18n="off"></button><button data-v="true" data-i18n="on"></button></div>
        <label for="s-fov"><span data-i18n="s_fov"></span> <span id="s-fov-v"></span></label><input type="range" id="s-fov" min="55" max="95" step="1">

// generic parametric house. side: 1 north (faces -Z), -1 south (faces +Z), 0 east block (faces -X)
function genericHouse(o) {
  const W = o.W, D = o.D, fl = 2.85, plinth = .5, F = o.floors || 2, H = F * fl;
  let m;
  if (o.side === 1) m = frame(o.x0, o.zf, 0); else if (o.side === -1) m = frame(o.x0 + W, o.zf, Math.PI); else m = frame(o.x0, o.zf + W / 2, Math.PI / 2);
  BT.m = m; srand(Math.round(o.x0 * 13 + o.zf * 7) + 101);

  const ops = [], wins = [];
  const n = Math.max(2, Math.floor(W / 3.1)); const doorK = Math.floor(SR(0, n));
  for (let f = 0; f < F; f++) {
    const y0 = B0 + plinth + f * fl;
    for (let k = 0; k < n; k++) {
      const c = (k + .5) * W / n, ww = SR(1.1, 1.6);
      if (f === 0 && k === doorK) { ops.push({ x0: c - .5, x1: c + .5, y0: y0, y1: y0 + 2.1 }); wins.push(['door', c - .5, c + .5, y0, y0 + 2.1]); }

      else if (!(f > 0 && o.balc && k === doorK + 1)) { ops.push({ x0: c - ww / 2, x1: c + ww / 2, y0: y0 + .85, y1: y0 + 2.15 }); wins.push(['win', c - ww / 2, c + ww / 2, y0 + .85, y0 + 2.15]); }
    }

  const bands = []; for (let f = 0; f < F; f++) bands.push([B0 + plinth + f * fl, B0 + plinth + (f + 1) * fl]);
  facade(W, bands, .3, o.mat, ops.filter(op => op.x1 < W - .1 && op.x0 > .1));

  for (let f = 1; f < F; f++) BT.add(o.mat, bx(0, B0 + plinth + f * fl - .1, -.06, W, B0 + plinth + f * fl + .04, 0));
  if (o.balc) { const c = (doorK + .5) * W / n; for (let f = 1; f < F; f++) balcony(clamp(c - 1.2, .2, W - 3), clamp(c + 2.0, 3, W - .2), -1.15, B0 + plinth + f * fl, o.balc, { rail: o.balc === 'green' ? 'ironGreen' : o.balc === 'glass' ? 'metalDark' : 'ironBlack' }); }
  if (o.awning) awning(.6, W * .55, B0 + plinth + fl - .15, 1.4, -.02);
  BT.add(o.mat, bx(0, B0 + plinth, .3, W, B0 + plinth + H, D));
  // side fake windows
  BT.m = m.clone().multiply(frame(W, 0, -Math.PI / 2)); for (let f = 0; f < F; f++) addWindow(D * .3, D * .3 + 1.2, B0 + plinth + f * fl + .85, B0 + plinth + f * fl + 2.1, { inset: -.08, frame: frameMat });
  BT.m = m.clone().multiply(frame(0, D, Math.PI / 2)); for (let f = 0; f < F; f++) addWindow(D * .4, D * .4 + 1.2, B0 + plinth + f * fl + .85, B0 + plinth + f * fl + 2.1, { inset: -.08, frame: frameMat });
  BT.m = m;
  const yE = B0 + plinth + H, ov = .65;
  if (o.roofType === 'flat') { BT.add(o.mat, bx(-.05, yE, -.05, W + .05, yE + .5, D + .05)); BT.add('cap', bx(-.1, yE + .5, -.1, W + .1, yE + .58, D + .1)); }
  else if (o.roofType === 'gable') { hipRoof(-ov, W + ov, -ov, D + ov, yE, .55, o.roof, true); gableEnds(0, W, 0, D, yE, (D / 2 + ov) * .55 - .05, o.mat, true); }

  if (o.chimney !== false) chimney(W * .7, D * .55, yE, yE + (Math.min(W, D) / 2) * .45 + 1.2, o.mat);
